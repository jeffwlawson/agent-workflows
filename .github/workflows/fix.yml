name: Agent Fix (reusable)

# The fix job itself. The `fix` job in `agent-pr.yml` is the caller (two wires,
# under that file's trigger), and everything that bounds what a wrong fix can do
# stays here, in a file an adopting repo *references* rather than copies
# (jeffwlawson/winget-manifest-lint#98, slice 4 of
# jeffwlawson/winget-manifest-lint#88; jeffwlawson/winget-manifest-lint#97
# proved the pattern on review).
#
# Address review feedback on an existing PR: the agent reads collaborator (and
# our own review agent's) comments, fixes the branch, and pushes.
#
# This is the highest-risk workflow in the set: it runs with `contents: write`
# and pushes, so an injection here steers *committed code*, not just text. Two
# controls carry that weight — the same-repo guard below, and the author gate in
# the runner's `shared/pr-feedback.ts`, which drops anything not written by a
# collaborator or `github-actions[bot]`. Both are on this side of the seam: a
# caller's own `if:` can skip this job, it cannot loosen it.
#
# The trigger stays with the caller because `workflow_call` cannot carry one:
# the event that reaches this job is the caller's, so `github.event.…` below
# reads the `pull_request_target` payload exactly as it did before the split.
on:
  workflow_call:
    inputs:
      default-branch:
        description: >-
          Branch to work against when the pull-request event carries no base
          ref. On a real PR `base.ref` is always set, so this fires only when
          something is already odd — but an unset fallback degrades *silently*
          to the wrong branch, which is the jeffwlawson/winget-manifest-lint#71
          failure arriving by a different route.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets its
          feedback acted on, running on the Node the runner package requires.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or a PR title becomes
          a shell script.
        type: string
        default: npm ci
      transcript-retention-days:
        description: >-
          Days the agent's Claude Code session transcript is kept, as this
          run's `agent-transcript` artifact, with every secret the job holds
          redacted. 0 turns the upload off. On a public repository the
          artifact is readable by anyone who can see the repository; see
          docs/ADOPTING.md §2d.
        type: number
        default: 3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the fix agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT, used to check the branch out, push it, add the
          `agent:review` that asks for the re-review, and mark a pull request
          ready where this run ends the round. A label made with `GITHUB_TOKEN`
          triggers no workflow, a push made with it starts CI that waits for a
          maintainer's approval, and `GITHUB_TOKEN` cannot convert a draft at
          all (docs/ADOPTING.md §1). Optional, and every one of those degrades
          rather than fails: the push still lands and its CI waits for
          approval (the review reads that as unknown, never green, #221), the
          label still goes on but starts
          no review until a human re-adds it, and the pull request stays a
          draft under a warning saying so. The loop's App, where it is set up,
          takes its place.
        required: false
      AGENT_APP_ID:
        description: >-
          The loop's GitHub App's ID. With `AGENT_APP_PRIVATE_KEY`, the publish
          job mints a token for this repository from the App and makes the
          writes `AGENT_PAT` would make with it, as the App's bot. Optional;
          without both, `AGENT_PAT` is used as before.
        required: false
      AGENT_APP_PRIVATE_KEY:
        description: The loop's GitHub App's private key. See `AGENT_APP_ID`.
        required: false

# One group per PR, shared with agent-update-branch (which pushes this same
# branch) and agent-review (which reads it). Review was outside the group
# until jeffwlawson/winget-manifest-lint#102 on the grounds that
# `contents: read` makes it harmless — but the race was never review
# writing, it was review *reading* mid-push, so a review could describe a
# tree that never existed. Nothing wants review and a mutate to overlap on
# one PR.
#
# On the workflow rather than on a job, because the run is three jobs that
# hand off to each other (see `implement.yml`'s note on its own group): a
# job-level group is released between them, and another run on this pull
# request could push between this run's agent and its push.
#
# A workflow-level group is entered before any job's `if:` is evaluated
# (probed, #309), and a group admits one pending run, cancelling the one it
# replaces. So an event for any other label takes a group of its own, keyed
# by its run id: otherwise adding a triage label while a run is in progress
# would cancel an `agent:fix` run waiting behind it, and nothing would say so.
concurrency:
  group: agent-pr-${{ github.event.pull_request.number }}${{ github.event.label.name != 'agent:fix' && format('-other-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# **Three jobs, and the agent's holds nothing it could use to write**, for
# the reason `implement.yml` gives in full: the agent can read every secret
# its own job names, from the runner process's memory, and leave something
# behind for a later step on its runner. So `gate` refuses or claims the pull
# request; `fix` runs the agent with a read-only token, names no PAT anywhere,
# and hands over its commits as a `git bundle` with the files the runner
# wrote; and `publish` starts on a fresh runner, checks the bundle, and
# pushes, replies and asks for the re-review.
#
# The permissions differ per job, and the caller grants the union: what
# `publish` spends. The caller is unchanged.
#
# Every job's `if:` opens with `vars.AGENT_ORCHESTRATOR != 'service'` (#455):
# a repository that sets that variable is served by the service orchestrator,
# and every job here skips, so one orchestrator answers each label. Unset, or
# any other value, leaves the rest of each condition as it was.
jobs:
  gate:
    # Job-level, so a fork PR skips before a runner is provisioned — no
    # checkout, no dependency install, no secrets. Fails closed: a deleted fork
    # gives head.repo == null, which also skips. The two jobs after it follow
    # from its outputs, so this is the one guard.
    if: >-
      vars.AGENT_ORCHESTRATOR != 'service' &&
      github.event.label.name == 'agent:fix' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # API calls and a bounded wait for a review's posting; the agent's own
    # limit is on its job.
    timeout-minutes: 15
    # Granted by the caller, bounded here, per job. A called workflow can only
    # *downgrade* the token it is handed, so each job's block is its ceiling
    # and the caller's grant has to cover the widest of them — without it there
    # is no run to make a `gh` call in: GitHub refuses the elevation rather than
    # trimming a job to fit, so a caller granting less than a block declares
    # fails before any job starts (probed, #146).
    permissions:
      # The live head, read from the branch ref.
      contents: read
      # The refusals and the label transitions.
      pull-requests: write
      # Installing the package `fix:gate` runs from, by `npm exec`. GitHub
      # Packages has no anonymous install, so this is needed even though the
      # package is public, and, being a bound, it grants nothing without the
      # caller's own `packages: read`, which both caller sets already grant.
      packages: read
    outputs:
      # `false` where the run goes ahead, `true` where it refused, and empty
      # where the gate died before deciding: the three `refused` takes in
      # `implement.yml`, so the jobs after it read one word the same way.
      refused: ${{ steps.state.outputs.proceed == 'true' && 'false' || steps.state.outputs.proceed == 'false' && 'true' || '' }}
      started: ${{ steps.clock.outputs.started }}
      # The sentence `fix:gate` failed with, where it failed after claiming
      # the run (the probe), for `fix:conclude`'s failure comment: its reason
      # file is in this job's `runner.temp`, which no later job can read.
      failure-reason: ${{ steps.state.outputs.failure-reason }}

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # `fix:gate` runs before anything is checked out, so there is no Node
      # here yet: Node and the registry the package installs from, set up for
      # the gate alone, as `review.yml`'s gate job does. A version rather than
      # a version file, since there is no checkout to read one from: the one
      # the package's `engines.node` names, which `tests/workflows.test.ts`
      # holds it to. No adopter step runs in this job, so the `.npmrc` it
      # points npm at needs none of the `userconfig` handling review's gate
      # job has (#429).
      - name: Set up Node for the gate
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # Everything this job settles before the agent's job, as one command
      # (#470): the pre-flight, which refuses a closed or merged pull request,
      # a branch that is gone, and a live head it cannot read or that is not
      # the event's (#188); the permission probe, the label write a short
      # token feels first, which fails the run before the agent's job starts;
      # `agent:blocked` off; and the bounded wait while a review is posting
      # (#257). `fix/gate.ts` says why each is as it is, an unreadable head
      # refusing where review's gate proceeds included. Each refusal is said
      # on the pull request, `agent:fix` comes off, and the two a maintainer
      # has to act on add `agent:blocked`.
      #
      # `HEAD_SHA`, `PR_STATE` and `PR_MERGED` are the pull request as the
      # label's event saw it; the branch tip and the labels the command reads
      # itself, with this job's token, which is also every write it makes.
      # What it decided is its `gate.json`, which the step below copies into
      # this job's outputs.
      - name: Refuse or claim the pull request
        id: gate
        env:
          # `GITHUB_TOKEN`, carrying the `packages: read` the caller granted:
          # there is no anonymous install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # `npm exec --prefix` rather than a bare `npx`: see the long note on
        # the runner step below.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.7 -- agent-workflows fix:gate

      # Glue only Actions can do (ADR 0003): the gate's decision, copied into
      # the step output `proceed`, which the job's `refused` and the clock
      # read. `always()`, so a gate that decided to go ahead and then failed,
      # at the probe, still says so; nothing where it wrote no `gate.json`,
      # which `refused` reads as a gate that died before deciding. And the
      # reason the gate failed with, where it wrote one, as `failure-reason`,
      # whole, under a delimiter of its own, as review's job hands its on.
      - name: Hand the gate's decision to the job
        id: state
        if: always()
        run: |
          reason="${RUNNER_TEMP}/failure_reason.txt"
          if [ -f "$reason" ]; then
            delimiter="REASON_$(date +%s%N)_${RANDOM}"
            {
              echo "failure-reason<<${delimiter}"
              printf '%s\n' "$(cat "$reason")"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi
          file="${RUNNER_TEMP}/gate.json"
          [ -f "$file" ] || { echo "fix:gate wrote no gate.json; this run decided nothing."; exit 0; }
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$file" >> "$GITHUB_OUTPUT"

      # The clock the agent's job reads its time limit off (#220). A job that
      # reaches its `timeout-minutes` is cancelled, not failed, and nothing in
      # the `needs` context says which cancellation it was, so that job's last
      # step compares how long it could have run with its limit. Last in this
      # job, so it starts as near the agent's job as a step here can, and is
      # read from this job's outputs, which the agent cannot reach.
      - name: Start the agent's clock
        if: steps.state.outputs.proceed == 'true'
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

  fix:
    needs: gate
    if: vars.AGENT_ORCHESTRATOR != 'service' && needs.gate.outputs.refused == 'false'
    runs-on: ubuntu-latest
    # The repository variable `AGENT_TIMEOUT_MINUTES` where it is set (#220),
    # shared by the four jobs that run an agent to write code, and 30 where it
    # is not. `vars` is among the contexts this key may read, and in a called
    # workflow it resolves against the caller's repository. `fromJSON` because
    # a variable is a string and this key wants a number; a value that is not
    # one fails the job before any step, which `doctor` reports.
    # `fix:conclude` in `publish` names the same figure.
    timeout-minutes: ${{ fromJSON(vars.AGENT_TIMEOUT_MINUTES || '30') }}
    # Its one output: whether it ran out of time. See *Measure how the agent's
    # job ended*. Everything else it hands over is the artifact.
    outputs:
      timed-out: ${{ steps.outcome.outputs.timed-out }}
    # **Read-only, and no PAT named anywhere in this job.** Not even in a step
    # that never runs: a secret is delivered to every job whose text names it.
    permissions:
      # The checkout.
      contents: read
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read
      # Reading a PRD's sub-issues, which place a PRD PR's fix round in its
      # slice. A **public** repository serves that read without the scope, so
      # its absence showed only on a private one: the PRD branch could not be
      # read and the run was numbered off the reviews' headers instead (#348).
      issues: read
      # The runner reads the pull request's threads and comments.
      pull-requests: read

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # The PR's real base branch — pr-feedback.ts diffs HEAD against this for
      # the DIFF context. A hardcoded `main` describes work the PR does not own
      # on any PR stacked on another branch
      # (jeffwlawson/winget-manifest-lint#71). The event field is the source;
      # `default-branch` is the fallback for an event that somehow carries none,
      # which is the adopter's call to make rather than a literal `main` buried
      # in a shell expansion.
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.default-branch }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Where a run of this pull request that stopped before it finished left
      # its commits, and where this one looks for them (#303). Fixed, so the
      # retry finds it by name: the publish job names the same branch.
      RESCUE_BRANCH: agent/rescue/fix-${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # No credential is left in the checkout for the agent's git, or
          # anything else it runs, to find. Nothing in this job pushes: the
          # publish job pushes, from a checkout of its own.
          persist-credentials: false

      # Shell-safe despite ref names being able to contain `$()`, backticks, `;`,
      # `|` and `&` — see the long note on the same step in
      # agent-review-reusable.yml. Short version: BASE_REF arrives as an `env:`
      # var rather than a workflow expression spliced into this script, and a
      # quoted parameter expansion is not re-scanned for syntax (verified
      # 2026-08-02, jeffwlawson/winget-manifest-lint#75).
      #
      # The `:-main` this line used to carry is gone, not lost: the fallback
      # moved up to the `env:` block, where it is the `default-branch` input
      # rather than a literal only this repo could be right about.
      #
      # This note lives at step level, NOT inside the `run:` block. GitHub
      # evaluates workflow expressions across the whole run script — shell
      # comment lines included — so a literal empty expression written inside a
      # run block is an "An expression was expected" startup failure. That is
      # what took this workflow down for two days; see tests/workflows.test.ts.
      #
      # Checkout plumbing only: the rescue branch an earlier run left is
      # `fix:prepare`'s to look up and fetch (#471), below.
      - name: Prepare branch and make the PR base available for diffing
        run: |
          set -euo pipefail
          # The checkout persists no credential, so the fetch carries the job's
          # read token itself, as the publish job's push carries its own.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" fetch origin "+refs/heads/${BASE_REF}:refs/heads/${BASE_REF}"
          git checkout -B "$BRANCH"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      # The package, installed once and early, the way the red check installs
      # it (#422), for everything of it this job runs: `fix:prepare` before the
      # PR's code, the runner, and `fix:bundle` after the agent. Node and the registry the package installs from, a version its
      # `engines.node` names, and no cache, since this job runs the PR's code
      # and a cache it saved would be restored on the base branch.
      - name: Set up Node for the package
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # That step points `NPM_CONFIG_USERCONFIG` at the `.npmrc` it wrote, for
      # every later step in the job (#429), the adopter's *Install dependencies*
      # included. So the job's setting goes back to npm's default here, and the
      # path comes out as `userconfig`, handed in `env:` to each step that
      # installs or runs the package from this install. The file `setup-node`
      # wrote, never a second copy.
      - name: Keep the package's registry to the package's steps
        id: npmrc
        run: |
          echo "userconfig=${NPM_CONFIG_USERCONFIG}" >> "$GITHUB_OUTPUT"
          echo "NPM_CONFIG_USERCONFIG=${HOME}/.npmrc" >> "$GITHUB_ENV"

      # Into `RUNNER_TEMP` while nothing of the PR's has run, so a command
      # after the agent finds it there and never asks the registry: `npm exec`
      # takes a package already installed under its `--prefix` at the exact
      # version it names without a request. The agent and the PR's own code
      # (`inputs.setup`) can leave things behind on this runner, so nothing
      # after them is handed the registry token for an install. From
      # `RUNNER_TEMP` too, so no `.npmrc` of the checkout is read.
      - name: Install the package
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --prefix "$RUNNER_TEMP" --no-save @jeffwlawson/agent-workflows@0.8.7

      # The rescue branch an earlier run left (#303), where there is one,
      # fetched to `refs/rescue/` for the runner to resume from (#471). The
      # runner decides whether it still builds on this head; this only
      # fetches it. **An unreadable answer stops the run**, rather than
      # reading as "no rescue": a run that started over without it, and
      # succeeded, would delete it. `fix/prepare.ts` says why.
      #
      # Here, before *Install dependencies*, so nothing of the PR's has run on
      # this runner while it holds the token: the PR's own code can leave a
      # git config entry or a hook behind for a later step. From the install
      # above, and handed the workflow token, read-only in this job, and no
      # writer. Its reason file goes in a directory of its own, which the
      # hand-over below carries for `fix:conclude`'s failure comment.
      - name: Fetch the rescue branch
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}/prepare
          CHECKOUT: ${{ github.workspace }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.7 -- agent-workflows fix:prepare

      # Both setup steps are the adopter's toolchain, so both are skippable.
      # `npm install -g @anthropic-ai/claude-code` below is not: that is the
      # agent's own runtime, and every runner image already has the Node it
      # needs for it.
      - name: Setup Node.js
        if: inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, which `pull_request_target` reads
      # from the default branch, and never an expression reading the PR event.
      - name: Install dependencies
        if: inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The runner below runs from the install above and asks the registry for
      # nothing, so here this step's work is the Node it names; the registry
      # entry is the shape every runner's job shares, and unread in this one.
      # The runner package lives on GitHub Packages, which has no anonymous
      # install even for a public package — see the long note on the same step in
      # agent-review-reusable.yml. Short version: the scoped `.npmrc` is written
      # for `@jeffwlawson` only so a caller's own `npm ci` is untouched, and
      # `packages: read` in the caller is what makes the token below work. The
      # cache opt-out belongs to the same note: this half declares no toolchain,
      # so it must not infer one.
      #
      # With `node-version-file: ''` the toolchain step above is skipped, and
      # without a Node named here the runner would run on the image's, below
      # the package's `engines.node` (#335). So it names one in exactly that
      # case and none otherwise, leaving an adopter's own version file to decide
      # the Node their commands run on. `tests/workflows.test.ts` holds it to
      # `engines.node`.
      - name: Authenticate to GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version-file == '' && '24' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # The runner refuses (non-zero) for three reasons, each with its own
      # sentence in the reason file: nothing trusted rendered *and* part of the
      # query refused, a selection the author gate itself reads, and a query
      # that came back with no answer at all (#76). Nothing to act on is not
      # one of them since #253: the runner writes `nothing_to_do.txt` and exits
      # 0, and the step below says so on the pull request. A refused selection that left trusted feedback
      # standing is not one of them — that run proceeds, with the gap named in
      # the section it took out. This job pushes, so an unestablished author is
      # a reason to stop — and "nothing was said" must never be the sentence a
      # human is shown for "we were not allowed to look".
      - name: Run fix agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_FIX: ${{ vars.AGENT_MODEL_FIX }}
          OUTPUT_DIR: ${{ runner.temp }}
        # The binary *Install the package* linked, run by its path, from the
        # checkout, where the runner does its git work. Not `npm exec`, as the
        # commands of this job are: with the package already under its
        # `--prefix`, `npm exec` installs nothing and puts no install directory
        # on `PATH`, only `node_modules/.bin` of the directory it runs in and
        # each one above it. So from the checkout it finds no command at all
        # (`agent-workflows: not found`, exit 127, and no reason file), and a
        # `PATH` entry handed in would come after the checkout's own
        # `node_modules/.bin`, which the PR's code has just had the chance to
        # write. By path, nothing is looked up, the version is the install's
        # pin, and the registry token stays with the install: this step holds
        # none (#482's rule for an agent's job). Where the PR's code removed
        # the install, the step fails with no reason file, as the red check's
        # classify does.
        run: '"$RUNNER_TEMP/node_modules/.bin/agent-workflows" fix'

      # The agent's own record of the session (#269), so a run can be profiled
      # and debugged from what it did and not only from the log, which shows
      # some of its tool calls and none of its file reads, edits or thinking.
      # Claude Code writes it under `~/.claude/projects/`, in a directory named
      # after the checkout's path, and it goes with the runner unless something
      # keeps it: sandcastle's own copy does not run without a sandbox.
      #
      # **Redacted, never refused.** An artifact on a public repository is
      # readable by anyone who can see the repository, and the agent's
      # environment holds `CLAUDE_CODE_OAUTH_TOKEN`, so a transcript where it
      # printed that environment carries the token. Every secret this job holds
      # is replaced with `[REDACTED]` in a copy, the job token also in the
      # basic-auth form a checkout's git config holds it in, and only the copy
      # is uploaded. The script is the one every agent workflow runs, and names no
      # PAT: no job that runs an agent holds one (#307, #316).
      #
      # `always()`, so a failed, cancelled or timed-out run keeps its record
      # too, and `continue-on-error`, so the record never fails the run it
      # records. The upload reads the redaction's outcome rather than its own
      # `always()` alone, so a copy the redaction did not finish is never sent.
      # `transcript-retention-days` at 0 turns both off.
      - name: Redact the session transcript
        id: transcript
        if: always() && inputs.transcript-retention-days > 0
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, shutil

          source = pathlib.Path.home() / ".claude" / "projects"
          copy = pathlib.Path(os.environ["RUNNER_TEMP"]) / "agent-transcript"
          shutil.rmtree(copy, ignore_errors=True)

          secrets = []
          for name in ("CLAUDE_CODE_OAUTH_TOKEN", "GITHUB_TOKEN"):
              value = os.environ.get(name, "").encode()
              if not value:
                  continue
              secrets.append(value)
              if name != "CLAUDE_CODE_OAUTH_TOKEN":
                  secrets.append(base64.b64encode(b"x-access-token:" + value))

          files = sorted(source.rglob("*.jsonl")) if source.is_dir() else []
          if not files:
              print("No session transcript to upload: the agent never started.")
          for file in files:
              text = file.read_bytes()
              for secret in secrets:
                  text = text.replace(secret, b"[REDACTED]")
              out = copy / file.relative_to(source)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(text)
              print(f"Redacted {file.relative_to(source)} for upload.")
          PY

      # `overwrite`, so a re-run replaces this attempt's copy rather than
      # failing on the name. Uploading needs no scope: the artifact service
      # takes the runner's own token.
      - name: Upload the session transcript
        if: always() && steps.transcript.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: agent-transcript
          path: ${{ runner.temp }}/agent-transcript
          if-no-files-found: ignore
          retention-days: ${{ inputs.transcript-retention-days }}
          overwrite: true

      # The agent's commits, as the one thing `publish` pushes: `fix:bundle`
      # bundles the branch ahead of the head the run started from, as the
      # label's event saw it, and writes nothing where there are none, which
      # `publish` reads as nothing to push. Into a directory of its own, which
      # the hand-over below carries beside the runner's files.
      #
      # `always()` (#303): a run that failed, was cancelled or timed out hands
      # its commits over too, for `publish` to rescue to a side branch rather
      # than push. From the install above, run from `RUNNER_TEMP` and working
      # in the checkout, and **with no token**: the agent and the PR's code
      # have run, and the job's `GH_TOKEN` is set empty for it.
      - name: Bundle the agent's commits
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          GH_TOKEN: ""
          OUTPUT_DIR: ${{ runner.temp }}/bundle
          CHECKOUT: ${{ github.workspace }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.7 -- agent-workflows fix:bundle

      # `fix:prepare`'s reason file on a failure, under `prepare/`;
      # `fix:bundle`'s files, the bundle and its reason file on a failure,
      # under `bundle/`; and every file the runner wrote for the publish job:
      # exactly the files `fix:publish` and `fix:conclude` declare they read
      # from each (the nothing-to-do note, the rescue it set aside, the round
      # header, the thread outcomes, the conversation outcomes, the top-level
      # comments and the out-of-scope notes, as data and with no marker, and
      # the three reason files, which `fix:conclude`'s failure comment reads).
      # One artifact, `always()`, because a failed run is one of the outcomes
      # `publish` reports, and any of them may be missing.
      # The paths' common directory is `runner.temp`, so `prepare/` and
      # `bundle/` stay as they are in the artifact and where `publish` downloads it. Uploading
      # needs no scope: the artifact service takes the runner's own token, so
      # this job stays read-only. `overwrite`, so a re-run replaces this
      # attempt's copy rather than failing on the name.
      #
      # What this job hands over is the agent's to write, whatever a step here
      # meant it to be. So `publish` takes nothing from it but this artifact,
      # which it checks, and `timed-out`, which decides nothing (see the step
      # after this one).
      - name: Hand the branch to the publish job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-fix
          path: |
            ${{ runner.temp }}/prepare/failure_reason.txt
            ${{ runner.temp }}/bundle/branch.bundle
            ${{ runner.temp }}/bundle/failure_reason.txt
            ${{ runner.temp }}/failure_reason.txt
            ${{ runner.temp }}/nothing_to_do.txt
            ${{ runner.temp }}/rescue_ignored.json
            ${{ runner.temp }}/round_header.txt
            ${{ runner.temp }}/thread_outcomes.json
            ${{ runner.temp }}/conversation_outcomes.json
            ${{ runner.temp }}/top_level_comments.json
            ${{ runner.temp }}/out_of_scope_notes.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # Whether this job ran out of time, for `fix:conclude`'s failure comment
      # (#220): glue only Actions can do (ADR 0003). Cancelled is not failed,
      # and a job that reached its limit is cancelled too, or may read as
      # failed in `needs`. What tells a timeout apart is the clock the gate
      # started just before this job: a timed-out job ran its whole limit,
      # less the moment the runner took to start, hence a minute's slack. The
      # limit is compared only where it is a positive integer: `fromJSON`
      # accepts `1.5` and `1e1`, which bash arithmetic refuses, and a limit
      # this cannot compare reads as no timeout, which is still said as a
      # cancel.
      #
      # Last, and `always()`, so it measures however the job ended. On this
      # job's runner, after the agent, so it is the agent's to rewrite like any
      # output here; it decides nothing but which of two sentences a stopped
      # run's comment gives, and never stands in for a reason the runner wrote.
      - name: Measure how the agent's job ended
        id: outcome
        if: always()
        env:
          GH_TOKEN: ""
          JOB_STATUS: ${{ job.status }}
          JOB_STARTED: ${{ needs.gate.outputs.started }}
          TIMEOUT_MINUTES: ${{ vars.AGENT_TIMEOUT_MINUTES || '30' }}
        run: |
          timed_out=false
          if [ "$JOB_STATUS" != "success" ] && [ -n "${JOB_STARTED:-}" ] && [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] && [ $(( $(date +%s) - JOB_STARTED )) -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
            timed_out=true
          fi
          echo "timed-out=${timed_out}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [gate, fix]
    # `always()`, so a failed, cancelled or timed-out agent is still reported
    # and its trigger label still taken off. Not where the gate was skipped
    # (another label's event, or a fork) or refused: that run said what it
    # had to. A pre-flight that died before deciding leaves `refused` empty
    # and comes through, so the label still comes off, as it always has.
    if: vars.AGENT_ORCHESTRATOR != 'service' && always() && needs.gate.result != 'skipped' && needs.gate.outputs.refused != 'true'
    runs-on: ubuntu-latest
    # A clone, a push and some API calls, and a bounded wait for the PR's head.
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # The package `fix:publish` and `fix:conclude` run from, installed by
      # `npm exec`. GitHub Packages has no anonymous install, and the caller
      # already grants it.
      packages: read

    # **No job-level `GH_TOKEN`.** A token is handed to the steps that write
    # with it and to no other, so the checkout, the Node setup, the download
    # and the upload hold none.
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # The agent's job's, which it looks for to resume from (#303), and
      # where `fix:conclude` rescues a stopped run's commits to.
      RESCUE_BRANCH: agent/rescue/fix-${{ github.event.pull_request.number }}
      GH_REPO: ${{ github.repository }}

    steps:
      # The token every write below that the workflow token cannot make is
      # made with: the loop's App's, `AGENT_PAT`, or the workflow token, in
      # that order, and `source` says which. Minted here, at the job's start
      # (ADR 0005), after the agent finished, and in no other job. A mint that
      # fails fails the step: `fix:publish`, which runs only on one that
      # succeeded, is skipped, and `fix:conclude`, told the mint's outcome,
      # says why.
      - name: Resolve the loop's token
        id: token
        if: always()
        uses: jeffwlawson/agent-workflows/.github/actions/loop-token@v0.8.7
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          agent-pat: ${{ secrets.AGENT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # **The one checkout**, of the head the run started from, wherever the
      # gate claimed the run: what `fix:publish` checks the bundle in and
      # pushes from, and what `fix:conclude` rescues from. Nothing the agent
      # touched is on this runner, and no credential is left in it: each push
      # passes its token itself. `always()`, so a mint that failed still gets
      # the checkout: without it `fix:conclude` checks the bundle in an empty
      # workspace, reads it as damaged, and its comment never says the
      # agent's commits went unsaved for want of a token.
      - name: Checkout PR head
        if: always() && needs.gate.outputs.refused == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The Node both commands run on, and the registry they install from. A
      # version rather than a version file, since nothing of the pull
      # request's runs here: the one the package's `engines.node` names, which
      # `tests/workflows.test.ts` holds it to. `always()`, since conclude runs
      # on every ending.
      - name: Authenticate to GitHub Packages
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # Into a directory of its own under `RUNNER_TEMP`, where both commands
      # look for the runner's files, for `fix:bundle`'s under `bundle/`, and
      # `fix:conclude` for `fix:prepare`'s under `prepare/`, where each wrote
      # them there. Its own, so nothing another step writes at
      # `RUNNER_TEMP`, the mint's reason file among them, reads as the
      # runner's. `always()`, so a run that stopped still hands its reason and
      # its commits to the rescue and the failure comment. Tolerated: an
      # agent's job that was killed before its upload leaves nothing to fetch,
      # and `fix:conclude`, told this step's outcome, says so where the agent
      # finished.
      - name: Fetch what the agent handed over
        id: fetch
        if: always() && needs.gate.outputs.refused == 'false'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: agent-fix
          path: ${{ runner.temp }}/agent-fix

      # The success arm (#468): the rescue-set-aside note, the nothing-to-do
      # note, the push, the rescue branch's deletion, the thread replies, the
      # conversation record, the top-level comments, the out-of-scope notes,
      # then the re-review or the ready mark. Every string and marker is its
      # own, from the hand-over's data, and every id it aims a write at it
      # found on the pull request itself. `fix/publish.ts` says why each is as
      # it is.
      #
      # It reads the runner's files from `FIX_DIR` and `fix:bundle`'s from
      # `BUNDLE_DIR`, exactly the files its declaration names, and checks
      # them all, the bundle in the checkout, before its first write. The head
      # the bundle has to build on is the label's event's, never a file the
      # agent's job wrote (ADR 0006). On a run that did not finish it posts
      # only the rescue-set-aside note, where there is one: the rest is
      # `fix:conclude`'s below.
      #
      # Given both tokens: `GH_TOKEN`, the workflow's, which it reads, replies
      # and comments with, and the loop's, which it pushes, labels and marks
      # ready with. Only on a mint that succeeded, and never on a finished
      # agent's run that is being cancelled, which pushes nothing more. From
      # `RUNNER_TEMP`, so no `.npmrc` of the checkout is read, and working in
      # the checkout.
      - name: Publish the fix
        id: publish
        if: >-
          always() && steps.token.outcome == 'success' && needs.fix.result != 'skipped' &&
          (needs.fix.result != 'success' || !cancelled())
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_TOKEN: ${{ steps.token.outputs.token }}
          LOOP_TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          OUTPUT_DIR: ${{ runner.temp }}/publish
          FIX_DIR: ${{ runner.temp }}/agent-fix
          BUNDLE_DIR: ${{ runner.temp }}/agent-fix/bundle
          CHECKOUT: ${{ github.workspace }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGENT_RESULT: ${{ needs.fix.result }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.7 -- agent-workflows fix:publish

      # Every other ending, and the label however the run ended (#469): a
      # stopped run's commits rescued to `RESCUE_BRANCH` where nothing was
      # pushed to the pull request (#303), the failure comment with the reason
      # and the retry the ending calls for (#105, #220, #253), then `agent:fix`
      # off (#236), then `agent:blocked`, in the loop's one order.
      # `fix/conclude.ts` says why each is as it is.
      #
      # `always()`: the ending is the point of it. Told the facts, not the
      # conclusions: how the gate and the agent's job ended, whether the
      # agent's job ran out of time and its limit, and the outcome of each
      # step above, so the package works out which ending this is. It reads
      # `fix:publish`'s `published.json` and reason from publish's directory,
      # and `fix:prepare`'s, the runner's and `fix:bundle`'s from the
      # hand-over, each from its own producer's directory, and checks the bundle in the checkout before
      # it rescues from it.
      #
      # Given both tokens, the loop's empty where it was not minted, which is
      # one of the endings it reports: it rescues with the loop's, as
      # `fix:publish` pushes, and writes everything else with the workflow's.
      - name: Conclude the run
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_TOKEN: ${{ steps.token.outputs.token }}
          LOOP_TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          OUTPUT_DIR: ${{ runner.temp }}/conclude
          PUBLISH_DIR: ${{ runner.temp }}/publish
          PREPARE_DIR: ${{ runner.temp }}/agent-fix/prepare
          FIX_DIR: ${{ runner.temp }}/agent-fix
          BUNDLE_DIR: ${{ runner.temp }}/agent-fix/bundle
          CHECKOUT: ${{ github.workspace }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REFUSED: ${{ needs.gate.outputs.refused }}
          GATE_RESULT: ${{ needs.gate.result }}
          GATE_REASON: ${{ needs.gate.outputs.failure-reason }}
          AGENT_RESULT: ${{ needs.fix.result }}
          TIMED_OUT: ${{ needs.fix.outputs.timed-out }}
          TIMEOUT_MINUTES: ${{ vars.AGENT_TIMEOUT_MINUTES || '30' }}
          MINT_OUTCOME: ${{ steps.token.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.fetch.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.7 -- agent-workflows fix:conclude

      # Every write the two commands made, one line each as it landed, and a
      # last line for how each ended (ADR 0005), kept for whoever audits the
      # run. One artifact, each command's log by the path it declares, and no
      # wildcard. `always()`, since a run that stopped is the one a log is
      # read for, and nothing of a command that never ran.
      - name: Keep the write logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-fix-write-log
          path: |
            ${{ runner.temp }}/publish/write_log.jsonl
            ${{ runner.temp }}/conclude/write_log.jsonl
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
