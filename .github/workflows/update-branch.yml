name: Agent Update Branch (reusable)

# The update-branch job itself. The `update-branch` job in `agent-pr.yml` is the
# caller (two wires, under that file's trigger), and every control stays here, in
# a file an adopting repo *references* rather than copies
# (jeffwlawson/winget-manifest-lint#98).
#
# Refresh a stale PR branch from the branch it is based on.
#
# Why this exists, concretely: `pull_request_target` takes the workflow YAML
# from the default branch but checks out the PR *head*, so everything the run reads
# out of the working tree comes from the pull request. That bit us on
# jeffwlawson/winget-manifest-lint#46, where a review ran the pre-suggestion
# runner and the test proved nothing until the base branch was merged in by
# hand.
#
# The *runner* half of that is closed structurally since
# jeffwlawson/winget-manifest-lint#96: the runners are a version pinned in this
# file, which is base-controlled. What still comes from the PR head is the
# repo's own `CONTEXT.md` and `CLAUDE.md` — an agent applying superseded
# conventions — and the code under review itself.
#
# Most refreshes are a clean merge, which needs no agent at all. The agent is
# invoked only when git reports conflicts.
on:
  workflow_call:
    inputs:
      default-branch:
        description: >-
          Branch to merge in when the pull-request event carries no base ref. On
          a real PR `base.ref` is always set, so this fires only when something
          is already odd — but an unset fallback degrades *silently* to merging
          the wrong branch, which is jeffwlawson/winget-manifest-lint#100
          arriving by a different route.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets its
          conflicts resolved, on the Node the runner package requires. Only
          reached on the conflicts path — a clean merge needs no agent and
          skips both setup steps regardless.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or a PR title becomes
          a shell script.
        type: string
        default: npm ci
      transcript-retention-days:
        description: >-
          Days the agent's Claude Code session transcript is kept, as this
          run's `agent-transcript` artifact, with every secret the job holds
          redacted. 0 turns the upload off. On a public repository the
          artifact is readable by anyone who can see the repository; see
          docs/ADOPTING.md §2d.
        type: number
        default: 3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the conflict-resolution agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT, used to check the branch out, push it, and — where conflicts
          had to be resolved — add the `agent:review` that asks for the review
          of the resolution. Neither a push nor a label made with `GITHUB_TOKEN`
          triggers another workflow (docs/ADOPTING.md §1), which on a refresh is
          the whole point of the refresh. Optional, and both halves degrade
          rather than fail: the push still lands, and the label still goes on
          but starts no review until a human re-adds it. The loop's App, where
          it is set up, takes its place.
        required: false
      AGENT_APP_ID:
        description: >-
          The loop's GitHub App's ID. With `AGENT_APP_PRIVATE_KEY`, the publish
          job mints a token for this repository from the App and makes the
          writes `AGENT_PAT` would make with it, as the App's bot. Optional;
          without both, `AGENT_PAT` is used as before.
        required: false
      AGENT_APP_PRIVATE_KEY:
        description: The loop's GitHub App's private key. See `AGENT_APP_ID`.
        required: false

# One group per PR — shared with agent:fix, which pushes the same branch,
# and agent:review, which reads it while a push would move it
# (jeffwlawson/winget-manifest-lint#102).
#
# On the workflow rather than on a job, because the run is three jobs that
# hand off to each other (see `implement.yml`'s note on its own group): a
# job-level group is released between them, and another run on this pull
# request could push between this run's merge and its push.
#
# A workflow-level group is entered before any job's `if:` is evaluated
# (probed, #309), and a group admits one pending run, cancelling the one it
# replaces. So an event for any other label takes a group of its own, keyed
# by its run id: otherwise adding a triage label while a run is in progress
# would cancel an `agent:update-branch` run waiting behind it, and nothing
# would say so.
concurrency:
  group: agent-pr-${{ github.event.pull_request.number }}${{ github.event.label.name != 'agent:update-branch' && format('-other-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# **Three jobs, and the agent's holds nothing it could use to write**, for
# the reason `implement.yml` gives in full: the agent can read every secret
# its own job names, from the runner process's memory, and leave something
# behind for a later step on its runner. So `gate` refuses or claims the pull
# request and tries the merge, which tells it whether there is anything for
# an agent to do; `update-branch` runs the agent on a conflicted merge only,
# with a read-only token and no PAT named anywhere, and hands over its
# resolution as a `git bundle`; and `publish` starts on a fresh runner and
# pushes: a clean merge it makes again itself, of the base commit the gate
# merged, and a resolution it checks before it pushes it.
#
# The permissions differ per job, and the caller grants the union: what
# `publish` spends. The caller is unchanged.
#
# Every job's `if:` opens with `vars.AGENT_ORCHESTRATOR != 'service'` (#455):
# a repository that sets that variable is served by the service orchestrator,
# and every job here skips, so one orchestrator answers each label. Unset, or
# any other value, leaves the rest of each condition as it was.
jobs:
  gate:
    # Same two guards as the other PR workflows: the trigger label, and
    # same-repo only so a fork PR never reaches checkout with secrets in scope.
    # The two jobs after it follow from its outputs, so this is the one guard.
    if: >-
      vars.AGENT_ORCHESTRATOR != 'service' &&
      github.event.label.name == 'agent:update-branch' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # API calls, a bounded wait for a review's posting, and a merge; the
    # agent's own limit is on its job.
    timeout-minutes: 15
    # Granted by the caller, bounded here, per job: a called workflow can only
    # downgrade the token it is handed, and a permission declared only here
    # grants nothing.
    permissions:
      # The checkout and the fetch of the base branch.
      contents: read
      # The refusal and the label transitions.
      pull-requests: write
      # Installing the package `update-branch:gate` and `update-branch:merge`
      # run from, by `npm install`. GitHub Packages has no anonymous install, so
      # this is needed even though the package is public, and, being a bound,
      # it grants nothing without the caller's own `packages: read`, which
      # both caller sets already grant.
      packages: read
    outputs:
      # `false` where the run goes ahead, `true` where it refused, and empty
      # where the gate died before deciding: the three `refused` takes in
      # `implement.yml`, so the jobs after it read one word the same way.
      refused: ${{ steps.state.outputs.proceed == 'true' && 'false' || steps.state.outputs.proceed == 'false' && 'true' || '' }}
      status: ${{ steps.merged.outputs.status }}
      base: ${{ steps.merged.outputs.base }}
      conflicts: ${{ steps.merged.outputs.conflicts }}
      started: ${{ steps.clock.outputs.started }}
      # The sentence a command in this job failed with, where it failed after
      # claiming the run (the probe, or the merge's fetch), for the failure
      # comment: its reason file is in this job's `runner.temp`, which no
      # later job can read.
      failure-reason: ${{ steps.state.outputs.failure-reason || steps.merged.outputs.failure-reason }}

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # The PR's real base branch — the branch this job merges in. A hardcoded
      # `main` merges an unrelated branch into any PR stacked on another one
      # (jeffwlawson/winget-manifest-lint#71 fixed review and fix;
      # jeffwlawson/winget-manifest-lint#100 fixed this, the site they missed).
      # The event field is the source; `default-branch` is the fallback for an
      # event that somehow carries none, which is the adopter's call to make
      # rather than a literal `main` buried in a shell expansion.
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.default-branch }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # `update-branch:gate` runs before anything is checked out, so there is
      # no Node here yet: Node and the registry the package installs from, set
      # up for the gate, as `fix.yml`'s gate job does. A version rather than a
      # version file, since there is no checkout to read one from: the one the
      # package's `engines.node` names, which `tests/workflows.test.ts` holds
      # it to. No adopter step runs in this job, so the `.npmrc` it points npm
      # at needs none of the `userconfig` handling review's gate job has
      # (#429).
      - name: Set up Node for the gate
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # The package, installed once and early, the way fix's agent job
      # installs it (#472), for the two commands this job runs:
      # `update-branch:gate` before the checkout, and `update-branch:merge`
      # after it. `npm exec` takes a package already installed under its
      # `--prefix` at the exact version it names without a request; one it
      # ran itself is in npm's own cache, not under the prefix, so a later
      # `npm exec` would ask the registry again. This is the one step of the
      # job handed the registry token, before anything is checked out, and
      # from `RUNNER_TEMP`, so no `.npmrc` of a checkout is read.
      - name: Install the package
        working-directory: ${{ runner.temp }}
        env:
          # `GITHUB_TOKEN`, carrying the `packages: read` the caller granted:
          # there is no anonymous install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --prefix "$RUNNER_TEMP" --no-save @jeffwlawson/agent-workflows@0.8.7

      # Everything this job settles before the checkout, as one command
      # (#481): the pre-flight, which refuses a closed or merged pull request
      # with a comment and then takes `agent:update-branch` off; the
      # permission probe, the label write a short token feels first, which
      # fails the run before the checkout; `agent:blocked` off; and the
      # bounded wait while a review is posting (#257), since this run reads
      # the verdict a review posts. `update-branch/gate.ts` says why each is
      # as it is. What it decided is its `gate.json`, which the step below
      # copies into this job's outputs.
      - name: Refuse or claim the pull request
        id: gate
        working-directory: ${{ runner.temp }}
        env:
          OUTPUT_DIR: ${{ runner.temp }}
        # `npm exec --prefix` rather than a bare `npx`: see the long note on
        # the runner step below. From the install above, so it asks the
        # registry nothing.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.7 -- agent-workflows update-branch:gate

      # Glue only Actions can do (ADR 0003): the gate's decision, copied into
      # the step output `proceed`, which the job's `refused` and every later
      # step here read. `always()`, so a gate that decided to go ahead and
      # then failed, at the probe, still says so; nothing where it wrote no
      # `gate.json`, which `refused` reads as a gate that died before
      # deciding. And the reason the gate failed with, where it wrote one, as
      # `failure-reason`, whole, under a delimiter of its own, as `fix.yml`'s
      # gate job hands its on.
      - name: Hand the gate's decision to the job
        id: state
        if: always()
        run: |
          reason="${RUNNER_TEMP}/failure_reason.txt"
          if [ -f "$reason" ]; then
            delimiter="REASON_$(date +%s%N)_${RANDOM}"
            {
              echo "failure-reason<<${delimiter}"
              printf '%s\n' "$(cat "$reason")"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi
          file="${RUNNER_TEMP}/gate.json"
          [ -f "$file" ] || { echo "update-branch:gate wrote no gate.json; this run decided nothing."; exit 0; }
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$file" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.state.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # No credential is left in the checkout, and this job pushes
          # nothing: the publish job pushes, from a checkout of its own.
          persist-credentials: false

      # The whole of the work in the common case. Only a conflicted merge goes
      # further. `update-branch:merge` fetches `BASE_REF`, with the job's read
      # token in git's environment and never in the checkout's config, checks
      # the head out as `BRANCH` and merges the base in, as the loop's
      # committer: up to date, clean, or conflicts, with the base commit it
      # read and the conflicted paths, in its `merge.json`. A fetch that
      # fails, a deleted base among its causes, stops the run with a reason
      # rather than reading as up to date.
      #
      # After the checkout of the PR's code, though it runs none of it: from
      # `RUNNER_TEMP`, so npm reads no `.npmrc` of the checkout, and with no
      # `NODE_AUTH_TOKEN`, so it holds no registry token while it could. It
      # runs from the install *Install the package* made under `RUNNER_TEMP`
      # before the checkout, which the same spec at the same exact version
      # takes without a request. Its reason file goes in a directory of its
      # own, so it never reads as the gate's.
      - name: Attempt the merge
        if: steps.state.outputs.proceed == 'true'
        id: merge
        working-directory: ${{ runner.temp }}
        env:
          OUTPUT_DIR: ${{ runner.temp }}/merge
          CHECKOUT: ${{ github.workspace }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.7 -- agent-workflows update-branch:merge

      # Glue only Actions can do (ADR 0003): what the merge came to, copied
      # into the step outputs the job's `status`, `base` and `conflicts`
      # read, the paths joined by spaces on one line, as the shell step wrote
      # them. And the reason the merge failed with, where it wrote one, as
      # the gate's is handed on. `always()` where the gate went ahead, so a
      # failed merge still hands its reason on; nothing where it wrote no
      # `merge.json`.
      - name: Hand the merge to the job
        id: merged
        if: always() && steps.state.outputs.proceed == 'true'
        run: |
          reason="${RUNNER_TEMP}/merge/failure_reason.txt"
          if [ -f "$reason" ]; then
            delimiter="REASON_$(date +%s%N)_${RANDOM}"
            {
              echo "failure-reason<<${delimiter}"
              printf '%s\n' "$(cat "$reason")"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi
          file="${RUNNER_TEMP}/merge/merge.json"
          [ -f "$file" ] || { echo "update-branch:merge wrote no merge.json; this run merged nothing."; exit 0; }
          jq -r '"status=\(.status)", "base=\(.base)", "conflicts=\(.conflicts | join(" ") | gsub("[\r\n]"; " "))"' "$file" >> "$GITHUB_OUTPUT"

      # The clock the failure step reads a time limit off (#220). A job that
      # reaches its `timeout-minutes` is cancelled, not failed, and nothing in
      # the `needs` context says which cancellation it was, so that step
      # compares how long the agent's job could have run with its limit. Last
      # in this job, so it starts as near the agent's job as a step here can,
      # and is read from this job's outputs rather than the agent's, which a
      # step there could rewrite.
      - name: Start the agent's clock
        if: steps.state.outputs.proceed == 'true'
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

  update-branch:
    needs: gate
    # Only on the conflicts path: a clean merge needs no agent, and the
    # publish job makes it itself.
    if: vars.AGENT_ORCHESTRATOR != 'service' && needs.gate.outputs.refused == 'false' && needs.gate.outputs.status == 'conflicts'
    runs-on: ubuntu-latest
    # The repository variable `AGENT_TIMEOUT_MINUTES` where it is set (#220),
    # shared by the four jobs that run an agent to write code, and 30 where it
    # is not. `vars` is among the contexts this key may read, and in a called
    # workflow it resolves against the caller's repository. `fromJSON` because
    # a variable is a string and this key wants a number; a value that is not
    # one fails the job before any step, which `doctor` reports. The failure
    # step in `publish` names the same figure.
    timeout-minutes: ${{ fromJSON(vars.AGENT_TIMEOUT_MINUTES || '30') }}
    # **Read-only, and no PAT named anywhere in this job.** Not even in a step
    # that never runs: a secret is delivered to every job whose text names it.
    permissions:
      # The checkout.
      contents: read
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read
      # The runner reads the pull request's heading for the agent's prompt.
      pull-requests: read

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.default-branch }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ needs.gate.outputs.base }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # No credential is left in the checkout for the agent's git, or
          # anything else it runs, to find. Nothing in this job pushes.
          persist-credentials: false

      # The package, installed once and early, the way fix's agent job
      # installs it (#472), for everything of it this job runs:
      # `update-branch:prepare` before the PR's code, and the runner after it.
      # Node and the registry the package installs from, a version its
      # `engines.node` names, and no cache, since this job runs the PR's code
      # and a cache it saved would be restored on the base branch.
      - name: Set up Node for the package
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # That step points `NPM_CONFIG_USERCONFIG` at the `.npmrc` it wrote, for
      # every later step in the job (#429), the adopter's *Install dependencies*
      # included. So the job's setting goes back to npm's default here, and the
      # path comes out as `userconfig`, handed in `env:` to each step that
      # installs or runs the package from this install. The file `setup-node`
      # wrote, never a second copy.
      - name: Keep the package's registry to the package's steps
        id: npmrc
        run: |
          echo "userconfig=${NPM_CONFIG_USERCONFIG}" >> "$GITHUB_OUTPUT"
          echo "NPM_CONFIG_USERCONFIG=${HOME}/.npmrc" >> "$GITHUB_ENV"

      # Into `RUNNER_TEMP` while nothing of the PR's has run, so the runner
      # after it runs that install and never asks the registry. The agent and
      # the PR's own code (`inputs.setup`) can leave things behind on this
      # runner, so nothing after them is handed the registry token: this is
      # the one step of the job that is. From `RUNNER_TEMP` too, so no `.npmrc`
      # of the checkout is read.
      - name: Install the package
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --prefix "$RUNNER_TEMP" --no-save @jeffwlawson/agent-workflows@0.8.7

      # The gate's merge, made again (#482), so the agent starts from the
      # conflicted tree the gate found: `update-branch:prepare` fetches
      # `BASE_REF` and merges `BASE_SHA`, the base commit the gate merged,
      # under the same name, so the merge and its message are the gate's. A
      # merge that does not stop on a conflict here is not the run the gate
      # decided on, so it refuses, as it does where the base no longer holds
      # that commit. `update-branch/prepare.ts` says why.
      #
      # Here, before *Install dependencies*, so nothing of the PR's has run on
      # this runner while it holds the token: the PR's own code can leave a
      # git config entry or a hook behind for a later step. From the install
      # above, and handed the workflow token, read-only in this job, and no
      # writer. Its reason file goes in a directory of its own, which the
      # hand-over below carries for the failure comment.
      - name: Repeat the conflicted merge
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          OUTPUT_DIR: ${{ runner.temp }}/prepare
          CHECKOUT: ${{ github.workspace }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.7 -- agent-workflows update-branch:prepare

      # Node and the dependency install are only needed to resolve conflicts,
      # which is the only path this job runs on; and both are the adopter's
      # toolchain besides, so both are also skippable by input.
      - name: Setup Node.js
        if: inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, which `pull_request_target` reads
      # from the default branch, and never an expression reading the PR event.
      - name: Install dependencies
        if: inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The runner below runs from the install above and asks the registry for
      # nothing, so here this step's work is the Node it names; the registry
      # entry is the shape every runner's job shares, and unread in this one.
      # The runner package lives on GitHub Packages, which has no anonymous
      # install even for a public package — see the long note on the same step in
      # agent-review-reusable.yml. Short version: the scoped `.npmrc` is written
      # for `@jeffwlawson` only so a caller's own `npm ci` is untouched, and
      # `packages: read` in the caller is what makes the token below work. The
      # cache opt-out belongs to the same note: this half declares no toolchain,
      # so it must not infer one.
      #
      # With `node-version-file: ''` the toolchain step above is skipped, and
      # without a Node named here the runner would run on the image's, below
      # the package's `engines.node` (#335). So it names one in exactly that
      # case and none otherwise, leaving an adopter's own version file to decide
      # the Node their commands run on. `tests/workflows.test.ts` holds it to
      # `engines.node`.
      - name: Authenticate to GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version-file == '' && '24' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      - name: Resolve conflicts
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_UPDATE_BRANCH: ${{ vars.AGENT_MODEL_UPDATE_BRANCH }}
          OUTPUT_DIR: ${{ runner.temp }}
          CONFLICTS: ${{ needs.gate.outputs.conflicts }}
        # The binary *Install the package* linked, run by its path, from the
        # checkout, where the runner does its git work, as fix's runner runs.
        # Not `npm exec`: with the package already under its `--prefix`, `npm
        # exec` installs nothing and puts no install directory on `PATH`, only
        # `node_modules/.bin` of the directory it runs in and each one above
        # it, so from the checkout it finds no command at all. By path,
        # nothing is looked up, the version is the install's pin, and the
        # registry token stays with the install: this step holds none (#482).
        run: '"$RUNNER_TEMP/node_modules/.bin/agent-workflows" update-branch'

      # The agent's own record of the session (#269), so a run can be profiled
      # and debugged from what it did and not only from the log, which shows
      # some of its tool calls and none of its file reads, edits or thinking.
      # Claude Code writes it under `~/.claude/projects/`, in a directory named
      # after the checkout's path, and it goes with the runner unless something
      # keeps it: sandcastle's own copy does not run without a sandbox.
      #
      # **Redacted, never refused.** An artifact on a public repository is
      # readable by anyone who can see the repository, and the agent's
      # environment holds `CLAUDE_CODE_OAUTH_TOKEN`, so a transcript where it
      # printed that environment carries the token. Every secret this job holds
      # is replaced with `[REDACTED]` in a copy, the job token also in the
      # basic-auth form a checkout's git config holds it in, and only the copy
      # is uploaded. The script is the one every agent workflow runs, and names no
      # PAT: no job that runs an agent holds one (#307, #316).
      #
      # `always()`, so a failed, cancelled or timed-out run keeps its record
      # too, and `continue-on-error`, so the record never fails the run it
      # records. The upload reads the redaction's outcome rather than its own
      # `always()` alone, so a copy the redaction did not finish is never sent.
      # `transcript-retention-days` at 0 turns both off.
      - name: Redact the session transcript
        id: transcript
        if: always() && inputs.transcript-retention-days > 0
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, shutil

          source = pathlib.Path.home() / ".claude" / "projects"
          copy = pathlib.Path(os.environ["RUNNER_TEMP"]) / "agent-transcript"
          shutil.rmtree(copy, ignore_errors=True)

          secrets = []
          for name in ("CLAUDE_CODE_OAUTH_TOKEN", "GITHUB_TOKEN"):
              value = os.environ.get(name, "").encode()
              if not value:
                  continue
              secrets.append(value)
              if name != "CLAUDE_CODE_OAUTH_TOKEN":
                  secrets.append(base64.b64encode(b"x-access-token:" + value))

          files = sorted(source.rglob("*.jsonl")) if source.is_dir() else []
          if not files:
              print("No session transcript to upload: the agent never started.")
          for file in files:
              text = file.read_bytes()
              for secret in secrets:
                  text = text.replace(secret, b"[REDACTED]")
              out = copy / file.relative_to(source)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(text)
              print(f"Redacted {file.relative_to(source)} for upload.")
          PY

      # `overwrite`, so a re-run replaces this attempt's copy rather than
      # failing on the name. Uploading needs no scope: the artifact service
      # takes the runner's own token.
      - name: Upload the session transcript
        if: always() && steps.transcript.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: agent-transcript
          path: ${{ runner.temp }}/agent-transcript
          if-no-files-found: ignore
          retention-days: ${{ inputs.transcript-retention-days }}
          overwrite: true

      # The resolution, as the one thing `publish` pushes on this path:
      # `update-branch:bundle` (#483) bundles the branch ahead of the pull
      # request's head and the base commit the gate merged, which `publish` has
      # from its own checkout and fetch, the way `fix:bundle` bundles. A
      # bundle rather than a push from here: this job holds no token that can
      # write, and the runner that ran the agent is not one to spend a token
      # on. Where the agent succeeded only: nothing to bundle then is a
      # refusal, with a reason. Into a directory of its own, which the
      # hand-over below carries beside the runner's files.
      #
      # From the install above, run from `RUNNER_TEMP` and working in the
      # checkout, and **with no token**: the agent and the PR's code have run,
      # and the job's `GH_TOKEN` is set empty for it.
      - name: Bundle the branch
        if: success()
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          GH_TOKEN: ""
          OUTPUT_DIR: ${{ runner.temp }}/bundle
          CHECKOUT: ${{ github.workspace }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.7 -- agent-workflows update-branch:bundle

      # The bundle, the comment the runner wrote and the reason file on a
      # failure: the runner's at `runner.temp`, `update-branch:prepare`'s
      # under `prepare/`, and `update-branch:bundle`'s, the bundle and its
      # reason file, under `bundle/`, as one artifact. The paths' common
      # directory is `runner.temp`, so `prepare/` and `bundle/` stay as they
      # are in the artifact and where `publish` downloads it. `always()`, because a failed run is one of
      # the outcomes `publish` reports, and any of them may be missing.
      # Uploading needs no scope: the artifact service takes the runner's own
      # token, so this job stays read-only. `overwrite`, so a re-run replaces
      # this attempt's copy rather than failing on the name.
      #
      # What this job hands over is the agent's to write, whatever a step here
      # meant it to be. So `publish` takes nothing from it but this artifact,
      # which it checks, and reads nothing from this job's outputs.
      - name: Hand the branch to the publish job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-update-branch
          path: |
            ${{ runner.temp }}/prepare/failure_reason.txt
            ${{ runner.temp }}/bundle/branch.bundle
            ${{ runner.temp }}/bundle/failure_reason.txt
            ${{ runner.temp }}/failure_reason.txt
            ${{ runner.temp }}/update_comment.md
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  publish:
    needs: [gate, update-branch]
    # `always()`, so a failed, cancelled or timed-out agent is still reported
    # and its trigger label still taken off, and so a clean merge, where the
    # agent's job is skipped, is pushed at all. Not where the gate was skipped
    # (another label's event, or a fork) or refused: that run said what it
    # had to. A pre-flight that died before deciding leaves `refused` empty
    # and comes through, so the label still comes off, as it always has.
    if: vars.AGENT_ORCHESTRATOR != 'service' && always() && needs.gate.result != 'skipped' && needs.gate.outputs.refused != 'true'
    runs-on: ubuntu-latest
    # A clone, a merge, a push and some API calls, and a bounded wait for the
    # PR's head.
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Carrying the review's verdict on to the merge commit a clean refresh
      # creates (#99). A commit status is its own scope rather than part of
      # `pull-requests: write`, so nothing above covers it. The command that
      # posts the copy warns rather than failing, the branch having already
      # moved by then — but a caller omitting the grant does not buy that
      # warning: it grants less than this block declares, and the run is
      # refused before any job starts (probed, #146).
      statuses: write
      # The package `update-branch:publish` runs from, installed by `npm
      # exec`. GitHub Packages has no anonymous install, and both caller sets
      # already grant it.
      packages: read

    # **No job-level `GH_TOKEN`.** A token is handed to the steps that write
    # with it and to no other, so the checkout, the Node setup, the download
    # and the uploads hold none.
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.default-branch }}
      GH_REPO: ${{ github.repository }}

    steps:
      # The token every write below that the workflow token cannot make is
      # made with: the loop's App's, `AGENT_PAT`, or the workflow token, in
      # that order, and `source` says which. Minted here, before the first
      # write and after the agent finished, and in no other job.
      - name: Resolve the loop's token
        id: token
        if: always()
        uses: jeffwlawson/agent-workflows/.github/actions/loop-token@v0.8.7
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          agent-pat: ${{ secrets.AGENT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # **The one checkout**, of the head the run started from, wherever the
      # gate claimed the run: what `update-branch:publish` makes the clean
      # merge in, checks a resolution in and pushes from. Nothing the agent
      # touched is on this runner, and no credential is left in it: the fetch
      # and the push pass their tokens themselves. `always()`, so a step
      # after it that runs on every ending never works in an empty workspace
      # (#473's last bug).
      - name: Checkout PR head
        if: always() && needs.gate.outputs.refused == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The Node the command runs on, and the registry it installs from. A
      # version rather than a version file, since nothing of the pull
      # request's runs here: the one the package's `engines.node` names, which
      # `tests/workflows.test.ts` holds it to.
      - name: Authenticate to GitHub Packages
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # Into `RUNNER_TEMP`, where `update-branch:publish` reads the runner's
      # `update_comment.md`, and `update-branch:bundle`'s bundle under
      # `bundle/`, and the failure step below each reason file. Tolerated: an
      # agent's job that was killed before its upload, or never ran, leaves
      # nothing to fetch, and the failure step still has to run.
      - name: Fetch what the agent handed over
        id: fetch
        if: always() && needs.gate.outputs.status == 'conflicts'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: agent-update-branch
          path: ${{ runner.temp }}

      # The success arm (#484): the push, the verdict carried over to a clean
      # merge, the comment saying what the run did, then the review of a
      # resolution. `update-branch/publish.ts` says why each is as it is.
      #
      # **What is pushed is never the agent's job's word alone.** A clean
      # merge is made again here, of the base commit the gate merged; a
      # resolution is `update-branch:bundle`'s bundle, from `BUNDLE_DIR`,
      # checked in the checkout against the head the run started for and the
      # base commit the gate read, never a file the agent's job wrote (ADR
      # 0006). Every check is made before the first write, and the push is
      # leased on that head.
      #
      # Given both tokens: `GH_TOKEN`, the workflow's, which it fetches,
      # reads, comments and carries the verdict with, since a status from any
      # other account is one the next round does not read as the loop's; and
      # the loop's, which it pushes and labels with. Only where the gate
      # claimed the run and the merge has something to publish, and on a mint
      # that succeeded. From `RUNNER_TEMP`, so no `.npmrc` of the checkout is
      # read, and working in the checkout.
      - name: Publish the refresh
        id: publish
        if: needs.gate.result == 'success' && needs.gate.outputs.refused == 'false' && (needs.gate.outputs.status != 'conflicts' || needs.update-branch.result == 'success') && success()
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_TOKEN: ${{ steps.token.outputs.token }}
          LOOP_TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          OUTPUT_DIR: ${{ runner.temp }}/publish
          UPDATE_BRANCH_DIR: ${{ runner.temp }}
          BUNDLE_DIR: ${{ runner.temp }}/bundle
          CHECKOUT: ${{ github.workspace }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS: ${{ needs.gate.outputs.status }}
          BASE_SHA: ${{ needs.gate.outputs.base }}
          AGENT_RESULT: ${{ needs.update-branch.result }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.7 -- agent-workflows update-branch:publish

      # Glue only Actions can do (ADR 0003), until `update-branch:conclude`
      # reads `published.json` itself: whether the command pushed, the head
      # it pushed and whether it asked for a review, copied into the step
      # outputs the two steps below read. `pushed` is what separates the
      # failure comment's two remedies, and `requested` is the one hand-off or
      # the other. `always()`, so a publish that failed after it pushed still
      # says so; nothing where it wrote no `published.json`.
      - name: Hand what publish did to the job
        id: published
        if: always()
        run: |
          file="${RUNNER_TEMP}/publish/published.json"
          [ -f "$file" ] || { echo "update-branch:publish wrote no published.json; it pushed nothing."; exit 0; }
          jq -r '"pushed=\(.pushed)", "head=\(.head // "")", "requested=\(.requested)"' "$file" >> "$GITHUB_OUTPUT"

      # The remedy depends on whether the branch moved, and since #99 both cases
      # are ordinary: what can fail *after* `update-branch:publish`'s push is
      # its comment and the review it asks for. "The branch was left
      # untouched" is true of everything before the push and false of
      # everything after it, and re-adding the label — which is the whole of
      # the advice — does nothing on a branch that is already merged.
      #
      # Any of the three jobs, where the gate claimed the pull request: the
      # gate failing after it did, the agent's job failing, timing out or
      # being cancelled where it had conflicts to resolve, or a step here.
      # `failure()` in this job sees an ancestor job's failure too, but not a
      # cancelled one, so each result is read by name.
      #
      # In the loop's one order (#236): the comment, then this run's own label
      # off, then `agent:blocked`.
      - name: Mark blocked on failure
        if: always() && needs.gate.outputs.refused == 'false' && (failure() || cancelled() || needs.gate.result != 'success' || (needs.gate.outputs.status == 'conflicts' && needs.update-branch.result != 'success'))
        env:
          # How each job ahead of this one ended, and this job's own status for
          # a cancel that lands while it runs. `job.status` rather than
          # `cancelled()`, which GitHub allows only in an `if:`.
          GATE_RESULT: ${{ needs.gate.result }}
          AGENT_RESULT: ${{ needs.update-branch.result }}
          JOB_STATUS: ${{ job.status }}
          JOB_STARTED: ${{ needs.gate.outputs.started }}
          TIMEOUT_MINUTES: ${{ vars.AGENT_TIMEOUT_MINUTES || '30' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUSHED: ${{ steps.published.outputs.pushed }}
          # The sentence a gate command failed with, from the gate job's
          # outputs, since its reason file is on that job's runner.
          GATE_REASON: ${{ needs.gate.outputs.failure-reason }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `update-branch:publish`'s reason file, under `publish/`, where it
          # stopped; else the agent's job's: `update-branch:prepare`'s, under
          # `prepare/`, where it refused before the runner ran;
          # `update-branch:bundle`'s, under `bundle/`, where it refused after
          # the runner succeeded; or else the runner's.
          reason_file=""
          if [ -f "${RUNNER_TEMP}/publish/failure_reason.txt" ]; then
            reason_file="${RUNNER_TEMP}/publish/failure_reason.txt"
          elif [ -f "${RUNNER_TEMP}/prepare/failure_reason.txt" ]; then
            reason_file="${RUNNER_TEMP}/prepare/failure_reason.txt"
          elif [ -f "${RUNNER_TEMP}/bundle/failure_reason.txt" ]; then
            reason_file="${RUNNER_TEMP}/bundle/failure_reason.txt"
          elif [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason_file="${RUNNER_TEMP}/failure_reason.txt"
          fi
          reason="It stopped without giving a reason. The workflow run's log has the details."
          if [ -n "$reason_file" ]; then
            reason=$(cat "$reason_file")
          elif [ -n "${GATE_REASON:-}" ]; then
            reason="$GATE_REASON"
          fi
          # Cancelled is not failed (#220), and a job that reached its limit
          # is cancelled too. What tells the two apart is the clock the gate
          # started just before the agent's job: a timed-out job ran its whole
          # limit, and the time since that clock is at least that. A reason
          # file is not read on either; what wrote one was stopped, not
          # failing. The labels and the retry are a failure's, word for word.
          #
          # The clock is read on a failure that left no reason file too: the
          # agent's result here is the `needs` context's, and a runner that
          # wrote no reason did not end on its own terms either way.
          # The limit is compared only where it is a positive integer: `fromJSON`
          # accepts `1.5` and `1e1`, which bash arithmetic refuses, and under
          # `bash -e` that would end this step before its comment. A limit the
          # step cannot compare reads as a cancel, which is still said.
          stopped=false
          if [ "$JOB_STATUS" = "cancelled" ] || [ "$GATE_RESULT" = "cancelled" ] || [ "$AGENT_RESULT" = "cancelled" ]; then
            stopped=true
            reason="It was cancelled before it finished, by hand or by GitHub."
          elif [ "$AGENT_RESULT" = "failure" ] && [ -z "$reason_file" ]; then
            stopped=true
          fi
          if [ "$stopped" = "true" ]; then
            if [ -n "${JOB_STARTED:-}" ] && [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] && [ $(( $(date +%s) - JOB_STARTED )) -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
              reason="It timed out after ${TIMEOUT_MINUTES} minutes. The repository variable \`AGENT_TIMEOUT_MINUTES\` raises the limit."
            fi
          fi
          # One pattern for every run that stopped (#253): the reason as a
          # sentence, starting with a capital and ending in a full stop, then
          # the run and what to do.
          reason="${reason^}"
          case "$reason" in *[.!?]) ;; *) reason="${reason}." ;; esac
          retry="To try again, add \`agent:update-branch\`."
          if [ "$PUSHED" = "true" ]; then
            retry="The merge was pushed before it stopped, so running it again would do nothing. Fix the problem above."
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '**`agent:update-branch` stopped:** %s\n\n[Workflow run](%s) · %s\n' "$reason" "$RUN_URL" "$retry" > "$body_file"
          gh pr comment "$PR_NUMBER" --body-file "$body_file" || echo "::warning::Could not post the failure comment on PR #${PR_NUMBER}."
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true

      # The trigger label comes off however the run ends (#236): success,
      # failure, refusal, timeout or cancel, so it never outlives the run.
      # `always()` alone, in a job that runs wherever the gate did not refuse,
      # so a pre-flight that died before deciding is covered too; a refusal
      # took it off already.
      #
      # **A request made while this run worked is not lost**, as in review's
      # copy of this step, which carries the reasoning. Where the run finished
      # and the head has moved on from what it left (the merge it pushed, or
      # the head it found up to date), because somebody pushed, it asks for
      # its own step again: removed above, then added, with the loop's App or
      # `AGENT_PAT`, or not at all. Not on a failure, which is `agent:blocked` and a human's retry,
      # and not while another trigger label is on, since that is a queued run
      # a request now would cancel and strand the label of; review's copy
      # says why.
      #
      # **And not where this run asked for a review of its resolution.** The
      # two are one hand-off or the other, never both: the review is queued in
      # this pull request's concurrency group, and a second request here would
      # queue behind it and cancel it while pending, before it could take
      # `agent:review` off. The busy check below would see that label too; this
      # says it without a read.
      - name: Always remove the trigger label
        if: always()
        env:
          REQUESTED: ${{ steps.published.outputs.requested }}
          PROCEEDED: ${{ needs.gate.outputs.refused == 'false' }}
          # How the run ended, across its jobs: this one's own status, and
          # the gate's and the agent's results, the agent's skipped on a
          # clean merge or an up-to-date branch, which is not a failure.
          JOB_STATUS: ${{ job.status }}
          GATE_RESULT: ${{ needs.gate.result }}
          AGENT_RESULT: ${{ needs.update-branch.result }}
          LEFT_SHA: ${{ steps.published.outputs.head || github.event.pull_request.head.sha }}
          TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          REQUEST_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          if [ "$PROCEEDED" != "true" ] || [ "$JOB_STATUS" != "success" ] || [ "$GATE_RESULT" != "success" ] \
            || [ "$AGENT_RESULT" = "failure" ] || [ "$AGENT_RESULT" = "cancelled" ] || [ -z "$LEFT_SHA" ]; then
            exit 0
          fi
          if [ "$REQUESTED" = "true" ]; then
            echo "This run asked for the review of its resolution, so it asks for nothing more."
            exit 0
          fi
          live=$(gh pr view "$PR_NUMBER" --json state,headRefOid,labels --jq '"\(.state) \(.headRefOid) \([.labels[].name | select(. == "agent:review" or . == "agent:fix" or . == "agent:update-branch")] | join(","))"' 2>/dev/null || echo "")
          read -r state head busy <<< "$live"
          if [ "$state" != "OPEN" ] || [ "$head" = "$LEFT_SHA" ]; then
            exit 0
          fi
          if [ -n "$busy" ]; then
            echo "::notice::PR #${PR_NUMBER} moved on to ${head} while this run left ${LEFT_SHA}, but it carries ${busy}, so agent:update-branch was not asked for again: that run is queued, and a new one would cancel it and leave its label on with no run behind it. Add agent:update-branch by hand once ${busy} is off, if the new head still needs it."
            exit 0
          fi
          if [ "$TOKEN_SOURCE" != "app" ] && [ "$TOKEN_SOURCE" != "pat" ]; then
            echo "::warning::PR #${PR_NUMBER} moved on to ${head} while this run left ${LEFT_SHA}, but neither the loop's App nor AGENT_PAT is set, so agent:update-branch was not asked for again: a label added with GITHUB_TOKEN starts nothing. Add agent:update-branch by hand to refresh the new head."
            gh pr comment "$PR_NUMBER" --body "This PR moved on to \`${head}\` while \`agent:update-branch\` worked on \`${LEFT_SHA}\`. No refresh of the new head will start on its own: neither the loop's App nor \`AGENT_PAT\` is set, and a label added with \`GITHUB_TOKEN\` starts nothing. Add \`agent:update-branch\` by hand to refresh it." \
              || echo "::warning::…and that could not be said on the pull request either."
            exit 0
          fi
          GH_TOKEN="$REQUEST_TOKEN" gh pr edit "$PR_NUMBER" --add-label "agent:update-branch" \
            || echo "::warning::PR #${PR_NUMBER} moved on to ${head} while this run left ${LEFT_SHA}, and agent:update-branch could not be added again. Add it by hand to refresh the new head."

      # Every write `update-branch:publish` made, one line each as it landed,
      # and a last line for how it ended (ADR 0005), kept for whoever audits
      # the run. By the path it declares, and no wildcard. `always()`, since a
      # run that stopped is the one a log is read for, and nothing of a
      # command that never ran.
      - name: Keep the write log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-update-branch-write-log
          path: ${{ runner.temp }}/publish/write_log.jsonl
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
