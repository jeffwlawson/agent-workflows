name: Agent Update Branch (reusable)

# The update-branch job itself. `agent-update-branch.yml` is the caller — a
# trigger and two wires — and every control stays here, in a file an adopting
# repo *references* rather than copies (#98).
#
# Refresh a stale PR branch from the branch it is based on.
#
# Why this exists, concretely: `pull_request_target` takes the workflow YAML
# from the base branch but checks out the PR *head*, so everything the run reads
# out of the working tree comes from the pull request. That bit us on #46, where
# a review ran the pre-suggestion runner and the test proved nothing until the
# base branch was merged in by hand.
#
# The *runner* half of that is closed structurally since #96: the runners are a
# version pinned in this file, which is base-controlled. What still comes from
# the PR head is the repo's own `CONTEXT.md` and `CLAUDE.md` — an agent applying
# superseded conventions — and the code under review itself.
#
# Most refreshes are a clean merge, which needs no agent at all. The agent is
# invoked only when git reports conflicts.
on:
  workflow_call:
    inputs:
      default-branch:
        description: >-
          Branch to merge in when the pull-request event carries no base ref. On
          a real PR `base.ref` is always set, so this fires only when something
          is already odd — but an unset fallback degrades *silently* to merging
          the wrong branch, which is #100 arriving by a different route.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets its
          conflicts resolved, on the image's own Node. Only reached on the
          conflicts path — a clean merge needs no agent and skips both setup
          steps regardless.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or a PR title becomes
          a shell script.
        type: string
        default: npm ci
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the conflict-resolution agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT, used to check the branch out, push it, and — where conflicts
          had to be resolved — add the `agent:review` that asks for the review
          of the resolution. Neither a push nor a label made with `GITHUB_TOKEN`
          triggers another workflow (docs/ADOPTING.md §1), which on a refresh is
          the whole point of the refresh. Optional, and both halves degrade
          rather than fail: the push still lands, and the label still goes on
          but starts no review until a human re-adds it.
        required: false

jobs:
  update-branch:
    # Same two guards as the other PR workflows: the trigger label, and
    # same-repo only so a fork PR never reaches checkout with secrets in scope.
    if: >-
      github.event.label.name == 'agent:update-branch' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One group per PR — shared with agent:fix, which pushes the same branch,
    # and agent:review, which reads it while a push would move it (#102).
    concurrency:
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # Granted by the caller, bounded here — a called workflow can only downgrade
    # the token it is handed, and a permission declared only here grants nothing.
    permissions:
      contents: write
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read
      pull-requests: write
      # Carrying the review's verdict on to the merge commit a clean refresh
      # creates (#99). A commit status is its own scope rather than part of
      # `pull-requests: write`, so nothing above covers it; without it the merge
      # lands and the pull request reads as unreviewed, which the step warns
      # about rather than failing on — the branch has already moved by then.
      statuses: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # The PR's real base branch — the branch this job merges in. A hardcoded
      # `main` merges an unrelated branch into any PR stacked on another one
      # (#71 fixed review and fix; #100 fixed this, the site they missed). The
      # event field is the source; `default-branch` is the fallback for an event
      # that somehow carries none, which is the adopter's call to make rather
      # than a literal `main` buried in a shell expansion.
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.default-branch }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Pre-flight — refuse if the PR is closed or merged
        id: state
        run: |
          if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" = "true" ]; then
            gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
            gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:update-branch\`: this PR is not open."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Transition labels
        if: steps.state.outputs.proceed == 'true'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR head
        if: steps.state.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      # The whole job in the common case. Only a conflicted merge goes further.
      #
      # Shell-safe despite ref names being able to contain `$()`, backticks, `;`,
      # `|` and `&` — see the long note on the fetch step in
      # agent-review-reusable.yml.
      # Short version: BASE_REF arrives as an `env:` var rather than a workflow
      # expression spliced into this script, and a quoted parameter expansion is
      # not re-scanned for syntax (verified 2026-08-02, #75). So `base` is data
      # from the moment it is assigned, and every use of it stays quoted.
      #
      # The `:-main` this line used to carry is gone, not lost: the fallback
      # moved up to the `env:` block, where it is the `default-branch` input.
      #
      # This note lives at step level, NOT inside the `run:` block. GitHub
      # evaluates workflow expressions across the whole run script — shell
      # comment lines included — so prose about expressions written in there
      # can silently change meaning, or fail the workflow at startup. See the
      # matching note in agent-fix-reusable.yml and tests/workflows.test.ts.
      - name: Attempt the merge
        if: steps.state.outputs.proceed == 'true'
        id: merge
        run: |
          set -uo pipefail
          base="$BASE_REF"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

          # Checked, not bare: without `set -e` a failed fetch would leave
          # `origin/$base` missing, every rev-parse below would print nothing,
          # and the empty-equals-empty comparison would report "up to date" on a
          # branch that was never merged. A deleted base branch is a real case
          # once the base is the PR's own, so refuse instead.
          if ! git fetch origin "+refs/heads/${base}:refs/remotes/origin/${base}"; then
            echo "::error::Could not fetch base branch '${base}' from origin."
            exit 1
          fi
          git checkout -B "$BRANCH"

          base_sha=$(git rev-parse "origin/${base}")
          if [ "$(git merge-base HEAD "origin/${base}")" = "$base_sha" ]; then
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            echo "Already contains origin/${base} — nothing to do."
            exit 0
          fi

          if git merge "origin/${base}" --no-edit; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "Merged cleanly."
          else
            conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "status=conflicts" >> "$GITHUB_OUTPUT"
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
            echo "Conflicts in: $conflicts"
          fi

      # Node and the dependency install are only needed to resolve conflicts, so
      # the clean path skips ~40s of setup entirely — and both are the adopter's
      # toolchain besides, so both are also skippable by input.
      - name: Setup Node.js
        if: steps.merge.outputs.status == 'conflicts' && inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, which `pull_request_target` reads
      # from the base branch, and never an expression reading the PR event.
      - name: Install dependencies
        if: steps.merge.outputs.status == 'conflicts' && inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        if: steps.merge.outputs.status == 'conflicts'
        run: npm install -g @anthropic-ai/claude-code

      # The runner package lives on GitHub Packages, which has no anonymous
      # install even for a public package — see the long note on the same step in
      # agent-review-reusable.yml. Short version: the scoped `.npmrc` is written
      # for `@jeffwlawson` only so a caller's own `npm ci` is untouched, and
      # `packages: read` in the caller is what makes the token below work. The
      # cache opt-out belongs to the same note: this half declares no toolchain,
      # so it must not infer one.
      #
      # Gated on the conflicts path like everything around it: a clean merge
      # invokes no runner, so it needs no registry either.
      - name: Authenticate to GitHub Packages
        if: steps.merge.outputs.status == 'conflicts'
        uses: actions/setup-node@v7
        with:
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      - name: Resolve conflicts
        if: steps.merge.outputs.status == 'conflicts'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_UPDATE_BRANCH: ${{ vars.AGENT_MODEL_UPDATE_BRANCH }}
          OUTPUT_DIR: ${{ runner.temp }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        # `npm exec --prefix` rather than a bare `npx`, and the prefix is the
        # whole point. `npx pkg@version` reuses a package already present in the
        # working directory when it satisfies the spec — and in the repository
        # that *publishes* this package, the checkout is such a package. It has
        # no `dist/` (CI installs, it does not build), so the bin resolves to
        # nothing and the step dies `command not found` before any runner code
        # runs (#8). Installing into RUNNER_TEMP sidesteps the name collision.
        #
        # A no-op for every consuming repo, which has no package of this name to
        # collide with — verified against npm 10 and 11, both of which ignore
        # `--ignore-existing` here. `--prefix` moves the *install*, not the
        # process `cwd`: the runner still does its git work in the checkout.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.4.0 -- agent-workflows update-branch

      # Two outputs, both written only where `-e` can already only mean the push
      # worked, and both read by a step below that has no other way to know
      # (#99).
      #
      # `head` is the commit the verdict is copied on to, and it is read here
      # rather than in that step because *this* is the step that made it the
      # branch tip. Two reads of the working tree are two chances for the commit
      # a status is posted about to stop being the commit that was pushed.
      #
      # `pushed` is what separates the failure arm's two remedies: everything
      # above this step leaves the branch untouched and is retried by re-adding
      # the label, and everything below it does not.
      - name: Push branch
        id: push
        if: steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'conflicts'
        run: |
          set -euo pipefail
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH"
          {
            echo "pushed=true"
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # A verdict is per commit, so the merge commit carries none until
      # something posts one — and a clean refresh would otherwise wipe the
      # review's answer off every open pull request each time the base branch
      # moves (#96, decision 6).
      #
      # Sound because a clean merge changed nothing the review read: same
      # branch work, plus commits that are already on the base. So the verdict
      # standing on the old head is still the verdict on this one, and it is
      # **copied, never parsed** — the state, the line a human acts on and the
      # link are the review's own words, and re-deriving any of them here would
      # be a second copy of a table `shared/review-output.ts` holds, in YAML,
      # about a commit no review has read.
      #
      # The conflicts path gets none of this: the resolution is code an agent
      # wrote, which no review has seen. It asks for one instead, below.
      #
      # Two conditions on what is copied, and they are the two `verdictOn`
      # selects on, because this writes what that reads. The **context**, and
      # the **creator**: a status is a thing any token holding `statuses: write`
      # can post under any context it likes, so without the second a refresh
      # would launder an outside integration's approval on to a commit.
      # The creator narrows it to *a workflow in this repository* and no
      # further — `github-actions[bot]` is the account every workflow here posts
      # as, not only the loop's — which is the bound the round rule is safe
      # under and a required check is not (docs/ADOPTING.md §3b). An
      # `error` is copied along with the rest — it says "the last review of this
      # branch produced no verdict", which a merge does not make untrue, and
      # `verdictOn` already declines to count it as a round.
      #
      # Posted under the job's own `GITHUB_TOKEN` rather than the PAT the
      # checkout and the push prefer, and that is the whole of why the copy is
      # worth making: a status created by any other account is one the next
      # round does not recognise, so the carried verdict would be invisible to
      # the reader it exists for.
      #
      # Never fails the run. The merge is pushed by the time this runs, so a
      # failure here would mark the pull request blocked and tell a human the
      # branch was left untouched. No verdict to copy is not a failure either: a
      # pull request nobody has reviewed yet refreshes like any other, and the
      # honest answer for its new head is the absence of one.
      - name: Carry the verdict over to the merge commit
        if: steps.merge.outputs.status == 'clean' && success()
        env:
          OLD_SHA: ${{ github.event.pull_request.head.sha }}
          NEW_SHA: ${{ steps.push.outputs.head }}
          VERDICT_CONTEXT: agent-review
          LOOP_ACCOUNT: github-actions[bot]
        run: |
          set -uo pipefail
          # Newest first, which is the order this endpoint documents, so the
          # first match is the verdict that stands rather than the first one
          # ever posted. Paginated because the page is thirty statuses and a
          # repository with a deploy bot on every commit has more than that —
          # unpaginated, the older the verdict the likelier it silently is not
          # there.
          #
          # The read is its own arm, because **the read failing is not "there
          # is no verdict"** (#105). Collapsed into one, only the second is ever
          # reported: a caller installed before this release has no `statuses`
          # entry and GitHub sets every unlisted scope to `none`, so on a
          # private repository this `GET` 403s exactly as docs/ADOPTING.md §4
          # describes for `checks: read` — and the step would log "nothing to
          # carry over" and exit 0, while the warning naming the grant sits on
          # the *write* below and never fires. Every refresh would drop the
          # verdict with no signal anywhere. It is the distinction `verdictOn`
          # keeps as `undefined` against `false`, and the CI word keeps as
          # `unknown` against `red`.
          #
          # The warning hedges, because the arm is gated on the call and not on
          # a status code (#123): a 5xx, a secondary rate limit and a dropped
          # connection land here alongside the 403, and on those the caller it
          # would send a reader to is already correct. Its own pair rather than
          # the write's below — a read cannot produce that 422 — and its own
          # remedy, because neither cause is one a re-run recovers from: the
          # branch is refreshed by the time this warns, so the next run has
          # nothing to merge and never reaches this step.
          err="${RUNNER_TEMP}/carry-verdict.err"
          if ! statuses=$(gh api "repos/{owner}/{repo}/commits/${OLD_SHA}/statuses" --paginate --slurp 2>"$err"); then
            echo "::warning::Could not read the statuses on ${OLD_SHA}, so no \`${VERDICT_CONTEXT}\` verdict was carried on to ${NEW_SHA} and this pull request now reads as unreviewed — which is not the same as its having none. GitHub's reply is printed below: on a private repository a 403 is a caller missing \`statuses: write\` (jeffwlawson/agent-workflows docs/ADOPTING.md §4); anything else — a 5xx, a secondary rate limit, a dropped connection — is transient and the caller is fine. Re-running this workflow recovers neither: the branch is refreshed already. The verdict that stands is the one on ${OLD_SHA}; add \`agent:review\` if you would rather have a fresh one."
            if [ -s "$err" ]; then
              cat "$err"
            fi
            exit 0
          fi
          # Still `|| verdict=""`, and now it can only mean what it says: the
          # read succeeded, so an empty answer is a commit carrying no verdict
          # of ours.
          verdict=$(printf '%s' "$statuses" \
            | jq -c '(add // []) | map(select(.context == env.VERDICT_CONTEXT and .creator.login == env.LOOP_ACCOUNT))[0] // empty') \
            || verdict=""
          if [ -z "$verdict" ]; then
            echo "No ${VERDICT_CONTEXT} verdict of ours on ${OLD_SHA} — nothing to carry over."
            exit 0
          fi
          state=$(printf '%s' "$verdict" | jq -r '.state')
          description=$(printf '%s' "$verdict" | jq -r '.description // ""')
          target_url=$(printf '%s' "$verdict" | jq -r '.target_url // ""')
          args=(--method POST "repos/{owner}/{repo}/statuses/${NEW_SHA}"
                -f "context=${VERDICT_CONTEXT}" -f "state=${state}" -f "description=${description}")
          # `if`, not a test ending the arm: an absent link is the ordinary case
          # for a verdict posted by a run that could not read its own review.
          if [ -n "$target_url" ]; then
            args+=(-f "target_url=${target_url}")
          fi
          gh api "${args[@]}" \
            || echo "::warning::Could not carry the \`${VERDICT_CONTEXT}\` verdict from ${OLD_SHA} on to ${NEW_SHA}. The merge is pushed; what is missing is the line saying what to do about it, so this pull request now reads as unreviewed. GitHub's reply is printed above: a 403 is a caller missing \`statuses: write\` (jeffwlawson/agent-workflows docs/ADOPTING.md §4); a 422 is the status itself being refused, which is ours to fix."

      - name: Comment on the PR
        if: steps.state.outputs.proceed == 'true' && success()
        env:
          STATUS: ${{ steps.merge.outputs.status }}
          BASE_SHA: ${{ steps.merge.outputs.base_sha }}
        run: |
          set -uo pipefail
          base="$BASE_REF"
          case "$STATUS" in
            uptodate)
              body="\`agent:update-branch\`: already up to date with \`${base}\` — no merge needed."
              ;;
            clean)
              body="\`agent:update-branch\`: merged \`${base}\` (\`${BASE_SHA:0:7}\`) cleanly — no conflicts."
              ;;
            conflicts)
              body=$(cat "${RUNNER_TEMP}/update_comment.md" 2>/dev/null \
                || echo "\`agent:update-branch\`: resolved conflicts merging \`${base}\`.")
              ;;
            *)
              body="\`agent:update-branch\`: finished with status \`${STATUS}\`."
              ;;
          esac
          gh pr comment "$PR_NUMBER" --body "$body"

      # The resolution closes itself out, the way a fix round does (#96,
      # decision 6). The commit this job just pushed is an agent's reading of a
      # conflict — the one thing this loop writes that no review has seen — and
      # by the round rule the review it asks for is a full **round 1**: round 2
      # needs a non-merge loop commit since the last verdict, and a resolution
      # leaves only the merge (#105). Which is the reading that suits it: the
      # earlier round's findings have not been attempted, so a verification pass
      # over them would answer with the round-2 line — "a fix round didn't
      # settle these" — on the strength of the base branch having moved, about
      # findings no fix round ever saw.
      #
      # So this is the other half of the step above, not an addition to it: a
      # clean merge carries the old verdict forward because it is still true,
      # and a resolution carries nothing forward because it is not. Each path
      # does exactly one of the two.
      #
      # Last of the success arms, after the comment reporting what was resolved:
      # the review reads the pull request, so a round started before this run
      # has finished speaking is a round reading the state before it.
      #
      # MUST use AGENT_PAT, like every other label this loop adds: a label added
      # with GITHUB_TOKEN triggers nothing, so the pull request would carry
      # `agent:review` and simply sit there. Warn loudly rather than pretend it
      # worked.
      #
      # And fail the run if the add itself fails, with a reason naming the way
      # out. The failure comment's own remedy — re-add `agent:update-branch` —
      # is inert here: the merge is already pushed, so a second run finds the
      # branch up to date and does nothing.
      - name: Request a review of the resolution
        if: steps.merge.outputs.status == 'conflicts' && success()
        env:
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh pr edit "$PR_NUMBER" --add-label "agent:review"; then
            printf 'The conflicts are resolved and pushed, but `agent:review` could not be added, so no review of the resolution was requested. Add `agent:review` to this PR by hand — re-adding `agent:update-branch` would find the branch already up to date and do nothing.\n' \
              > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi
          if [ "$HAS_PAT" != "true" ]; then
            # On the pull request as well as in the log (#105): a warning
            # annotation is on a run nobody opens, and what is at stake here is
            # a conflict resolution an agent wrote that nothing has reviewed.
            echo "::warning::AGENT_PAT is not set, so this label was added with GITHUB_TOKEN and will NOT trigger agent-review. Add agent:review by hand on PR #${PR_NUMBER}."
            gh pr comment "$PR_NUMBER" --body 'The conflicts are resolved and pushed, but no review of the resolution will start on its own: `AGENT_PAT` is not set, so the `agent:review` label this run added triggers nothing. Remove and re-add `agent:review` by hand to review it.' \
              || echo "::warning::…and that could not be said on the pull request either."
          fi

      # The remedy depends on whether the branch moved, and since #99 both cases
      # are ordinary: the two steps that can fail *after* the push are the
      # verdict this job carries over and the review it asks for. "The branch
      # was left untouched" is true of every step above the push and false of
      # every one below it, and re-adding the label — which is the whole of the
      # advice — does nothing on a branch that is already merged.
      - name: Mark blocked on failure
        if: steps.state.outputs.proceed == 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          outcome="The branch was left untouched. Re-add \`agent:update-branch\` to retry."
          if [ "$PUSHED" = "true" ]; then
            outcome="The merge is pushed; what failed came after it, so re-adding \`agent:update-branch\` would find the branch up to date and do nothing. Act on the reason above instead."
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:update-branch` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\n%s\n' "$reason" "$RUN_URL" "$outcome" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && steps.state.outputs.proceed == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
