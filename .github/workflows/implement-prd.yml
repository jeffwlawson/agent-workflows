name: Agent Implement PRD (reusable)

# The PRD job itself. `agent-implement-prd.yml` is the caller — a trigger and
# two wires — and every guard, permission and step stays here, in a file an
# adopting repo *references* rather than copies
# (jeffwlawson/winget-manifest-lint#98).
#
# The PRD path (jeffwlawson/winget-manifest-lint#92). Labelling a *parent* issue
# `agent:implement` implements its sub-issues one at a time — one per run — each
# on a slice branch of its own, opened as a draft slice PR against a single PRD
# branch (#172).
#
# It shares its trigger label with `agent-implement`, so both jobs start on
# every `agent:implement` label event and the pair partitions the work by issue
# *shape*: an issue that has sub-issues is this workflow's, every other shape is
# `agent-implement`'s. Whichever one does not own the shape calls `defer` and
# exits touching nothing — no comment, no label. Both halves matter. Two bot
# comments about one event say opposite things ("the PRD path is not built"
# beside a run that is building it), and a second job racing to remove
# `agent:implement` would eat the re-label that advances the chain.
#
# ## Ordering comes from creation order, not from the edges
#
# The chain walks **sub-issues API order** and never reads `blocked-by`. That is
# safe only because sub-issues are *created* in dependency order, blockers
# first — the topological sort happens once, at publish time. Do not add
# edge-reading here; fix the publish order instead. The edges exist as the
# record of why the order is what it is.
#
# The preflight does read `blocked_by`, on the **parent** and only there, and
# that is not the edge-reading this section forbids (#14). It settles whether
# the chain starts at all — one question, asked once, about a deliverable whose
# blocker is outside the PRD entirely. Sequencing *within* the walk stays
# creation order, untouched.
#
# ## Every slice gets a review round of its own
#
# One review of the whole PRD, on the last slice, was a review too large to be
# useful, and it saw a design error in slice 1 only once every later slice sat
# on top of it (PRD #171). So each slice is a **slice PR** into the PRD branch,
# and each gets the ordinary `review` round — the same workflow, once per slice
# PR, not a per-slice review workflow.
#
# The chain therefore waits between slices: a run builds one slice, opens its
# slice PR, requests its review and stops. It re-labels nothing. The next run
# starts by merging that slice PR into the PRD branch (#173), then builds the
# next slice on top of it; the first run to merge one also opens the PRD PR,
# and every run that merges one writes that slice's row of the slices table
# into the PRD PR's body — its verdict and its open findings, never refreshed.
# A run that died after its merge left a slice with no row; the next run finds
# it by that absence and writes it, merging nothing twice (#207).
# Until the chain can see a round end, re-adding `agent:implement` to the
# parent is a human's to do, and it is what says the round is over.
#
# After the last slice, a **finishing run** (#177) builds nothing and runs no
# model: it merges the last slice PR, writes its row, and hands the PRD PR
# over — to an integration review when the chain holds more than one slice,
# straight to ready when it holds one. A human merges the PRD PR. The loop
# never merges it and never approves.

on:
  workflow_call:
    inputs:
      default-branch:
        description: >-
          The branch the PRD branch is cut from and the PR is
          opened against. Not a fallback, unlike the PR workflows' input of the
          same name — nothing in an `issues` event says which branch the work
          belongs on, so this is the only answer there is.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets its
          slices implemented, running on the image's own Node.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or an issue title
          becomes a shell script.
        type: string
        default: npm ci
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the implementation agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT. It opens each slice PR (the Actions bot may not create
          one) and adds `agent:review` to it, and a label added with
          `GITHUB_TOKEN` triggers no workflow — so without it every slice PR
          sits in draft with nobody asked to review it (docs/ADOPTING.md §1).
          Optional, and every site warns rather than failing silently.
        required: false

jobs:
  implement-prd:
    # Job-level, for the same reason as agent-implement-reusable.yml — a
    # job-level `if:` skips without provisioning a runner. On this side of the
    # seam, where a caller can skip it but cannot loosen it.
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    # The repository variable `AGENT_TIMEOUT_MINUTES` where it is set (#220),
    # shared by the four jobs that run an agent to write code, and 30 where it
    # is not. `vars` is among the contexts this key may read, and in a called
    # workflow it resolves against the caller's repository. `fromJSON` because
    # a variable is a string and this key wants a number; a value that is not
    # one fails the job before any step, which `doctor` reports. The failure
    # step below names the same figure.
    timeout-minutes: ${{ fromJSON(vars.AGENT_TIMEOUT_MINUTES || '30') }}
    # Per *parent issue*, first-come, so consecutive slices of one PRD never
    # overlap: the chaining step re-labels the parent while this job is still
    # running, and the next run waits for this one to finish every step —
    # including the `always()` label removal — before it starts.
    #
    # NOT the `agent-pr-<n>` group the three PR workflows share, even though
    # this pushes to a PR's branch. An `issues` event carries no PR number, so
    # the two cannot compute a common key. The residual race that leaves is
    # recorded in docs/parity.md §10 rather than papered over: the happy path
    # does not overlap, because the review this run requests is on a slice
    # PR, and the next run's merge step refuses while that round is running.
    concurrency:
      group: agent-implement-prd-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    # Granted by the caller, bounded here — a called workflow can only downgrade
    # the token it is handed, and a permission declared only here grants nothing.
    permissions:
      contents: write
      issues: write
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read
      pull-requests: write
      # The slices table's row records each merged slice's `agent-review`
      # verdict, read from the merged head's combined status — its own scope,
      # which a block that leaves it out sets to `none` (#199).
      statuses: read

    env:
      # Throughout this file, ISSUE_* is the **parent PRD**. The sub-issue being
      # implemented this run is `steps.preflight.outputs.sub`, and is never the
      # thing whose labels get transitioned.
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_STATE: ${{ github.event.issue.state }}
      # The branch the chain is based on: checked out, branched from on the
      # first slice, opened against, and handed to the runner so the prompt can
      # tell the agent what to diff to see the slices already landed.
      BASE_REF: ${{ inputs.default-branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # This run's page, linked from the start comment and from the failure
      # comment on the parent (#205). One definition, so the two cannot link
      # different things.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # The clock the failure step reads a time limit off (#220). A job that
      # reaches its `timeout-minutes` is cancelled, not failed, and nothing in
      # the `job` context says which cancellation it was, so that step compares
      # how long the job ran with its limit. First, so it starts as near the
      # job's own start as a step can.
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # Everything that decides whether this run happens, before checkout and
      # the dependency install, so a refusal costs one API call and nothing else.
      #
      # Order is load-bearing and differs from `agent-implement`'s: the
      # **partition** is settled first, before anything that speaks. A closed
      # PRD parent would otherwise collect the same "this issue is not open"
      # comment twice, seconds apart, from two runs that cannot see each other.
      - name: Preflight
        id: preflight
        run: |
          set -euo pipefail

          # The trigger label comes off with every refusal, as with every run
          # that ends (#236), which is what makes a retry a deliberate human
          # act rather than a re-run. In the loop's one order: the comment
          # first, then this run's own label off, then `agent:blocked` where
          # the refusal is a durable one, so the label that names the next step
          # goes on last.
          # The comment is tolerated: under `-e` a failed one would end the step
          # before the removal, and leave the label on with nothing behind it.
          # One pattern for every refusal (#253): the label that did not run,
          # then a sentence saying why and what to do, starting with a capital.
          refuse() {
            echo "refused=true" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --body "**\`agent:implement\` didn't run:** $1" || echo "::warning::Could not post the refusal comment on #${ISSUE_NUMBER}."
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
            if [ "${2:-}" = "blocked" ]; then
              gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
            fi
            exit 0
          }

          # A durable refusal, one that will repeat verbatim until somebody
          # restructures the work, also marks the issue blocked, since that is
          # where the maintainer has to act (#253). Deliberately
          # NOT used for the finished-PRD case below: a PRD whose sub-issues
          # have all closed is in a success state, and `agent:blocked` there is
          # exactly the stale label nobody ever clears (docs/parity.md §10).
          refuse_shape() {
            refuse "$1" blocked
          }

          # Not a refusal. `agent-implement` owns this shape and is running
          # right now on the same event; this job has nothing to add and, more
          # importantly, nothing it may safely touch. A log line and exit 0.
          defer() {
            echo "refused=true" >> "$GITHUB_OUTPUT"
            echo "$1"
            exit 0
          }

          # One query for the whole shape — parent, labels and the sub-issue
          # list together. Asking separately is two chances to see a different
          # answer, and every branch below reads the same snapshot.
          #
          # Deliberately not `|| true`, the same exception
          # jeffwlawson/winget-manifest-lint#90 made: "no answer" read as "no
          # sub-issues" would hand a PRD to the single-issue path. A failed
          # query fails the step, which leaves the trigger label in place and
          # the run visibly red.
          issue=$(gh api graphql \
            -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -F number="$ISSUE_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  issue(number: $number) {
                    parent { number }
                    labels(first: 100) { nodes { name } }
                    subIssues(first: 100) {
                      totalCount
                      nodes { number title state }
                    }
                  }
                }
              }' \
            --jq '.data.repository.issue')
          # Kept for `Merge slice PR`, which titles the slices table's rows from
          # the same snapshot every branch below rules on.
          printf '%s\n' "$issue" > "${RUNNER_TEMP}/prd-issue.json"

          parent=$(jq -r '.parent.number // ""' <<< "$issue")
          subs=$(jq -r '.subIssues.totalCount' <<< "$issue")
          wayfinder=$(jq -r '[.labels.nodes[].name | select(startswith("wayfinder:"))] | join(", ")' <<< "$issue")

          # The partition, and the first thing this step does with the answer.
          # `totalCount` counts closed sub-issues too, so a finished PRD still
          # lands here rather than being handed back — which is what keeps the
          # "nothing left to do" refusal below reachable.
          if [ "$subs" -eq 0 ]; then
            defer "#${ISSUE_NUMBER} has no sub-issues, so agent-implement owns this label event."
          fi

          if [ "$ISSUE_STATE" != "open" ]; then
            refuse "This issue is closed. Reopen it, then add \`agent:implement\` again."
          fi

          # Checked before the hierarchy, since a wayfinder ticket is refused
          # whichever shape it happens to have. A wayfinder map with sub-issues
          # reaches *this* workflow rather than agent-implement, so the refusal
          # has to exist in both.
          if [ -n "$wayfinder" ]; then
            refuse_shape "This is a planning issue (\`wayfinder:*\`), not buildable work. Add \`agent:implement\` to the issues it produces instead."
          fi

          # A nested PRD has two owners of one ordering, and neither can see the
          # other's chain: #${parent}'s run would drive its own sub-issues while
          # this one drives these, both pushing to different branches.
          if [ -n "$parent" ]; then
            refuse_shape "This PRD is itself a sub-issue of #${parent}. Remove it from #${parent}, or move its sub-issues up to #${parent}, then label the top-level issue."
          fi

          # The query pages at 100, and `totalCount` does not. Past that, `next`
          # can come back empty while open sub-issues sit off the end of the
          # page — and the refusal below would then report a PRD as *finished*
          # when it is not, which is the plausible-wrong-answer class every
          # other guard in this file exists to prevent. Refuse loudly instead.
          if [ "$subs" -gt 100 ]; then
            refuse_shape "This PRD has ${subs} sub-issues, and the loop handles at most 100. Split it into smaller PRDs."
          fi

          # The whole scheduling policy, in one filter: keep the open ones in
          # the order the API returned them, take the head. No sort, no edge
          # read — see the note at the top of this file.
          next=$(jq -c '[.subIssues.nodes[] | select(.state == "OPEN")] | .[0] // empty' <<< "$issue")

          # A refusal that is a *stop* rather than a shape: the chain is
          # mid-flight and something on it needs a human. It fails into `Mark
          # blocked on failure`, which is what gives it `agent:blocked` and a
          # comment carrying the reason file — the route every later refusal
          # of the chain takes too, once there is a step to refuse from.
          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          # The open slice PRs, found by their **base** — never by the name of
          # the branch they come from, which a human may rename (#172). Keyed on
          # the same stable half of the PRD branch's name the branch lookup
          # below uses, `agent/prd-<parent>-`, with the dash that stops #17
          # matching #171's branch. A slice branch is `agent/slice-…`, so it can
          # never be the base this matches.
          #
          # Not `|| true`, for the shape query's reason: "could not look" read
          # as "none open" builds a slice on top of one nobody has merged.
          pulls=$(gh pr list --state open --limit 1000 --json number,headRefName,baseRefName,isDraft)
          slice_prs=$(jq -c "[.[] | select(.baseRefName | startswith(\"agent/prd-${ISSUE_NUMBER}-\"))]" <<< "$pulls")
          open_slices=$(jq 'length' <<< "$slice_prs")
          named=$(jq -r 'map("#\(.number) (`\(.headRefName)` into `\(.baseRefName)`)") | join(", ")' <<< "$slice_prs")
          # The PRD PR, found by its **head**, the PRD branch, the way `Open or
          # reuse the PRD PR` finds it.
          prd_prs=$(jq -c "[.[] | select(.headRefName | startswith(\"agent/prd-${ISSUE_NUMBER}-\"))]" <<< "$pulls")

          # Before the finished refusal: a PRD whose last slice PR is still
          # open is not finished, it is waiting on that PR.
          #
          # More than one is never guessed at. Merging either drops the other's
          # place in the order, and building a third stacks work on neither.
          if [ "$open_slices" -gt 1 ]; then
            block "${open_slices} slice PRs are open against this PRD's branch: ${named}. It builds one slice at a time and can't tell which of these lands next. Close or merge all but one."
          fi

          # The merged slice PRs with no row in the slices table (#207). A row
          # is written only by the run that merges its slice, so one that died
          # after the merge (reading the row's facts, opening the PRD PR, or in
          # the runner writing it) left a slice PR that is closed, which the
          # open lookup above cannot see, and a row nothing else will write.
          # So they are looked for here, by base like the open ones, and handed
          # to the steps after this one: the merge step's `MERGED` arm merges
          # nothing twice, and the row and PRD PR steps then do what the dead
          # run did not. That is what makes "the merge is not repeated", in
          # every failure text after the merge, a resume rather than a skip.
          #
          # A row is keyed by sub-issue, read out of the first cell of each row
          # between the slices-table markers of the PRD PR's body, the key the
          # runner's splice uses, and nowhere else: a sub-issue mentioned
          # outside the table is not a row. No PRD PR means no rows at all, so
          # every merged slice PR is rowless, which is the first slice's merge
          # dying before it could open one.
          #
          # Rows are read from PRD PRs in **every state**, not only the open
          # one. A PRD reopened after its PRD PR merged (to add a sub-issue,
          # say) has its rows in a merged body; read from open PRs only, every
          # slice it ever built would look rowless, and the run would try to
          # open a PRD PR from a branch that is merged or gone.
          #
          # A merged PR into the PRD branch that names no sub-issue, by `Part of
          # #<n>` or by slice branch name, is not a slice a row could be written
          # for, and is left alone rather than holding the chain up.
          #
          # More than one is **backfilled, in merge order**, not refused. Each
          # row is read off its own merged slice PR, which nothing can change
          # any more, so there is nothing for a human to decide, and a refusal
          # would leave them writing rows by hand. Beside an open slice PR they
          # are backfilled too, before it: that is exactly the state a retry
          # that skipped them left behind, a slice built on top of the rowless
          # one, and building nothing until they are written would cost a
          # re-label and gain nothing.
          #
          # Not `|| true`, for the shape query's reason: "could not look" read
          # as "every row written" is the skip this lookup exists to end.
          history=$(gh pr list --state all --limit 1000 --json number,state,headRefName,baseRefName,body,mergedAt)
          rows=$(jq -c --arg parent "$ISSUE_NUMBER" --arg start "<!-- agent:slices -->" --arg end "<!-- /agent:slices -->" '[.[]
            | select(.headRefName | startswith("agent/prd-\($parent)-")) | .body // ""
            | select(contains($start)) | split($start)[1] | split($end)[0] | split("\n")[]
            | capture("^\\s*\\|(?<cell>(?:[^|\\\\]|\\\\.)*)\\|").cell
            | capture("\\(#(?<n>[0-9]+)\\)\\s*$").n | tonumber]' <<< "$history")
          rowless=$(jq -c --arg parent "$ISSUE_NUMBER" --argjson rows "$rows" '[.[]
                | select(.state == "MERGED" and (.baseRefName | startswith("agent/prd-\($parent)-")))
                | {number, mergedAt, sub: ((.body // "" | capture("Part of #(?<n>[0-9]+)").n) // (.headRefName | capture("^agent/slice-\($parent)-(?<n>[0-9]+)-").n) // null)}
                | select(.sub != null) | select(.sub | tonumber | IN($rows[]) | not)]
              | sort_by(.mergedAt) | map(.number)' <<< "$history")

          # One slice PR goes through the merge step: the open one, merged this
          # run and so last in merge order, or failing that the rowless one that
          # merged last. The rest are the backfill, written before it.
          # `slice_open` says which of the two it is, for the start comment:
          # the rowless one is merged already, and only has its row written.
          if [ "$open_slices" -eq 1 ]; then
            slice_pr=$(jq -r '.[0].number' <<< "$slice_prs")
            slice_open=true
            backfill=$(jq -r 'map(tostring) | join(" ")' <<< "$rowless")
          else
            slice_pr=$(jq -r '.[-1] // ""' <<< "$rowless")
            slice_open=false
            backfill=$(jq -r '.[:-1] | map(tostring) | join(" ")' <<< "$rowless")
          fi
          if [ "$(jq 'length' <<< "$rowless")" -gt 0 ]; then
            echo "Merged slice PR(s) with no row in the slices table of #${ISSUE_NUMBER}: $(jq -r 'map("#\(.)") | join(", ")' <<< "$rowless"). Writing their rows this run; none is merged twice."
          fi

          # One open slice PR with a sub-issue still to build is the chain
          # mid-flight: the slice before this one, built and waiting on its
          # review round. The run merges it into the PRD branch first — `Merge
          # slice PR`, the first step after this one that does anything — and
          # then builds the next slice on top of it. Whether its round has
          # ended is that step's to check, not this one's.
          #
          # With no sub-issue left, the run is the **finishing run** (#177): it
          # builds nothing and runs no model. The whole state table, every row
          # safe to re-run:
          #
          #   open sub-issue | open slice PR  | the run
          #   yes            | yes            | merges it, builds the next slice
          #   yes            | no, one merged | writes its row, builds the next slice,
          #                  |   with no row  |   since a run died after merging it
          #   yes            | no             | builds the next slice
          #   no             | yes            | finishing: merges it, hands the PRD PR over
          #   no             | no, one merged | finishing: writes its row, hands the
          #                  |   with no row  |   PRD PR over
          #   no             | no, PRD PR     | finishing: resumes the handover, since a
          #                  |   still draft  |   run died after the last row
          #   no             | no, otherwise  | refused: the PRD is finished
          #
          # Any other rowless merged slice PR is backfilled on the way, in
          # every row of the table that merges or writes one.
          #
          # Only a draft PRD PR is waiting on a handover. Ready means handed
          # over, and none means there is nothing to hand.
          if [ -z "$next" ]; then
            if [ "$open_slices" -eq 1 ]; then
              echo "The last slice PR ${named} is open; finishing #${ISSUE_NUMBER}."
            elif [ -n "$slice_pr" ]; then
              echo "Slice PR #${slice_pr} merged with no row in the slices table; finishing #${ISSUE_NUMBER} from it."
            else
              if [ "$(jq 'length' <<< "$prd_prs")" -gt 1 ]; then
                block "$(jq -r 'map("#\(.number)") | join(", ")' <<< "$prd_prs") are all open from this PRD's branch, so it can't tell which one to hand over. Close all but one."
              fi
              if [ "$(jq -r '.[0].isDraft // false' <<< "$prd_prs")" != "true" ]; then
                refuse "Every sub-issue of this PRD is built and its PRD PR is ready for you. To build more, add a sub-issue first."
              fi
              echo "PRD PR #$(jq -r '.[0].number' <<< "$prd_prs") is still a draft with every slice merged; resuming its handover."
              {
                echo "prd_pr=$(jq -r '.[0].number' <<< "$prd_prs")"
                echo "prd_branch=$(jq -r '.[0].headRefName' <<< "$prd_prs")"
              } >> "$GITHUB_OUTPUT"
            fi
            {
              echo "sub="
              echo "slice_pr=${slice_pr}"
              echo "slice_open=${slice_open}"
              echo "backfill=${backfill}"
              echo "finishing=true"
              echo "refused=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The same blocked-by refusal `agent-implement` carries, for the same
          # reason: a blocker is a *separate* deliverable with its own PR and
          # its own reviewer, so labelling the thing downstream must not
          # authorise it, transitively. Being a coordinator exempts this issue
          # from nothing — a PRD parent is a deliverable like any other — and
          # here the cost of running anyway is larger than the flat case's one
          # wasted run: a single label starts a chain that lands every slice on
          # one branch, as one PR, built on work that does not exist yet.
          #
          # **Last, after every shape refusal above, including the finished
          # PRD's.** Those shapes can never run at all; this one is only *not
          # yet*, and it is the one that must give way when they collide. A
          # finished PRD carrying a still-open edge — a blocker reopened, or an
          # edge added once the chain was done — would otherwise take this arm
          # and be handed `agent:blocked`, the one label `refuse_shape` above
          # deliberately withholds from a success state, on an issue no later
          # run can ever clear it from. The message would misdirect as well:
          # re-adding `agent:implement` once the blocker closes lands on the
          # finished refusal, not on a slice. Ordered this way each refusal is
          # the one whose remedy is the real one.
          #
          # The finishing run never reaches it either, and should not: the
          # chain it finishes was started — and so cleared of blockers — by
          # its first run, and what is left is merging work already built.
          #
          # **The parent, and never the sub-issues.** The chain walks them in
          # sub-issues API order and reads `blocked_by` nowhere: whatever
          # publishes the batch owns the topological sort
          # (docs/agents/ticket-shape.md), and reading the edges mid-walk is a
          # deliberate non-goal (docs/parity.md §2a, and the header of this
          # file). Underneath the doctrine is a design reason — slices are
          # pieces of *one* feature landing on *one* branch, so a slice that
          # needs outside work blocks the whole PRD, not itself; you cannot
          # merge four of five and wait. That dependency belongs as an edge on
          # the parent, which is the one edge this reads.
          #
          # REST rather than the shape query above, deliberately: this endpoint
          # is purpose-built and its response was verified against a real edge.
          # A GraphQL equivalent may exist and would save the call, but an
          # unverified field name here fails the entire preflight, and the
          # ~0.3 s is not worth guessing for.
          blockers=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/dependencies/blocked_by" \
            --jq '[.[] | select(.state == "open") | "#\(.number)"] | join(", ")' 2>/dev/null || echo "")
          # `refuse_shape` rather than `refuse`, the same deliberate exception
          # `agent-implement` makes. By the durable/transient rule above this is
          # transient — the blocker closes and the same run proceeds, with
          # nothing restructured — but `agent:blocked` is the only way to find
          # work that is waiting, and until #5 promotes these automatically
          # nothing else will surface them. A plain `refuse` would strip the
          # trigger label and leave the PRD carrying nothing at all.
          #
          # There is no queued label to use instead: the one declared for this
          # was retired (#204), because the native edge read above already says
          # the PRD waits, and this refusal is what reads it.
          if [ -n "$blockers" ]; then
            if [[ "$blockers" == *,* ]]; then
              refuse_shape "It's blocked by ${blockers}, which are still open. Add \`agent:implement\` again once they are closed, or remove the \"blocked by\" links that no longer apply."
            else
              refuse_shape "It's blocked by ${blockers}, which is still open. Add \`agent:implement\` again once ${blockers} is closed, or remove the \"blocked by\" link if it no longer applies."
            fi
          fi

          # Heredoc form for the title: an issue title cannot contain a newline
          # today, and a step output that trusts that is one GitHub API change
          # away from being an injection into the environment file.
          {
            echo "sub=$(jq -r '.number' <<< "$next")"
            echo "slice_pr=${slice_pr}"
            echo "slice_open=${slice_open}"
            echo "backfill=${backfill}"
            echo "sub_title<<PRD_SUB_TITLE_EOF"
            jq -r '.title' <<< "$next"
            echo "PRD_SUB_TITLE_EOF"
            echo "finishing=false"
            echo "refused=false"
          } >> "$GITHUB_OUTPUT"

          echo "Targeting sub-issue #$(jq -r '.number' <<< "$next") of ${subs}."

      # The trigger label stays on while this run works and comes off in the
      # last step, however the run ends (#236), so on the parent it is on only
      # during a build. Nothing in this run puts it back: the next slice waits
      # on this one's slice PR, and review's advance job re-adds it. So the one
      # label to take off here is a block an earlier run left. The line before
      # it is the permission probe, as in review's `Transition labels`, where
      # the reason is spelled out: it adds the label this run already holds,
      # which changes nothing, and is not `|| true`, so a short token fails the
      # run before the checkout.
      #
      # Then the run links itself on the parent (#205), naming what it is for,
      # since a chain starts one run per slice on the same parent and the link
      # alone would not tell them apart. A warning where it cannot be posted,
      # never a failure: nothing has been done yet that a stopped run would
      # need to report.
      - name: Transition labels
        if: steps.preflight.outputs.refused == 'false'
        env:
          SUB: ${{ steps.preflight.outputs.sub }}
          SUB_TITLE: ${{ steps.preflight.outputs.sub_title }}
          SLICE_PR: ${{ steps.preflight.outputs.slice_pr }}
          SLICE_OPEN: ${{ steps.preflight.outputs.slice_open }}
          FINISHING: ${{ steps.preflight.outputs.finishing }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:implement"
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          # An open slice PR is merged first. A rowless one has merged
          # already, and this run only writes its row.
          slice=""
          if [ -n "$SLICE_PR" ]; then
            if [ "$SLICE_OPEN" = "true" ]; then
              slice="merging slice PR #${SLICE_PR}"
            else
              slice="writing the row of slice PR #${SLICE_PR}, already merged"
            fi
          fi
          if [ "$FINISHING" = "true" ]; then
            what="Every sub-issue is built, so this run hands the PRD PR over"
            if [ -n "$slice" ]; then
              what="${what} after ${slice}"
            fi
          else
            what="Building sub-issue #${SUB} (${SUB_TITLE})"
            if [ -n "$slice" ]; then
              what="${what}, after ${slice}"
            fi
          fi
          gh issue comment "$ISSUE_NUMBER" --body "**\`agent:implement\` started:** ${what}. [Workflow run](${RUN_URL})" || echo "::warning::Could not post the start comment on #${ISSUE_NUMBER}. The run goes on; it is ${RUN_URL}."

      # The waiting slice PR, merged into the PRD branch before anything is
      # built, so the next slice is cut from a PRD branch that holds it. Its
      # own step, named for the slice PR, so a run log reads merge-then-build.
      #
      # It **never reads the verdict**. What started this run is `agent:implement`
      # re-added to the parent, and a human's re-label is an acceptance exactly
      # as the chain's own is — so there is one merge path, not one per verdict.
      # What it does read is whether the round is still running, and whether
      # GitHub can merge the thing at all. Every refusal names the slice PR and
      # fails into `Mark blocked on failure` with a reason file.
      #
      # Before the checkout, deliberately: nothing here needs a working tree,
      # and the checkout below then fetches a PRD branch that already has it.
      #
      # Merged with AGENT_PAT, because a merge made with GITHUB_TOKEN fires no
      # event: the PRD PR's CI does not run on it, and neither does
      # `agent-follow-ups`, which files a merged PR's findings on its close. The
      # fallback still merges — the chain is not held for a missing secret —
      # and says which of the two it cost.
      #
      # Safe to re-run from every state it can stop in: the refusals change
      # nothing, a slice PR already marked ready is left alone, and one some
      # earlier attempt already merged is not merged twice.
      - name: "Merge slice PR #${{ steps.preflight.outputs.slice_pr }}"
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.slice_pr != ''
        id: merge
        env:
          SLICE_PR: ${{ steps.preflight.outputs.slice_pr }}
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          # One read, so every check below rules on the same snapshot — and its
          # head is the one the merge is pinned to.
          fields=number,state,isDraft,mergeable,headRefOid,headRefName,baseRefName,labels,body
          pr=$(gh pr view "$SLICE_PR" --json "$fields") \
            || block "Could not read slice PR #${SLICE_PR}, so nothing was merged. Re-add \`agent:implement\` here to retry."
          state=$(jq -r '.state' <<< "$pr")
          head=$(jq -r '.headRefOid' <<< "$pr")
          head_ref=$(jq -r '.headRefName' <<< "$pr")
          prd_branch=$(jq -r '.baseRefName' <<< "$pr")
          labels=$(jq -r '[.labels[].name] | join(" ")' <<< "$pr")
          echo "prd_branch=$prd_branch" >> "$GITHUB_OUTPUT"

          # A round in flight is never cut short: the review, the fix it
          # started, or the re-review that fix asked for is still to land on it.
          # Read off the trigger labels alone, which are on while their run
          # works and while it is queued (#236), so a run in progress shows.
          busy=$(jq -r '[.labels[].name | select(. == "agent:review" or . == "agent:fix" or . == "agent:update-branch")] | join("`, `")' <<< "$pr")
          if [ -n "$busy" ]; then
            block "Refused to merge slice PR #${SLICE_PR} into the PRD branch: it carries \`${busy}\`, so its review round has not ended. Re-add \`agent:implement\` here once that label is gone."
          fi

          if [ "$state" = "MERGED" ]; then
            echo "Slice PR #${SLICE_PR} is already merged into ${prd_branch}; nothing to merge."
          elif [ "$state" != "OPEN" ]; then
            block "Refused to merge slice PR #${SLICE_PR} into the PRD branch: it is ${state,,}, not open. Reopen it, or close the sub-issue it built and re-open that one, then re-add \`agent:implement\` here."
          else
            # UNKNOWN is GitHub still computing the answer, which a read starts;
            # a short wait settles it far more often than a refusal would.
            mergeable=$(jq -r '.mergeable' <<< "$pr")
            for _ in 1 2 3 4 5; do
              [ "$mergeable" = "UNKNOWN" ] || break
              sleep 5
              mergeable=$(gh pr view "$SLICE_PR" --json mergeable --jq '.mergeable')
            done
            if [ "$mergeable" != "MERGEABLE" ]; then
              block "Refused to merge slice PR #${SLICE_PR} into the PRD branch: GitHub reports it as ${mergeable,,}, not mergeable. That is usually a conflict with a PRD branch that moved since the slice was built. Add \`agent:update-branch\` to slice PR #${SLICE_PR} to bring it up to date, then re-add \`agent:implement\` here once its round has ended."
            fi

            # A draft cannot be merged, and a slice PR accepted by hand as it
            # stands — its round parked, nothing marked it ready — is merged
            # like any other.
            if [ "$(jq -r '.isDraft' <<< "$pr")" = "true" ]; then
              gh pr ready "$SLICE_PR" \
                || block "Could not mark slice PR #${SLICE_PR} ready for review, and a draft cannot be merged. If AGENT_PAT is unset this is expected: GITHUB_TOKEN cannot do it. Mark it ready by hand, then re-add \`agent:implement\` here."
            fi

            # The first method the repository allows, in the order that gives
            # the PRD branch one commit per slice wherever it can. Read from the
            # settings rather than tried in turn: a refused method is not the
            # only reason a merge fails, and this must not guess which it was.
            method=$(gh api "repos/${GH_REPO}" --jq '[
                if .allow_squash_merge then "squash" else empty end,
                if .allow_rebase_merge then "rebase" else empty end,
                if .allow_merge_commit then "merge" else empty end
              ] | .[0] // ""') || method=""
            if [ -z "$method" ]; then
              block "Refused to merge slice PR #${SLICE_PR} into the PRD branch: this repository's settings allow none of squash, rebase or a merge commit, or this token cannot read them."
            fi

            # The chain's own mark, for review's `advance-merged` (#209), which
            # re-adds `agent:implement` when a slice PR is merged by hand and
            # must not when this run merges it: this run builds the next slice
            # already, and a second label would queue a second run. The merge
            # is under AGENT_PAT, the maintainer's own login, so who merged
            # cannot tell them apart; the body the `closed` event carries can.
            # Pinned to the head the merge is, and written before it, so the
            # event cannot arrive without it.
            #
            # And gone again unless the merge happens. A mark that outlives a
            # merge that did not (refused by a required check or review, a
            # transient error, a cancelled run) makes a later hand merge of the
            # same head read as the chain's, and nothing then moves the chain
            # on. So every exit from here to the merge takes it back out: the
            # merge's own failure arm, any other error, and a cancel, which is
            # turned into an exit so the trap runs. Tolerant, since the step is
            # already failing and says why; a mark it could not take back is
            # said too. Set before the write, so a mark an earlier run left on
            # this head and could not remove is taken out as well.
            marker="<!-- agent-chain-merge ${head} -->"
            body=$(jq -r '.body // ""' <<< "$pr")
            unmarked=${body//$'\n\n'"$marker"/}
            unmarked=${unmarked//"$marker"/}
            unmark() {
              gh api -X PATCH "repos/${GH_REPO}/pulls/${SLICE_PR}" -f body="${unmarked}" >/dev/null \
                || echo "::warning::Could not take the chain's mark back out of slice PR #${SLICE_PR}'s body. Delete \`${marker}\` from it by hand, or merging it by hand will not move the PRD chain on."
            }
            trap unmark EXIT
            trap 'exit 1' INT TERM
            if [[ "$body" != *"$marker"* ]]; then
              gh api -X PATCH "repos/${GH_REPO}/pulls/${SLICE_PR}" -f body="${body}"$'\n\n'"${marker}" >/dev/null \
                || block "Could not mark slice PR #${SLICE_PR} as merged by the chain, so nothing was merged: merged without the mark, it would read as a hand merge and start a second run. Re-add \`agent:implement\` here to retry."
            fi

            # Pinned to the head read above. A push between that read and this
            # merge is code nothing checked, and GitHub refuses it rather than
            # merging it unseen.
            gh pr merge "$SLICE_PR" "--${method}" --match-head-commit "$head" \
              || block "Could not merge slice PR #${SLICE_PR} into the PRD branch (${method}, pinned to ${head}). If it was pushed to since this run read it, its new head has not been through a round: re-add \`agent:implement\` here once it has."
            # Merged, so the mark is the chain's to keep: the `closed` event it
            # answers has already been sent.
            trap - EXIT INT TERM
            echo "Merged slice PR #${SLICE_PR} into ${prd_branch} (${method})."

            if [ "$HAS_PAT" != "true" ]; then
              warning="AGENT_PAT is not set, so slice PR #${SLICE_PR} was merged with GITHUB_TOKEN, which triggers no workflow: the PRD PR's CI did not run on this merge."
              if [[ " $labels " == *" agent:follow-ups "* ]]; then
                warning="${warning} Its follow-ups were not filed either, since agent-follow-ups fires on the merge: remove \`agent:follow-ups\` from slice PR #${SLICE_PR} and add it back to file them."
              fi
              echo "::warning::${warning}"
            fi
          fi

          # A finished slice leaves no branch behind. Tolerant, because a
          # repository that deletes head branches on merge got there first, and
          # a re-run finds it gone.
          gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${head_ref}" \
            || echo "::warning::Could not delete the slice branch ${head_ref}; it may already be gone."

          echo "merged=true" >> "$GITHUB_OUTPUT"

      # The facts for the merged slice's row of the slices table (#174),
      # gathered here and left in RUNNER_TEMP for the runner, which renders
      # them into the PRD PR body before it builds anything. A step of its own
      # so the merge above still reads no verdict: this reads one, and only to
      # report it.
      #
      # Runs on a re-run that finds the slice PR already merged too, since a
      # run that died after the merge wrote no row. The row is keyed by
      # sub-issue, so one an earlier attempt did write is left as it stands.
      #
      # And gathers the rows of the backfill (#207): the other merged slice PRs
      # the preflight found with no row, in merge order, each read exactly the
      # way the merged one is, and written before it.
      - name: Gather the slice's row
        if: steps.preflight.outputs.refused == 'false' && steps.merge.outputs.merged == 'true'
        id: slice_row
        env:
          SLICE_PR: ${{ steps.preflight.outputs.slice_pr }}
          BACKFILL: ${{ steps.preflight.outputs.backfill }}
          PRD_BRANCH: ${{ steps.merge.outputs.prd_branch }}
        run: |
          set -euo pipefail

          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          # The sub-issue from `Part of #<n>`, or failing that the slice
          # branch's name — the one place a name is read, and only to label a
          # row, never to find a PR.
          slice_of='(.body // "" | capture("Part of #(?<n>[0-9]+)").n) // (.headRefName | capture("^agent/slice-\($parent)-(?<n>[0-9]+)-").n) // empty'

          # One merged slice PR's facts, left in `row`. Not in a subshell, so
          # a `block` here ends the step rather than one command substitution.
          gather() {
            local number=$1 pr head sub url verdict threads

            # One read of the merged slice PR. Its head is the one the merge
            # was pinned to, and a merged pull request's head no longer moves.
            pr=$(gh pr view "$number" --json number,headRefOid,headRefName,title,body,url) \
              || block "Merged slice PR #${number} into the PRD branch, but could not read it back for its row of the slices table. Re-add \`agent:implement\` here to retry. The merge is not repeated."
            head=$(jq -r '.headRefOid' <<< "$pr")

            sub=$(jq -r --arg parent "$ISSUE_NUMBER" "$slice_of" <<< "$pr")
            if [ -z "$sub" ]; then
              block "Merged slice PR #${number} into the PRD branch, but could not tell which sub-issue it built: its body has no \`Part of #<sub-issue>\` and its branch is not \`agent/slice-${ISSUE_NUMBER}-<sub-issue>-…\`. Put \`Part of #<sub-issue>\` back in slice PR #${number}'s body, then re-add \`agent:implement\` here. The merge is not repeated."
            fi
            url=$(jq -r '.url' <<< "$pr")

            # The verdict on the **merged head**, the one the merge was pinned
            # to: the verdict of the code that landed. The combined status
            # holds the latest post per context.
            verdict=$(gh api "repos/${GH_REPO}/commits/${head}/status" --paginate --slurp \
              | jq -c '[.[].statuses[]? | select(.context == "agent-review")] | .[0].description // null') \
              || block "Merged slice PR #${number} into the PRD branch, but could not read the \`agent-review\` verdict on ${head} for its row of the slices table. Re-add \`agent:implement\` here to retry. The merge is not repeated."

            # Every review thread left open, linked from the row rather than
            # raised again: the PRD PR's review is not a second round of these.
            threads=$(gh api graphql --paginate --slurp \
              -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -F number="$number" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $endCursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes { isResolved path line originalLine comments(first: 1) { nodes { url } } }
                      }
                    }
                  }
                }' \
              | jq -c --arg url "$url" '[.[].data.repository.pullRequest.reviewThreads.nodes[]
                  | select(.isResolved | not)
                  | {path, line: (.line // .originalLine), url: (.comments.nodes[0].url // $url)}]') \
              || block "Merged slice PR #${number} into the PRD branch, but could not read its review threads for its row of the slices table. Re-add \`agent:implement\` here to retry. The merge is not repeated."

            row=$(jq -n \
              --slurpfile issue "${RUNNER_TEMP}/prd-issue.json" \
              --argjson sub "$sub" --argjson slice_pr "$number" --arg url "$url" \
              --arg pr_title "$(jq -r '.title' <<< "$pr")" \
              --argjson verdict "$verdict" --argjson threads "$threads" \
              '{
                title: (first($issue[0].subIssues.nodes[] | select(.number == $sub) | .title) // $pr_title),
                subIssue: $sub, slicePr: $slice_pr, slicePrUrl: $url,
                verdict: $verdict, openThreads: $threads
              }')
          }

          backfill="[]"
          for number in $BACKFILL; do
            gather "$number"
            backfill=$(jq -c --argjson row "$row" '. + [$row]' <<< "$backfill")
          done
          gather "$SLICE_PR"
          merged="$row"

          # A sub-issue closed with no slice PR was built before slice PRs
          # existed. Offered on every run; the runner writes these rows only
          # when it creates the table, the first run after an upgrade.
          # Every state, since a merged slice PR is exactly what rules one out.
          built=$(gh pr list --state all --base "$PRD_BRANCH" --limit 1000 --json number,body,headRefName \
            | jq -c --arg parent "$ISSUE_NUMBER" "[.[] | ${slice_of} | tonumber]") \
            || block "Merged slice PR #${SLICE_PR} into the PRD branch, but could not list the slice PRs of \`${PRD_BRANCH}\` for the slices table. Re-add \`agent:implement\` here to retry. The merge is not repeated."

          jq -n \
            --slurpfile issue "${RUNNER_TEMP}/prd-issue.json" \
            --argjson backfill "$backfill" --argjson merged "$merged" --argjson built "$built" \
            '{
              backfill: $backfill,
              merged: $merged,
              preUpgrade: [$issue[0].subIssues.nodes[] | select(.state == "CLOSED" and (.number as $n | any($built[]; . == $n) | not))
                | {title, subIssue: .number}]
            }' > "${RUNNER_TEMP}/slices-table.json"

      # The PRD PR — PRD branch into the base branch, the one PR of the chain a
      # human merges. It cannot open before a slice has merged, since until
      # then the PRD branch has no commits the base branch lacks, so the run
      # that merges the first slice opens it; every later run finds it by its
      # **head** and reuses it. That lookup is also what adopts a draft PR a
      # pre-upgrade chain opened from the PRD branch: it is that PR already.
      #
      # A **draft**, carrying `Closes #<parent>`, so the parent closes when the
      # PRD lands and not before; it leaves draft only when the chain hands it
      # over.
      #
      # Its body collects the **slices table** (#174): the runner writes the
      # merged slice's row into it, between markers, from the facts the step
      # above gathered — creating the table in a body that predates it, and
      # touching nothing outside the markers. So the body opened here is only
      # the part above the table.
      - name: Open or reuse the PRD PR
        if: steps.preflight.outputs.refused == 'false' && steps.merge.outputs.merged == 'true'
        id: prd_pr
        env:
          PRD_BRANCH: ${{ steps.merge.outputs.prd_branch }}
          SLICE_PR: ${{ steps.preflight.outputs.slice_pr }}
          # The Actions bot may not create a PR; see `Open the slice PR`.
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          existing=$(gh pr list --state open --head "$PRD_BRANCH" --limit 100 --json number --jq 'map(.number) | join(" ")') \
            || block "Could not look for the PRD PR from \`${PRD_BRANCH}\`. Slice PR #${SLICE_PR} is merged; re-add \`agent:implement\` here to retry. The merge is not repeated."
          count=$(wc -w <<< "$existing")

          if [ "$count" -gt 1 ]; then
            block "Refused to pick a PRD PR: ${count} open PRs come from the PRD branch \`${PRD_BRANCH}\` of #${ISSUE_NUMBER} (#${existing// /, #}). Close all but one, then re-add \`agent:implement\` here."
          elif [ "$count" -eq 1 ]; then
            number="$existing"
            echo "Reusing PRD PR #${number}."
          else
            body_file="${RUNNER_TEMP}/prd-pr-body.md"
            {
              echo "Closes #${ISSUE_NUMBER}"
              echo
              echo "The PRD branch \`${PRD_BRANCH}\`, built one slice PR at a time by the \`agent:implement\`"
              echo "PRD workflow. It stays a draft while the chain is still building."
            } > "$body_file"
            url=$(gh pr create --draft --base "$BASE_REF" --head "$PRD_BRANCH" \
              --title "${ISSUE_TITLE:0:256}" --body-file "$body_file" | tail -n1) \
              || if [ "$HAS_PAT" != "true" ]; then
                block "Couldn't open the PRD PR, because \`AGENT_PAT\` isn't set and GitHub doesn't let the default token open PRs. Set \`AGENT_PAT\` first."
              else
                block "Couldn't open the PRD PR from \`${PRD_BRANCH}\` into \`${BASE_REF}\`. GitHub's reply is in the workflow run's log."
              fi
            number=$(basename "$url")
            echo "Opened PRD PR $url"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # From here to `Request review` is **building a slice**, and the finishing
      # run (#177) skips all of it: no checkout, no toolchain, no Claude Code.
      # It still hands over to the runner when it merged the last slice PR,
      # since writing that slice's row is the runner's — and the runner, told
      # it is finishing, writes the row and runs no model.
      - name: Checkout the base branch
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          # AGENT_PAT is optional. When absent this falls back to GITHUB_TOKEN,
          # which works, except that CI on the resulting PR waits for a
          # maintainer to approve it: since 2026-06-11 a push made with it
          # starts `pull_request` runs that require approval (#221). Add the
          # secret later and this starts using it with no change to the
          # workflow.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      # One PRD branch for the whole PRD. Every slice branch is cut from its
      # tip, so slice N is written on top of slices 1..N-1 rather than against
      # a base that does not have them.
      #
      # Looked up on the remote by the **stable half** of the name —
      # `agent/prd-<parent>-` — rather than recomputed whole. The slug half comes
      # from the parent's title, and a title is editable: recompute it every run
      # and retitling the PRD mid-chain silently forks the chain, branching slice
      # N off the base branch without slices 1..N-1 and opening a *second* draft
      # PR carrying the same `Closes #<parent>`. The issue number is the part
      # nobody can edit, so it is the part the lookup keys on; the slug is only
      # ever used to *name* a branch that does not exist yet.
      - name: Resolve the PRD branch
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'false'
        id: branch
        run: |
          set -euo pipefail
          existing=$(git ls-remote --heads origin "agent/prd-${ISSUE_NUMBER}-*" \
            | cut -f2 | sed 's#^refs/heads/##')

          if [ -z "$existing" ]; then
            slug=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
            name="agent/prd-${ISSUE_NUMBER}-${slug}"
            exists=false
            echo "No branch for PRD #${ISSUE_NUMBER} yet; will create ${name} from ${BASE_REF}."
          elif [ "$(wc -l <<< "$existing")" -gt 1 ]; then
            # Two branches for one PRD is the fork this lookup exists to prevent,
            # so it must not be guessed at — picking either one drops whatever
            # slices are on the other. Fail, and let the blocked comment say so.
            echo "::error::More than one branch matches agent/prd-${ISSUE_NUMBER}-*, so which one carries this PRD's slices is ambiguous: $(tr '\n' ' ' <<< "$existing"). Delete or rename all but one, then re-add agent:implement."
            exit 1
          else
            name="$existing"
            exists=true
            echo "Reusing ${name}."
          fi

          {
            echo "name=$name"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"

      # Every slice is built on a **slice branch** of its own, cut from the PRD
      # branch tip, and opened as a slice PR against it (#172) — so slice N is
      # still written on top of slices 1..N-1, which are on the PRD branch
      # once their slice PRs have merged there.
      #
      # `agent/slice-<parent>-<sub>-<slug>`, and deliberately **not** under
      # `agent/prd-`. The PRD branch lookup above keys on that prefix, so a
      # slice branch there would be a second match — the ambiguity the lookup
      # refuses — and `agent/prd-<n>-<slug>/…` cannot even exist as a ref
      # beside `agent/prd-<n>-<slug>`, which git stores as a file where the
      # other needs a directory. The slug is the sub-issue's, only ever used to
      # *name* the branch: nothing finds a slice PR by it (see the preflight).
      - name: Prepare the slice branch
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'false'
        id: prepare
        env:
          PRD_BRANCH: ${{ steps.branch.outputs.name }}
          EXISTS: ${{ steps.branch.outputs.exists }}
          SUB: ${{ steps.preflight.outputs.sub }}
          SUB_TITLE: ${{ steps.preflight.outputs.sub_title }}
        run: |
          set -euo pipefail
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

          if [ "$EXISTS" = "true" ]; then
            git fetch origin "+refs/heads/${PRD_BRANCH}:refs/remotes/origin/${PRD_BRANCH}"
            git checkout -B "$PRD_BRANCH" "refs/remotes/origin/${PRD_BRANCH}"
            echo "Reusing $PRD_BRANCH at $(git rev-parse --short HEAD)."
          else
            git checkout -b "$PRD_BRANCH"
            echo "Created $PRD_BRANCH from ${BASE_REF}; it is pushed with the first slice."
          fi

          slug=$(echo "$SUB_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          slice="agent/slice-${ISSUE_NUMBER}-${SUB}-${slug}"
          git checkout -b "$slice"
          echo "Building sub-issue #${SUB} on ${slice}."
          echo "slice=$slice" >> "$GITHUB_OUTPUT"

      # Both setup steps are the adopter's toolchain, so both are skippable.
      # `npm install -g @anthropic-ai/claude-code` below is not: that is the
      # agent's own runtime, and every runner image already has the Node it
      # needs for it.
      - name: Setup Node.js
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'false' && inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, never an expression reading the
      # issue event.
      - name: Install dependencies
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'false' && inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'false'
        run: npm install -g @anthropic-ai/claude-code

      # The runner package lives on GitHub Packages, which has no anonymous
      # install even for a public package — see the long note on the same step in
      # agent-review-reusable.yml. Short version: the scoped `.npmrc` is written
      # for `@jeffwlawson` only so a caller's own `npm ci` is untouched, and
      # `packages: read` in the caller is what makes the token below work. The
      # cache opt-out belongs to the same note: this half declares no toolchain,
      # so it must not infer one.
      - name: Authenticate to GitHub Packages
        if: steps.preflight.outputs.refused == 'false' && (steps.preflight.outputs.finishing == 'false' || steps.merge.outputs.merged == 'true')
        uses: actions/setup-node@v7
        with:
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      - name: Run implementation agent
        if: steps.preflight.outputs.refused == 'false' && (steps.preflight.outputs.finishing == 'false' || steps.merge.outputs.merged == 'true')
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_IMPLEMENT_PRD: ${{ vars.AGENT_MODEL_IMPLEMENT_PRD }}
          BRANCH: ${{ steps.prepare.outputs.slice }}
          PRD_BRANCH: ${{ steps.branch.outputs.name }}
          SUB_NUMBER: ${{ steps.preflight.outputs.sub }}
          SUB_TITLE: ${{ steps.preflight.outputs.sub_title }}
          # Set only when this run merged a slice PR: the runner writes that
          # slice's row of the slices table into this PR's body, first, from the
          # facts `Gather the slice's row` left in OUTPUT_DIR (#174).
          PRD_PR: ${{ steps.prd_pr.outputs.number }}
          # `true` on the finishing run, which builds nothing: the runner writes
          # the last slice's row and exits before any agent is started.
          FINISHING: ${{ steps.preflight.outputs.finishing }}
          OUTPUT_DIR: ${{ runner.temp }}
        # `npm exec --prefix` rather than a bare `npx`, and the prefix is the
        # whole point. `npx pkg@version` reuses a package already present in the
        # working directory when it satisfies the spec — and in the repository
        # that *publishes* this package, the checkout is such a package. It has
        # no `dist/` (CI installs, it does not build), so the bin resolves to
        # nothing and the step dies `command not found` before any runner code
        # runs (#8). Installing into RUNNER_TEMP sidesteps the name collision.
        #
        # A no-op for every consuming repo, which has no package of this name to
        # collide with — verified against npm 10 and 11, both of which ignore
        # `--ignore-existing` here. `--prefix` moves the *install*, not the
        # process `cwd`: the runner still does its git work in the checkout.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.7.4 -- agent-workflows implement-prd

      # Two pushes, and only one of them may be forced.
      #
      # The PRD branch is pushed **plain**, and only on the run that created
      # it — the slice PR needs a base that exists on the remote. It carries
      # every earlier slice, so a force push there is a chain that silently
      # eats its own history; a rejected non-fast-forward is the correct
      # outcome, since it means something else moved the branch.
      #
      # The slice branch is forced, for `agent-implement`'s reason: this run
      # cut it and owns it. What it can replace is an earlier attempt at the
      # same sub-issue that never became an open slice PR — a sub-issue is
      # closed as its slice PR opens, so it is never built again — and a retry
      # after a failed build lands
      # rather than being rejected by its own leftovers.
      - name: Push branches
        id: push
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'false' && success()
        env:
          PRD_BRANCH: ${{ steps.branch.outputs.name }}
          EXISTS: ${{ steps.branch.outputs.exists }}
          SLICE_BRANCH: ${{ steps.prepare.outputs.slice }}
        run: |
          set -euo pipefail
          if [ "$EXISTS" != "true" ]; then
            git push origin "$PRD_BRANCH"
          fi
          git push --force origin "$SLICE_BRANCH"
          # The commit `Request review` waits for the slice PR to show.
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # One slice PR per sub-issue, into the PRD branch rather than the base
      # branch, and a **draft**: draft means the loop is still working on it,
      # and the review round it is about to get is that work.
      #
      # `Part of`, never `Closes`. The sub-issue is closed by the next step, as
      # the chain's "built" marker, and a closing keyword here would tie that
      # marker to when the slice PR merges instead of to when it opened.
      - name: Open the slice PR
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'false' && success()
        id: slice_pr
        env:
          PRD_BRANCH: ${{ steps.branch.outputs.name }}
          SLICE_BRANCH: ${{ steps.prepare.outputs.slice }}
          SUB: ${{ steps.preflight.outputs.sub }}
          SUB_TITLE: ${{ steps.preflight.outputs.sub_title }}
          # gh reads GH_TOKEN from the env, and the Actions bot is forbidden
          # from creating PRs. A user PAT is not the Actions bot, so it bypasses
          # that; fall back to GITHUB_TOKEN so the shape stays identical in a
          # setup without the secret.
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="${SUB_TITLE} (#${SUB})"
          body_file="${RUNNER_TEMP}/slice-pr-body.md"
          {
            echo "Part of #${SUB}"
            echo
            echo "One slice of PRD #${ISSUE_NUMBER}, built by the \`agent:implement\` PRD workflow on"
            echo "\`${SLICE_BRANCH}\` and opened against the PRD branch \`${PRD_BRANCH}\`, which holds"
            echo "the slices before it. This PR's diff is this slice alone."
          } > "$body_file"
          url=$(gh pr create --draft --base "$PRD_BRANCH" --head "$SLICE_BRANCH" \
            --title "${title:0:256}" --body-file "$body_file" | tail -n1)
          echo "number=$(basename "$url")" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      # Closed the moment its slice PR opens, not when it merges, so "the first
      # open sub-issue" the preflight picks is still the next slice to build.
      #
      # The commit SHA is the whole point of this comment. It is the only
      # record tying a closed sub-issue to the code that closed it: a slice
      # branch is not meant to outlive its slice PR, and the PRD branch tip
      # moves on with every slice.
      - name: Close the finished sub-issue
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'false' && success()
        env:
          SUB: ${{ steps.preflight.outputs.sub }}
          SLICE_BRANCH: ${{ steps.prepare.outputs.slice }}
          PRD_BRANCH: ${{ steps.branch.outputs.name }}
          SLICE_PR: ${{ steps.slice_pr.outputs.number }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          gh issue close "$SUB" --reason completed --comment \
            "Implemented in ${sha} on \`${SLICE_BRANCH}\`, as part of #${ISSUE_NUMBER}, and opened as slice PR #${SLICE_PR} against the PRD branch \`${PRD_BRANCH}\`."

      # The slice PR gets its review round the way `agent-implement`'s PR
      # does. Safe for the same reason as there: the hop it starts is bounded
      # at the other end (docs/parity.md §10).
      #
      # This run adds nothing to the parent. The chain does not re-label itself
      # after a slice any more — the next slice waits for this one's round, and
      # until the chain can see a round end, a human advances it (#172).
      #
      # MUST use AGENT_PAT: a label added with GITHUB_TOKEN triggers no
      # workflow. `-e`, unlike `agent-implement`'s: this is the last step, and
      # without it a failed label add exits green with the slice PR sitting in
      # draft asking nobody for review — so it fails into `Mark blocked on
      # failure`, whose comment names the slice PR to label by hand.
      - name: Request review
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'false' && success()
        env:
          SLICE_PR: ${{ steps.slice_pr.outputs.number }}
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          # The commit this run pushed, and how long the PR gets to show it as
          # its head before the label goes on anyway (#229).
          PUSHED_SHA: ${{ steps.push.outputs.head }}
          HEAD_WAIT_SECONDS: "60"
        run: |
          set -euo pipefail
          # Wait for the pull request to show the pushed commit as its head
          # before asking for the review (#229). GitHub moves a PR's head
          # asynchronously after a push, and a label added before it has would
          # carry the commit before the push in its payload. Bounded: past it,
          # the label goes on anyway with a warning, since review reads the
          # branch tip itself and refuses by name where it cannot settle on it.
          head=""
          deadline=$((SECONDS + HEAD_WAIT_SECONDS))
          until head=$(gh pr view "$SLICE_PR" --json headRefOid --jq .headRefOid 2>/dev/null) && [ "$head" = "$PUSHED_SHA" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::PR #${SLICE_PR} still shows ${head:-an unreadable head} as its head ${HEAD_WAIT_SECONDS}s after ${PUSHED_SHA} was pushed. Asking for the review anyway: it reads the branch tip itself, and refuses by name if it cannot settle on ${PUSHED_SHA}."
              break
            fi
            sleep 5
          done
          # This run's own label comes off the parent before the next step's
          # goes on the slice PR (#236): every result is posted by now, so what
          # is left is the hand-off. The last step removes it again, which is
          # nothing where it is already off.
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          # Removed first, as every trigger label the loop adds (#236): an add
          # on a label that is somehow already there fires nothing.
          gh pr edit "$SLICE_PR" --remove-label "agent:review" || true
          gh pr edit "$SLICE_PR" --add-label "agent:review"
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::AGENT_PAT is not set, so this label was added with GITHUB_TOKEN and will NOT trigger agent-review. Add agent:review by hand on slice PR #${SLICE_PR}."
          fi

      # The finishing run's handover (#177): the PRD PR leaves draft, and a
      # human merges it — the loop never merges it and never approves.
      #
      # More than one slice means an **integration review**: `agent:review` on
      # the PRD PR, and review marks it ready once the review is posted, the
      # way it marks any PR ready. One slice has had its review already, on
      # its slice PR — the same lines — so the PRD PR is marked ready here. A
      # slice built before slice PRs had no review of its own, and counts: the
      # integration review is the one it gets.
      #
      # The count is read from GitHub rather than off the slices table: the
      # slice PRs merged into the PRD branch, plus the closed sub-issues no
      # slice PR built, which is the same "built before slice PRs" test `Gather
      # the slice's row` applies. A body a human may edit is not evidence.
      #
      # Needs AGENT_PAT either way, and refuses without it rather than doing
      # half. `gh pr ready` cannot convert a draft under GITHUB_TOKEN, and a
      # label added with it starts no review — and would then already be on
      # the PRD PR when a retry adds it again, which fires no event either.
      #
      # Safe to re-run, and that is the resume-the-handover row of the
      # preflight: a run that died after the last merge leaves a draft PRD PR,
      # and re-adding `agent:implement` lands here with nothing merged.
      - name: "Hand over PRD PR #${{ steps.prd_pr.outputs.number || steps.preflight.outputs.prd_pr }}"
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.finishing == 'true' && success()
        id: handover
        env:
          PRD_PR: ${{ steps.prd_pr.outputs.number || steps.preflight.outputs.prd_pr }}
          PRD_BRANCH: ${{ steps.merge.outputs.prd_branch || steps.preflight.outputs.prd_branch }}
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          if [ "$HAS_PAT" != "true" ]; then
            block "Couldn't hand PRD PR #${PRD_PR} over, because \`AGENT_PAT\` isn't set and GitHub doesn't let the default token mark a draft ready or start a review. Every sub-issue is built and merged. Set \`AGENT_PAT\`; trying again resumes the handover and merges nothing."
          fi

          # Every slice PR the PRD branch has had, for the merged count and for
          # telling a pre-upgrade slice apart — the sub-issue from `Part of
          # #<n>`, or failing that the slice branch's name, as the row step.
          slice_of='(.body // "" | capture("Part of #(?<n>[0-9]+)").n) // (.headRefName | capture("^agent/slice-\($parent)-(?<n>[0-9]+)-").n) // empty'
          prs=$(gh pr list --state all --base "$PRD_BRANCH" --limit 1000 --json number,state,body,headRefName) \
            || block "Could not list the slice PRs of \`${PRD_BRANCH}\` to decide how to hand PRD PR #${PRD_PR} over. Re-add \`agent:implement\` here to retry. Nothing is merged twice."
          merged=$(jq '[.[] | select(.state == "MERGED")] | length' <<< "$prs")
          built=$(jq -c --arg parent "$ISSUE_NUMBER" "[.[] | ${slice_of} | tonumber]" <<< "$prs")
          before=$(jq --argjson built "$built" \
            '[.subIssues.nodes[] | select(.state == "CLOSED" and (.number as $n | any($built[]; . == $n) | not))] | length' \
            "${RUNNER_TEMP}/prd-issue.json")
          slices=$((merged + before))
          echo "PRD PR #${PRD_PR} holds ${slices} slice(s): ${merged} merged slice PR(s) and ${before} built before slice PRs."

          if [ "$slices" -gt 1 ]; then
            # This run's own label off the parent before the next step's goes
            # on the PRD PR, as in `Request review` (#236).
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
            # Removed first, as every trigger label the loop adds (#236).
            gh pr edit "$PRD_PR" --remove-label "agent:review" || true
            gh pr edit "$PRD_PR" --add-label "agent:review" \
              || block "Could not add \`agent:review\` to PRD PR #${PRD_PR}, so its integration review was not asked for. Re-add \`agent:implement\` here to retry the handover. Nothing is merged twice."
            echo "Asked for the integration review of PRD PR #${PRD_PR}; review marks it ready."
          else
            gh pr ready "$PRD_PR" \
              || block "Could not mark PRD PR #${PRD_PR} ready for review. Re-add \`agent:implement\` here to retry the handover. Nothing is merged twice."
            echo "Marked PRD PR #${PRD_PR} ready: its one slice was reviewed on its slice PR."
          fi

      # `!= 'true'`, not `== 'false'`: a preflight that fails hard exits before
      # writing the output at all, and `''` is not `'false'` — an equality gate
      # would skip this step precisely when the PRD most needed the comment.
      # Refusals and deferrals exit 0, so `failure()` keeps them out regardless
      # — all but the preflight's `block`, which exits 1 to land here.
      #
      # In the loop's one order (#236): the comment, then this run's own label
      # off, then `agent:blocked`. The removal only where the preflight decided
      # the issue was this run's, for the last step's reason below.
      - name: Mark blocked on failure
        if: steps.preflight.outputs.refused != 'true' && (failure() || cancelled())
        env:
          JOB_STATUS: ${{ job.status }}
          REFUSED: ${{ steps.preflight.outputs.refused }}
          TIMEOUT_MINUTES: ${{ vars.AGENT_TIMEOUT_MINUTES || '30' }}
          SUB: ${{ steps.preflight.outputs.sub }}
          SLICE_PR: ${{ steps.slice_pr.outputs.number }}
          FINISHING: ${{ steps.preflight.outputs.finishing }}
        run: |
          reason="It stopped without giving a reason. The workflow run's log has the details."
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          # Cancelled is not failed (#220), and a job that reached its limit
          # is cancelled too. What tells the two apart is the clock the first
          # step started: a timed-out job ran its whole limit, less the moment
          # the runner took to reach that step, hence a minute's slack. A
          # reason file is not read on either; what wrote one was stopped, not
          # failing. The labels and the retry are a failure's, word for word.
          # The limit is compared only where it is a positive integer: `fromJSON`
          # accepts `1.5` and `1e1`, which bash arithmetic refuses, and under
          # `bash -e` that would end this step before its comment. A limit the
          # step cannot compare reads as a cancel, which is still said.
          if [ "$JOB_STATUS" = "cancelled" ]; then
            reason="It was cancelled before it finished, by hand or by GitHub."
            if [ -n "${JOB_STARTED:-}" ] && [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] && [ $(( $(date +%s) - JOB_STARTED )) -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
              reason="It timed out after ${TIMEOUT_MINUTES} minutes. The repository variable \`AGENT_TIMEOUT_MINUTES\` raises the limit."
            fi
          fi
          # One pattern for every run that stopped (#253): the reason as a
          # sentence, starting with a capital and ending in a full stop, then
          # the run and what to do.
          reason="${reason^}"
          case "$reason" in *[.!?]) ;; *) reason="${reason}." ;; esac
          # The label comes off in the last step since #236, so adding it is
          # the retry.
          #
          # The finishing run built nothing, so there is no sub-issue to retry.
          # What a retry does instead is the rest of the state table: merge the
          # last slice PR if it is still open, and resume the handover if the
          # PRD PR is still a draft, so it is still the remedy, and says so.
          retry="To try again, add \`agent:implement\`."
          if [ "${FINISHING}" = "true" ]; then
            reason="${reason} It was handing the PRD PR over, with every sub-issue built."
            retry="To try again, add \`agent:implement\`; it resumes the handover and builds nothing."
          elif [ -n "${SUB}" ]; then
            reason="${reason} It was building sub-issue #${SUB}."
          fi
          # Not after a preflight that died before deciding: that run leaves
          # the label on (see the last step), and adding a label that is
          # already present fires no event.
          if [ "$REFUSED" != "false" ]; then
            retry="To try again, remove \`agent:implement\` if it is still on this issue, then add it."
          fi
          # Adding the label is the right retry for most of the ways this run
          # can stop, and the wrong one for the late ones: once the slice PR is
          # open, the retry starts by **merging** it rather than rebuilding the
          # slice, and the merge step never reads a verdict, so a slice PR with
          # no review round yet would land unreviewed. What is left to do by
          # hand is whatever the steps after it did not: the sub-issue's close
          # and the review label. So name the slice PR whenever there is one.
          if [ -n "${SLICE_PR}" ]; then
            retry="Slice PR #${SLICE_PR} was opened before it stopped, and adding \`agent:implement\` now would merge it as it stands. Close sub-issue #${SUB} if it is still open, add \`agent:review\` to slice PR #${SLICE_PR} if it does not have it, and add \`agent:implement\` here once that review has finished."
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '**`agent:implement` stopped:** %s\n\n[Workflow run](%s) · %s\n' "$reason" "$RUN_URL" "$retry" > "$body_file"
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file" || echo "::warning::Could not post the failure comment on #${ISSUE_NUMBER}."
          if [ "$REFUSED" = "false" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true

      # The trigger label comes off however the run ends (#236): success,
      # failure, timeout or cancel, so it never outlives the run that decided
      # the issue was its own. `== 'false'`, unlike the failure step above: a
      # refusal took it off already, a deferral must not touch it, and nor
      # must a preflight that died before deciding, since that run may be the
      # one that would have deferred, and `agent-implement` owns that label event
      # and holds the label while it works. Such a run leaves it on, as it
      # always has, and the failure comment says to remove it before re-adding.
      - name: Always remove the trigger label
        if: always() && steps.preflight.outputs.refused == 'false'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
