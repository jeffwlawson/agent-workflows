name: Agent Review (reusable)

# The review job itself. `agent-review.yml` is the caller — a trigger and two
# wires — and everything that bounds what a wrong review can do stays here, in a
# file an adopting repo *references* rather than copies
# (jeffwlawson/winget-manifest-lint#97, slice 3 of
# jeffwlawson/winget-manifest-lint#88).
#
# A reusable workflow rather than a composite action, for one reason: an action
# cannot declare `on:`, `permissions:`, `concurrency:` or a job-level `if:` —
# which is every security control in this loop, and **the fork guard is a
# job-level `if:`**. An action could have absorbed checkout → node → install and
# left the controls to be copy-pasted per repo, which is how they drift.
#
# The trigger stays with the caller because `workflow_call` cannot carry one:
# the event that reaches this job is the caller's, so `github.event.…` below
# reads the `pull_request_target` payload exactly as it did before the split,
# and `github.repository` is still the *calling* repository.
#
# Two properties an adopter cannot get wrong, because they are not theirs to
# state: the fork guard and the label guard are on this side of the seam. A
# caller's own `if:` can skip this job; it cannot loosen it.
on:
  workflow_call:
    inputs:
      # **Deprecated** (#201, PRD #200 decision 4), and removed in the release
      # after the one that deprecated it. The fix-round budget replaced it: the
      # repository variable `AGENT_MAX_FIX_ROUNDS`, read by *Settle the
      # fix-round budget* below. Kept one release because GitHub fails a caller
      # that passes an input the reusable no longer declares.
      #
      # A **string** now, where it was a boolean, and that is what lets it be an
      # alias at all: a boolean input reads `false` whether the caller wrote
      # `false` or nothing, and the two mean opposite things here (a budget of
      # 0, and the variable's budget). An unquoted `true` or `false` in a
      # caller's `with:` still reaches a string input, as `"true"` or `"false"`;
      # the reverse, a string into a boolean input, is what GitHub refuses.
      auto-fix:
        description: >-
          Deprecated: set the repository variable `AGENT_MAX_FIX_ROUNDS`
          instead. When set, it wins over the variable: `true` is a fix-round
          budget of 1 and `false` a budget of 0, and the run warns that it is
          going away. Empty, the default, leaves the budget to the variable.
        type: string
        default: ""
      default-branch:
        description: >-
          Branch to diff against when the pull-request event carries no base
          ref. On a real PR `base.ref` is always set, so this fires only when
          something is already odd — but an unset fallback degrades *silently*
          to the wrong branch, which is the jeffwlawson/winget-manifest-lint#71
          failure arriving by a different route.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets a
          review, running on the image's own Node.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or a PR title becomes
          a shell script.
        type: string
        default: npm ci
      self-check:
        description: >-
          The check-run name this job appears under on the PR, which for a
          called workflow is `<caller job id> / <this workflow's job id>`. The
          CI wait below polls every check on the head commit and has to
          recognise its own, or it waits for itself: the whole 15 minutes of
          its CI wait, then a review with the degraded evidence
          jeffwlawson/winget-manifest-lint#48 exists to prevent. Nothing inside
          a called workflow can read its caller's job id, hence an input — and
          required rather than defaulted, because a default that is wrong fails
          exactly this quietly.
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the review agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT, used to mark the PR ready for review — `GITHUB_TOKEN`
          cannot do that whatever permissions it is granted (docs/ADOPTING.md
          §1) — and to add the labels this workflow adds for another to fire
          on: `agent:fix` for an automatic fix round, and `agent:implement` on a slice
          PR's parent when its round ends. Optional: without it each of those
          warns, the run stays green, and a human does it by hand.
        required: false

jobs:
  # The review's time limit (#220): its CI wait plus its own time, so a slow CI
  # no longer eats the review. Its own time is the repository variable
  # `AGENT_REVIEW_TIMEOUT_MINUTES`, 5 where it is unset, which with the 15
  # minutes of the wait is the 20 this job had before it was a sum.
  #
  # **A job, because an expression cannot add.** `timeout-minutes` may read
  # `vars` and `needs` and nothing a step computes, and GitHub's expression
  # language has no arithmetic, so the sum is done here and handed across as an
  # output. It runs where the review does, the same two guards, and holds no
  # permission at all: it reads one variable and writes one number.
  #
  # **It never fails.** A failed job here would skip the review silently, which
  # is the class this issue is about. A value that is not a positive integer is
  # summed as the default instead and flagged, and the review refuses it where
  # it can say so: on the pull request, naming the variable, as the fix-round
  # budget is refused.
  time-limit:
    if: >-
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      minutes: ${{ steps.limits.outputs.minutes }}
      refused: ${{ steps.limits.outputs.refused }}
    steps:
      - name: Add the CI wait to the review's own time
        id: limits
        env:
          REVIEW_MINUTES: ${{ vars.AGENT_REVIEW_TIMEOUT_MINUTES }}
          # `WAIT_SECONDS` in *Wait for other checks*, in minutes. A test holds
          # the two equal.
          CI_WAIT_MINUTES: "15"
        run: |
          own="${REVIEW_MINUTES:-5}"
          refused=false
          if [[ ! "$own" =~ ^[1-9][0-9]*$ ]]; then
            refused=true
            own=5
          fi
          echo "Review time limit: ${CI_WAIT_MINUTES} minutes of CI wait and ${own} of its own."
          {
            echo "minutes=$((CI_WAIT_MINUTES + own))"
            echo "refused=${refused}"
          } >> "$GITHUB_OUTPUT"

  review:
    # Two guards, both required:
    #  - the trigger label, and
    #  - same-repo head: a fork PR must never reach the checkout+npm ci steps,
    #    which would run untrusted code with secrets in scope.
    if: >-
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [time-limit]
    runs-on: ubuntu-latest
    # The sum `time-limit` made, which is the repository variable where it is set
    # and today's 20 where it is not. `needs` is among the contexts this key may
    # read. The failure step below names the same figure.
    timeout-minutes: ${{ fromJSON(needs.time-limit.outputs.minutes) }}
    # One group per PR, shared with agent-fix and agent-update-branch. Review is
    # `contents: read` and cannot push, but that is not what the group protects
    # against: the hazard is review *reading* a branch while a fix is writing to
    # it, which produces a confident review of a tree state that never existed.
    # Review used to sit in its own `agent-review-pr-*` group and that race was
    # live (docs/parity.md §10, jeffwlawson/winget-manifest-lint#102).
    concurrency:
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # What the `post-review` job below reads (#257). This job runs the model and
    # posts nothing: every write the run makes is that job's, after this one
    # has ended. So everything it decides crosses as an output, or, for the
    # files the runner wrote, as the `review` artifact (*Hand the review to the
    # posting job*).
    outputs:
      # Whether the pre-flight let the run go ahead, and if not, what to say.
      # `blocked` is whether the refusal also adds `agent:blocked`.
      proceed: ${{ steps.state.outputs.proceed }}
      refusal: ${{ steps.state.outputs.refusal }}
      blocked: ${{ steps.state.outputs.blocked }}
      # The commit this run reviewed, which every status and the moved check
      # are about (#229).
      sha: ${{ steps.state.outputs.sha }}
      # The verdict's machine-readable key, out of the file the runner wrote,
      # which the hand-off selects on. See *Hand the verdict to what reads it*.
      verdict: ${{ steps.verdict.outputs.verdict }}
      # How the run ended, for the posting job's failure comment: the reason a
      # failed runner wrote, the refusal a variable met, and whether a cancel
      # was the time limit. See *Hand the outcome to the posting job*.
      failure-reason: ${{ steps.outcome.outputs.failure-reason }}
      refusal-reason: ${{ steps.outcome.outputs.refusal-reason }}
      timed-out: ${{ steps.outcome.outputs.timed-out }}
    # **Read-only, every scope** (#257). This job reads untrusted pull-request
    # content and runs a model over it, so it holds no write at all: not
    # `contents: write`, which is what stops a wrong review touching the branch
    # (docs/parity.md §10), and not the pull-request, status and label writes
    # it held until the posting job took them. A model that could be talked
    # into a call has nothing here to make it with.
    #
    # The caller declares the union of every job's scopes, and that is not the
    # duplication it looks like: the two blocks do opposite jobs. A called
    # workflow can only *downgrade* the token it is handed, so this block is the
    # bound and cannot be widened from the caller's side. That is why the
    # caller can grant `contents: write` and `pull-requests: write` for the
    # posting job while this job still holds `read`. The caller's block is the
    # grant, and a scope declared only here grants nothing, but what that costs
    # is the run rather than the step: GitHub refuses the elevation instead of
    # trimming the job to fit, so a caller short of any scope in this block
    # fails the **whole run** before any job starts, with no job log in it
    # (probed, #146). Not a review that half works; no review at all, which is
    # what `setup/doctor.ts` tells an adopter before a label rather than after
    # one.
    permissions:
      # Reading the check runs the CI wait below polls. On a **public**
      # repository they are readable without this scope, which is why every
      # repo in the pilot worked without it; on a private one the same call
      # 403s `Resource not accessible by integration`. Latent since v0.1.0 and
      # found by the first private adopter to run this loop. That history is
      # about the **poll**, and it is not what a caller short of the scope gets:
      # this job declares it, so such a caller is refused before any job starts,
      # on a public repository too (probed, #146).
      checks: read
      # Reading this commit's workflow runs, which is the only surface a run
      # that is queued or **waiting for approval** shows on: it has created no
      # check run yet (#221). Since 2026-06-11 a push made with `GITHUB_TOKEN`
      # starts runs that wait for approval, so without this the CI wait saw
      # nothing and read the commit as green. The failure-log tail reads run
      # logs under the same scope, which #80 once declined it for. Like every
      # scope here, a caller that does not grant it is refused before any job
      # starts (#146).
      actions: read
      contents: read
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read
      # The pre-flight's read of the head, and the runner's of the threads,
      # reviews and comments it hands the agent.
      pull-requests: read
      # The budget step's count of the verdicts already posted, which are
      # commit statuses, and the CI wait's read of the statuses CI posts.
      statuses: read

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # The PR's real base branch. review-context.ts diffs HEAD against this so
      # the inline-comment allow-list matches GitHub's PR diff exactly; a
      # hardcoded `main` mis-filters any PR stacked on another branch
      # (jeffwlawson/winget-manifest-lint#71). The event field is the source;
      # `default-branch` is the fallback for an event that somehow carries none,
      # which is the adopter's call to make rather than a literal `main` buried
      # in a shell expansion.
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.default-branch }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # The clock the failure step reads a time limit off (#220). A job that
      # reaches its `timeout-minutes` is cancelled, not failed, and nothing in
      # the `job` context says which cancellation it was, so that step compares
      # how long the job ran with its limit. First, so it starts as near the
      # job's own start as a step can.
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # Same guard as agent-fix and agent-update-branch. Review had none until
      # jeffwlawson/winget-manifest-lint#102, so labelling a merged PR ran a
      # full agent pass over merged work and then died at `gh pr ready` — which
      # cannot convert a merged PR — under a warning that blames a missing
      # AGENT_PAT. That is a real failure mode misreported as a setup problem,
      # which is worse than either.
      #
      # A refusal on a moved branch also adds `agent:blocked`: it is a run a
      # human asked for and did not get, and the comment alone scrolls away. A
      # closed PR does not (#253): there is nothing left for anyone to act on,
      # so it gets the note alone, as in fix and update-branch. This step only
      # decides both; the posting job says them (#257).
      #
      # The rest is settling **which commit this run reviews**, and everything
      # after this step reads that one answer, `steps.state.outputs.sha`: the
      # checkout, the CI wait's check and status reads, and, handed over as the
      # job's `sha`, every status the posting job posts. The payload's
      # `head.sha` is not read again past this step.
      #
      # The payload is not enough on its own, for two reasons. It is snapshotted
      # at label time, and joining `agent-pr-*` means the run can start long
      # after: label `agent:review` while a fix is running and the review starts
      # once the fix has pushed. And GitHub moves a pull request's head
      # **asynchronously** after a push (#229), so a label added the moment a
      # fix, a conflict resolution or an implement run has pushed can carry the
      # commit *before* the push in its payload, and `headRefOid` can agree with
      # it for a while. That is what #228 saw: the fix pushed `cb00b28`, the
      # review checked out `34c3fe5`, and its verdict went on `34c3fe5`, where
      # branch protection never looks.
      #
      # So the branch tip is read from **git**, with `ls-remote` on the head
      # ref, which moves as soon as the push lands. It is the reading `fix`'s
      # guard makes (#188), and authenticated the same way. Then:
      #
      #  - the tip is the payload's commit: review it;
      #  - the tip **descends** from it: the branch moved forward since the
      #    label, which is the push-then-label sequence above. Wait, bounded,
      #    for `headRefOid` to catch up, then review the tip. The wait is what
      #    makes the posted review land on the pull request's head: GitHub
      #    anchors `commitOID` against it, and a review posted ahead of it is
      #    one the pull request does not yet know the commit for;
      #  - the tip does not descend from it (a rewritten branch), the ancestry
      #    cannot be read, or `headRefOid` never catches up: refuse, naming both
      #    commits. None of those is a commit anybody pointed at.
      #
      # An unreadable tip proceeds on the payload's commit, with a warning: an
      # API blip is not evidence the branch moved, and this run only reads.
      # `fix` refuses there instead, because replying twice is its harm.
      - name: "Pre-flight: refuse if the PR is closed, merged, or has moved"
        id: state
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # How long `headRefOid` gets to catch up with a tip that moved, and
          # how often it is asked. About a minute: GitHub catches up in seconds.
          HEAD_WAIT_SECONDS: "60"
          HEAD_POLL_SECONDS: "5"
        run: |
          set -uo pipefail
          # A refusal is said by the posting job, which holds the writes this
          # job does not (#257): the sentence, and whether `agent:blocked` goes
          # on after it. One pattern for every refusal (#253): the label that
          # did not run, then a sentence saying why and what to do, starting
          # with a capital. The posting job writes the label's half.
          refuse() {
            {
              echo "proceed=false"
              echo "refusal=$1"
              if [ "${2:-}" = "blocked" ]; then echo "blocked=true"; else echo "blocked=false"; fi
            } >> "$GITHUB_OUTPUT"
          }
          # One explanation for every way the PR can have moved since the
          # label (#253): the reader's remedy is the same for all of them.
          # The commits are named in the log rather than in the comment.
          changed="The PR changed after \`agent:review\` was added. Add \`agent:review\` again to review the latest version."

          if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" = "true" ]; then
            refuse "This PR is closed."
            exit 0
          fi

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          tip=""
          if remote=$(git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" \
              ls-remote "${GITHUB_SERVER_URL}/${GH_REPO}.git" "refs/heads/${BRANCH}"); then
            # `ls-remote` matches a pattern against the tail of each ref, so the
            # exact name is picked out rather than taking the first line.
            tip=$(printf '%s\n' "$remote" | awk -v ref="refs/heads/${BRANCH}" '$2 == ref { print $1 }')
          fi
          if [ -z "$tip" ]; then
            echo "::warning::Could not read the tip of ${BRANCH}, so this reviews ${HEAD_SHA}, the commit the label was added at, without confirming it is still the head."
            tip="$HEAD_SHA"
          fi

          if [ "$tip" != "$HEAD_SHA" ]; then
            # `ahead` is the compare API's word for "the second commit descends
            # from the first". Anything else, or no answer, is not a review of
            # what the label pointed at.
            relation=$(gh api "repos/${GH_REPO}/compare/${HEAD_SHA}...${tip}" --jq .status 2>/dev/null || echo "")
            if [ -z "$relation" ]; then
              echo "::warning::The label was added at ${HEAD_SHA}, but ${BRANCH} is now at ${tip}, and whether that descends from it could not be read."
              refuse "$changed" blocked
              exit 0
            fi
            if [ "$relation" != "ahead" ]; then
              echo "::warning::The branch moved while this run was queued: the label was added at ${HEAD_SHA}, but ${BRANCH} is now at ${tip}, which does not descend from it (${relation})."
              refuse "$changed" blocked
              exit 0
            fi

            head=""
            deadline=$((SECONDS + HEAD_WAIT_SECONDS))
            until head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid 2>/dev/null) && [ "$head" = "$tip" ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::warning::The label was added at ${HEAD_SHA}, and ${BRANCH} has since moved on to ${tip}, but after ${HEAD_WAIT_SECONDS}s this PR still shows ${head:-an unreadable head} as its head, so a review of ${tip} could not be posted against it."
                refuse "${changed} If the PR still shows the old commit, close and reopen it so GitHub catches up." blocked
                exit 0
              fi
              sleep "$HEAD_POLL_SECONDS"
            done
            echo "::notice::The label was added at ${HEAD_SHA}; ${BRANCH} has moved on to ${tip}, which descends from it, so this run reviews ${tip}."
          fi

          echo "sha=${tip}" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # The review's own time, refused the way the fix-round budget below is:
      # a limit nobody wrote down is not one to guess (#220). `time-limit` summed
      # the default in its place so that this run could start and say so.
      - name: Refuse a time limit that is not a positive integer
        if: steps.state.outputs.proceed == 'true' && needs.time-limit.outputs.refused == 'true'
        env:
          REVIEW_MINUTES: ${{ vars.AGENT_REVIEW_TIMEOUT_MINUTES }}
        run: |
          reason="The repository variable \`AGENT_REVIEW_TIMEOUT_MINUTES\` is \`${REVIEW_MINUTES}\`. It must be a whole number of minutes (1 or more), or delete it to use the default of 5. Then add \`agent:review\` again."
          printf '%s\n' "$reason" > "${RUNNER_TEMP}/refusal_reason.txt"
          echo "::error::${reason}"
          exit 1

      # The fix-round budget (#201, PRD #200): whether this review, if it
      # recommends changes, starts a fix round itself. Settled **before** the
      # review, so the verdict announces a round only where one will start, and
      # the posting job's hand-off starts exactly the rounds announced (the key the
      # runner derives from `start` is the one it selects on). `start` is a
      # ceiling, not a promise: the runner still stops the loop where the fix
      # round this review follows closed none of its findings (#202), and then
      # derives a key nothing selects on.
      #
      # **The budget** is the repository variable `AGENT_MAX_FIX_ROUNDS`,
      # automatic fix rounds per pull request, default 3 and `0` for none. A
      # `vars.*` read in a reusable workflow resolves against the **caller's**
      # repository, which GitHub documents ("the variables from the caller
      # workflow's repository are used", *Reusing workflow configurations*), so
      # an adopter sets it once in their own settings and neither caller set
      # carries a `with:` line for it. `AGENT_MODEL` above was already read the
      # same way. A value that is not a non-negative integer fails the run,
      # naming the variable and the value: guessing a budget out of `three` or
      # `-1` is a loop running a number of rounds nobody wrote down.
      #
      # **The deprecated `auto-fix` input wins** where a caller still passes it,
      # for one release (decision 4): `true` is a budget of 1, `false` of 0.
      #
      # **Rounds spent are counted from the pull request**, not from a marker
      # label: the verdicts this loop posted on its commits whose status is the
      # *fix round started* row, word for word. So the count survives a re-run
      # and a hand edit, and the one-shot marker label #102 kept is retired.
      # Counted once per posted review, by the review URL the status links to,
      # because `update-branch` copies a standing verdict, link and all, on to
      # the merge commit it makes, and a copy is not a second round. A human
      # adding `agent:fix` posts no such verdict, so only automatic rounds count
      # (decision 7), and a push resets nothing.
      #
      # **And no PAT, no round.** A label added with `GITHUB_TOKEN` starts
      # nothing, so without `AGENT_PAT` the verdict asks for the label instead of
      # announcing a round that would never run. The same holds for a count that
      # could not be read: a run that cannot say how many rounds are spent does
      # not start another, and warns.
      - name: Settle the fix-round budget
        id: budget
        if: steps.state.outputs.proceed == 'true'
        env:
          MAX_FIX_ROUNDS: ${{ vars.AGENT_MAX_FIX_ROUNDS }}
          AUTO_FIX: ${{ inputs.auto-fix }}
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          VERDICT_CONTEXT: agent-review
          LOOP_ACCOUNT: github-actions[bot]
          # `VERDICTS["changes recommended, fix round started"].description`,
          # verbatim; a test holds the two equal.
          STARTED: "Changes recommended. The fixes are clear. A fix round has already started; a re-review follows automatically."
        run: |
          set -uo pipefail
          # A refusal rather than a stop (#253): nothing was reviewed, so the
          # failure step says this run didn't run, from its own file.
          refuse() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/refusal_reason.txt"
            echo "::error::$1"
            exit 1
          }

          if [ -n "$AUTO_FIX" ]; then
            case "$AUTO_FIX" in
              true) budget=1 ;;
              false) budget=0 ;;
              *) refuse "The review workflow still sets \`auto-fix\`, which has been replaced. Remove it and set the repository variable \`AGENT_MAX_FIX_ROUNDS\` instead, then add \`agent:review\` again." ;;
            esac
            echo "::warning::The \`auto-fix\` input is deprecated and goes away in the next release. It sets this run's fix-round budget to ${budget}, over the repository variable \`AGENT_MAX_FIX_ROUNDS\`. Remove \`auto-fix\` from the review caller's \`with:\` block and set \`AGENT_MAX_FIX_ROUNDS\` instead: \`1\` is what \`auto-fix: true\` did, and \`0\` what \`false\` did."
          else
            budget="${MAX_FIX_ROUNDS:-3}"
            if [[ ! "$budget" =~ ^[0-9]+$ ]]; then
              refuse "The repository variable \`AGENT_MAX_FIX_ROUNDS\` is \`${MAX_FIX_ROUNDS}\`. It must be a whole number (0 or more), or delete it to use the default of 3. Then add \`agent:review\` again."
            fi
            # Leading zeros stripped, and anything past nine digits held at
            # nine: no pull request is going to spend that many, and bash
            # arithmetic wraps well before an arbitrary digit string ends.
            budget=$(printf '%s' "$budget" | sed 's/^0*//')
            budget="${budget:-0}"
            [ "${#budget}" -le 9 ] || budget=999999999
          fi

          # Every link a *fix round started* verdict of ours carries, one per
          # line, over every commit of the pull request; or a failure, which is
          # not the same answer as none.
          started_links() {
            local commits sha
            commits=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq '.[].sha') || return 1
            for sha in $commits; do
              gh api "repos/${GH_REPO}/commits/${sha}/statuses" --paginate --slurp \
                | jq -r '(add // [])[] | select(.context == env.VERDICT_CONTEXT and .creator.login == env.LOOP_ACCOUNT and .description == env.STARTED) | (.target_url // "status \(.id)")' \
                || return 1
            done
          }

          spent=0
          if [ "$budget" -gt 0 ]; then
            if links=$(started_links); then
              spent=$(printf '%s\n' "$links" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
            else
              spent=""
            fi
          fi

          start=false
          if [ -z "$spent" ]; then
            echo "::warning::Could not count the automatic fix rounds already spent on PR #${PR_NUMBER}, so this review will not start one. GitHub's reply is printed above. Add \`agent:fix\` by hand if the review recommends changes."
          elif [ "$spent" -lt "$budget" ] && [ "$HAS_PAT" = "true" ]; then
            start=true
          fi
          echo "Fix-round budget ${budget}, spent ${spent:-unknown}; an automatic fix round starts on changes recommended: ${start}."
          {
            echo "budget=${budget}"
            echo "spent=${spent}"
            echo "start=${start}"
          } >> "$GITHUB_OUTPUT"

      # The commit the pre-flight settled on, not the payload's (#229). Still an
      # explicit `ref:`, which is what keeps `actions/checkout`'s own fork check
      # on; the job's `if:` is the other half.
      - name: Checkout PR head
        if: steps.state.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.state.outputs.sha }}
          fetch-depth: 0

      - name: Make the PR base available for diffing
        if: steps.state.outputs.proceed == 'true'
        # Create a local ref for the PR's base branch (the checkout is of one
        # commit, so the base is not present). review-context.ts diffs against
        # it; a bare `git fetch origin <ref>` would populate FETCH_HEAD but no
        # named ref, so keep the refspec. Falls back to `main` when base.ref is
        # somehow empty, matching diffCommandAgainstBase's own default.
        #
        # A ref name may legally contain `$()`, backticks, `;`, `|` and `&`, so
        # jeffwlawson/winget-manifest-lint#75 asked whether this line is
        # shell-safe. It is, and the two reasons are both load-bearing — keep
        # them if you edit this:
        #   1. BASE_REF arrives as an `env:` var, NOT as a `${{ }}` interpolated
        #      into the run script. Interpolation would splice the ref into the
        #      script *source*, where it would be parsed as syntax; an env var
        #      is only ever data.
        #   2. `"${BASE_REF}"` expands in one pass. POSIX shells do not re-scan
        #      an expansion result for command substitution or operators — only
        #      word splitting and globbing, which the double quotes suppress.
        #      Verified 2026-08-02 against sh and bash with the values above:
        #      each reached git verbatim as a single argument.
        # So the quotes are not decorative; dropping them, or switching to
        # `${{ github.event.pull_request.base.ref }}` inline, breaks this.
        #
        # The `:-main` this line used to carry is gone, not lost: the fallback
        # moved up to the `env:` block, where it is the `default-branch` input
        # rather than a literal only this repo could be right about.
        run: git fetch origin "+refs/heads/${BASE_REF}:refs/heads/${BASE_REF}"

      # Both setup steps are the adopter's toolchain, so both are skippable.
      # `npm install -g @anthropic-ai/claude-code` below is not: that is the
      # agent's own runtime, and every runner image already has the Node it
      # needs for it.
      - name: Setup Node.js
        if: steps.state.outputs.proceed == 'true' && inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, which `pull_request_target` reads
      # from the base branch, and never an expression reading the PR event.
      - name: Install dependencies
        if: steps.state.outputs.proceed == 'true' && inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        if: steps.state.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Wait for the PR's other checks, then hand their results to the agent.
      #
      # Why: a review running while CI is still going has no evidence beyond the
      # diff, so it reasons from the issue's spec. That is exactly how a review
      # once certified a rule "corpus-safe" 96 seconds before the corpus failed
      # with 13 false positives from that very rule. Waiting alone would not have
      # helped — the *results* have to reach the prompt.
      #
      # This job is itself a check on the PR, so `gh pr checks --watch` would
      # deadlock waiting on itself. Poll the check-runs API excluding our own
      # job name instead. Never fails the run: missing CI context degrades the
      # review, it does not invalidate it.
      #
      # Three surfaces, because each sees something the others cannot: check
      # runs, commit statuses for CI outside Actions, and the commit's workflow
      # runs, which are the only place a run that is queued or waiting for
      # approval shows (#221). The wait ends when nothing it can see is pending,
      # after a short grace period for a run to appear; a run waiting for
      # approval is named and reads `unknown`, and so does a check still running
      # at the ceiling. Neither is green, and neither is a failure.
      #
      # The exclusion is every *agent* job, not just this one, and that became
      # load-bearing when review joined the shared per-PR concurrency group
      # (jeffwlawson/winget-manifest-lint#102). A `fix` labelled while a review
      # is running now sits queued behind it — and a queued job is a check run
      # in a non-completed state, so waiting on it is waiting on a job that
      # cannot start until we finish. The timeout bounds that at the whole
      # 15-minute wait, which is not a bound worth having. They are not CI
      # either way: "fix: queued" is not evidence about the diff.
      - name: Wait for other checks, collect results
        if: steps.state.outputs.proceed == 'true'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.state.outputs.sha }}
          # The sibling agent jobs, which the conversion renamed too: a called
          # workflow's job appears as `<caller job id> / <this workflow's job
          # id>`, so `agent-fix.yml` now produces `fix / fix`. The pattern
          # matches a name whose *either* half is an agent job, because the two
          # halves are owned by different people — the second is a job id in one
          # of these reusable files and cannot change under an adopter, the
          # first is whatever they called their caller job. `^(…)$` alone
          # stopped matching every sibling the moment the loop was split, which
          # put a queued `fix` back in the wait: review would burn the full
          # 900 s on a job that cannot start until review ends, then review on
          # the degraded evidence jeffwlawson/winget-manifest-lint#48 exists to
          # prevent.
          #
          # Still bounded at both ends, which is the point of anchoring at all:
          # `fixtures`, `CI / fix-lint` and `build / fixtures` are repo checks,
          # not agents, and none of them match.
          #
          # `follow-ups` joins the list even though its exclusion is dead at
          # runtime — this wait only runs on an open pull request and that
          # workflow only fires on a closed one (#50). Joining costs one word in
          # one string; carving it out would cost a comment justifying a timing
          # argument that could stop being true.
          #
          # `post-review` is this workflow's posting job (#257), which runs after
          # this one, so a review never waits on its own. But an adopter who
          # renamed the caller job gets `agent-review / post-review`, which
          # nothing else here matches, and it is not evidence about the diff
          # either way. Named `post-review` rather than `post` so the pattern
          # cannot swallow a repository's own CI job called `post`.
          #
          # `advance` is `fix`'s job (#176) that runs after a fix run ends a
          # slice PR's round. A later round on the same head would otherwise
          # read `fix / advance` as CI. `advance-merged` (#209) is this
          # workflow's hand-merge twin, named in its own right: the alternation
          # is anchored on `( / |$)`, so `advance` does not match a name that
          # goes on past it.
          #
          # `time-limit` (#220) runs *before* this job, so it has finished by the
          # time this wait reads anything. Named all the same, for the reason
          # `post-review` is: under a renamed caller job it is `agent-review /
          # time-limit`, and a job that sums two numbers is not CI.
          AGENT_CHECKS: '(^|/ )(review|time-limit|post-review|advance|advance-merged|fix|follow-ups|update-branch|implement-prd|implement)( / |$)'
          # This job's own check run, named the same way. Overlapping with the
          # pattern above is deliberate, not redundant: that one is a heuristic
          # over names nobody declares, and this is the exact answer the caller
          # was made to state. Self-exclusion is the case with no error to read
          # when it is wrong, so it does not get to depend on a regex. Compared
          # as a literal via jq's `env`, never folded into that regex — a job
          # id is not a regex, and a `.` in one would quietly match a
          # neighbouring check too.
          SELF_CHECK: ${{ inputs.self-check }}
          # The verdict's own context, excluded from the commit statuses this
          # step reduces to a word — see the arm that reads them. Spelled out
          # here rather than read from the runner: this step runs long before
          # the runner does, and a test holds the literal to `VERDICT_CONTEXT`.
          VERDICT_CONTEXT: agent-review
          # This run's id, which the workflow-runs read drops as itself (#221).
          # The caller's run, since a called workflow contributes none of its
          # own. Through `env:` like the rest, never interpolated into the script.
          SELF_RUN_ID: ${{ github.run_id }}
          # The ceiling, and not a fixed wait: the loop ends as soon as nothing
          # it can see is pending. Reaching it reads `unknown`, never `red`.
          WAIT_SECONDS: "900"
          # How long the wait keeps looking when no CI has reported at all,
          # because a run is created a moment after the push that starts it
          # (#221). Never longer than `WAIT_SECONDS`.
          GRACE_SECONDS: "60"
          POLL_SECONDS: "20"
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/ci_status.md"
          # Whatever the last `gh`/`jq` attempt wrote to stderr — the count's,
          # and then the listing's, each truncating it before it runs. Kept out
          # of the evidence — the agent cannot act on it — and out of the log
          # too until a failure arm fires, at which point it is the only thing
          # that separates the causes those arms now have.
          err="${RUNNER_TEMP}/ci_status.err"
          : > "$out"

          # Prints exactly one number, or nothing at all when the API call
          # fails, and never fails itself. All three are load-bearing.
          #
          # `--slurp` is what makes it one number. `--paginate --jq` applies
          # the filter *per page*, so a commit with more than one page of
          # check runs (>30, the endpoint default) prints `0\n0` — several
          # counts, no total. Slurped, the pages arrive as one array and the
          # filter runs once over all of them.
          #
          # The filter is a **pipe into standalone jq**, not gh's `--jq`, and
          # it has to be: gh refuses the two together — "the `--slurp` option
          # is not supported with `--jq` or `--template`" — at flag-parse time,
          # before any request. Written as one gh invocation it shipped in
          # v0.1.5 and collected no evidence at all for a day (#28). Nothing
          # caught it because everything checking it matched *text*; what
          # covers it now runs the step (tests/review-ci-wait.test.ts).
          #
          # Printing nothing on failure is what makes the caller's
          # non-numeric arm mean "the API did not answer". This used to fall
          # back to a literal zero, which turned a failure into a plausible
          # count: a clean non-zero exit became "nothing pending" and the
          # review ran blind, and a 403 whose body reached stdout became
          # `{"message":…}0`, which `-eq` rejects every iteration until the
          # deadline. Both had the same trigger — check runs on a private
          # repository need `checks: read`, granted on this job above.
          #
          # Which is why the count is gated on gh's **exit status** and not on
          # what it printed. Under `--slurp` a failed request still writes
          # JSON: `[]` for a connection failure, and `[{"message":"Resource
          # not accessible by integration",…}]` for that same 403 (recorded
          # from gh 2.100.0). The first of those counts, through this filter,
          # as a perfectly plausible zero — the old lie with a new source.
          #
          # `|| return 0` and `|| true` are both there because GitHub runs a
          # `run:` block carrying no `shell:` under `bash -e`: a non-zero gh
          # inside `$( )` ends the step where it stands, ahead of the arm
          # below that exists to report exactly that. The agent then gets an
          # empty file and reviews saying "no checks reported" — the same
          # blindness, minus the diagnosis. That is what v0.1.5 did.
          #
          # Both halves send stderr to `$err` rather than `/dev/null`, because
          # the arm below no longer has one cause. It fires for a non-zero gh,
          # for a jq filter error, and for no `jq` on the runner at all — and
          # the grant its `::error::` names is the one thing it cannot be: a
          # caller short of `checks: read` is refused before any job starts
          # (#146), so a poll that ran holds the read. Discarding the stderr is
          # how the invocation gh refuses stayed invisible for a release; the
          # arm prints whatever landed here underneath it, which is the only
          # thing that tells the three apart.
          pending_count() {
            : > "$err"
            body=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate --slurp 2>"$err") || return 0
            printf '%s' "$body" \
              | jq "[.[].check_runs[] | select(.name != env.SELF_CHECK) | select(.name | test(\"${AGENT_CHECKS}\") | not) | select(.status != \"completed\" and .status != \"waiting\")] | length" \
              2>>"$err" || true
          }

          # The same count over the **other** CI surface (#107): commit
          # statuses still `pending`, minus `agent-review` — this job's own
          # output, the answer it has not written yet. Without this a review
          # that starts before status-based CI finishes reads that CI as
          # pending, and the verdict asks for a human on a pull request that
          # would have been ready a minute later. Combined endpoint for the
          # reason the verdict's read below gives: one state per context.
          #
          # Same shape as `pending_count` — one number or nothing, gated on
          # gh's exit status — but *nothing* here is not the blind arm below.
          # That arm is about check runs, and names them; a status read that
          # failed is reported by the verdict's own read of the same endpoint
          # further down, with its stderr, and reads as `unknown` there. So the
          # wait counts an unreadable status half as zero rather than spinning
          # on it, and its stderr goes to a file of its own so it cannot
          # clobber the check-run count's.
          pending_statuses() {
            body=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/status" --paginate --slurp 2>"${err}.status") || return 0
            printf '%s' "$body" \
              | jq "[.[].statuses[] | select(.context != env.VERDICT_CONTEXT) | select(.state == \"pending\")] | length" \
              2>>"${err}.status" || true
          }

          # The third CI surface (#221): this commit's **workflow runs**, which
          # see what neither of the two above can. A run that is queued, or
          # waiting for approval, has created no check run yet, so a wait over
          # check runs and statuses alone saw nothing, ended at once, and called
          # the commit green with no CI having run. Since 2026-06-11 a push made
          # with `GITHUB_TOKEN` starts `pull_request` runs that **wait for
          # approval**, and that is the loop's own no-`AGENT_PAT` fallback.
          #
          # The loop's own runs are dropped, on `AGENT_CHECKS`'s grounds and
          # three ways, each for a case the others miss: this run by its id (the
          # caller's, since a called workflow contributes no run of its own), an
          # `Agent …` workflow by its name, as the failure-log tail always has,
          # and a renamed caller by what it calls, which is how `init` and
          # `doctor` recognise one too.
          #
          # A run is `awaiting` when it needs a maintainer to approve it
          # (`action_required`, as a status or a conclusion) or a protection
          # rule holds it (`waiting`). Neither is pending: it cannot start until
          # a human acts, so waiting for it would spend the whole ceiling on
          # nothing. The same goes for a job in it whose check run is `waiting`
          # on an environment's reviewers, which `pending_count` skips for that
          # reason; the verdict below still reads it as unfinished.
          #
          # A run is `failed` when it completed with any conclusion a check run
          # would read as red, approval aside. Most of those also fail a check
          # run, but not all: a `startup_failure` (a workflow file GitHub could
          # not run) creates no job, so no check run, and is seen here or nowhere.
          ci_runs_filter='[.[].workflow_runs[]
            | select((.id | tostring) != env.SELF_RUN_ID)
            | select((.name // "") | startswith("Agent ") | not)
            | select(any(.referenced_workflows[]?; (.path // "") | test("^[^/]+/agent-workflows/\\.github/workflows/")) | not)
            | {id, name, status, conclusion, html_url,
               awaiting: (.status == "action_required" or .status == "waiting" or .conclusion == "action_required"),
               failed: (.status == "completed" and (.conclusion // "" | IN("success", "neutral", "skipped", "action_required") | not))}]'

          # The filtered runs as one JSON array, or nothing when the read
          # fails. Gated on gh's exit status, and slurped, for the reasons
          # `pending_count` gives. *Nothing* reads as no run pending, as an
          # unreadable status half does: the read after the wait reports it.
          ci_runs() {
            body=$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" --paginate --slurp 2>"${err}.runs") || return 0
            printf '%s' "$body" | jq -c "$ci_runs_filter" 2>>"${err}.runs" || true
          }

          # Whether anything that is CI has reported on this commit at all, on
          # any of the three surfaces: what the grace period below waits for.
          # Only asked while nothing is pending, so it costs no call on a commit
          # whose CI is running. A read that fails counts as nothing seen, which
          # at worst spends the rest of the grace period looking again.
          ci_seen() {
            seen_checks=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate --slurp 2>/dev/null \
              | jq "[.[].check_runs[] | select(.name != env.SELF_CHECK) | select(.name | test(\"${AGENT_CHECKS}\") | not)] | length" 2>/dev/null) || seen_checks=0
            seen_statuses=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/status" --paginate --slurp 2>/dev/null \
              | jq "[.[].statuses[] | select(.context != env.VERDICT_CONTEXT)] | length" 2>/dev/null) || seen_statuses=0
            seen_runs=$(printf '%s' "$runs" | jq 'length' 2>/dev/null) || seen_runs=0
            for n in "$seen_checks" "$seen_statuses" "$seen_runs"; do
              case "$n" in
                "" | 0 | *[!0-9]*) ;;
                *) return 0 ;;
              esac
            done
            return 1
          }

          # A run is created a moment after the push that starts it, so a review
          # that begins first would see no CI at all and say so. The grace
          # period is how long the wait keeps looking before it believes that,
          # never longer than the wait itself.
          started=$(date +%s)
          deadline=$(( started + WAIT_SECONDS ))
          grace=$(( started + (GRACE_SECONDS < WAIT_SECONDS ? GRACE_SECONDS : WAIT_SECONDS) ))
          while :; do
            pending=$(pending_count)
            statuses_pending=$(pending_statuses)
            case "$statuses_pending" in
              "" | *[!0-9]*) statuses_pending=0 ;;
            esac
            runs=$(ci_runs)
            runs_pending=$(printf '%s' "$runs" | jq '[.[] | select(.status != "completed" and (.awaiting | not))] | length' 2>/dev/null)
            case "$runs_pending" in
              "" | *[!0-9]*) runs_pending=0 ;;
            esac

            # Not a number — the API call failed rather than returning a
            # count. Say so once, loudly, and stop: waiting cannot fix a
            # permission error, and spinning to the deadline turns a
            # diagnosable 403 into fifteen quiet minutes. The step stays
            # `continue-on-error`, so the review still runs; what changes is
            # that both the log and the agent's evidence say it is blind.
            case "$pending" in
              "" | *[!0-9]*)
                echo "::error::Could not read check runs for ${HEAD_SHA}. It is not the caller's \`checks: read\` grant: a caller granting less than this job declares fails the run before any job starts, so a token that got this far holds the read (jeffwlawson/agent-workflows docs/ADOPTING.md §4). Reviewing without CI evidence."
                # `if`, not `[ -s … ] && …`: under `bash -e` a test that fails
                # as the last command of this arm ends the step, which is the
                # defect this whole block was rewritten to stop doing.
                if [ -s "$err" ]; then
                  echo "…and this is what \`gh\`/\`jq\` said, which is the part that tells the three apart:"
                  cat "$err"
                fi
                echo "_Could not read this commit's check runs, so the review below has no CI evidence._" >> "$out"
                break
                ;;
            esac

            # After the arm above, not before it: a sum would turn a failed
            # check-run read into a plausible number.
            #
            # Runs are counted apart from checks, not summed into them: a
            # running workflow has running check runs too, so one sum would
            # count most CI twice.
            pending=$(( pending + statuses_pending ))
            if [ "$pending" -eq 0 ] && [ "$runs_pending" -eq 0 ]; then
              # `if`, not `&& continue`, on the `bash -e` grounds of the arm above.
              if [ "$(date +%s)" -lt "$grace" ] && ! ci_seen; then
                echo "No CI has reported on this commit yet; looking again for up to ${GRACE_SECONDS} s in case a run is still being created…"
                sleep "$POLL_SECONDS"
                continue
              fi
              break
            fi
            # The ceiling is not a failure (#221). A check still running has
            # not failed, so this reads `unknown` below rather than `red`, and
            # the evidence says what it was rather than that something broke.
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "_Still running after $(( WAIT_SECONDS / 60 )) minutes: ${pending} check(s) and ${runs_pending} workflow run(s) had not finished, so CI is unknown here rather than failed, and the results below may be incomplete._" >> "$out"
              break
            fi
            echo "Waiting for ${pending} check(s) and ${runs_pending} workflow run(s)…"
            sleep "$POLL_SECONDS"
          done

          # Slurped and piped for the same reason as the count, and `jq -r` to
          # match what gh's own `--jq` does with a string result: print it
          # unquoted. Without `-r` every line reaches the agent wrapped in
          # quotes it would have to read past.
          #
          # Stderr goes to `$err` here for the same reason it does in the
          # count, and it is a separate failure: this call can fail on a run
          # where the count succeeded — a transient 5xx, a secondary rate
          # limit, a later change to this filter alone — and the count's arm
          # never fires to explain it. Without this the agent would be handed
          # `- (could not read check runs)` and the log would say nothing at
          # all about why. Discarding the stderr is the habit that hid #28 for
          # a release; it does not get to survive three lines below the fix.
          #
          # `if !`, not `|| { …; [ -s … ] && cat …; }`, on the same grounds as
          # the arm above: under `bash -e` a test as the last command of the
          # arm ends the step, which is the defect this block was rewritten to
          # stop doing.
          echo "Checks on this commit:" >> "$out"
          : > "$err"
          if ! gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate --slurp 2>"$err" \
            | jq -r ".[].check_runs[] | select(.name != env.SELF_CHECK) | select(.name | test(\"${AGENT_CHECKS}\") | not) | \"- \(.name): \(.conclusion // .status)\"" \
            2>>"$err" >> "$out"; then
            echo "- (could not read check runs)" >> "$out"
            echo "::warning::Could not list check runs for ${HEAD_SHA}, so the review's check list is empty. It is not the \`checks: read\` grant, which a run that started holds. See what \`gh\`/\`jq\` said below."
            if [ -s "$err" ]; then
              cat "$err"
            fi
          fi

          # The same check runs again, as **one word** this time: the CI half of
          # the verdict the runner derives (#96).
          #
          # Separate from the evidence above on purpose. That file is prose for
          # the agent — notes, failure logs, whatever the listing managed — and
          # a derivation that parsed it would be a second description of a
          # format written three lines up, drifting from it on the release that
          # edits either. This reads `.conclusion` from the API instead, with
          # the same two exclusions: a queued sibling agent job is not a red
          # check, and this job's own run is not evidence about the diff.
          #
          # Three values, and `unknown` is not folded into `red`: a review that
          # could not see the checks has not seen a failure, it has seen
          # nothing. Both send a finding-free review to a human — the
          # derivation reads anything but `green` that way — and they say
          # different things about why. A step that dies before writing the
          # file leaves no file at all, which the runner reads as `unknown`
          # too.
          #
          # A check that has not *passed* is not green, and one that has not
          # *finished* has not failed either (#221): a still-pending one (the
          # ceiling above) is `unknown`, so the evidence and the word both say
          # it was still running. A failure seen beside it still reads `red`.
          # A commit with no other checks at all is `none`,
          # which the arm below the statuses turns into a word: green on an
          # ordinary pull request — there is nothing failing, which is the
          # honest reading for an adopter whose repository runs none — and not
          # on a slice PR (#175).
          #
          # `if !` rather than `|| { … }` on the same grounds as the arms above:
          # under `bash -e` a test as the last command of the arm ends the step.
          : > "$err"
          if ! checks=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate --slurp 2>"$err" \
            | jq -r "[.[].check_runs[] | select(.name != env.SELF_CHECK) | select(.name | test(\"${AGENT_CHECKS}\") | not) | {status, conclusion}] | if length == 0 then \"none\" elif any(.status == \"completed\" and (.conclusion | IN(\"success\", \"neutral\", \"skipped\") | not)) then \"red\" elif any(.status != \"completed\") then \"unknown\" else \"green\" end" \
            2>>"$err"); then
            checks=unknown
            echo "::warning::Could not decide whether this commit's check runs are green, so the verdict below will ask for a human rather than claim the pull request is ready. See what \`gh\`/\`jq\` said below."
            if [ -s "$err" ]; then
              cat "$err"
            fi
          fi

          # And the **other** CI surface, which check runs are not (#105). A
          # repository whose CI reports through the commit-status API — most
          # things outside Actions, and every `create-status` integration — has
          # no check run to read at all, so a derivation over check runs alone
          # calls that commit green and can recommend approving a red one.
          #
          # `agent-review` is excluded by context, and that exclusion is the
          # whole reason this can be read at all: it is the context this very
          # job posts the verdict under, so counting it would make a `failure`
          # verdict on the previous round part of the evidence for the next one
          # — and every "changes recommended" would derive "needs a closer look"
          # one round later, by reading its own answer back.
          #
          # `pending` is `unknown` for the reason a queued check run is: a
          # status that has not passed has not passed, and one that has not
          # finished has not failed. This step has already spent its wait.
          #
          # The combined endpoint rather than the per-post list, because it
          # returns the latest status per context — the list returns one entry
          # per *post*, and a context that went `pending → success` would be
          # read as both.
          : > "$err"
          if ! commit_statuses=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/status" --paginate --slurp 2>"$err" \
            | jq -r "[.[].statuses[] | select(.context != env.VERDICT_CONTEXT) | .state] | if length == 0 then \"none\" elif any(. == \"failure\" or . == \"error\") then \"red\" elif any(. == \"pending\") then \"unknown\" else \"green\" end" \
            2>>"$err"); then
            commit_statuses=unknown
            echo "::warning::Could not read this commit's statuses, so the verdict below will ask for a human rather than claim the pull request is ready. See what \`gh\`/\`jq\` said below."
            if [ -s "$err" ]; then
              cat "$err"
            fi
          fi

          # And the **workflow runs** (#221), read once more for the word, for the
          # evidence and for the failure-log tail below. This is the only
          # surface on which a run waiting for approval shows at all, so it is
          # the one that keeps such a commit from reading green: a run that
          # never started has failed nothing and passed nothing, and the
          # evidence names it with a link a maintainer can approve it from.
          #
          # A run that completed without passing is `red` here as well as in the
          # check runs, because not every such run has a check run to fail: a
          # `startup_failure` creates no job at all, and with no statuses either
          # it would otherwise read as no CI, and green. Each one is named with
          # its conclusion. A run still going at the ceiling is `unknown`, as a
          # check run is.
          #
          # Unreadable is `unknown` rather than skipped: green needs every
          # surface to have answered, and a run waiting for approval would be
          # missing from the other two without a word. It is not the grant:
          # the job declares `actions: read`, so a caller short of it is refused
          # before any job starts (#146).
          : > "${err}.runs"
          if ! runs=$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" --paginate --slurp 2>"${err}.runs" \
            | jq -c "$ci_runs_filter" 2>>"${err}.runs"); then
            runs="[]"
            workflow_runs=unknown
            echo "::warning::Could not list this commit's workflow runs, so a run waiting for approval could not be seen and the review has no failure-log output. It is not the \`actions: read\` grant, which a run that started holds. What \`gh\`/\`jq\` said is below."
            if [ -s "${err}.runs" ]; then
              cat "${err}.runs"
            fi
            echo "_Could not list this commit's workflow runs, so a run waiting for approval or still going could not be seen here, and failure-log output is missing rather than absent._" >> "$out"
          else
            workflow_runs=$(printf '%s' "$runs" | jq -r 'if length == 0 then "none" elif any(.failed) then "red" elif any(.awaiting or .status != "completed") then "unknown" else "green" end')
            failed=$(printf '%s' "$runs" | jq -r '.[] | select(.failed) | "- \(.name): \(.conclusion), \(.html_url)"')
            if [ -n "$failed" ]; then
              {
                echo
                echo "_Workflow runs that did not pass:_"
                echo "$failed"
              } >> "$out"
            fi
            awaiting=$(printf '%s' "$runs" | jq -r '.[] | select(.awaiting) | "- \(.name): waiting for approval, \(.html_url)"')
            if [ -n "$awaiting" ]; then
              echo "::warning::A CI run on this commit is waiting for approval, so CI is unknown here rather than green."
              {
                echo
                echo "_CI waiting for approval: these runs have not run, so CI is unknown here rather than green. A push made with \`GITHUB_TOKEN\` starts runs that wait for a maintainer to approve them (jeffwlawson/agent-workflows docs/ADOPTING.md §1)._"
                echo "$awaiting"
              } >> "$out"
            fi
          fi

          # **No CI at all** (`none` from every surface) is green everywhere
          # but a slice PR (#175). A slice PR's base is a PRD branch, not the
          # default branch, so an adopter's CI that filters `pull_request` to
          # the default branch never runs on one. Green there would let a clean
          # review recommend approving code no CI ran on, and on a slice PR that
          # verdict is what moves the chain onto the next slice. `unknown`
          # sends the review to a human instead, and the evidence says why and
          # where the one-line fix is.
          #
          # Every surface, not check runs alone: a slice PR whose CI reports only
          # through commit statuses had CI run on it. A slice branch is named
          # by `implement-prd`'s *Prepare the slice branch* step.
          #
          # On an ordinary pull request the word stays green (PRD #171, story
          # 58), so an adopter with no CI anywhere is unchanged, but the
          # evidence says plainly that nothing ran (#221): "no failures" is not
          # "CI passed", and the agent is told which one it is reading.
          if [ "${checks}/${commit_statuses}/${workflow_runs}" = "none/none/none" ]; then
            case "$BRANCH" in
              agent/slice-*)
                checks=unknown
                commit_statuses=unknown
                no_ci="No CI ran on this slice PR: nothing but the loop's own jobs reported on this commit. A slice PR's base is its PRD branch, so a CI workflow that filters \`pull_request\` to the default branch does not run on it. Add \`agent/prd-**\` to that filter's \`branches:\` (jeffwlawson/agent-workflows docs/ADOPTING.md §5, *Slice PRs and your CI*). Until then CI is unknown here, not green, so a clean review asks for a human rather than advancing the chain."
                echo "::warning::${no_ci}"
                echo "_${no_ci}_" >> "$out"
                ;;
              *)
                echo "_No CI ran on this commit: nothing but the loop's own jobs reported on it, so there are no CI results to read here, passing or failing._" >> "$out"
                ;;
            esac
          fi
          if [ "$checks" = none ]; then
            checks=green
          fi
          if [ "$commit_statuses" = none ]; then
            commit_statuses=green
          fi
          if [ "$workflow_runs" = none ]; then
            workflow_runs=green
          fi

          # One word out of three, and `red` beats `unknown`: a failure that was
          # seen is more than another surface failing to be read, and the three
          # fail independently. `green` needs every one to have answered it.
          case "${checks}/${commit_statuses}/${workflow_runs}" in
            red/* | */red/* | */red) ci_result=red ;;
            unknown/* | */unknown/* | */unknown) ci_result=unknown ;;
            *) ci_result=green ;;
          esac
          echo "$ci_result" > "${RUNNER_TEMP}/ci_result.txt"
          echo "Checks on this commit are: ${ci_result} (check runs ${checks}, commit statuses ${commit_statuses}, workflow runs ${workflow_runs})."

          # Tail the failing steps so the agent sees *what* failed, not merely
          # that something did. Capped so a noisy failure cannot swamp the prompt.
          #
          # Read off the workflow runs listed above, so excluded on the same
          # grounds and by the same filter: a failed `Agent Fix` says nothing
          # about this diff, and its 60 lines crowd out the CI failure that does.
          # A listing that failed lists nothing here and has already said so in
          # the evidence; one that answered with no failed run adds nothing.
          #
          # These logs used to be a private repository's to withhold: the job
          # did not declare `actions: read`, on the grounds that a run log can
          # carry an accidentally echoed secret and a log tail is not worth that
          # (#80). The grant is declared now, because seeing a run that waits
          # for approval needs it (#221), so the tail reads private logs too,
          # on the failed runs of the repository's own CI only.
          failed_runs=$(printf '%s' "$runs" | jq -r '.[] | select(.conclusion == "failure") | .id' 2>/dev/null) || failed_runs=""
          for rid in $failed_runs; do
            rname=$(printf '%s' "$runs" | jq -r --arg id "$rid" '.[] | select((.id | tostring) == $id) | .name' 2>/dev/null) || rname=""
            rname="${rname:-run ${rid}}"
            # `|| echo` on the same grounds as the count above, and it is the
            # same bug: `gh run view --log-failed` exits non-zero whenever a
            # failed run's logs cannot be had — expired, still uploading, a
            # token without `actions: read` — and with `pipefail` under
            # `bash -e` that failing *pipeline* ends the step, inside a group
            # already redirected to `$out`. The step is `continue-on-error`, so
            # nothing goes red; the agent simply never gets the runs after this
            # one, nor the `--- collected CI context ---` dump, and the
            # truncation is silent. Same blindness as #28, one loop further on.
            {
              echo
              echo "### Failure output: ${rname}"
              echo '```'
              gh run view "$rid" --log-failed 2>/dev/null | sed 's/^[^Z]*Z //' | tail -60 \
                || echo "(no failure log available for run ${rid})"
              echo '```'
            } >> "$out"
          done

          echo "--- collected CI context ---"
          cat "$out"

      # The runner package is published to **GitHub Packages**, not npmjs, so the
      # `npx` below resolves from `https://npm.pkg.github.com` and needs a token.
      # `actions/setup-node` writes the `.npmrc` rather than this file doing it by
      # hand — a hand-written one is a second place for the scope to be wrong, and
      # the way it is wrong is a 401 that reads like a bad token.
      #
      # Two properties to keep if you edit this. The registry entry is scoped to
      # `@jeffwlawson` **only**, so a caller's own `npm ci` still resolves
      # everything else from npmjs untouched. And `NODE_AUTH_TOKEN` is
      # unconditional: GitHub Packages has no anonymous install *even for a public
      # package*, so the caller's `packages: read` is a grant this step cannot do
      # without, rather than a consequence of the package's visibility.
      #
      # No `node-version-file` here on purpose: this is the registry half of
      # `setup-node`, not the toolchain half, so it still runs on a repo that
      # passed `node-version-file: ''`. It comes *after* the toolchain step for
      # the same reason — both write the same `.npmrc`, and the last one wins.
      #
      # `package-manager-cache: false` states that same thing to the action.
      # From v5 it caches on its own when the repository's `package.json`
      # carries a `packageManager` field, and the input that switches that off
      # has defaulted to `true` since that same release; v6 and v7 only widen
      # the detection to `devEngines.packageManager`. So a step written to do no
      # toolchain work starts doing some. On an adopter whose manifest names npm
      # with no root lockfile, the restore throws `Dependencies lock file is not
      # found` and fails this step before the runner exists to write
      # `failure_reason.txt`, leaving a run that says only `(no reason file
      # written)`. It would also add a cache *save* to a `pull_request_target`
      # job.
      #
      # It was written at the `@v4` pin, which had no such input, and was inert
      # on purpose — the guard the bump lands on rather than a response to it.
      # At the `@v7` pin above the input exists and is honoured. It still
      # changes no behaviour *here*: this repo declares only `engines`, never
      # `packageManager`, so the caching it switches off would never have fired.
      # The step this protects is an adopter's, and this repo cannot reproduce
      # the failure — which is the reason it is asserted rather than observed
      # (`tests/workflows.test.ts`).
      #
      # This is also the one step in the loop that reaches across repositories. A
      # package published from this repo is not automatically readable by another
      # repo's `GITHUB_TOKEN`; that follows from the package's own access settings
      # (docs/ADOPTING.md §4).
      - name: Authenticate to GitHub Packages
        if: steps.state.outputs.proceed == 'true'
        uses: actions/setup-node@v7
        with:
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      - name: Run review agent
        if: steps.state.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Reads the `.npmrc` the step above wrote. `GITHUB_TOKEN`, carrying the
          # `packages: read` the caller granted — there is no anonymous install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_REVIEW: ${{ vars.AGENT_MODEL_REVIEW }}
          OUTPUT_DIR: ${{ runner.temp }}
          CI_STATUS_FILE: ${{ runner.temp }}/ci_status.md
          # The evidence and the fact are two files, not one. The first is what
          # the agent reads; the second is what the verdict is derived from, and
          # keeping them apart is what stops the derivation reading prose.
          CI_RESULT_FILE: ${{ runner.temp }}/ci_result.txt
          # What *Settle the fix-round budget* decided (#201): whether an
          # automatic fix round starts if this review recommends changes, and
          # the budget and rounds spent it decided from. The derivation adds
          # whether the fix round this review follows made progress (#202),
          # judged from the verdict history and the findings' ids, and picks the
          # verdict row whose key the posting job's hand-off selects on, so the
          # line a maintainer reads and the step that makes it true come from
          # one decision. The two numbers are for the line alone:
          # where the budget is spent, the verdict says how much of it was used.
          AUTO_FIX: ${{ steps.budget.outputs.start }}
          FIX_ROUNDS_SPENT: ${{ steps.budget.outputs.spent }}
          FIX_ROUND_BUDGET: ${{ steps.budget.outputs.budget }}
        # `npm exec --prefix` rather than a bare `npx`, and the prefix is the
        # whole point. `npx pkg@version` reuses a package already present in the
        # working directory when it satisfies the spec — and in the repository
        # that *publishes* this package, the checkout is such a package. It has
        # no `dist/` (CI installs, it does not build), so the bin resolves to
        # nothing and the step dies `command not found` before any runner code
        # runs (#8). Installing into RUNNER_TEMP sidesteps the name collision.
        #
        # A no-op for every consuming repo, which has no package of this name to
        # collide with — verified against npm 10 and 11, both of which ignore
        # `--ignore-existing` here. `--prefix` moves the *install*, not the
        # process `cwd`: the runner still does its git work in the checkout.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.7.4 -- agent-workflows review

      # The verdict as something the posting job can select on (#102). The
      # **key**, not the heading: two rows share a heading and the automatic fix
      # fires on exactly one of them, so a selector on anything but the key
      # would fire on both.
      #
      # An output as well as a file in the artifact, because the posting job's
      # step `if:`s read it, and a step `if:` can read `needs` but not a file.
      # A run that wrote no file hands over nothing, and nothing is handed off,
      # which is the same direction every arm here fails in.
      - name: Hand the verdict to what reads it
        id: verdict
        if: steps.state.outputs.proceed == 'true' && success()
        run: |
          file="${RUNNER_TEMP}/verdict.json"
          [ -f "$file" ] || { echo "No verdict file; nothing to hand over."; exit 0; }
          jq -r '"verdict=\(.verdict)"' "$file" >> "$GITHUB_OUTPUT"

      # Everything the runner wrote for posting, handed to the posting job
      # (#257): the review payload and the body's parts, the verdict, the
      # threads this review closed, and the follow-ups marker's file. A job
      # cannot read another job's `RUNNER_TEMP`.
      #
      # **An artifact rather than an output**, for size. The payload is the
      # body, up to GitHub's 64 KB, plus a thread per finding, and an output
      # reaches the posting job's script as an environment variable, which
      # Linux caps at 128 KB a string: a long review would fail at `exec`, and
      # a short one would not show it. The small decisions stay outputs above.
      #
      # `overwrite`, so a re-run of every job replaces this attempt's copy
      # rather than failing on the name. Uploading needs no scope: the artifact
      # service takes the runner's own token, so this job stays read-only.
      - name: Hand the review to the posting job
        if: steps.state.outputs.proceed == 'true' && success()
        uses: actions/upload-artifact@v7
        with:
          name: agent-review
          path: |
            ${{ runner.temp }}/review_payload.json
            ${{ runner.temp }}/review_body.json
            ${{ runner.temp }}/verdict.json
            ${{ runner.temp }}/thread_resolutions.json
            ${{ runner.temp }}/follow_ups.md
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # How this run ended, for the posting job's failure comment (#257), which
      # is where the comment is posted now that this job writes nothing.
      # `always()`, so a failed, refused, cancelled or timed-out run hands it
      # over too: those are the runs it is for.
      #
      # Cancelled is not failed (#220), and a job that reached its limit is
      # cancelled too. What tells the two apart is the clock the first step
      # started: a timed-out job ran its whole limit, less the moment the runner
      # took to reach that step, hence a minute's slack. Measured here because
      # only this job's clock knows. The limit is compared only where it is a
      # positive integer: `fromJSON` accepts `1.5` and `1e1`, which bash
      # arithmetic refuses, and a limit this cannot compare reads as a cancel,
      # which is still said.
      #
      # The two reasons cross as multi-line outputs, under a delimiter nothing
      # in a reason can contain.
      - name: Hand the outcome to the posting job
        id: outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TIMEOUT_MINUTES: ${{ needs.time-limit.outputs.minutes }}
        run: |
          timed_out=false
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "${JOB_STARTED:-}" ] && [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] && [ $(( $(date +%s) - JOB_STARTED )) -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
            timed_out=true
          fi
          echo "timed-out=${timed_out}" >> "$GITHUB_OUTPUT"
          for name in failure_reason refusal_reason; do
            file="${RUNNER_TEMP}/${name}.txt"
            [ -f "$file" ] || continue
            delimiter="REASON_$(date +%s%N)_${RANDOM}"
            {
              echo "${name//_/-}<<${delimiter}"
              printf '%s\n' "$(cat "$file")"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          done

  # Everything this run writes, in one job that runs no model (#257). The review
  # job above reads and decides; this job posts, in the loop's one order for
  # every workflow, settled with the maintainer 2026-09-30: **label on, do the
  # work, post every result, take your own label off, add the next step's
  # label.** So the timeline reads in order, and a hand-off never appears
  # before the step it follows has finished:
  #
  #  1. reply to and resolve the earlier findings the review ruled on;
  #  2. post the review, the overview and the new findings in one call, its
  #     *Resolved since last review* listing only the threads step 1 actually
  #     resolved;
  #  3. the `agent:follow-ups` marker and the `agent-review` verdict status;
  #  4. mark the pull request ready, unless a fix round is about to start;
  #  5. take `agent:review` off;
  #  6. hand off: `agent:review` again where the head moved during the run,
  #     else `agent:fix` where the verdict announced a round, else the PRD
  #     chain's advance on a slice PR.
  #
  # And on a failure, or a refusal that needs a maintainer: the comment, then
  # `agent:review` off, then `agent:blocked`.
  #
  # Until #257 these were four jobs. The review job posted the overview, and a
  # `resolve` job resolved the threads afterwards (on #228 the overview landed
  # at 00:18:39 and the replies from 00:18:53), so the overview's *Resolved*
  # section was posted before anything was resolved, and claimed closures that
  # never happened wherever the resolve failed, as on #133. `auto-fix` and
  # `advance` each repeated the guards and waited on the others' results.
  #
  # **The scopes are the union the three jobs held**, plus the status write
  # the review job held, which is why no caller changed: `contents: write`,
  # because `resolveReviewThread` is refused on an installation token without
  # it, and `addPullRequestReviewThreadReply` beside it is not (confirmed
  # 2026-09-24 on a scratch pull request, run 36057777753: the job with
  # `contents: read` was refused FORBIDDEN, the job with `contents: write`
  # resolved); `pull-requests: write` for the review, the comments and the
  # labels; `statuses: write` for the verdict.
  #
  # **Why the write scopes are safe here.** This job checks nothing out,
  # installs nothing and runs no model. What it posts is what the review job
  # wrote, through fixed `gh` calls and one fixed GraphQL request whose body is
  # a file: the review payload, the thread ids the runner handed over
  # (`verifyCarried` dropped every id it had not), and the replies it
  # composed. So `contents: write` reaches a job that has nothing to write
  # with, and `AGENT_PAT`, spent only on the labels something fires on and on
  # marking the pull request ready, stays out of the job that reads untrusted
  # pull-request content.
  #
  # **The cost of a short grant is the whole run**, not this job. A caller's
  # `permissions:` is the ceiling for every job it calls, and GitHub refuses an
  # elevation rather than trimming it: a called job asking for more than its
  # caller granted fails the **whole run** before any job starts, as a
  # `startup_failure` with no job log in it. Probed on a real token (#146).
  # What GitHub calls it is an *invalid workflow file*, annotated on the run
  # page as:
  #
  #   Invalid workflow file: .github/workflows/agent-review.yml#L<the caller's
  #   `uses:` line> — Error calling workflow
  #   '<owner>/<repo>/.github/workflows/review.yml@<sha>'. The nested job
  #   'post-review' is requesting 'contents: write', but is only allowed
  #   'contents: read'.
  #
  # `gh run view` reports it only as "a workflow file issue" and names neither
  # the scope nor the file, so the annotation is the one place it is legible.
  # The line it points at is the caller's `uses:`, not the `permissions:` line
  # that is short, and the job it names is the **called** one; docs/ADOPTING.md
  # §4 writes the same annotation and says the same two things about reading it.
  post-review:
    needs: [time-limit, review]
    # `always()`, so a failed, cancelled or refused review still has its
    # comment, its error status and its label written: this is the only job
    # that can write them. A run cancelled before the review started at all
    # takes the trigger label off too, as the review job's own `always()` step
    # used to. Only a review that never ran, because a guard skipped it, skips
    # this.
    #
    # Both of the review job's guards, restated: `always()` drops the implicit
    # "every need succeeded", and with it the guards a skipped review would
    # otherwise have carried here.
    if: >-
      always() &&
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # **No concurrency group**, on purpose. `agent-pr-*` holds one waiting run,
    # and a newer arrival evicts it silently (docs/parity.md §10). In the group,
    # this job would queue behind a fix a human labelled while the review ran,
    # could evict that fix, or be evicted itself, and an evicted posting job
    # posts nothing at all. Nothing it does is a read a writer can tear. A fix
    # run shown a thread that already carries its closing reply is told the
    # close is the only thing outstanding on it (`shared/pr-feedback.ts`), and
    # a review that races this job re-verifies such a thread and resolves it
    # without a second reply. The hand-off labels it adds fire runs that do
    # join the group, so the serialisation this loop depends on still happens
    # where the work is.
    permissions:
      # `resolveReviewThread`, and nothing else here: it is refused on an
      # installation token without this scope (#133). No checkout, so there is
      # no branch to write to.
      contents: write
      # The review and its threads, the replies, the comments and the labels.
      pull-requests: write
      # The verdict, posted as a commit status on the reviewed head (#96). A
      # status is not a pull-request write (it is its own scope), so nothing
      # already here covers it, and the caller has to grant it too. Omitting it
      # there does not buy a review with no verdict on it: a caller granting
      # less than this block declares fails the whole run before any job starts
      # (probed, #146), which is what `setup/doctor.ts` reports as an error,
      # before a label rather than after one. The step that posts the status
      # warns rather than failing all the same, a posted review is worth more
      # than the line summarising it, so where the token is short for some
      # other reason this is the one failure in this job that looks like the
      # feature simply being switched off.
      statuses: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The pre-flight's refusal, which that job could decide and not say
      # (#257). In the loop's one order (#236): the comment first, then this
      # run's own label off, then `agent:blocked` where a maintainer has to
      # act, so the label that names the next step goes on last. A closed PR
      # gets the note alone (#253): there is nothing left for anyone to act on.
      #
      # The comment is tolerated: a failed one would end the step before the
      # removal, and leave the label on with nothing behind it.
      - name: Say why the review didn't run
        if: needs.review.outputs.proceed == 'false'
        env:
          REFUSAL: ${{ needs.review.outputs.refusal }}
          BLOCKED: ${{ needs.review.outputs.blocked }}
        run: |
          gh pr comment "$PR_NUMBER" --body "**\`agent:review\` didn't run:** ${REFUSAL}" || echo "::warning::Could not post the refusal comment on PR #${PR_NUMBER}."
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          if [ "$BLOCKED" = "true" ]; then
            gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          fi

      # The trigger label stays on while the run works and comes off in step 5,
      # however the run ends (#236), so the one label to take off here is a
      # block an earlier run left. Here rather than as the run starts, because
      # the review job writes nothing; and only on a review that finished, since
      # a failed one adds the block straight back.
      #
      # No permission probe: the probe was a label write ahead of the agent
      # pass, so a short token failed the run before the pass was spent, and
      # the job that spends the pass now holds no write to probe with. A caller
      # short of a scope is still refused before any job starts (#146).
      - name: Transition labels
        if: needs.review.outputs.proceed == 'true' && needs.review.result == 'success'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true

      - name: Fetch what the review wrote
        id: fetch
        if: needs.review.outputs.proceed == 'true' && needs.review.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: agent-review
          path: ${{ runner.temp }}

      # Step 1: the earlier findings this review ruled on (#111, and #109
      # decision 1). The **reviewer** closes a finding and the fixer never does:
      # a fix run replies and resolves nothing, so nothing is marked done by the
      # run that claims to have done it. First, so the overview posted next can
      # say what actually closed (#257).
      #
      # **The reply is posted first and the resolve is gated on it.**
      # `resolutionReason` is recorded by GitHub and exposed nowhere afterwards,
      # because no field on `PullRequestReviewThread` reads it back. So the
      # reply is the only record of why a thread closed. A thread that closes
      # with no reply loses that statement. On the `WONT_FIX` arm the lost part
      # is the maintainer's quoted words, which are what make a misreading
      # visible. Ordering alone does not prevent that; only the `continue`
      # does. A reply that would not post leaves its thread open, which is the
      # direction this loop fails in everywhere else.
      #
      # **Unless the thread already carries that reply** (`alreadyReplied`,
      # #133). A resolve that did not go through leaves the thread open, and the
      # next review verifies it again. Without this guard every round adds
      # another `**Verified fixed.**`, which is how #130 collected nine on one
      # thread. Only the literal `true` skips the reply. Any other value posts
      # it, because a duplicate reply is the cheaper mistake than a thread that
      # closes with no reply at all.
      #
      # What says a thread already carries the reply is a hidden marker on it
      # and never the words it opens with. Those words are shown to the fix
      # agent, whose own replies land in the same thread as this same bot, and a
      # reply matched on prose is one the fixer can make: a thread closing
      # under the fixer's claim with no review's record on it at all
      # (`shared/review-verification.ts`).
      #
      # Two reasons, and which one a thread closes on is decided by
      # `verifyCarried` and read out of the list, never derived here: a finding
      # the review verified fixed closes as `ADDRESSED`, and one a maintainer
      # declined closes as `WONT_FIX` with their words quoted back (#109,
      # decision 10). The enum is spelled out on both arms because it is a
      # literal in the document rather than a variable GitHub would coerce, and
      # the branch is on a fixed list, so a value this step does not recognise
      # closes as addressed instead of putting an unknown string into a
      # mutation.
      #
      # **Every thread that did resolve is written down**, one id a line, and
      # that list is what the overview's *Resolved since last review* is made
      # of. A thread whose reply or resolve failed is not on it, so the
      # overview lists it as still open, with a note, rather than claiming a
      # closure that never happened.
      #
      # Never fails the job. A thread that would not close is a thread the next
      # review retries, and a human can close it. So each failure is a
      # `::warning::`, and the per-mutation `||` keeps one bad id from taking the
      # rest of the list with it.
      - name: Resolve the threads this review closed
        id: resolve
        if: steps.fetch.outcome == 'success'
        env:
          RESOLUTIONS: ${{ runner.temp }}/thread_resolutions.json
          RESOLVED: ${{ runner.temp }}/resolved_threads.txt
        run: |
          set -uo pipefail
          : > "$RESOLVED"
          [ -f "$RESOLUTIONS" ] || { echo "No resolutions file; nothing to resolve."; exit 0; }
          count=$(jq 'length' "$RESOLUTIONS")
          echo "Resolving ${count} thread(s) this review closed."

          for i in $(seq 0 $((count - 1))); do
            tid=$(jq -r ".[$i].threadId" "$RESOLUTIONS")
            body=$(jq -r ".[$i].reply" "$RESOLUTIONS")
            reason=$(jq -r ".[$i].reason" "$RESOLUTIONS")
            already=$(jq -r ".[$i].alreadyReplied" "$RESOLUTIONS")

            if [ "$already" = "true" ]; then
              echo "  ${tid} already carries this reply; retrying only the resolve."
            else
              gh api graphql -f threadId="$tid" -f body="$body" -f query='
                mutation($threadId:ID!,$body:String!) {
                  addPullRequestReviewThreadReply(
                    input:{pullRequestReviewThreadId:$threadId, body:$body}
                  ) { clientMutationId }
                }' >/dev/null \
                && echo "  replied to ${tid}" \
                || { echo "::warning::Could not reply to review thread ${tid}, so it is left open: a thread that closes with no reply loses the only record of why. The overview lists it as still open."; continue; }
            fi

            if [ "$reason" = "WONT_FIX" ]; then
              mutation='
                mutation($threadId:ID!) {
                  resolveReviewThread(
                    input:{threadId:$threadId, resolutionReason:WONT_FIX}
                  ) { clientMutationId }
                }'
            else
              mutation='
                mutation($threadId:ID!) {
                  resolveReviewThread(
                    input:{threadId:$threadId, resolutionReason:ADDRESSED}
                  ) { clientMutationId }
                }'
            fi

            if gh api graphql -f threadId="$tid" -f query="$mutation" >/dev/null; then
              echo "  resolved ${tid} (${reason})"
              echo "$tid" >> "$RESOLVED"
            else
              echo "::warning::Could not resolve review thread ${tid} (${reason}). Its reply is posted, the overview lists it as still open, and the thread stays open until the next review retries it, which it does without replying again. GitHub's reply is printed above. It is not the caller's \`contents:\` grant: a caller granting less than this job declares fails the run before any job starts, so a token that got this far holds the write (jeffwlawson/agent-workflows docs/ADOPTING.md §4)."
            fi
          done

      # Step 2: the overview and the new findings, in one call, after the
      # threads (#257). The body's *Resolved since last review* is put back
      # together here from what step 1 resolved: the runner rendered every line
      # and left a slot where the group goes (`renderReviewPost`), and this
      # writes no entry, only the two group wrappers, from the words the runner
      # handed over. A line whose thread is on the resolved list stays under
      # *Resolved*; one whose thread is not moves to the *Still open* group, with
      # its note. A legacy body entry has no thread, closes by not being listed
      # again, and always stays.
      #
      # GraphQL `addPullRequestReview`, not REST `POST /pulls/{n}/reviews`, for
      # the one thing REST cannot do: open a **file-level** thread in the same
      # call as the review — it answers one with a 422 — which is where a
      # finding goes when it is in a changed file but outside its hunks (#110).
      # REST's `comments` field is deprecated in favour of `threads` besides.
      #
      # The whole request body is `review_payload.json`, written by the runner
      # from a unit-tested function, with its body replaced: `--input` sends a
      # file verbatim, so nothing here composes a query or names a field beyond
      # the body. The endpoint is `graphql` rather than `/graphql` deliberately:
      # that is what makes `gh` fail the step on an `errors` array, which
      # GraphQL returns with HTTP 200 and which a raw path would read as success
      # and post nothing.
      #
      # The `id:` and the captured URL are the verdict's (#96): a commit status
      # carries one link, and the only place the posted review's own URL exists
      # is the response to this call. `--jq` rather than a second lookup — the
      # newest review on the pull request is not reliably this one.
      - name: Post PR review
        id: review
        if: steps.fetch.outcome == 'success'
        env:
          PAYLOAD: ${{ runner.temp }}/review_payload.json
          BODY: ${{ runner.temp }}/review_body.json
          RESOLVED: ${{ runner.temp }}/resolved_threads.txt
        run: |
          set -euo pipefail
          posted="${RUNNER_TEMP}/review_posted.json"
          [ -f "$RESOLVED" ] || : > "$RESOLVED"
          # One group, as the runner's `renderGroup` writes it, or nothing
          # where it is empty.
          jq --slurpfile parts "$BODY" --rawfile resolved "$RESOLVED" '
            def group($head; $lines):
              if ($lines | length) == 0 then empty
              else [
                "<details\(if $head.open then " open" else "" end)>",
                "<summary><b>\($head.title)</b> (\($lines | length))</summary>",
                (if $head.subtitle then "", "_\($head.subtitle)_" else empty end),
                "",
                $lines[],
                "",
                "</details>"
              ] | join("\n") end;
            ($resolved | split("\n") | map(select(. != ""))) as $ok
            | $parts[0] as $p
            | ($p.resolved | map(select(.threadId != null and (.threadId as $t | $ok | index($t) | not)))) as $unclosed
            | ($p.resolved | map(select(.threadId == null or (.threadId as $t | $ok | index($t))))) as $closed
            | ($p.slotted | split("\n\n" + $p.slot)) as $halves
            | if ($halves | length) != 2 then error("the review body carries its slot \($halves | length - 1) times") else . end
            | .variables.input.body = $halves[0]
                + ([group($p.groups.unclosed; $unclosed | map(.line)), group($p.groups.resolved; $closed | map(.line))] | map("\n\n" + .) | join(""))
                + $halves[1]
          ' "$PAYLOAD" > "$posted"
          unclosed=$(jq --slurpfile parts "$BODY" --rawfile resolved "$RESOLVED" -n '($resolved | split("\n") | map(select(. != ""))) as $ok | [$parts[0].resolved[] | select(.threadId != null and (.threadId as $t | $ok | index($t) | not))] | length')
          if [ "$unclosed" -gt 0 ]; then
            echo "::warning::${unclosed} thread(s) this review closed could not be resolved, so the overview lists them as still open."
          fi
          if ! url=$(gh api graphql --input "$posted" --jq .data.addPullRequestReview.pullRequestReview.url); then
            echo "GitHub refused the review, so it was not posted. Its threads are not on the pull request and there is no verdict; the earlier threads this review closed are resolved." > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # The marker for the filing half (#47): this PR's review recorded
      # out-of-scope findings, and a human still has a say before they become
      # issues. Removing the label is that say.
      #
      # **Added when, and only when, the run recorded at least one.** The runner
      # writes `follow_ups.md` in no other case, so the file's existence is the
      # whole condition: no parsing, and nothing here that can decide
      # differently from what went into the body.
      #
      # **Never removed here**, which is the other half of the rule and is not
      # symmetry. Removal is the human's opt-out gesture; a step that cleared a
      # stale marker would be racing the person it exists to serve. A marker
      # left behind by a later empty run costs nothing either: that run posts an
      # *empty* findings block, which is what the filing half reads as the
      # latest list, so the merge files nothing and clears the marker itself.
      #
      # After the review is posted, on purpose. The label points at a record
      # that lives in the review body, so marking a PR whose review failed to
      # post would point at nothing.
      #
      # Never fails the run. This label is not one `docs/ADOPTING.md` §3
      # mandates, so an adopter can be up to date on the pin and not have it,
      # and a posted review is worth more than a marker. A warning says so
      # where `|| true` would not, the same call `Mark PR ready for review`
      # makes below.
      - name: Mark the PR as carrying follow-ups
        if: steps.review.outcome == 'success'
        run: |
          [ -f "${RUNNER_TEMP}/follow_ups.md" ] || exit 0
          gh pr edit "$PR_NUMBER" --add-label "agent:follow-ups" \
            || echo "::warning::Could not add \`agent:follow-ups\` to PR #${PR_NUMBER}. Its out-of-scope findings stay in the review body and nothing will file them. If the label does not exist in this repository, create it."

      # Step 3: the verdict, what a maintainer does next, on the commit it is
      # about.
      #
      # A commit status rather than a comment or a label, for the one property
      # neither of those has — it is attached to a **commit**. A new commit
      # carries no verdict until one is posted for it, so a stale "ready to
      # merge" cannot survive a push, and the status history is the only record
      # of what earlier rounds said. One context, so a later review of the same
      # commit replaces its own verdict and nothing else.
      #
      # The context, the state and the line all come out of `verdict.json`,
      # which the runner wrote from a derivation that is unit-tested. Deriving
      # any of them here would be a second copy of that table, in YAML, where
      # nothing can test it — and the line is the whole feature: it is what
      # makes the outcome actionable without reading the review.
      #
      # Never fails the run, on the same grounds as the marker step above: a
      # posted review is worth more than its verdict. Not because the adopter's
      # caller is the likely cause — a caller short of `statuses: write` is
      # refused before any job starts (#146), so a step that ran holds the
      # write, and what lands here is GitHub refusing the status itself. A
      # warning says so where `|| true` would leave a loop posting no verdicts
      # and looking healthy.
      - name: Post the verdict as a commit status
        if: steps.review.outcome == 'success'
        env:
          HEAD_SHA: ${{ needs.review.outputs.sha }}
          REVIEW_URL: ${{ steps.review.outputs.url }}
        run: |
          context=$(jq -r .context "${RUNNER_TEMP}/verdict.json")
          state=$(jq -r .state "${RUNNER_TEMP}/verdict.json")
          description=$(jq -r .description "${RUNNER_TEMP}/verdict.json")
          args=(--method POST "repos/{owner}/{repo}/statuses/${HEAD_SHA}"
                -f "context=${context}" -f "state=${state}" -f "description=${description}")
          # `if`, not `[ -n … ] && …`: under `bash -e` an unset URL would end
          # the step here — with the review posted and no verdict on it, which
          # is the state this whole step exists to make impossible.
          if [ -n "$REVIEW_URL" ]; then
            args+=(-f "target_url=${REVIEW_URL}")
          fi
          gh api "${args[@]}" \
            || echo "::warning::Could not post the \`agent-review\` verdict for ${HEAD_SHA}. The review is posted; what is missing is the one line saying what to do about it. GitHub's reply is printed above. It is not the caller's \`statuses:\` grant: a caller granting less than this job declares fails the run before any job starts, so a token that got this far holds the write (jeffwlawson/agent-workflows docs/ADOPTING.md §4); a 422 is the status itself being refused, which is ours to fix."

      # Step 4. Draft means "the automated pipeline has not finished", not "the
      # agent is still writing code", so this belongs here rather than at the
      # end of implement. The human's first real decision (act on the review, or
      # merge) only exists once the review is posted; marking ready any earlier
      # fires the signal during a window when there is nothing to decide.
      #
      # Only on a posted review, on purpose: a failed review should leave the
      # PR in draft, so the draft state agrees with the `agent:blocked` label
      # rather than presenting an unreviewed PR as finished.
      #
      # Does not cascade: `ready_for_review` is not in the default
      # `pull_request` types (opened/synchronize/reopened), so neither ci.yml nor
      # corpus.yml re-runs.
      #
      # MUST use AGENT_PAT. `GITHUB_TOKEN` cannot convert a draft PR even with
      # `pull-requests: write` — it fails with
      #   GraphQL: Resource not accessible by integration (markPullRequestReadyForReview)
      # because the Actions bot is an App installation and this mutation is not
      # in its permission set at all. A user PAT is not an App, so it can.
      #
      # This is the fourth GITHUB_TOKEN limitation the loop has hit, and the
      # third of that four where the operation *looks* covered by the granted
      # permission. See docs/ADOPTING.md §1.
      #
      # Never `|| true` here. It was, and it turned a hard failure into a green
      # step: every reviewed PR silently stayed a draft while the workflow
      # reported success, and two were marked ready by hand without anyone
      # noticing the feature was broken. A warning keeps the run green — a PR
      # stuck in draft is not worth failing a review over — while making the
      # failure visible, which `|| true` did not.
      #
      # **Not when an automatic fix round is about to run** (#102, PRD #101
      # decision 4). Draft means "the loop is still working", and it is the human's turn
      # on *approval recommended*, on *needs a closer look*, and on changes
      # recommended only where nobody is going to act on them but them. The
      # hand-off at the end of this job is about to add `agent:fix`, so the next
      # thing to happen on this pull request is another agent run: marking it
      # ready here would fire "your turn" during exactly the window the draft
      # state exists to describe, and the fix round's own review would have to
      # mark it ready all over again.
      #
      # The key alone, and deliberately the hand-off's own selector: it is
      # derived only where the budget said a round would start, so a step
      # reading it cannot decide differently from the step it is predicting.
      # The hand-off's live-state guard can still add nothing (a newer verdict,
      # or a label a human already added), and either way the pull request is
      # not the human's yet: a newer verdict marks it ready itself, and a fix
      # round is starting on the other. Where the hand-off does not start the
      # round it should have, it marks the pull request ready itself.
      - name: Mark PR ready for review
        if: >-
          steps.review.outcome == 'success' &&
          needs.review.outputs.verdict != 'changes recommended, fix round started'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready "$PR_NUMBER" \
            || echo "::warning::Could not mark PR #${PR_NUMBER} ready for review. If AGENT_PAT is unset this is expected: GITHUB_TOKEN cannot do it. Mark it ready by hand."

      # And a run that failed says so where the verdict goes, rather than leaving
      # the last verdict standing. So does one that was cancelled or timed out
      # (#220), which leaves it standing just the same. Silence is the dangerous
      # answer here: a status is per commit and per context, so a review that
      # died half way reads from the outside exactly like one that recommended
      # approval, right up until someone merges on it.
      #
      # Two ways to get here (#257): the review job failed, or it finished and
      # posting failed in this job. Below every step it is the arm for, so
      # every posting step above it is covered, including the one that posts
      # the verdict itself, whose own failure would otherwise be the one that
      # leaves no status at all. Above the hand-off, so a hand-off that fails
      # after the review was posted is not reported as a review that did not
      # finish. And above the failure comment, which is where the labels move
      # (#236): every result is posted before this run takes its own label off.
      #
      # The one step that spells the context out. A run that failed wrote no
      # `verdict.json` to read it from, so this literal is held to
      # `VERDICT_CONTEXT` by a test instead.
      - name: Post an error verdict
        if: >-
          needs.review.outputs.proceed == 'true' &&
          (failure() || cancelled() || needs.review.result != 'success')
        env:
          HEAD_SHA: ${{ needs.review.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/{owner}/{repo}/statuses/${HEAD_SHA}" \
            -f "context=agent-review" -f "state=error" -f "target_url=${RUN_URL}" \
            -f "description=The review run did not finish, so there's no verdict. Check the run, then re-add agent:review." \
            || echo "::warning::Could not post the failed \`agent-review\` verdict for ${HEAD_SHA}. The failure comment on the pull request is the only record of this run."

      # In the loop's one order (#236): the comment, then this run's own label
      # off, then `agent:blocked`. After the error verdict, so it is the last
      # result this run posts.
      #
      # The reason is the review job's where that job failed, handed over by
      # *Hand the outcome to the posting job*, and this job's own where posting
      # failed. Cancelled is not failed (#220): a job that reached its limit is
      # cancelled too, and the review job measured which it was. A reason file
      # is not read on a cancel; what wrote one was stopped, not failing. The
      # labels and the retry are a failure's, word for word.
      - name: Mark blocked on failure
        if: >-
          needs.review.outputs.proceed == 'true' &&
          (failure() || cancelled() || needs.review.result != 'success')
        env:
          JOB_STATUS: ${{ job.status }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_REASON: ${{ needs.review.outputs.failure-reason }}
          REVIEW_REFUSAL: ${{ needs.review.outputs.refusal-reason }}
          TIMED_OUT: ${{ needs.review.outputs.timed-out }}
          TIMEOUT_MINUTES: ${{ needs.time-limit.outputs.minutes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="It stopped without giving a reason. The workflow run's log has the details."
          refusal=""
          if [ "$REVIEW_RESULT" = "success" ]; then
            # The review finished; posting it is what stopped.
            if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
              reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
            fi
            if [ "$JOB_STATUS" = "cancelled" ]; then
              reason="It was cancelled before it finished, by hand or by GitHub."
            fi
          elif [ "$REVIEW_RESULT" = "cancelled" ]; then
            reason="It was cancelled before it finished, by hand or by GitHub."
            if [ "$TIMED_OUT" = "true" ]; then
              reason="It timed out after ${TIMEOUT_MINUTES} minutes. The repository variable \`AGENT_REVIEW_TIMEOUT_MINUTES\` raises the review's own time, which its CI wait is added to."
            fi
          else
            if [ -n "$REVIEW_REASON" ]; then
              reason="$REVIEW_REASON"
            fi
            refusal="$REVIEW_REFUSAL"
          fi
          # One pattern for every run that stopped (#253): the reason as a
          # sentence, starting with a capital and ending in a full stop, then
          # the run and what to do.
          reason="${reason^}"
          case "$reason" in *[.!?]) ;; *) reason="${reason}." ;; esac
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '**`agent:review` stopped:** %s\n\n[Workflow run](%s) · %s\n' "$reason" "$RUN_URL" "To try again, add \`agent:review\`." > "$body_file"
          # A variable the review refused before it reviewed anything is the
          # other pattern (#253): it didn't run, and the sentence says what to
          # do. Still `agent:blocked`, since the maintainer has to fix it.
          if [ -n "$refusal" ]; then
            printf "**\`agent:review\` didn't run:** %s\n" "$refusal" > "$body_file"
          fi
          gh pr comment "$PR_NUMBER" --body-file "$body_file" || echo "::warning::Could not post the failure comment on PR #${PR_NUMBER}."
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true

      # Step 5. The trigger label comes off however the run ends (#236):
      # success, failure, refusal, timeout or cancel, so it never outlives the
      # run. `always()` alone, so a pre-flight that died before deciding is
      # covered too; a refusal or a failure took it off already, and removing an
      # absent label leaves nothing on the timeline. After every result above,
      # and before every hand-off below (#257).
      #
      # **A request made while this run worked is not lost.** Adding the label
      # then fired nothing, since it was already on. So where the run finished
      # and the pull request's head has moved on from the commit it reviewed,
      # because somebody pushed, it asks for its own step again: removed above,
      # then added. With `AGENT_PAT` or not at all, since a label added with
      # `GITHUB_TOKEN` starts nothing. Not on a failure, which is
      # `agent:blocked` and a human's retry, and never a cycle: nothing in the
      # loop pushes to a pull request while its review runs, since every run
      # that pushes shares the review job's concurrency group.
      #
      # **Not while another trigger label is on.** That label is a run queued
      # in this pull request's concurrency group, whose waiting slot holds one
      # run: a request now would cancel it, and a run cancelled while pending
      # never reaches its own last step, so its label would stay on with
      # nothing behind it, and the PRD merge would refuse the PR as busy. The
      # queued run sees the new head anyway, and a fix or a refresh asks for
      # the review of what it pushed.
      #
      # **Whichever of the three it does, it says the head moved**, as
      # `moved=true`, and the two hand-offs below stand down on it. This run's
      # verdict is about a commit the pull request has left: a fix round
      # started off it would read a branch somebody else has pushed to, and
      # finding no verdict on the head it would post a false "no fix round"
      # failure; an advance would re-add `agent:implement` and the chain's
      # merge would refuse the slice PR as busy, or merge a head nobody
      # reviewed. The review of the new head, re-requested here or queued or
      # added by hand, decides both.
      - name: Always remove the trigger label
        id: trigger
        if: always()
        env:
          PROCEEDED: ${{ needs.review.outputs.proceed }}
          REVIEW_RESULT: ${{ needs.review.result }}
          JOB_STATUS: ${{ job.status }}
          LEFT_SHA: ${{ needs.review.outputs.sha }}
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          REQUEST_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          if [ "$PROCEEDED" != "true" ] || [ "$REVIEW_RESULT" != "success" ] || [ "$JOB_STATUS" != "success" ] || [ -z "$LEFT_SHA" ]; then
            exit 0
          fi
          live=$(gh pr view "$PR_NUMBER" --json state,headRefOid,labels --jq '"\(.state) \(.headRefOid) \([.labels[].name | select(. == "agent:review" or . == "agent:fix" or . == "agent:update-branch")] | join(","))"' 2>/dev/null || echo "")
          read -r state head busy <<< "$live"
          if [ "$state" != "OPEN" ] || [ "$head" = "$LEFT_SHA" ]; then
            exit 0
          fi
          echo "moved=true" >> "$GITHUB_OUTPUT"
          if [ -n "$busy" ]; then
            echo "::notice::PR #${PR_NUMBER} moved on to ${head} while this run reviewed ${LEFT_SHA}, but it carries ${busy}, so agent:review was not asked for again: that run is queued, and a new one would cancel it and leave its label on with no run behind it. Add agent:review by hand once ${busy} is off, if the new head still needs it."
            exit 0
          fi
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::PR #${PR_NUMBER} moved on to ${head} while this run reviewed ${LEFT_SHA}, but AGENT_PAT is not set, so agent:review was not asked for again: a label added with GITHUB_TOKEN starts nothing. Add agent:review by hand to review the new head."
            gh pr comment "$PR_NUMBER" --body "This PR moved on to \`${head}\` while its review of \`${LEFT_SHA}\` ran. No review of the new head will start on its own: \`AGENT_PAT\` is not set, and a label added with \`GITHUB_TOKEN\` starts nothing. Add \`agent:review\` by hand to review it." \
              || echo "::warning::…and that could not be said on the pull request either."
            exit 0
          fi
          GH_TOKEN="$REQUEST_TOKEN" gh pr edit "$PR_NUMBER" --add-label "agent:review" \
            || echo "::warning::PR #${PR_NUMBER} moved on to ${head} while this run reviewed ${LEFT_SHA}, and agent:review could not be added again. Add it by hand to review the new head."

      # Step 6, the first hand-off: the automatic fix round (#102, and the
      # budget of #201, PRD #200). Where the verdict is *changes recommended,
      # fix round started*, this adds `agent:fix` itself, so a pull request whose
      # fixes the review says are clear reaches a maintainer already fixed and
      # re-reviewed rather than waiting on a label nobody was asked to think
      # about. After `agent:review` came off (#257), so the timeline never shows
      # the next step's label beside this run's.
      #
      # **Whether a round starts is settled before the review**, by *Settle the
      # fix-round budget*: the rounds this loop already started on the pull
      # request, counted from its verdicts, against `AGENT_MAX_FIX_ROUNDS`. The
      # runner derives this key only where that step said a round would start,
      # so the verdict announces exactly the rounds this step starts, and the
      # budget is restated nowhere here: a second copy of the comparison could
      # only disagree with the first.
      #
      # **Why it cannot loop.** Two bounds, both ruled on before the key below
      # is derived. The budget bounds it per pull request, and the count it is
      # checked against is the verdicts that announced a round, so nothing here
      # has to be written down for the bound to hold. And the early stop (#202):
      # a review after a fix round that closed none of the findings it was given
      # cannot produce the key below, whatever budget is left (`deriveVerdict`,
      # docs/parity.md §10).
      #
      # MUST use AGENT_PAT. A label added with `GITHUB_TOKEN` fires no
      # `labeled` event, so `agent:fix` added with it sits on the pull request
      # triggering nothing. The budget step already declined to start a round
      # without the PAT, so this step does not run without one; the fallback is
      # for the comment, which is the one thing here `GITHUB_TOKEN` can do.
      #
      # **Decided from live state, not the event payload** (#201). Before adding
      # anything it re-reads the pull request:
      #
      #  - `agent:fix` is already on it: a round is starting anyway, whoever
      #    added it. Adding nothing.
      #  - the newest `agent-review` verdict on its head is not this review's,
      #    by the review URL the status links to: a newer verdict stands.
      #    Adding nothing.
      #
      # The head alone decides nothing. A clean `update-branch` moves it and
      # copies this verdict on to the new one, where the round still stands; a
      # push nobody reviewed leaves the head with no verdict, which is a round
      # announced and not coming, and is said like the failures below.
      #
      # **Say only what will happen.** The verdict has already announced a
      # round, so every arm that does not start one when it should, a read
      # that failed, a verdict that is nowhere on the head, or an add that
      # failed, says so on the pull request, where the announcement is, and
      # ends red, with the pull request marked ready, since it is the human's
      # turn now. Between 2026-09-22 and 09-30 all seven auto-fix jobs here
      # failed after the verdict had announced a round, and the only record was
      # a red job nobody opened.
      - name: Start the automatic fix round
        if: >-
          success() && needs.review.result == 'success' &&
          needs.review.outputs.verdict == 'changes recommended, fix round started' &&
          steps.trigger.outputs.moved != 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          REVIEWED_SHA: ${{ needs.review.outputs.sha }}
          REVIEW_URL: ${{ steps.review.outputs.url }}
          VERDICT_CONTEXT: agent-review
          LOOP_ACCOUNT: github-actions[bot]
        run: |
          set -euo pipefail
          # The review left the pull request a draft for the round it
          # announced, so a round that is not coming hands it back as well.
          no_round() {
            gh pr comment "$PR_NUMBER" --body "No fix round started, although this PR's review said one had: $1. Add \`agent:fix\` to start one by hand." \
              || echo "::warning::…and that could not be said on the pull request either."
            gh pr ready "$PR_NUMBER" \
              || echo "::warning::Could not mark PR #${PR_NUMBER} ready for review either. Mark it ready by hand."
            echo "::error::No fix round started on PR #${PR_NUMBER}: $1."
            exit 1
          }

          if ! live=$(gh pr view "$PR_NUMBER" --json labels,headRefOid); then
            no_round "its labels could not be read, so whether a round was already starting could not be told"
          fi
          if printf '%s' "$live" | jq -e 'any(.labels[]; .name == "agent:fix")' >/dev/null; then
            echo "PR #${PR_NUMBER} already carries agent:fix, so a fix round is starting anyway. Adding nothing."
            exit 0
          fi

          # A head that moved is not a reason on its own (#240): a clean
          # `update-branch` copies this verdict, link and all, on to the merge
          # commit, and the round it announced still stands there. What decides
          # is which verdict the head carries, so a moved head is only named.
          head=$(printf '%s' "$live" | jq -r .headRefOid)
          where="the head commit \`${head}\`"
          [ "$head" = "$REVIEWED_SHA" ] || where="${where}, which moved on from the reviewed \`${REVIEWED_SHA}\`"
          if ! statuses=$(gh api "repos/${GH_REPO}/commits/${head}/statuses" --paginate --slurp); then
            no_round "the verdicts on its head could not be read, so whether a newer one stands could not be told"
          fi
          # Newest first, which is the order this endpoint documents.
          newest=$(printf '%s' "$statuses" \
            | jq -c '(add // []) | map(select(.context == env.VERDICT_CONTEXT and .creator.login == env.LOOP_ACCOUNT))[0] // empty')
          if [ -z "$newest" ]; then
            no_round "the verdict that announced it is not on ${where}"
          fi
          if [ "$(printf '%s' "$newest" | jq -r '.target_url // ""')" != "$REVIEW_URL" ]; then
            echo "A newer verdict stands on ${head} than the review that announced this round. Adding nothing."
            exit 0
          fi

          # Removed first, as every trigger label the loop adds (#236): an add
          # on a label that is somehow still there fires nothing.
          gh pr edit "$PR_NUMBER" --remove-label "agent:fix" || true
          if ! gh pr edit "$PR_NUMBER" --add-label "agent:fix"; then
            no_round "adding \`agent:fix\` failed, and GitHub's reply is in the workflow run's log"
          fi
          echo "Added agent:fix to PR #${PR_NUMBER}: an automatic fix round starts."

      # Step 6, the other hand-off: the PRD chain's advance (#176, PRD #171). A
      # slice PR is one sub-issue of a PRD, opened by `implement-prd` against
      # the PRD branch, and the chain waits for that slice's review round to end
      # before it builds the next one. When the round ends on a verdict the
      # chain moves on from, this re-adds `agent:implement` to the parent; the
      # `implement-prd` run that starts merges the slice PR into the PRD branch
      # and builds the next slice, or, after the last slice, is the finishing
      # run that hands the PRD PR over.
      #
      # **Which verdicts advance.** The two a slice round ends on without a
      # human: *approval recommended*; and *changes recommended* where no
      # automatic fix is starting (a budget of 0 or spent, a fix round that made
      # no progress, or no `AGENT_PAT`). Not the key the fix round above selects
      # on: a fix and its re-review are still in flight, and the round ends at
      # their end, here or in `fix.yml`'s `advance` job. And not *needs a
      # closer look*, which is a reviewer asking for a human: the chain parks on
      # that slice PR until one re-adds `agent:implement` to the parent, which
      # is itself the acceptance. A failed review or a failed post never gets
      # here, so the chain parks there too.
      #
      # Keys, matched exactly, for the reason the fix round matches one: two
      # rows share a heading, and it is the key that tells them apart.
      #
      # **Only on a slice PR**, recognised by its head: `agent/slice-<parent>-…`,
      # the name `implement-prd` gives it, which is also where the parent comes
      # from. An ordinary pull request has no chain to advance, and a PRD PR's
      # head is `agent/prd-…`, which this does not match: its own review ends
      # the chain rather than advancing it.
      #
      # **After the threads are resolved**, which is now the order of this job's
      # steps rather than a `needs:` between two jobs. The `implement-prd` run
      # this starts reads the slice PR's unresolved threads for its row of the
      # slices table, and rows are never refreshed, so a row written before the
      # resolve would link fixed findings as open for good.
      #
      # What advancing *is* lives in `.github/actions/advance-prd`, the one copy
      # this and `fix.yml`'s `advance` job both run (#257): no checkout, no
      # model, `AGENT_PAT` or nothing.
      - name: Advance the PRD chain
        if: >-
          success() && needs.review.result == 'success' &&
          startsWith(github.event.pull_request.head.ref, 'agent/slice-') &&
          steps.trigger.outputs.moved != 'true' &&
          (needs.review.outputs.verdict == 'approval recommended' ||
           needs.review.outputs.verdict == 'changes recommended')
        uses: jeffwlawson/agent-workflows/.github/actions/advance-prd@v0.7.4
        with:
          pr-number: ${{ github.event.pull_request.number }}
          head-ref: ${{ github.event.pull_request.head.ref }}
          has-pat: ${{ secrets.AGENT_PAT != '' }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

  # A slice PR merged **by hand** advances the chain too (#209). Merging a
  # slice PR whose round parked is the obvious move for a maintainer, and until
  # this job it was a dead end: the chain moved only on `agent:implement`
  # re-added to the parent, and nothing on the slice PR said so. This re-adds
  # it, and the `implement-prd` run that starts finds the slice PR merged,
  # writes its row of the slices table and builds the next slice (#207).
  #
  # **Not on the chain's own merge.** `implement-prd` merges each slice PR
  # itself, and that run already builds the next slice: a second label would
  # queue a second run behind it. Who merged cannot tell the two apart, since
  # the chain merges under `AGENT_PAT`, which is the maintainer's own login. So
  # the chain leaves a mark instead: just before it merges, it writes
  # `<!-- agent-chain-merge <head sha> -->` into the slice PR's body, and the
  # `closed` payload carries the body as it was at the merge. Pinned to the
  # head, so a mark left by a chain merge that failed does not hide a later
  # hand merge of a head pushed since. Read in the `if:`, so the chain's own
  # merge starts no job at all, and there is no race with the run that made it.
  #
  # **Not while the chain is already moving.** A human merge can land while
  # the run an advance started is queued or building (the parent carries
  # `agent:implement`, which is on from the advance until that run ends); that
  # run finds the slice PR merged and goes on, and a second label would only
  # queue a second run.
  #
  # **Only on a slice PR**, for the advance's reason and by the same head, and
  # only into a PRD branch. `closed` with `merged`, and the action named:
  # a label added to a pull request that is already merged is a `labeled`
  # event carrying `merged: true` too.
  #
  # In the advance's shape (`.github/actions/advance-prd`): no checkout, no
  # toolchain, no model, `pull-requests: write` alone, `AGENT_PAT` or nothing. It cannot cycle: it labels an issue,
  # never a pull request, and a merged slice PR closes once.
  advance-merged:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.base.ref, 'agent/prd-') &&
      startsWith(github.event.pull_request.head.ref, 'agent/slice-') &&
      !contains(github.event.pull_request.body, format('<!-- agent-chain-merge {0} -->', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # **No concurrency group**, for the reason the posting job is in none.
    permissions:
      # The comment the no-PAT arm leaves on the slice PR, and nothing else.
      # The label on the parent goes on with `AGENT_PAT` or not at all, so
      # `issues: write` stays out of this job (docs/parity.md §10).
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # MUST use AGENT_PAT, for the advance's reason. `bash -e` and no `|| true`
      # on the add or the read before it: a hand merge that did not move the
      # chain is the dead end this job exists to remove, and a red job is the
      # only thing that says so.
      - name: Advance the PRD chain past a hand-merged slice
        env:
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_REF" =~ ^agent/slice-([0-9]+)-[0-9]+- ]]; then
            echo "::error::Slice PR #${PR_NUMBER}'s head \`${HEAD_REF}\` is not \`agent/slice-<parent>-<sub-issue>-…\`, so its PRD cannot be told. Re-add \`agent:implement\` to the PRD by hand to advance its chain."
            exit 1
          fi
          parent="${BASH_REMATCH[1]}"
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::AGENT_PAT is not set, so the PRD chain was not advanced past this hand merge: a label added with GITHUB_TOKEN starts nothing. Re-add agent:implement to #${parent} by hand."
            gh pr comment "$PR_NUMBER" --body "This slice PR was merged by hand, but the PRD chain will not move on its own: \`AGENT_PAT\` is not set, and a label added with \`GITHUB_TOKEN\` starts nothing. Re-add \`agent:implement\` to #${parent} by hand to record this slice in the PRD PR and build the next one." \
              || echo "::warning::…and that could not be said on the pull request either."
            exit 0
          fi
          busy=$(gh issue view "$parent" --json labels --jq '[.labels[].name | select(. == "agent:implement")] | join(", ")')
          if [ -n "$busy" ]; then
            echo "#${parent} carries ${busy}: the PRD chain is already moving, and its run finds slice PR #${PR_NUMBER} merged. Nothing to add."
            exit 0
          fi
          gh issue edit "$parent" --remove-label "agent:implement" || true
          gh issue edit "$parent" --add-label "agent:implement"
          echo "Re-added agent:implement to #${parent}: slice PR #${PR_NUMBER} was merged by hand, and the PRD chain moves on from it."
