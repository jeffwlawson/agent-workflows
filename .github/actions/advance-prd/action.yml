name: Advance the PRD chain
description: >-
  Re-add `agent:implement` to a PRD PR's parent, so the `implement-prd` run
  that starts builds the next slice on the PRD branch, or finishes the chain.
  With no `AGENT_PAT`, say on the PRD PR which re-label does it by hand.

# The PRD chain's advance (PRD #222), run by `review.yml`'s `advance` job when
# a slice round on the PRD PR ends on an approval. Which rounds advance is that
# job's to decide, in its own `if:`: this is what advancing *is*.
#
# **A composite action, pinned like a workflow** (#257): it is fetched by
# GitHub from the same tag as the workflow that names it,
# `jeffwlawson/agent-workflows/.github/actions/advance-prd@v<version>`, written
# by `scripts/sync-version.ts` on release (`shared/pins.ts`, the `action`
# form). No toolchain, no checkout and no model.
#
# **Why it cannot cycle.** It adds a label to the parent **issue**, never to a
# pull request, and the `implement-prd` run it starts builds one slice and asks
# for one review, or refuses. The approval gate in that run's preflight reads
# the PRD PR's head live, so a label this adds without an approval behind it
# builds nothing, and what it starts is bounded by the number of sub-issues.
#
# **The token is the caller's.** A composite cannot read `secrets`, so it is
# handed `AGENT_PAT`, or `GITHUB_TOKEN` where there is none, together with which
# one it got.
inputs:
  pr-number:
    description: The PRD PR whose slice round ended.
    required: true
  head-ref:
    description: The PRD PR's head, `agent/prd-<parent>-…`, which names its parent.
    required: true
  has-pat:
    description: "`true` where `token` is `AGENT_PAT`."
    required: true
  token:
    description: "`AGENT_PAT`, or `GITHUB_TOKEN` where it is not set."
    required: true

runs:
  using: composite
  steps:
    # MUST use AGENT_PAT: `agent:implement` added with `GITHUB_TOKEN` sits on
    # the parent and starts nothing. So without the PAT nothing is added at all,
    # and the one place a maintainer is already looking, the PRD PR, says which
    # re-label advances the chain by hand.
    #
    # `bash -e` and no `|| true` on the add: a chain that did not advance after
    # an approval is a stall with no other symptom, and a red job is the only
    # thing that says so.
    - name: Advance the PRD chain
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_REF: ${{ inputs.head-ref }}
        HAS_PAT: ${{ inputs.has-pat }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [[ ! "$HEAD_REF" =~ ^agent/prd-([0-9]+)- ]]; then
          echo "::error::PRD PR #${PR_NUMBER}'s head \`${HEAD_REF}\` is not \`agent/prd-<parent>-…\`, so its PRD cannot be told. Re-add \`agent:implement\` to the PRD by hand to advance its chain."
          exit 1
        fi
        parent="${BASH_REMATCH[1]}"
        if [ "$HAS_PAT" != "true" ]; then
          echo "::warning::AGENT_PAT is not set, so the PRD chain was not advanced: a label added with GITHUB_TOKEN starts nothing. Re-add agent:implement to #${parent} by hand."
          gh pr comment "$PR_NUMBER" --body "This slice's round ended on an approval, but the PRD chain will not advance on its own: \`AGENT_PAT\` is not set, and a label added with \`GITHUB_TOKEN\` starts nothing. Re-add \`agent:implement\` to #${parent} by hand to build the next slice." \
            || echo "::warning::…and that could not be said on the pull request either."
          exit 0
        fi
        # Removed first, as every trigger label the loop adds (#236): an add
        # on a label still there fires nothing, and the chain would stall.
        gh issue edit "$parent" --remove-label "agent:implement" || true
        gh issue edit "$parent" --add-label "agent:implement"
        echo "Re-added agent:implement to #${parent}: the PRD chain advances past the slice round approved on PRD PR #${PR_NUMBER}."
