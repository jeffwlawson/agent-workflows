name: Agent Review (reusable)

# The review job itself. The `review` job in `agent-pr.yml` is the caller (two
# wires, under that file's trigger), and everything that bounds what a wrong
# review can do stays here, in a file an adopting repo *references* rather than
# copies
# (jeffwlawson/winget-manifest-lint#97, slice 3 of
# jeffwlawson/winget-manifest-lint#88).
#
# A reusable workflow rather than a composite action, for one reason: an action
# cannot declare `on:`, `permissions:`, `concurrency:` or a job-level `if:` —
# which is every security control in this loop, and **the fork guard is a
# job-level `if:`**. An action could have absorbed checkout → node → install and
# left the controls to be copy-pasted per repo, which is how they drift.
#
# The trigger stays with the caller because `workflow_call` cannot carry one:
# the event that reaches this job is the caller's, so `github.event.…` below
# reads the `pull_request_target` payload exactly as it did before the split,
# and `github.repository` is still the *calling* repository.
#
# Two properties an adopter cannot get wrong, because they are not theirs to
# state: the fork guard and the label guard are on this side of the seam. A
# caller's own `if:` can skip this job; it cannot loosen it.
on:
  workflow_call:
    inputs:
      default-branch:
        description: >-
          Branch to diff against when the pull-request event carries no base
          ref. On a real PR `base.ref` is always set, so this fires only when
          something is already odd — but an unset fallback degrades *silently*
          to the wrong branch, which is the jeffwlawson/winget-manifest-lint#71
          failure arriving by a different route.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets a
          review, running on the Node the runner package requires.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or a PR title becomes
          a shell script.
        type: string
        default: npm ci
      self-check:
        description: >-
          The check-run name this job appears under on the PR, which for a
          called workflow is `<caller job id> / <this workflow's job id>`. The
          CI wait below polls every check on the head commit and has to
          recognise its own, or it waits for itself: the whole 15 minutes of
          its CI wait, then a review with the degraded evidence
          jeffwlawson/winget-manifest-lint#48 exists to prevent. Nothing inside
          a called workflow can read its caller's job id, hence an input — and
          required rather than defaulted, because a default that is wrong fails
          exactly this quietly.
        required: true
        type: string
      # The red check (#231, PRD #212): the `red-check` job below runs the
      # tests a pull request adds or changes against the code as it was before
      # the change, and reports which of them fail there. Off unless
      # configured: with `red-check-command` empty, the default, the job is
      # skipped and the review runs as it did before. The other two must be set
      # with it, and the job says so where one is missing.
      red-check-command:
        description: >-
          The command that runs the tests for the red check and writes a JUnit
          XML report, such as `npx vitest run --reporter=junit
          --outputFile=junit.xml` or `pytest --junitxml=junit.xml`. Under
          jest-junit, set `JEST_JUNIT_REPORT_TEST_SUITE_ERRORS=true`, or a test
          file that fails to import is left out of the report. Empty, the
          default, turns the red check off. It runs on the merge-base's source
          (on a PRD PR's slice round, the PRD branch's as it stood before the
          slice) with the pull request's test files put over it, in a job
          holding no secrets. The test files are in `RED_CHECK_FILES`, one a
          line, for a command that runs only those. Like `setup`, this is a *command*:
          pass a literal from your workflow file, never an expression that
          reads the event.
        type: string
        default: ""
      red-check-report:
        description: >-
          Where `red-check-command` writes its JUnit XML report, relative to the
          repository root.
        type: string
        default: ""
      red-check-test-globs:
        description: >-
          Globs that tell test files from source files, one a line, matched
          the way `.gitignore` matches (`tests/**`, `**/*.test.ts`). The test
          files a pull request adds or changes are put over the merge-base;
          every other file comes from the merge-base.
        type: string
        default: ""
      transcript-retention-days:
        description: >-
          Days the agent's Claude Code session transcript is kept, as this
          run's `agent-transcript` artifact, with every secret the job holds
          redacted. 0 turns the upload off. On a public repository the
          artifact is readable by anyone who can see the repository; see
          docs/ADOPTING.md §2d.
        type: number
        default: 3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the review agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT, used to mark the PR ready for review — `GITHUB_TOKEN`
          cannot do that whatever permissions it is granted (docs/ADOPTING.md
          §1) — and to add the labels this workflow adds for another to fire
          on: `agent:fix` for an automatic fix round, and `agent:implement` on a PRD
          PR's parent when a slice round ends on an approval; and to post the
          park comment on that parent when a round ends without one. Optional:
          without it each of those warns, the run stays green, and a human does
          it by hand. The loop's App, where it is set up, takes its place.
        required: false
      AGENT_APP_ID:
        description: >-
          The loop's GitHub App's ID. With `AGENT_APP_PRIVATE_KEY`, the posting
          and advance jobs each mint a token for this repository from the App
          and make the writes `AGENT_PAT` would make with it, as the App's bot.
          Optional; without both, `AGENT_PAT` is used as before.
        required: false
      AGENT_APP_PRIVATE_KEY:
        description: The loop's GitHub App's private key. See `AGENT_APP_ID`.
        required: false

jobs:
  # The review's time limit (#220): its CI wait plus its own time, so a slow CI
  # no longer eats the review. Its own time is the repository variable
  # `AGENT_REVIEW_TIMEOUT_MINUTES`, 5 where it is unset, which with the 15
  # minutes of the wait is the 20 this job had before it was a sum.
  #
  # **A job, because an expression cannot add.** `timeout-minutes` may read
  # `vars` and `needs` and nothing a step computes, and GitHub's expression
  # language has no arithmetic, so the sum is done here and handed across as an
  # output. It runs where the review does, the same two guards, and holds no
  # permission at all: it reads one variable and writes one number, and the
  # token source below.
  #
  # **And which token the posting job will write with** (#316, #320), which the
  # fix-round budget reads: a label added with the workflow token starts no
  # round. The review job runs the agent, which can read its runner's memory,
  # and that memory holds every secret the job names, a comparison against
  # `''` included. So the resolver chooses here, where no agent runs, minting
  # nothing (`choose-only`), and only the source it reports crosses.
  #
  # **It never fails.** A failed job here would skip the review silently, which
  # is the class this issue is about. A value that is not a positive integer is
  # summed as the default instead, and `review:gate` refuses it where it can
  # say so: on the pull request, naming the variable, as the fix-round budget
  # is refused. The gate reads the variable itself, so nothing here hands a
  # verdict on it across.
  time-limit:
    if: >-
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      minutes: ${{ steps.limits.outputs.minutes }}
      token-source: ${{ steps.token.outputs.source }}
    steps:
      - name: Add the CI wait to the review's own time
        id: limits
        env:
          REVIEW_MINUTES: ${{ vars.AGENT_REVIEW_TIMEOUT_MINUTES }}
          # `CI_WAIT_SECONDS` in `review:collect-checks`, in minutes. A test
          # holds the two equal.
          CI_WAIT_MINUTES: "15"
        run: |
          own="${REVIEW_MINUTES:-5}"
          if [[ ! "$own" =~ ^[1-9][0-9]*$ ]]; then
            own=5
          fi
          echo "Review time limit: ${CI_WAIT_MINUTES} minutes of CI wait and ${own} of its own."
          echo "minutes=$((CI_WAIT_MINUTES + own))" >> "$GITHUB_OUTPUT"

      # The same choice the posting job's resolver makes, from the same
      # secrets, so the two cannot disagree; but no token.
      - name: Say which token the loop writes with
        id: token
        uses: jeffwlawson/agent-workflows/.github/actions/loop-token@v0.8.2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          agent-pat: ${{ secrets.AGENT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          choose-only: "true"

  # The red check (#231, PRD #212): the tests a pull request adds or changes,
  # run against the code as it was **before** the change, so the review can
  # check that a fix is covered by a test that was red rather than take the PR's
  # word for it. Off unless `red-check-command` is set.
  #
  # Two commands (#422), on either side of the adopter's own install and test
  # command, which stay their steps: `review:red-check-place` puts the PR's
  # test files over the merge-base, or on a PRD PR's slice round over the PRD
  # branch before the slice, and `review:red-check-classify` reads the JUnit
  # report the command writes and classifies each test as red, broken or
  # passed. `review/red-check-place.ts` and `review/red-check-classify.ts` say
  # why each is as it is.
  #
  # **It runs the pull request's code**, so it carries the review's fork guard,
  # holds **no secret**, and checks out without persisting the token. And
  # after that code runs it could have changed anything on the runner. So the
  # package is installed **before** any of it runs, by the one step handed the
  # registry token, and nothing after is handed a token: not the adopter's
  # steps, and not `classify`, which reuses that install. What the PR's code
  # gains by tampering with it is the power to forge its own report, which its
  # tests already have. An install it removed fails `classify`, which leaves
  # no report, and the review reads that as unreadable, never as "no red
  # tests". Nothing it produces is trusted beyond its report, the
  # `agent-red-check` artifact: no job reads its outputs, and the report is
  # evidence for the review, read as data. Its own label guard too, so it runs
  # only where the review does.
  #
  # **And it never stops the review.** The review `needs:` it so the report is
  # there to read, but runs whether this job was skipped, failed or timed out,
  # and the CI wait excludes its check run, so it never feeds the CI result.
  red-check:
    if: >-
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      inputs.red-check-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Installing the package. GitHub Packages has no anonymous install, so
      # this is needed even though the package is public, and only the install
      # step is handed the token that carries it.
      packages: read
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.default-branch }}
    steps:
      # `fetch-depth: 0` brings every branch with it, so the base branch is
      # there for the merge-base without a second, authenticated fetch. And
      # `persist-credentials: false`, so the token this checkout used is not
      # left in `.git/config` for the tests below to read.
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Node and the registry the package installs from, before the adopter's
      # toolchain, as the review job sets them up for its gate: a version the
      # package's `engines.node` names, and no cache, since this job runs the
      # PR's code and a cache it saved would be restored on the base branch.
      - name: Set up Node for the package
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # That step points `NPM_CONFIG_USERCONFIG` at the `.npmrc` it wrote, for
      # every later step in the job (#429), the adopter's *Install dependencies*
      # included, whose own `~/.npmrc` and any login in it would go unread. So
      # the job's setting goes back to npm's default here, and the path comes
      # out as `userconfig`, handed in `env:` to each step that installs or
      # runs the package. The file `setup-node` wrote, never a second copy.
      - name: Keep the package's registry to the package's steps
        id: npmrc
        run: |
          echo "userconfig=${NPM_CONFIG_USERCONFIG}" >> "$GITHUB_OUTPUT"
          echo "NPM_CONFIG_USERCONFIG=${HOME}/.npmrc" >> "$GITHUB_ENV"

      # The package, installed into `RUNNER_TEMP` while nothing of the PR's has
      # run, so the two commands below find it there and never ask the
      # registry: `npm exec` takes a package already installed under its
      # `--prefix` at the exact version it names without a request, and a
      # request without the token is refused. The one step handed the token.
      # From `RUNNER_TEMP` too, so no `.npmrc` of the checkout is read.
      - name: Install the package
        working-directory: ${{ runner.temp }}
        env:
          # Reads the `.npmrc` *Set up Node for the package* wrote.
          # `GITHUB_TOKEN`, carrying the `packages: read` above: there is no
          # anonymous install.
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --prefix "$RUNNER_TEMP" --no-save @jeffwlawson/agent-workflows@0.8.2

      # The tree the tests run on (#231, #235). It runs from `RUNNER_TEMP`,
      # where `npm exec` finds the install's binary, and works in the checkout,
      # which is `CHECKOUT`. The body and the branch reach it through `env:`,
      # never inline: they are the pull request's to write.
      - name: Put the PR's test files over the merge-base
        id: place
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          OUTPUT_DIR: ${{ runner.temp }}/red-check-place
          CHECKOUT: ${{ github.workspace }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPORT_PATH: ${{ inputs.red-check-report }}
          TEST_GLOBS: ${{ inputs.red-check-test-globs }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.2 -- agent-workflows review:red-check-place

      # Glue only Actions can do (ADR 0003): whether there is anything to run,
      # copied from `place.json` into the step output the steps below are
      # gated on. Nothing where it wrote none.
      - name: Hand the placement to the job
        id: placed
        run: |
          file="${RUNNER_TEMP}/red-check-place/place.json"
          [ -f "$file" ] || { echo "review:red-check-place wrote no place.json; nothing was placed."; exit 0; }
          echo "status=$(jq -r .status "$file")" >> "$GITHUB_OUTPUT"

      # The adopter's toolchain, as the review job sets it up, with one
      # difference: no cache. This job runs the PR's code, and a cache it saved
      # would be restored into every later run on the base branch, the review's
      # included. So no `cache:`, and `package-manager-cache: false`, since
      # `setup-node` caches by itself where `package.json` names a
      # `packageManager`.
      - name: Setup Node.js
        if: steps.placed.outputs.status == 'ready' && inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          package-manager-cache: false

      # The merge-base's dependencies, by the same command the review installs
      # with. A literal from the caller's workflow file, as there.
      - name: Install dependencies
        id: setup
        if: steps.placed.outputs.status == 'ready' && inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      # The command reaches the shell through `env:`, so its exit code can be
      # kept: a failing test is the result this job is looking for, not a
      # failure of the job. A report left in the merge-base's tree is removed
      # first, so one the command did not write is never read as its. The
      # test files placed reach it as `RED_CHECK_FILES`, one a line.
      - name: Run the tests against the merge-base
        id: run
        if: steps.placed.outputs.status == 'ready'
        env:
          RED_CHECK_COMMAND: ${{ inputs.red-check-command }}
          REPORT_PATH: ${{ inputs.red-check-report }}
        run: |
          rm -f -- "$REPORT_PATH"
          RED_CHECK_FILES="$(jq -r '.files[]' "${RUNNER_TEMP}/red-check-place/place.json")"
          export RED_CHECK_FILES
          code=0
          bash -e -c "$RED_CHECK_COMMAND" || code=$?
          echo "The test command exited ${code}."
          echo "exit-code=${code}" >> "$GITHUB_OUTPUT"

      # The report, `RUNNER_TEMP/red_check.json`, written whatever happened
      # above, so the review can tell "no red test" from "the check did not
      # run". The install `place` used, from `RUNNER_TEMP`, and **no token**:
      # the PR's code has run. Where that code removed the install, `npm exec`
      # asks the registry, is refused, and the step fails with no report.
      - name: Classify each test as red, broken or passed
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          OUTPUT_DIR: ${{ runner.temp }}
          CHECKOUT: ${{ github.workspace }}
          REPORT_PATH: ${{ inputs.red-check-report }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
          PLACE_DIR: ${{ runner.temp }}/red-check-place
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.2 -- agent-workflows review:red-check-classify

      # The report, for the review job to pick up. `always()`, because a run
      # that could not place, install or run anything is still a report.
      - name: Hand the report to the review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-red-check
          path: ${{ runner.temp }}/red_check.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  review:
    # Two guards, both required:
    #  - the trigger label, and
    #  - same-repo head: a fork PR must never reach the checkout+npm ci steps,
    #    which would run untrusted code with secrets in scope.
    if: >-
      !cancelled() &&
      needs.time-limit.result == 'success' &&
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # `red-check` (#231) is a need so that its report exists before the review
    # starts, and only for that: `!cancelled()` drops the implicit "every need
    # succeeded", so a red check that was skipped, failed or timed out never
    # stops the review. `time-limit` is still required to have succeeded, which
    # is what that implicit check gave it.
    needs: [time-limit, red-check]
    runs-on: ubuntu-latest
    # The sum `time-limit` made, which is the repository variable where it is set
    # and today's 20 where it is not. `needs` is among the contexts this key may
    # read. The failure step below names the same figure.
    timeout-minutes: ${{ fromJSON(needs.time-limit.outputs.minutes) }}
    # One group per PR, shared with agent-fix and agent-update-branch. Review is
    # `contents: read` and cannot push, but that is not what the group protects
    # against: the hazard is review *reading* a branch while a fix is writing to
    # it, which produces a confident review of a tree state that never existed.
    # Review used to sit in its own `agent-review-pr-*` group and that race was
    # live (docs/parity.md §10, jeffwlawson/winget-manifest-lint#102).
    concurrency:
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # What the `post-review` job below reads (#257). This job runs the model and
    # posts nothing: every write the run makes is that job's, after this one
    # has ended. So everything it decides crosses as an output, or, for the
    # files the runner wrote, as the `review` artifact (*Hand the review to the
    # posting job*).
    outputs:
      # Whether the gate let the run go ahead, and if not, what to say.
      # `blocked` is whether the refusal also adds `agent:blocked`.
      proceed: ${{ steps.state.outputs.proceed }}
      refusal: ${{ steps.state.outputs.refusal }}
      blocked: ${{ steps.state.outputs.blocked }}
      # The commit this run reviewed, which every status and the moved check
      # are about (#229).
      sha: ${{ steps.state.outputs.sha }}
      # The verdict's machine-readable key, out of the file the runner wrote,
      # and whether the review asked for an automatic fix round, which the
      # hand-off selects on. See *Hand the verdict to what reads it*.
      verdict: ${{ steps.verdict.outputs.verdict }}
      fix-round: ${{ steps.verdict.outputs.fix-round }}
      # Where a review that recommends changes asked for no round, which of
      # #200's stops kept it from asking, empty where none did; and the budget
      # and the rounds spent the count decided from, the rounds empty where
      # they could not be counted. What `review:conclude` says no round is
      # starting with (#425).
      stop: ${{ steps.verdict.outputs.stop }}
      fix-round-budget: ${{ steps.budget.outputs.budget }}
      fix-rounds-spent: ${{ steps.budget.outputs.spent }}
      # On a PRD PR, `slice` or `final`, which the ready mark and the advance
      # job select on. See *Settle what this run reviews*.
      round: ${{ steps.state.outputs.round }}
      # How the run ended, for the posting job's failure comment: the reason a
      # failed runner wrote, the refusal a variable met, and whether a cancel
      # was the time limit. See *Hand the outcome to the posting job*.
      failure-reason: ${{ steps.outcome.outputs.failure-reason }}
      refusal-reason: ${{ steps.outcome.outputs.refusal-reason }}
      timed-out: ${{ steps.outcome.outputs.timed-out }}
    # **Read-only, every scope** (#257). This job reads untrusted pull-request
    # content and runs a model over it, so it holds no write at all: not
    # `contents: write`, which is what stops a wrong review touching the branch
    # (docs/parity.md §10), and not the pull-request, status and label writes
    # it held until the posting job took them. A model that could be talked
    # into a call has nothing here to make it with.
    #
    # The caller declares the union of every job's scopes, and that is not the
    # duplication it looks like: the two blocks do opposite jobs. A called
    # workflow can only *downgrade* the token it is handed, so this block is the
    # bound and cannot be widened from the caller's side. That is why the
    # caller can grant `contents: write` and `pull-requests: write` for the
    # posting job while this job still holds `read`. The caller's block is the
    # grant, and a scope declared only here grants nothing, but what that costs
    # is the run rather than the step: GitHub refuses the elevation instead of
    # trimming the job to fit, so a caller short of any scope in this block
    # fails the **whole run** before any job starts, with no job log in it
    # (probed, #146). Not a review that half works; no review at all, which is
    # what `setup/doctor.ts` tells an adopter before a label rather than after
    # one.
    permissions:
      # Reading the check runs the CI wait below polls. On a **public**
      # repository they are readable without this scope, which is why every
      # repo in the pilot worked without it; on a private one the same call
      # 403s `Resource not accessible by integration`. Latent since v0.1.0 and
      # found by the first private adopter to run this loop. That history is
      # about the **poll**, and it is not what a caller short of the scope gets:
      # this job declares it, so such a caller is refused before any job starts,
      # on a public repository too (probed, #146).
      checks: read
      # Reading this commit's workflow runs, which is the only surface a run
      # that is queued or **waiting for approval** shows on: it has created no
      # check run yet (#221). Since 2026-06-11 a push made with `GITHUB_TOKEN`
      # starts runs that wait for approval, so without this the CI wait saw
      # nothing and read the commit as green. The failure-log tail reads run
      # logs under the same scope, which #80 once declined it for. Like every
      # scope here, a caller that does not grant it is refused before any job
      # starts (#146).
      actions: read
      contents: read
      # Reading the linked issue, its trusted comments and a PRD's sub-issues:
      # the spec and acceptance criteria the review is handed, and the PRD
      # branch the progress table, the slice round and its fix-round budget
      # (#331) are read off. A
      # **public** repository serves all three without the scope, so its
      # absence showed only on a private one, and only as warnings: every
      # review there was handed no criteria, and the progress table was never
      # written at a round's end, leaving a reviewed slice "In review" beside
      # the next one building (#348).
      issues: read
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read
      # The gate's read of the head and the body, the budget's of the commits
      # and reviews its count attributes, and the runner's of the threads,
      # reviews and comments it hands the agent.
      pull-requests: read
      # The budget's count of the fix rounds already started, which are
      # commit statuses, and the CI wait's read of the statuses CI posts.
      statuses: read

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # The PR's real base branch. review-context.ts diffs HEAD against this so
      # the inline-comment allow-list matches GitHub's PR diff exactly; a
      # hardcoded `main` mis-filters any PR stacked on another branch
      # (jeffwlawson/winget-manifest-lint#71). The event field is the source;
      # `default-branch` is the fallback for an event that somehow carries none,
      # which is the adopter's call to make rather than a literal `main` buried
      # in a shell expansion.
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.default-branch }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # The clock the failure step reads a time limit off (#220). A job that
      # reaches its `timeout-minutes` is cancelled, not failed, and nothing in
      # the `job` context says which cancellation it was, so that step compares
      # how long the job ran with its limit. First, so it starts as near the
      # job's own start as a step can.
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # `review:gate` runs before the checkout, so nothing of the adopter's
      # toolchain is here yet: Node and the registry the package installs from,
      # set up for the gate alone. A version rather than a version file, since
      # there is no checkout to read one from: the one the package's
      # `engines.node` names, which `tests/workflows.test.ts` holds it to.
      # *Authenticate to GitHub Packages* below sets the registry up again for
      # the runner, after the adopter's own Node.
      - name: Set up Node for the gate
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # That step points `NPM_CONFIG_USERCONFIG` at the `.npmrc` it wrote, for
      # every later step in the job (#429), the adopter's *Install dependencies*
      # included, whose own `~/.npmrc` and any login in it would go unread. So
      # the job's setting goes back to npm's default here, and the path comes
      # out as `userconfig`, handed in `env:` to each step that runs the
      # package before *Authenticate to GitHub Packages* sets it up again. The
      # file `setup-node` wrote, never a second copy.
      - name: Keep the package's registry to the package's steps
        id: npmrc
        run: |
          echo "userconfig=${NPM_CONFIG_USERCONFIG}" >> "$GITHUB_OUTPUT"
          echo "NPM_CONFIG_USERCONFIG=${HOME}/.npmrc" >> "$GITHUB_ENV"

      # Everything this job settles before its checkout, as one command
      # (#420): the pre-flight, which refuses a closed, merged or moved pull
      # request and settles **which commit this run reviews**; a time limit
      # that is not a positive integer; the fix-round budget's value; and, on
      # a PRD PR, a slice round or the final review. The rounds spent against
      # the budget are *Count the fix rounds this round has spent*, after the
      # checkout (#331). `review/gate.ts` says why each
      # is as it is, the reasons #228 and #229 gave the pre-flight included.
      #
      # It writes nothing to the record: this job holds no write (#257), so a
      # refusal is decided here and said by the posting job. What it decided
      # is its `gate.json`, which the step below copies into this job's step
      # outputs. A variable it refuses fails the step, after writing
      # `refusal_reason.txt`, which *Hand the outcome to the posting job*
      # reads, so the comment says this run didn't run and names it (#253).
      #
      # `HEAD_SHA`, `PR_STATE` and `PR_MERGED` are the pull request as the
      # label's event saw it; the branch tip and the pull request's head and
      # body the command reads itself, with this job's read-only token. The
      # budget and the time limit are the caller's
      # repository variables, since a `vars.*` read in a reusable workflow
      # resolves against the **caller's** repository ("the variables from the
      # caller workflow's repository are used", *Reusing workflow
      # configurations*), so an adopter sets each once and neither caller set
      # carries a `with:` line for it.
      - name: Settle what this run reviews
        id: gate
        env:
          # Reads the `.npmrc` *Set up Node for the gate* wrote. `GITHUB_TOKEN`,
          # carrying the `packages: read` the caller granted: there is no
          # anonymous install.
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_TIMEOUT_MINUTES: ${{ vars.AGENT_REVIEW_TIMEOUT_MINUTES }}
          MAX_FIX_ROUNDS: ${{ vars.AGENT_MAX_FIX_ROUNDS }}
        # `npm exec --prefix` rather than a bare `npx`: see the long note on the
        # runner step below.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.2 -- agent-workflows review:gate

      # Glue only Actions can do (ADR 0003): the gate's decisions, copied into
      # step outputs under the names every later `if:`, the budget count, the
      # runner and the posting job read: `proceed`, `refusal`, `blocked`,
      # `sha`, `budget` and `round`. `always()`, so a gate that refused a
      # variable after settling the commit still hands over the commit the
      # error verdict goes on; nothing where it wrote no `gate.json`.
      - name: Hand the gate's decisions to the job
        id: state
        if: always()
        run: |
          file="${RUNNER_TEMP}/gate.json"
          [ -f "$file" ] || { echo "review:gate wrote no gate.json; this run decided nothing."; exit 0; }
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$file" >> "$GITHUB_OUTPUT"

      # The commit the pre-flight settled on, not the payload's (#229). Still an
      # explicit `ref:`, which is what keeps `actions/checkout`'s own fork check
      # on; the job's `if:` is the other half.
      #
      # And no credential left in the checkout. The token is this job's, which
      # reads and cannot write, but the agent below reads the PR's own text,
      # and on a private repository a token lifted from the checkout reads the
      # code and the Actions logs from anywhere until the job ends. The base
      # fetch carries it itself instead. red-check's checkout persists none either.
      - name: Checkout PR head
        if: steps.state.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.state.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Make the PR base available for diffing
        if: steps.state.outputs.proceed == 'true'
        # Create a local ref for the PR's base branch (the checkout is of one
        # commit, so the base is not present). review-context.ts diffs against
        # it; a bare `git fetch origin <ref>` would populate FETCH_HEAD but no
        # named ref, so keep the refspec. Falls back to `main` when base.ref is
        # somehow empty, matching diffCommandAgainstBase's own default.
        #
        # A ref name may legally contain `$()`, backticks, `;`, `|` and `&`, so
        # jeffwlawson/winget-manifest-lint#75 asked whether this line is
        # shell-safe. It is, and the two reasons are both load-bearing — keep
        # them if you edit this:
        #   1. BASE_REF arrives as an `env:` var, NOT as a `${{ }}` interpolated
        #      into the run script. Interpolation would splice the ref into the
        #      script *source*, where it would be parsed as syntax; an env var
        #      is only ever data.
        #   2. `"${BASE_REF}"` expands in one pass. POSIX shells do not re-scan
        #      an expansion result for command substitution or operators — only
        #      word splitting and globbing, which the double quotes suppress.
        #      Verified 2026-08-02 against sh and bash with the values above:
        #      each reached git verbatim as a single argument.
        # So the quotes are not decorative; dropping them, or switching to
        # `${{ github.event.pull_request.base.ref }}` inline, breaks this.
        #
        # The `:-main` this line used to carry is gone, not lost: the fallback
        # moved up to the `env:` block, where it is the `default-branch` input
        # rather than a literal only this repo could be right about.
        #
        # The checkout persists no credential, so the fetch carries the job's
        # token itself, as a masked header on this one command.
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" fetch origin "+refs/heads/${BASE_REF}:refs/heads/${BASE_REF}"

      # **The fix-round budget** (#201, PRD #200): the automatic fix rounds
      # already spent against the budget the gate settled, and whether a
      # review that recommends changes starts another. `review/budget.ts`
      # says why each part is as it is.
      #
      # After the checkout, because on a PRD PR the budget is the **round's**
      # (#331): each slice round, and the final review, has its own, and
      # which slice is current is read off the checkout's history against the
      # base fetched above, by the same reading the review's header scope
      # comes from. A status counts toward the round its linked review's
      # header names, never by the commit it stands on. Off a PRD PR the
      # rounds are the pull request's, as they always were.
      #
      # Before the adopter's toolchain and the agent, with this job's
      # read-only token: it decides what the runner may ask for, so it runs
      # where neither has run yet. The statuses and reviews it counts, and a
      # PRD's sub-issues, it reads itself. Which token the loop writes with
      # comes from `time-limit`, so this job never names a secret that writes
      # (#316). What it decided is its `budget.json`, copied into step outputs
      # below, for the runner. A count it cannot read is no round started and
      # a warning, never zero spent.
      - name: Count the fix rounds this round has spent
        if: steps.state.outputs.proceed == 'true'
        env:
          # Reads the `.npmrc` *Set up Node for the gate* wrote. `GITHUB_TOKEN`,
          # carrying the `packages: read` the caller granted.
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
          FIX_ROUND_BUDGET: ${{ steps.state.outputs.budget }}
          ROUND: ${{ steps.state.outputs.round }}
          LOOP_TOKEN_SOURCE: ${{ needs.time-limit.outputs.token-source }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.2 -- agent-workflows review:budget

      # Glue only Actions can do (ADR 0003): the count's decisions, copied
      # into step outputs under the names the runner reads, `budget`, `spent`
      # and `start`.
      - name: Hand the budget to the runner
        id: budget
        if: steps.state.outputs.proceed == 'true'
        run: |
          file="${RUNNER_TEMP}/budget.json"
          [ -f "$file" ] || { echo "review:budget wrote no budget.json; no fix round starts."; exit 0; }
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$file" >> "$GITHUB_OUTPUT"

      # Both setup steps are the adopter's toolchain, so both are skippable.
      # `npm install -g @anthropic-ai/claude-code` below is not: that is the
      # agent's own runtime, and every runner image already has the Node it
      # needs for it.
      - name: Setup Node.js
        if: steps.state.outputs.proceed == 'true' && inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, which `pull_request_target` reads
      # from the base branch, and never an expression reading the PR event.
      - name: Install dependencies
        if: steps.state.outputs.proceed == 'true' && inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        if: steps.state.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Wait for the PR's other checks, then hand their results to the agent
      # (#421). `review/collect-checks.ts` says why each part is as it is: the
      # sibling jobs left out of the wait, the bounded wait and its grace
      # period, the three surfaces it reads, and a CI run waiting for approval
      # reading as unknown.
      #
      # On the commit the gate settled, read with this job's read-only token.
      # `SELF_CHECK` is this job's own check run, which the caller was made to
      # state, and `SELF_RUN_ID` this run, the caller's, since a called
      # workflow contributes none of its own: neither is CI. Its own
      # directory, so a reason it fails with never lands where *Hand the
      # outcome to the posting job* reads the runner's; the runner reads its
      # two files from there as `CI_STATUS_FILE` and `CI_RESULT_FILE`.
      #
      # `continue-on-error`: missing CI context degrades the review, it does
      # not invalidate it. A command that never wrote leaves no result, which
      # the runner reads as unknown.
      - name: Wait for other checks, collect results
        if: steps.state.outputs.proceed == 'true'
        continue-on-error: true
        env:
          # Reads the `.npmrc` *Set up Node for the gate* wrote. `GITHUB_TOKEN`,
          # carrying the `packages: read` the caller granted.
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}/collect-checks
          REVIEWED_SHA: ${{ steps.state.outputs.sha }}
          SELF_CHECK: ${{ inputs.self-check }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.2 -- agent-workflows review:collect-checks

      # The red check's report (#232), the `red-check` job's artifact, read as
      # evidence the way the CI results above are. Into a directory of its own,
      # so nothing it holds lands beside a file this job writes.
      #
      # Only where the check is configured, and `continue-on-error`: a report
      # that never arrived (the job timed out, or failed before its upload)
      # leaves no file, which the runner reads as *unknown*, never as "no red
      # tests". `RED_CHECK_CONFIGURED` below is what keeps that apart from a
      # check that is off, which leaves no file either.
      - name: Fetch the red check's report
        if: steps.state.outputs.proceed == 'true' && inputs.red-check-command != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: agent-red-check
          path: ${{ runner.temp }}/red-check

      # The runner package is published to **GitHub Packages**, not npmjs, so the
      # `npx` below resolves from `https://npm.pkg.github.com` and needs a token.
      # `actions/setup-node` writes the `.npmrc` rather than this file doing it by
      # hand — a hand-written one is a second place for the scope to be wrong, and
      # the way it is wrong is a 401 that reads like a bad token.
      #
      # Two properties to keep if you edit this. The registry entry is scoped to
      # `@jeffwlawson` **only**, so a caller's own `npm ci` still resolves
      # everything else from npmjs untouched. And `NODE_AUTH_TOKEN` is
      # unconditional: GitHub Packages has no anonymous install *even for a public
      # package*, so the caller's `packages: read` is a grant this step cannot do
      # without, rather than a consequence of the package's visibility.
      #
      # No `node-version-file` here on purpose: this is the registry half of
      # `setup-node`, not the toolchain half, so it still runs on a repo that
      # passed `node-version-file: ''`. It comes *after* the toolchain step for
      # the same reason — both write the same `.npmrc`, and the last one wins.
      #
      # `package-manager-cache: false` states that same thing to the action.
      # From v5 it caches on its own when the repository's `package.json`
      # carries a `packageManager` field, and the input that switches that off
      # has defaulted to `true` since that same release; v6 and v7 only widen
      # the detection to `devEngines.packageManager`. So a step written to do no
      # toolchain work starts doing some. On an adopter whose manifest names npm
      # with no root lockfile, the restore throws `Dependencies lock file is not
      # found` and fails this step before the runner exists to write
      # `failure_reason.txt`, leaving a run that says only `(no reason file
      # written)`. It would also add a cache *save* to a `pull_request_target`
      # job.
      #
      # It was written at the `@v4` pin, which had no such input, and was inert
      # on purpose — the guard the bump lands on rather than a response to it.
      # At the `@v7` pin above the input exists and is honoured. It still
      # changes no behaviour *here*: this repo declares only `engines`, never
      # `packageManager`, so the caching it switches off would never have fired.
      # The step this protects is an adopter's, and this repo cannot reproduce
      # the failure — which is the reason it is asserted rather than observed
      # (`tests/workflows.test.ts`).
      #
      # This is also the one step in the loop that reaches across repositories. A
      # package published from this repo is not automatically readable by another
      # repo's `GITHUB_TOKEN`; that follows from the package's own access settings
      # (docs/ADOPTING.md §4).
      #
      # With `node-version-file: ''` the toolchain step above is skipped, and
      # without a Node named here the runner would run on the image's, below
      # the package's `engines.node` (#335). So it names one in exactly that
      # case and none otherwise, leaving an adopter's own version file to decide
      # the Node their commands run on. `tests/workflows.test.ts` holds it to
      # `engines.node`.
      - name: Authenticate to GitHub Packages
        if: steps.state.outputs.proceed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version-file == '' && '24' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      - name: Run review agent
        if: steps.state.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Reads the `.npmrc` the step above wrote. `GITHUB_TOKEN`, carrying the
          # `packages: read` the caller granted — there is no anonymous install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_REVIEW: ${{ vars.AGENT_MODEL_REVIEW }}
          OUTPUT_DIR: ${{ runner.temp }}
          CI_STATUS_FILE: ${{ runner.temp }}/collect-checks/ci_status.md
          # The evidence and the fact are two files, not one. The first is what
          # the agent reads; the second is what the verdict is derived from, and
          # keeping them apart is what stops the derivation reading prose.
          CI_RESULT_FILE: ${{ runner.temp }}/collect-checks/ci_result.txt
          # The red check's report and whether it is on (#232). Three cases the
          # review keeps apart: off, on with no readable report, and ran. Like
          # the CI evidence, it is never a fact the verdict is derived from.
          RED_CHECK_CONFIGURED: ${{ inputs.red-check-command != '' }}
          RED_CHECK_FILE: ${{ runner.temp }}/red-check/red_check.json
          # What *Count the fix rounds this round has spent* decided of the
          # fix-round budget (#201): whether an automatic fix round starts if this review
          # recommends changes, and the budget and rounds spent it decided from. The derivation adds
          # whether the fix round this review follows made progress (#202),
          # judged from the verdict history and the findings' ids, and picks the
          # verdict row whose key the posting job's hand-off selects on, so the
          # line a maintainer reads and the step that makes it true come from
          # one decision. The two numbers are for the line alone:
          # where the budget is spent, the verdict says how much of it was used.
          AUTO_FIX: ${{ steps.budget.outputs.start }}
          FIX_ROUNDS_SPENT: ${{ steps.budget.outputs.spent }}
          FIX_ROUND_BUDGET: ${{ steps.budget.outputs.budget }}
          # Which round of a PRD PR this is, from *Settle what this run
          # reviews*: `final`, `slice`, or empty off a PRD PR.
          ROUND: ${{ steps.state.outputs.round }}
        # `npm exec --prefix` rather than a bare `npx`, and the prefix is the
        # whole point. `npx pkg@version` reuses a package already present in the
        # working directory when it satisfies the spec — and in the repository
        # that *publishes* this package, the checkout is such a package. It has
        # no `dist/` (CI installs, it does not build), so the bin resolves to
        # nothing and the step dies `command not found` before any runner code
        # runs (#8). Installing into RUNNER_TEMP sidesteps the name collision.
        #
        # A no-op for every consuming repo, which has no package of this name to
        # collide with — verified against npm 10 and 11, both of which ignore
        # `--ignore-existing` here. `--prefix` moves the *install*, not the
        # process `cwd`: the runner still does its git work in the checkout.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.2 -- agent-workflows review

      # The agent's own record of the session (#269), so a run can be profiled
      # and debugged from what it did and not only from the log, which shows
      # some of its tool calls and none of its file reads, edits or thinking.
      # Claude Code writes it under `~/.claude/projects/`, in a directory named
      # after the checkout's path, and it goes with the runner unless something
      # keeps it: sandcastle's own copy does not run without a sandbox.
      #
      # **Redacted, never refused.** An artifact on a public repository is
      # readable by anyone who can see the repository, and the agent's
      # environment holds `CLAUDE_CODE_OAUTH_TOKEN`, so a transcript where it
      # printed that environment carries the token. Every secret this job holds
      # is replaced with `[REDACTED]` in a copy, the job token also in the
      # basic-auth form a checkout's git config holds it in, and only the copy
      # is uploaded. The script is the one every agent workflow runs, and names no
      # PAT: no job that runs an agent holds one (#307, #316).
      #
      # `always()`, so a failed, cancelled or timed-out run keeps its record
      # too, and `continue-on-error`, so the record never fails the run it
      # records. The upload reads the redaction's outcome rather than its own
      # `always()` alone, so a copy the redaction did not finish is never sent.
      # `transcript-retention-days` at 0 turns both off.
      - name: Redact the session transcript
        id: transcript
        if: always() && inputs.transcript-retention-days > 0
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, shutil

          source = pathlib.Path.home() / ".claude" / "projects"
          copy = pathlib.Path(os.environ["RUNNER_TEMP"]) / "agent-transcript"
          shutil.rmtree(copy, ignore_errors=True)

          secrets = []
          for name in ("CLAUDE_CODE_OAUTH_TOKEN", "GITHUB_TOKEN"):
              value = os.environ.get(name, "").encode()
              if not value:
                  continue
              secrets.append(value)
              if name != "CLAUDE_CODE_OAUTH_TOKEN":
                  secrets.append(base64.b64encode(b"x-access-token:" + value))

          files = sorted(source.rglob("*.jsonl")) if source.is_dir() else []
          if not files:
              print("No session transcript to upload: the agent never started.")
          for file in files:
              text = file.read_bytes()
              for secret in secrets:
                  text = text.replace(secret, b"[REDACTED]")
              out = copy / file.relative_to(source)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(text)
              print(f"Redacted {file.relative_to(source)} for upload.")
          PY

      # `overwrite`, so a re-run replaces this attempt's copy rather than
      # failing on the name. Uploading needs no scope: the artifact service
      # takes the runner's own token.
      - name: Upload the session transcript
        if: always() && steps.transcript.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: agent-transcript
          path: ${{ runner.temp }}/agent-transcript
          if-no-files-found: ignore
          retention-days: ${{ inputs.transcript-retention-days }}
          overwrite: true

      # The verdict as something the posting job can select on (#102). The
      # **key**, not the heading or the line, so no rewording moves a selector.
      # And `fix-round`, whether the review asked for an automatic fix round:
      # the row's line is the same whether or not one starts (#297), so the
      # file says it separately, and the automatic fix selects on this. And
      # `stop`, the stop that kept it from asking for one, where one did,
      # which `review:conclude` says on the pull request (#425).
      #
      # An output as well as a file in the artifact, because the posting job's
      # step `if:`s read it, and a step `if:` can read `needs` but not a file.
      # A run that wrote no file hands over nothing, and nothing is handed off,
      # which is the same direction every arm here fails in.
      - name: Hand the verdict to what reads it
        id: verdict
        if: steps.state.outputs.proceed == 'true' && success()
        run: |
          file="${RUNNER_TEMP}/verdict.json"
          [ -f "$file" ] || { echo "No verdict file; nothing to hand over."; exit 0; }
          jq -r '"verdict=\(.verdict)", "fix-round=\(.fixRound)", "stop=\(.stop // "")"' "$file" >> "$GITHUB_OUTPUT"

      # Everything the runner wrote for posting, handed to the posting job
      # (#257): what `review:publish` reads, exactly the files its `REVIEW_DIR`
      # declares (the findings, the body's parts, the threads this review
      # closed, the title and summary where this review rewrites them, and the
      # verdict, as decisions and raw text, ADR 0007). `tests/workflows.test.ts`
      # holds the list to the declaration. A job cannot read another job's
      # `RUNNER_TEMP`.
      #
      # **An artifact rather than an output**, for size. The payload is the
      # body, up to GitHub's 64 KB, plus a thread per finding, and an output
      # reaches the posting job's script as an environment variable, which
      # Linux caps at 128 KB a string: a long review would fail at `exec`, and
      # a short one would not show it. The small decisions stay outputs above.
      #
      # `overwrite`, so a re-run of every job replaces this attempt's copy
      # rather than failing on the name. Uploading needs no scope: the artifact
      # service takes the runner's own token, so this job stays read-only.
      - name: Hand the review to the posting job
        if: steps.state.outputs.proceed == 'true' && success()
        uses: actions/upload-artifact@v7
        with:
          name: agent-review
          path: |
            ${{ runner.temp }}/findings.json
            ${{ runner.temp }}/review_body.json
            ${{ runner.temp }}/thread_resolutions.json
            ${{ runner.temp }}/verdict.json
            ${{ runner.temp }}/pr_summary.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # On a PRD PR, what the runner wrote for `review:advance` (PRD #222),
      # exactly the files its `PARK_DIR` declares: `park.json`, the round, what
      # was open before this review and, once it ruled, its verdict, the
      # reason its round parks and what it leaves open; and `progress.json`,
      # what the PRD PR's progress table and status line are rendered from
      # (#246). Data, not comments or tables (ADR 0007): advance writes every
      # string and marker. `tests/workflows.test.ts` holds the list to the
      # declaration. Both are written before the agent runs, so a failed run
      # has them. Its own artifact and `always()`, because a failed run is one
      # of the endings it is for, and the review's own artifact is uploaded
      # only on success. Either file may be missing; advance says so where it
      # needs one.
      - name: Hand the park data to the advance job
        if: always() && steps.state.outputs.round != ''
        uses: actions/upload-artifact@v7
        with:
          name: agent-review-park
          path: |
            ${{ runner.temp }}/park.json
            ${{ runner.temp }}/progress.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # How this run ended, for the posting job's failure comment (#257), which
      # is where the comment is posted now that this job writes nothing.
      # `always()`, so a failed, refused, cancelled or timed-out run hands it
      # over too: those are the runs it is for.
      #
      # Cancelled is not failed (#220), and a job that reached its limit is
      # cancelled too. What tells the two apart is the clock the first step
      # started: a timed-out job ran its whole limit, less the moment the runner
      # took to reach that step, hence a minute's slack. Measured here because
      # only this job's clock knows. The limit is compared only where it is a
      # positive integer: `fromJSON` accepts `1.5` and `1e1`, which bash
      # arithmetic refuses, and a limit this cannot compare reads as a cancel,
      # which is still said.
      #
      # The two reasons cross as multi-line outputs, under a delimiter nothing
      # in a reason can contain.
      - name: Hand the outcome to the posting job
        id: outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TIMEOUT_MINUTES: ${{ needs.time-limit.outputs.minutes }}
        run: |
          timed_out=false
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "${JOB_STARTED:-}" ] && [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] && [ $(( $(date +%s) - JOB_STARTED )) -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
            timed_out=true
          fi
          echo "timed-out=${timed_out}" >> "$GITHUB_OUTPUT"
          for name in failure_reason refusal_reason; do
            file="${RUNNER_TEMP}/${name}.txt"
            [ -f "$file" ] || continue
            delimiter="REASON_$(date +%s%N)_${RANDOM}"
            {
              echo "${name//_/-}<<${delimiter}"
              printf '%s\n' "$(cat "$file")"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          done

  # Everything this run writes, in one job that runs no model (#257). The review
  # job above reads and decides; this job posts, in the loop's one order for
  # every workflow, settled with the maintainer 2026-09-30: **label on, do the
  # work, post every result, take your own label off, add the next step's
  # label.** So the timeline reads in order, and a hand-off never appears
  # before the step it follows has finished:
  #
  #  1. reply to and resolve the earlier findings the review ruled on;
  #  2. post the review, the overview and the new findings in one call, its
  #     *Resolved since last review* listing only the threads step 1 actually
  #     resolved, and the `agent:follow-ups` marker where it recorded any;
  #  3. the pull request's title and the summary block in its body, where
  #     anything was pushed since the summary was last written (#218);
  #  4. the `agent-review` verdict status;
  #  5. mark the pull request ready, unless a fix round is about to start,
  #     and on a PRD PR only on the final review's approval;
  #  6. take `agent:review` off;
  #  7. hand off: `agent:review` again where the head moved during the run,
  #     else `agent:fix` where the review asked for a round.
  #
  # Steps 1 to 4 are `review:publish` (ADR 0003, #417, #418), a command of
  # the package: it composes every string it posts from the decisions and raw
  # text the review handed over (ADR 0007), and checks every id in them
  # against what it reads from GitHub itself before its first write. Steps 5
  # to 7 are `review:conclude` (#419), which ends every run, success included,
  # and is told how each step before it ended rather than relying on which
  # steps ran: so a hand-off that fails after the review is posted is said as
  # a failed hand-off, and not as a review that did not finish (#399).
  #
  # On a PRD PR the `advance` job below follows this one, and moves the chain
  # on or parks it.
  #
  # And on a failure, or a refusal that needs a maintainer: the comment, then
  # `agent:review` off, then `agent:blocked`, also `review:conclude`'s.
  #
  # What is left in YAML is what only Actions can do (ADR 0003): the mint,
  # Node, the download, the two command steps, a copy of what conclude
  # reports into the job's outputs, and the write logs kept as an artifact.
  #
  # Until #257 these were four jobs. The review job posted the overview, and a
  # `resolve` job resolved the threads afterwards (on #228 the overview landed
  # at 00:18:39 and the replies from 00:18:53), so the overview's *Resolved*
  # section was posted before anything was resolved, and claimed closures that
  # never happened wherever the resolve failed, as on #133. `auto-fix` and
  # `advance` each repeated the guards and waited on the others' results.
  #
  # **The scopes are the union the three jobs held**, plus the status write
  # the review job held, which is why no caller changed: `contents: write`,
  # because `resolveReviewThread` is refused on an installation token without
  # it, and `addPullRequestReviewThreadReply` beside it is not (confirmed
  # 2026-09-24 on a scratch pull request, run 36057777753: the job with
  # `contents: read` was refused FORBIDDEN, the job with `contents: write`
  # resolved); `pull-requests: write` for the review, the comments and the
  # labels; `statuses: write` for the verdict. And `packages: read`, which
  # installs the package `review:publish` runs from: GitHub Packages has no
  # anonymous install. The caller already grants it to the job that calls
  # this workflow.
  #
  # **Why the write scopes are safe here.** This job checks nothing out and
  # runs no model, and what it installs is this release's package, at the
  # version pinned below, with the dependency tree the release shipped. What
  # it posts is built from what the review job wrote, by `review:publish`,
  # which takes the mutation from the engine, the commit from the review
  # job's output, and every id from what it reads from GitHub, and by
  # `review:conclude`, which writes only its own fixed strings and the reasons
  # the steps before it gave. So `contents: write` reaches a job that has
  # nothing to write with, and the loop's token (`.github/actions/loop-token`: the App's,
  # `AGENT_PAT`, or the workflow token), spent only on the labels something
  # fires on and on marking the pull request ready, stays out of the job that
  # reads untrusted pull-request content.
  #
  # **The cost of a short grant is the whole run**, not this job. A caller's
  # `permissions:` is the ceiling for every job it calls, and GitHub refuses an
  # elevation rather than trimming it: a called job asking for more than its
  # caller granted fails the **whole run** before any job starts, as a
  # `startup_failure` with no job log in it. Probed on a real token (#146).
  # What GitHub calls it is an *invalid workflow file*, annotated on the run
  # page as:
  #
  #   Invalid workflow file: .github/workflows/agent-pr.yml#L<the caller's
  #   `uses:` line> — Error calling workflow
  #   '<owner>/<repo>/.github/workflows/review.yml@<sha>'. The nested job
  #   'post-review' is requesting 'contents: write', but is only allowed
  #   'contents: read'.
  #
  # `gh run view` reports it only as "a workflow file issue" and names neither
  # the scope nor the file, so the annotation is the one place it is legible.
  # The line it points at is the caller's `uses:`, not the `permissions:` line
  # that is short, and the job it names is the **called** one; docs/ADOPTING.md
  # §4 writes the same annotation and says the same two things about reading it.
  post-review:
    needs: [time-limit, review]
    # `always()`, so a failed, cancelled or refused review still has its
    # comment, its error status and its label written: this is the only job
    # that can write them. A run cancelled before the review started at all
    # takes the trigger label off too, as the review job's own `always()` step
    # used to. Only a review that never ran, because a guard skipped it, skips
    # this.
    #
    # Both of the review job's guards, restated: `always()` drops the implicit
    # "every need succeeded", and with it the guards a skipped review would
    # otherwise have carried here.
    if: >-
      always() &&
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # What the `advance` job reads: whether the head moved while the review ran,
    # in which case the round has not ended, and the posted review's URL, which
    # the park comment links this round's findings to.
    #
    # Its only outputs, copied from `ended.json`, which `review:conclude`
    # writes: the package never writes `$GITHUB_OUTPUT` (#408).
    outputs:
      moved: ${{ steps.ended.outputs.moved }}
      review-url: ${{ steps.ended.outputs.review-url }}
    # **No concurrency group**, on purpose. `agent-pr-*` holds one waiting run,
    # and a newer arrival evicts it silently (docs/parity.md §10). In the group,
    # this job would queue behind a fix a human labelled while the review ran,
    # could evict that fix, or be evicted itself, and an evicted posting job
    # posts nothing at all. Joining would not even serialise it: a run waiting
    # in the group starts the moment the review job ends, before this job is
    # queued at all.
    #
    # **So the runs that read what this job writes wait for it instead.** The
    # group is released when the review job ends, before anything is posted,
    # and a fix or a branch refresh labelled while the review ran starts then.
    # Unchecked, the fix would read only the previous round's feedback, and the
    # refresh would copy the verdict on the old head before this round's
    # exists. Both wait, as their first step past the pre-flight, while
    # `agent:review` is on the pull request (*Wait for a review's posting to
    # finish*, in `fix.yml` and `update-branch.yml`), and this job takes it off
    # only after every result is posted. The wait is bounded by this job's
    # `timeout-minutes`, so a label nobody will take off costs time and not
    # the run.
    #
    # A fix run shown a thread that already carries its closing reply is told
    # the close is the only thing outstanding on it (`shared/pr-feedback.ts`),
    # and a review that races this job re-verifies such a thread and resolves
    # it without a second reply. The hand-off labels it adds fire runs that do
    # join the group, so the serialisation this loop depends on still happens
    # where the work is.
    permissions:
      # `resolveReviewThread`, and nothing else here: it is refused on an
      # installation token without this scope (#133). No checkout, so there is
      # no branch to write to.
      contents: write
      # The review and its threads, the replies, the comments and the labels.
      pull-requests: write
      # The verdict, posted as a commit status on the reviewed head (#96). A
      # status is not a pull-request write (it is its own scope), so nothing
      # already here covers it, and the caller has to grant it too. Omitting it
      # there does not buy a review with no verdict on it: a caller granting
      # less than this block declares fails the whole run before any job starts
      # (probed, #146), which is what `setup/doctor.ts` reports as an error,
      # before a label rather than after one. `review:publish`, which posts it,
      # warns rather than failing all the same, a posted review is worth more
      # than the line summarising it, so where the token is short for some
      # other reason this is the one failure in this job that looks like the
      # feature simply being switched off.
      statuses: write
      # The package `review:publish` and `review:conclude` run from, installed
      # by `npm exec`.
      packages: read
    # **No job-level `GH_TOKEN`.** A token is handed to the steps that write
    # with it and to no other, so the Node setup, the download and the glue
    # between the steps hold none.
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The token the writes that the workflow token cannot make are made
      # with: the loop's App's, `AGENT_PAT`, or the workflow token, in that
      # order, and `source` says which. Minted on a runner the agent never ran
      # on. Reviews, comments and statuses stay the workflow token's, as
      # `github-actions[bot]`, which is what the loop recognises its own by.
      #
      # **At the job's start** (ADR 0005), so both commands hold it for every
      # write they make. A mint that fails fails the step, and publish, whose
      # `if:` names no status function, is skipped: nothing is posted, and
      # `review:conclude`, told the mint's outcome, says why. Only where a
      # review finished, since every use is on one.
      - name: Resolve the loop's token
        id: token
        if: needs.review.outputs.proceed == 'true' && needs.review.result == 'success'
        uses: jeffwlawson/agent-workflows/.github/actions/loop-token@v0.8.2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          agent-pat: ${{ secrets.AGENT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The Node both commands run on, and the registry they install from. A
      # version rather than a version file, since this job checks nothing
      # out: the one the package's `engines.node` names, which
      # `tests/workflows.test.ts` holds it to. `always()`, since conclude runs
      # on every ending, a refusal, a failed mint and a cancel included.
      - name: Authenticate to GitHub Packages
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # What the review wrote for posting, wherever the review finished, a
      # failed mint included, so what it handed over is here whatever the
      # steps around it did. `!cancelled()` rather than `always()`: a cancel
      # posts nothing more, and conclude says so.
      - name: Fetch what the review wrote
        id: fetch
        if: >-
          !cancelled() &&
          needs.review.outputs.proceed == 'true' && needs.review.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: agent-review
          path: ${{ runner.temp }}

      # Steps 1 to 4 (#417, #418): the earlier findings this review ruled on,
      # replied to and resolved, then the review and its new findings in one
      # call, its *Resolved since last review* naming only the threads that
      # resolved, then `agent:follow-ups` where follow-ups survive in its body,
      # then the title and summary block where this review rewrites them, the
      # status line off a PRD PR, and the verdict as a commit status, with the
      # fix round's beside it where the review asked for one. Every string,
      # context and state is publish's own. `review/publish.ts` says why each
      # is as it is.
      #
      # It reads the hand-over from `REVIEW_DIR`, exactly the files its
      # declaration names, and writes into a directory of its own:
      # `published.json`, the review's URL, the moment it is posted;
      # `write_log.jsonl`, every write as it lands; and `failure_reason.txt`
      # where it stops. The commit it posts on is the review job's `sha`,
      # recorded before the agent ran, and no file the agent's runner wrote
      # names one (ADR 0006). `BRANCH` is the head the event names, which
      # tells a PRD PR, whose status line is the advance job's.
      #
      # Given both tokens: `GH_TOKEN`, the workflow's, which publish posts and
      # reads with, and the loop's, which it holds for the writes that have to
      # start a run. Only on a mint that succeeded, which the implicit
      # `success()` keeps.
      - name: Publish the review
        id: publish
        if: steps.fetch.outcome == 'success'
        env:
          # Reads the `.npmrc` the step above wrote. `GITHUB_TOKEN`, carrying the
          # `packages: read` the caller granted — there is no anonymous install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_TOKEN: ${{ steps.token.outputs.token }}
          LOOP_TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          OUTPUT_DIR: ${{ runner.temp }}/publish
          REVIEW_DIR: ${{ runner.temp }}
          REVIEWED_SHA: ${{ needs.review.outputs.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        # `npm exec --prefix` rather than a bare `npx`: see the long note on the
        # runner step in the review job.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.2 -- agent-workflows review:publish

      # Steps 5 to 7, and every other ending (#419): the refusal's note, or
      # the error verdict and the failure comment, or the block off and the
      # ready mark, and the note that no automatic fix round is starting where
      # one of #200's stops kept the review from asking for one (#425); then
      # `agent:review` off, however the run ended (#236), so
      # it never outlives the run; then the hand-off, `agent:review` again
      # where the head moved while the review ran, else `agent:fix` where the
      # review asked for a round. `review/conclude.ts` says why each is as it
      # is.
      #
      # `always()`: the ending is the point of it. Told the facts, not the
      # conclusions: how the review job ended and what it decided, as its
      # outputs, and the outcome of each step above, so the package works out
      # which ending this is. It reads publish's `published.json` and
      # `failure_reason.txt` from publish's directory, and writes `ended.json`
      # into its own.
      #
      # Given both tokens, the loop's empty where it was not minted, which is
      # one of the endings it reports. Ends red only where a fix round the
      # review asked for did not start, so the job's result still means
      # "everything posted", which the advance job reads.
      - name: Conclude the run
        if: always()
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_TOKEN: ${{ steps.token.outputs.token }}
          LOOP_TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          OUTPUT_DIR: ${{ runner.temp }}/conclude
          PUBLISH_DIR: ${{ runner.temp }}/publish
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PROCEED: ${{ needs.review.outputs.proceed }}
          REFUSAL: ${{ needs.review.outputs.refusal }}
          BLOCKED: ${{ needs.review.outputs.blocked }}
          REVIEWED_SHA: ${{ needs.review.outputs.sha }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          FIX_ROUND: ${{ needs.review.outputs.fix-round }}
          ROUND: ${{ needs.review.outputs.round }}
          FAILURE_REASON: ${{ needs.review.outputs.failure-reason }}
          REFUSAL_REASON: ${{ needs.review.outputs.refusal-reason }}
          TIMED_OUT: ${{ needs.review.outputs.timed-out }}
          TIMEOUT_MINUTES: ${{ needs.time-limit.outputs.minutes }}
          MINT_OUTCOME: ${{ steps.token.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.fetch.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STOP: ${{ needs.review.outputs.stop }}
          FIX_ROUND_BUDGET: ${{ needs.review.outputs.fix-round-budget }}
          FIX_ROUNDS_SPENT: ${{ needs.review.outputs.fix-rounds-spent }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.2 -- agent-workflows review:conclude

      # Glue only Actions can do (ADR 0003): what conclude reports, copied into
      # the job's outputs, which the advance job reads. `always()`, so a run
      # whose hand-off failed still says whether the head moved and where its
      # review is; nothing where conclude wrote no `ended.json`.
      - name: Hand the ending to the advance job
        id: ended
        if: always()
        run: |
          file="${RUNNER_TEMP}/conclude/ended.json"
          [ -f "$file" ] || { echo "review:conclude wrote no ended.json; the advance job reads nothing from this one."; exit 0; }
          jq -r '"moved=\(.moved)", "review-url=\(.reviewUrl // "")"' "$file" >> "$GITHUB_OUTPUT"

      # Every write the two commands made, one line each as it landed, and a
      # last line for how each ended (ADR 0005), kept for whoever audits the
      # run. One artifact, each command's log by the path it declares, and no
      # wildcard. `always()`, since a run that stopped is the one a log is
      # read for, and nothing of a command that never ran.
      - name: Keep the write logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-review-write-log
          path: |
            ${{ runner.temp }}/publish/write_log.jsonl
            ${{ runner.temp }}/conclude/write_log.jsonl
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # The PRD chain's **advance job** (PRD #222), and the one place the chain
  # moves on from or parks at. Every way a slice round or the final review on
  # a PRD PR can end lands here, since on a PRD PR every fix run ends by asking
  # for a review (`fix.yml`'s *Request re-review*): so this job is the whole of
  # it, and `fix` carries no copy.
  #
  # What it does is `review:advance` (#423), a command of the package: the
  # progress table and status line for how the round ended, then
  # `agent:implement` back on the parent on a slice round's approval, or the
  # park comment there on every ending but an approval or a fix round
  # starting. `review/advance.ts` says why each is as it is. What is left in
  # YAML is what only Actions can do (ADR 0003): Node, the token's mint, the
  # download and the command.
  #
  # **Only on a PRD PR**, recognised by its head, from this repository, on the
  # review's own label: the review job's two guards, restated, because
  # `always()` drops them with the rest of "every need succeeded". And only
  # where the review proceeded, since a refusal ended no round, and where the
  # head did not move while the review ran, since the review of the new head
  # decides.
  #
  # **Its shape**: no checkout and no model. `pull-requests: write` for the
  # progress table and the comment on the PRD PR where the parent cannot be
  # written, and `packages: read` for the install, since GitHub Packages has no
  # anonymous one. The caller already grants both. Everything on the parent is
  # the loop's token's, the App's or `AGENT_PAT`
  # (`.github/actions/loop-token`), or nothing there: `issues: write` stays out
  # of this job and every caller's grant (docs/parity.md §10). **No
  # concurrency group**, for the reason the posting job is in none. It cannot
  # cycle: it labels and comments on an issue, never a pull request.
  advance:
    needs: [review, post-review]
    if: >-
      always() &&
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/prd-') &&
      needs.review.outputs.proceed == 'true' &&
      needs.post-review.outputs.moved != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      packages: read
    steps:
      # The Node the command runs on, and the registry it installs from. A
      # version rather than a version file, since this job checks nothing out:
      # the one the package's `engines.node` names, which
      # `tests/workflows.test.ts` holds it to.
      - name: Authenticate to GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # The token everything on the parent is written with: the loop's App's,
      # `AGENT_PAT`, or the workflow token, which can write nothing there, and
      # `source` says which. A mint that fails fails the step, and advance,
      # told its outcome, says so on the PRD PR; the progress table, which the
      # workflow token writes, is written anyway (#330 review).
      - name: Resolve the loop's token
        id: token
        uses: jeffwlawson/agent-workflows/.github/actions/loop-token@v0.8.2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          agent-pat: ${{ secrets.AGENT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # What the runner handed over. Missing where the run failed before it
      # got that far, which advance says in its own words, so a failed
      # download stops nothing.
      - name: Fetch the park data
        if: "!cancelled()"
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: agent-review-park
          path: ${{ runner.temp }}/park

      # The table, then the advance or the park (#423). `!cancelled()`, so a
      # failed mint does not skip it (#330 review): it is one of the endings
      # advance reports. Told the facts, not the conclusions: how the review
      # job and the posting job ended, their outputs and the mint's outcome,
      # so the package works out the ending. It fails where the chain neither
      # moved on nor said where it stands on the parent, so a red job is what
      # says so.
      #
      # Given both tokens: `GH_TOKEN`, the workflow's, which writes the PRD
      # PR, and the loop's, empty where it was not minted, for the parent.
      - name: Advance the PRD chain
        if: "!cancelled()"
        env:
          # Reads the `.npmrc` the step above wrote. `GITHUB_TOKEN`, carrying the
          # `packages: read` the caller granted — there is no anonymous install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_TOKEN: ${{ steps.token.outputs.token }}
          LOOP_TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          OUTPUT_DIR: ${{ runner.temp }}/advance
          PARK_DIR: ${{ runner.temp }}/park
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEW_RESULT: ${{ needs.review.result }}
          POSTING_RESULT: ${{ needs.post-review.result }}
          MOVED: ${{ needs.post-review.outputs.moved }}
          REVIEW_URL: ${{ needs.post-review.outputs.review-url }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          FIX_ROUND: ${{ needs.review.outputs.fix-round }}
          ROUND: ${{ needs.review.outputs.round }}
          MINT_OUTCOME: ${{ steps.token.outcome }}
        # `npm exec --prefix` rather than a bare `npx`: see the long note on the
        # runner step in the review job.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.2 -- agent-workflows review:advance
