name: Publish

# Publishes this package to **GitHub Packages** as `@jeffwlawson/agent-workflows`,
# the version every workflow in the loop pins and resolves with `npx`.
#
# ## Why a tag push
#
# Simplicity, and nothing more load-bearing than that — which is worth stating
# because the previous version of this file argued a `workflow_dispatch`
# deadlock and a "the package is a subdirectory" case, and **both died with the
# migration**. Dispatch could not bootstrap a publish from a pull request while
# this lived in the linter repo; here the workflow is on the default branch from
# the first commit, so that constraint is gone. The package is now the whole
# repository, so there is no second version line to keep tags away from either.
#
# `on: release` is the reasonable alternative and was considered: it buys release
# notes and a visible artifact list, at the cost of a second manual step. One
# maintainer, one package — the tag is enough. Revisit if this ever grows an
# audience that reads changelogs.
#
# The tag is a bare `v*` rather than the old `agent-workflows-v*`: the prefix
# existed to separate this package's versions from the linter's, and there is
# nothing left to separate it from.
on:
  push:
    tags:
      - "v*"

# Two tags pushed close together must not race the registry. `cancel-in-progress:
# false` on purpose — a half-cancelled publish is worse than a queued one.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `environment:` gate. An `environment: publish` job gate is real practice
    # *once required reviewers are configured in repo settings*, and nothing in a
    # workflow file can configure them — an environment with no protection rules
    # is inert, so adding one here would ship the appearance of a gate.
    #
    # `contents: write` is for the Release (#561): creating the `v<version>`
    # Release and uploading the tarball to it are writes to the repository's
    # contents, and nothing else in the job writes there. `packages: write` is
    # the registry publish.
    permissions:
      contents: write
      packages: write

    steps:
      # `fetch-depth: 0` for the ancestor check below: the default shallow clone
      # has no merge-base to compute against, and `--is-ancestor` on a truncated
      # history answers confidently and wrongly.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The guard that makes tag-triggered publishing safe: a tag can be pushed
      # from any commit on any branch, so without this, publishing from code
      # nobody reviewed is one `git tag` away and leaves no trace afterwards.
      #
      # It was deliberately absent while this file lived in the linter repo,
      # because the bootstrap tag had to be pushed on a pull request head — the
      # one commit it would have rejected. That constraint left with the
      # migration, so it lands here at the first opportunity rather than staying
      # a TODO with nothing to force it.
      - name: Require the tagged commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_SHA} is not reachable from origin/${DEFAULT_BRANCH}. Publishing from an unmerged commit would put code on the registry that never landed on the default branch. Merge first, then tag the merge commit."
            exit 1
          fi
          echo "Tagged commit is on ${DEFAULT_BRANCH}."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          # Scoped to `@jeffwlawson` alone, so the `npm ci` below still resolves
          # every other dependency from npmjs.
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"

      # The package now owns its dependencies outright. While it was nested in
      # the linter repo it declared `typescript` but never installed it, and the
      # build resolved `tsc` by walking up into the root's `node_modules` — green
      # only because the two pins happened to match.
      - name: Install dependencies
        run: npm ci

      # The first of two guards, and they catch different mistakes. This one
      # catches a tag naming a version the package does not claim: publishing
      # under it would put a version on the registry that no commit here
      # describes, which is unfindable afterwards.
      - name: Check the tag and the manifest agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tagged="${TAG#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag ${TAG} names version ${tagged}, but package.json declares ${declared}. Retag, or bump the manifest. A published version that disagrees with its tag cannot be traced back to a commit."
            exit 1
          fi
          echo "version=${declared}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${declared}, which tag ${TAG} agrees with."

      # The second, and it runs *after* the first rather than instead of it: this
      # one catches a tag naming a version the registry already has. Re-pushing a
      # moved tag is the likely accident, and it should be a no-op rather than a
      # 409 from the registry surfacing as a red run nobody can act on.
      #
      # It gates the registry publish and nothing after the pack: a version the
      # registry has may still lack its Release (a run whose publish succeeded and
      # whose Release step failed), and the re-run is what attaches it.
      - name: Skip if already published
        id: preflight
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@jeffwlawson/agent-workflows@${VERSION}" version >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@jeffwlawson/agent-workflows@${VERSION} is already published; only its Release is checked."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      # One tarball (#561). The registry, the Release and the bundled-tree check
      # below all read the file this step makes, so what each serves is the same
      # bytes the check held to the lockfile. A new version is packed here, where
      # `prepack` runs the build, so it cannot ship a stale `dist/`. A version the
      # registry already has is fetched from it instead: a re-run attaching a
      # missing Release asset attaches the file that was published, never a
      # second build of it.
      - name: Pack the release
        id: pack
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALREADY_PUBLISHED: ${{ steps.preflight.outputs.already-published }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pack="${RUNNER_TEMP}/pack"
          mkdir -p "$pack"
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            name=$(node -p "require('./package.json').name")
            npm pack "${name}@${VERSION}" --pack-destination "$pack" >/dev/null
          else
            npm pack --pack-destination "$pack" >/dev/null
          fi
          shopt -s nullglob
          tarballs=("$pack"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected one tarball in ${pack}, found ${#tarballs[@]}."
            exit 1
          fi
          tarball="${tarballs[0]}"
          (cd "$pack" && sha256sum "$(basename "$tarball")" > "$(basename "$tarball").sha256")
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      # The release ships its runtime dependencies inside it (#430), as
      # `bundleDependencies`, and npm installs those from the tarball whatever the
      # registry's metadata says. (#414 shipped a shrinkwrap instead, and npm reads
      # one only where the registry sets `_hasShrinkwrap`, which GitHub Packages
      # never does.) `npm pack` bundles whatever `node_modules` holds, so the pack
      # above came from the tree `npm ci` built, and this holds it to the lockfile
      # before anything is published or attached: red here means nothing shipped.
      - name: Check the bundled dependencies match the lockfile
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          unpacked="${RUNNER_TEMP}/unpacked"
          mkdir -p "$unpacked"
          tar -xzf "$TARBALL" -C "$unpacked"
          node scripts/bundled-tree.ts "$unpacked/package"

      # Publishes the checked file as it is. `npm publish` of a tarball runs no
      # lifecycle script and packs nothing, so this is the file the Release gets.
      - name: Publish
        if: steps.preflight.outputs.already-published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL"

      # The tokenless route (#561): GitHub Packages' npm registry wants a token
      # even for a public package, and a public repository's Release assets do
      # not, so `npm install <asset URL>` needs none. Creates the tag's Release if
      # it is absent and uploads the tarball and its `.sha256` only where the
      # Release lacks them, so a re-run where both exist changes nothing and
      # never uploads a second copy. The repository and the tag are the run's
      # own, named by nothing here.
      - name: Attach the tarball to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "Install without a registry token: npm install the tarball attached below, by its URL. Check it against the .sha256 beside it first."
          fi
          attached=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for file in "$TARBALL" "${TARBALL}.sha256"; do
            name=$(basename "$file")
            if grep -qxF "$name" <<< "$attached"; then
              echo "${name} is already attached to ${TAG}."
            else
              gh release upload "$TAG" "$file"
            fi
          done

      # The tokenless install, as the deployment guide gives it: the asset's URL,
      # with every registry credential the job holds taken away. The digest is
      # checked against the attached file, and the installed tree is held to the
      # lockfile the same way the registry install is below.
      - name: Check a tokenless install of the attached tarball
        env:
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/no-credentials.npmrc
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          checker="${GITHUB_WORKSPACE}/scripts/bundled-tree.ts"
          : > "$NPM_CONFIG_USERCONFIG"
          name=$(basename "$TARBALL")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
          download="${RUNNER_TEMP}/download"
          mkdir -p "$download"
          cd "$download"
          curl -fsSL -o "$name" "$url"
          curl -fsSL -o "${name}.sha256" "${url}.sha256"
          sha256sum -c "${name}.sha256"
          prefix="${RUNNER_TEMP}/tokenless"
          npm install --prefix "$prefix" "$url"
          package=$(node -p "require('${GITHUB_WORKSPACE}/package.json').name")
          node "$checker" "${prefix}/node_modules/${package}"

      # The same comparison against what a run installs: the release, from the
      # registry, through `npm exec` in the pin form the reusable workflows use.
      # The package root is two levels above the `agent-workflows` binary's
      # target, `dist/cli.js`. The version is already published when this runs,
      # so red here means "installs of this release do not run its tested
      # tree", not "this release did not ship".
      - name: Check an install of the release runs its bundled dependencies
        if: steps.preflight.outputs.already-published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          checker="${GITHUB_WORKSPACE}/scripts/bundled-tree.ts"
          cd "$RUNNER_TEMP"
          for attempt in 1 2 3; do
            npm view "@jeffwlawson/agent-workflows@${VERSION}" version >/dev/null 2>&1 && break
            sleep 10
          done
          npm exec --yes --package="@jeffwlawson/agent-workflows@${VERSION}" -- \
            sh -c 'node "$1" "$(dirname "$(dirname "$(realpath "$(command -v agent-workflows)")")")"' sh "$checker"
