name: Agent Fix

# The trigger, the token grant and the secrets — the three facts about *this*
# repo the fix job cannot read for itself. Everything else — the fork guard, the
# permissions ceiling, the concurrency group, every step — is in
# agent-fix-reusable.yml, which an adopting repo references instead of copying
# (#98).
#
# Uses pull_request_target so the labeled event fires reliably even when the PR
# is out of date. On a PUBLIC repo that is a fork-code-execution path; the fork
# guard that closes it is a job-level `if:` in the called workflow, where a
# caller can skip it but cannot loosen it and an adopter cannot leave it behind.
#
# `pull_request_target` reads workflow YAML from the *base* branch, so a pull
# request cannot alter this file to change what runs. The called workflow is
# equally out of a PR's reach — but now because of what the `uses:` below is
# **pinned to**, not because it is local. Pin a tag or a SHA, never a branch:
# `@main` would hand a job that runs with your secrets to whatever currently
# sits on another repository's default branch (docs/ADOPTING.md §9).
on:
  pull_request_target:
    types: [labeled]

jobs:
  fix:
    uses: jeffwlawson/agent-workflows/.github/workflows/fix.yml@v0.1.2
    # Granted here, bounded there. A called workflow can only downgrade the
    # token it is handed, so these have to be at least what the job needs.
    permissions:
      contents: write
      # Installing the runner package, which the called job does with `npx` from
      # GitHub Packages. Granted here because a called workflow can only
      # *downgrade* the token it is handed, so the scope has to start in the
      # caller — and unconditional because GitHub Packages has no anonymous
      # install even for a public package. Omit it and the run dies at `npx`
      # with a 401 that reads like a bad token rather than a missing grant.
      packages: read
      pull-requests: write
    # No `with:`. The three inputs (`default-branch`, `node-version-file`,
    # `setup`) default to this repo's values — `main`, `.nvmrc`, `npm ci`.
    #
    # Named rather than `secrets: inherit`, which would hand the called workflow
    # every secret this repository holds. Both are declared in it; AGENT_PAT is
    # optional and an absent one arrives as the empty string, which the
    # `secrets.AGENT_PAT || secrets.GITHUB_TOKEN` fallbacks in it already expect.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}
