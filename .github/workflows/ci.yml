name: CI

# The gate for this repository. It is deliberately small: the package has no
# unit tests of its own yet, and the one failure that has actually shipped from
# here was a *packaging* fault that no amount of source testing would have
# caught.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # `.nvmrc` rather than a literal, and it matters here more than usual: the
      # publish check below only reproduces on the npm that ships with Node 24.
      # Pinning a different version would make this job pass while a publish
      # from the same commit silently loses `bin` (see below).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The regression guard for the 0.1.2 defect, and the one that checks the
      # artefact rather than a log line.
      #
      # 0.1.2 shipped `dist/tests/` — 32 files and 68.8 kB against 24 and 31.0 kB,
      # including an 89 kB workflow test — because the tests moved into this repo
      # while `tsconfig.json` still said `include: ["**/*.ts"]`, and
      # `files: ["dist"]` publishes whatever `tsc` emits. Nothing caught it: the
      # `bin` guard below greps a warning string, and `copy-assets` only skips
      # Markdown.
      #
      # `--ignore-scripts` because the Build step above already produced `dist/`,
      # and letting `prepack` run again prints to stdout and corrupts the JSON.
      - name: The tarball ships the runner and nothing else
        run: |
          set -euo pipefail
          leaked=$(npm pack --dry-run --json --ignore-scripts \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                console.log(JSON.parse(s)[0].files.map(f=>f.path)
                  .filter(p=>/(^|\/)tests?\//.test(p)||/\.test\./.test(p)||/vitest/.test(p))
                  .join('\n'));});")
          if [ -n "$leaked" ]; then
            echo "::error::These files would be published and should not be:"
            printf '%s\n' "$leaked"
            echo "::error::Build with tsconfig.build.json, which excludes tests/ and vitest.config.ts."
            exit 1
          fi
          echo "Tarball carries no test files."

      # The regression guard for the 0.1.0 defect.
      #
      # `npm publish` normalises the manifest before upload and will DROP a
      # `bin` entry whose path begins with `./`, logging it as a warning among
      # several others and then **publishing successfully**. The tarball is
      # unaffected — `dist/cli.js` is present and the packaged package.json
      # still names it — so the only place the damage shows is the registry
      # manifest, and the only symptom is `npx <pkg> <cmd>` finding no command.
      #
      # This cannot be checked by inspecting the tarball, and `npm pack` does
      # not reproduce it. Grepping the publish dry-run's output is the entire
      # available signal, which is why this step exists rather than a test.
      - name: The published manifest must keep its bin entry
        run: |
          set -uo pipefail
          out=$(npm publish --dry-run 2>&1) || true
          echo "$out"
          if printf '%s' "$out" | grep -q 'invalid and removed'; then
            echo "::error::npm publish would strip an entry from package.json. A bin path beginning with './' is the known cause — write it as 'dist/cli.js', not './dist/cli.js'. Publishing in this state succeeds and produces a package whose commands cannot be run."
            exit 1
          fi
          echo "Publish-time manifest normalisation removed nothing."
