name: Agent Review (reusable)

# The review job itself. `agent-review.yml` is the caller — a trigger and two
# wires — and everything that bounds what a wrong review can do stays here, in
# a file an adopting repo *references* rather than copies (#97, slice 3 of #88).
#
# A reusable workflow rather than a composite action, for one reason: an action
# cannot declare `on:`, `permissions:`, `concurrency:` or a job-level `if:` —
# which is every security control in this loop, and **the fork guard is a
# job-level `if:`**. An action could have absorbed checkout → node → install and
# left the controls to be copy-pasted per repo, which is how they drift.
#
# The trigger stays with the caller because `workflow_call` cannot carry one:
# the event that reaches this job is the caller's, so `github.event.…` below
# reads the `pull_request_target` payload exactly as it did before the split,
# and `github.repository` is still the *calling* repository.
#
# Two properties an adopter cannot get wrong, because they are not theirs to
# state: the fork guard and the label guard are on this side of the seam. A
# caller's own `if:` can skip this job; it cannot loosen it.
on:
  workflow_call:
    inputs:
      auto-fix:
        description: >-
          Start the fix round yourself when the verdict is the round-1 *Changes
          recommended* — once per pull request, recorded by the
          `agent:auto-fixed` label (PRD #101, decision 3). Off by default, so an
          adopter's upgrade changes nothing: turning it on is a statement that
          the verdicts have been in use long enough to be acted on unread. It
          needs `AGENT_PAT`, because a label added with `GITHUB_TOKEN` fires no
          event; `doctor` warns where it is on and the secret is not set.
        type: boolean
        default: false
      default-branch:
        description: >-
          Branch to diff against when the pull-request event carries no base
          ref. On a real PR `base.ref` is always set, so this fires only when
          something is already odd — but an unset fallback degrades *silently*
          to the wrong branch, which is the #71 failure arriving by a different
          route.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets a
          review, running on the image's own Node.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or a PR title becomes
          a shell script.
        type: string
        default: npm ci
      self-check:
        description: >-
          The check-run name this job appears under on the PR, which for a
          called workflow is `<caller job id> / <this workflow's job id>`. The
          CI wait below polls every check on the head commit and has to
          recognise its own, or it waits for itself: 15 of this job's 20
          minutes, then a review with the degraded evidence #48 exists to
          prevent. Nothing inside a called workflow can read its caller's job
          id, hence an input — and required rather than defaulted, because a
          default that is wrong fails exactly this quietly.
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the review agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT, used to mark the PR ready for review — `GITHUB_TOKEN`
          cannot do that whatever permissions it is granted (docs/ADOPTING.md
          §1) — and to add the labels this workflow adds for another to fire
          on: `agent:fix` under `auto-fix`, and `agent:implement` on a slice
          PR's parent when its round ends. Optional: without it each of those
          warns, the run stays green, and a human does it by hand.
        required: false

jobs:
  review:
    # Two guards, both required:
    #  - the trigger label, and
    #  - same-repo head: a fork PR must never reach the checkout+npm ci steps,
    #    which would run untrusted code with secrets in scope.
    if: >-
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One group per PR, shared with agent-fix and agent-update-branch.
    # Review is `contents: read` and cannot push, but that is not what the group
    # protects against: the hazard is review *reading* a branch while a fix is
    # writing to it, which produces a confident review of a tree state that
    # never existed. Review used to sit in its own `agent-review-pr-*` group and
    # that race was live (docs/parity.md §10, #102).
    concurrency:
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # What the `resolve` job below reads. See *Hand the verified threads to the
    # resolve job*.
    outputs:
      resolutions: ${{ steps.resolutions.outputs.resolutions }}
      # …and what `auto-fix` reads: the verdict's machine-readable key and the
      # round it was derived under, both out of the file the runner wrote. A
      # job cannot read another job's `RUNNER_TEMP`, so the only way across is
      # an output. See *Hand the verdict to what reads it*.
      verdict: ${{ steps.verdict.outputs.verdict }}
      round: ${{ steps.verdict.outputs.round }}
    # `contents: read` is the invariant that bounds what a wrong review can do
    # (docs/parity.md §10). No `issues: write`: review files nothing, and the
    # `gh pr edit --add-label` steps below need only `pull-requests: write` —
    # that scope covers labels on a PR, which is why agent-fix and
    # agent-update-branch already label unguarded without it.
    #
    # The caller declares the same scopes, and that is not the duplication it
    # looks like — the two blocks do opposite jobs. A called workflow can only
    # *downgrade* the token it is handed, so this block is the bound and cannot
    # be widened from the caller's side. That is why the caller can grant
    # `contents: write` for the `resolve` job below (#133) while this job
    # still holds `read`. The caller's block is the grant, and a scope declared
    # only here grants nothing — but what that costs is the run rather than the
    # step: GitHub refuses the elevation instead of trimming the job to fit, so
    # a caller short of any scope in this block fails the **whole run** before
    # any job starts, with no job log in it (probed, #146). Not a review that
    # half works; no review at all, which is what `setup/doctor.ts` tells an
    # adopter before a label rather than after one.
    #
    # Where a token is short for some other reason, the first `gh pr edit` to
    # feel it is the `--add-label "agent:in-progress"` ending `Transition
    # labels`, which is deliberately not written `|| true`: Actions' default
    # `bash -e` fails the run there — before the checkout, so before the diff is
    # fetched and before an agent pass is spent. That is why that one line
    # carries no tolerance while the removals beside it do.
    permissions:
      # Reading the check runs the CI wait below polls. On a **public**
      # repository they are readable without this scope, which is why every
      # repo in the pilot worked without it; on a private one the same call
      # 403s `Resource not accessible by integration`. Latent since v0.1.0 and
      # found by the first private adopter to run this loop. That history is
      # about the **poll**, and it is not what a caller short of the scope gets:
      # this job declares it, so such a caller is refused before any job starts,
      # on a public repository too (probed, #146).
      checks: read
      contents: read
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read
      pull-requests: write
      # The verdict, posted as a commit status on the reviewed head (#96). A
      # status is not a pull-request write — it is its own scope — so nothing
      # already here covers it, and the caller has to grant it too. Omitting it
      # there does not buy a review with no verdict on it: a caller granting
      # less than this block declares fails the whole run before any job starts
      # (probed, #146), which is what `setup/doctor.ts` reports as an error,
      # before a label rather than after one. The step that posts the status
      # warns rather than failing all the same — a posted review is worth more
      # than the line summarising it — so where the token is short for some
      # other reason this is the one failure in this job that looks like the
      # feature simply being switched off.
      statuses: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # The PR's real base branch. review-context.ts diffs HEAD against this so
      # the inline-comment allow-list matches GitHub's PR diff exactly; a
      # hardcoded `main` mis-filters any PR stacked on another branch (#71).
      # The event field is the source; `default-branch` is the fallback for an
      # event that somehow carries none, which is the adopter's call to make
      # rather than a literal `main` buried in a shell expansion.
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.default-branch }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # Same guard as agent-fix and agent-update-branch. Review had none
      # until #102, so labelling a merged PR ran a full agent pass over merged
      # work and then died at `gh pr ready` — which cannot convert a merged PR —
      # under a warning that blames a missing AGENT_PAT. That is a real failure
      # mode misreported as a setup problem, which is worse than either.
      #
      # Unlike the other two this also adds `agent:blocked`. A refusal here is a
      # run a human asked for and did not get, and the review pipeline already
      # uses that label for exactly that; the comment alone scrolls away.
      #
      # The second refusal is the one the shared concurrency group makes
      # necessary. Everything this job reads is pinned to the head SHA in the
      # `labeled` payload — the checkout below, and `commitOID` on the posted
      # review, which is `git rev-parse HEAD` of that checkout. The payload is
      # snapshotted at label time, and joining `agent-pr-*` means the run can
      # start long after: label `agent:review` while a fix is running and the
      # review starts once the fix has pushed, still pinned to the pre-fix
      # commit. Serialising did not remove the race, it turned reading-during-a-
      # write into reading-after-one — a clean review of a superseded tree,
      # every inline comment on an ancestor commit and rendered outdated. The
      # mutates catch their version of this at push time
      # (`--force-with-lease` on the same payload SHA); review publishes
      # instead of failing, so it has to check before it starts.
      #
      # Refuse rather than re-target the current tip: a review is a statement
      # about the commit a human pointed at, and re-pointing it at whatever
      # arrived since would also need the CI wait and `commitOID` moved to the
      # new SHA. Re-adding the label after the mutate finishes is one action and
      # reviews the right thing. An unreadable `gh pr view` proceeds rather than
      # refuses — an API blip is not evidence the branch moved.
      - name: Pre-flight — refuse if the PR is closed, merged, or has moved
        id: state
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          refuse() {
            gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
            gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
            gh pr comment "$PR_NUMBER" --body "$1"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          }

          if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" = "true" ]; then
            refuse "Refused to run \`agent:review\`: this PR is not open."
            exit 0
          fi

          current=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid 2>/dev/null || echo "")
          if [ -n "$current" ] && [ "$current" != "$HEAD_SHA" ]; then
            refuse "Refused to run \`agent:review\`: the branch moved while this run was queued — the label was added at \`${HEAD_SHA:0:7}\`, the head is now \`${current:0:7}\`. Reviewing the labelled commit would put every comment on an ancestor and render it outdated. Re-add \`agent:review\` to review the current head."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Transition labels
        if: steps.state.outputs.proceed == 'true'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR head
        if: steps.state.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Make the PR base available for diffing
        if: steps.state.outputs.proceed == 'true'
        # Create a local ref for the PR's base branch (the checkout is of
        # head.sha, so the base is not present). review-context.ts diffs against
        # it; a bare `git fetch origin <ref>` would populate FETCH_HEAD but no
        # named ref, so keep the refspec. Falls back to `main` when base.ref is
        # somehow empty, matching diffCommandAgainstBase's own default.
        #
        # A ref name may legally contain `$()`, backticks, `;`, `|` and `&`, so
        # #75 asked whether this line is shell-safe. It is, and the two reasons
        # are both load-bearing — keep them if you edit this:
        #   1. BASE_REF arrives as an `env:` var, NOT as a `${{ }}` interpolated
        #      into the run script. Interpolation would splice the ref into the
        #      script *source*, where it would be parsed as syntax; an env var
        #      is only ever data.
        #   2. `"${BASE_REF}"` expands in one pass. POSIX shells do not re-scan
        #      an expansion result for command substitution or operators — only
        #      word splitting and globbing, which the double quotes suppress.
        #      Verified 2026-08-02 against sh and bash with the values above:
        #      each reached git verbatim as a single argument.
        # So the quotes are not decorative; dropping them, or switching to
        # `${{ github.event.pull_request.base.ref }}` inline, breaks this.
        #
        # The `:-main` this line used to carry is gone, not lost: the fallback
        # moved up to the `env:` block, where it is the `default-branch` input
        # rather than a literal only this repo could be right about.
        run: git fetch origin "+refs/heads/${BASE_REF}:refs/heads/${BASE_REF}"

      # Both setup steps are the adopter's toolchain, so both are skippable.
      # `npm install -g @anthropic-ai/claude-code` below is not: that is the
      # agent's own runtime, and every runner image already has the Node it
      # needs for it.
      - name: Setup Node.js
        if: steps.state.outputs.proceed == 'true' && inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, which `pull_request_target` reads
      # from the base branch, and never an expression reading the PR event.
      - name: Install dependencies
        if: steps.state.outputs.proceed == 'true' && inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        if: steps.state.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Wait for the PR's other checks, then hand their results to the agent.
      #
      # Why: a review running while CI is still going has no evidence beyond the
      # diff, so it reasons from the issue's spec. That is exactly how a review
      # once certified a rule "corpus-safe" 96 seconds before the corpus failed
      # with 13 false positives from that very rule. Waiting alone would not have
      # helped — the *results* have to reach the prompt.
      #
      # This job is itself a check on the PR, so `gh pr checks --watch` would
      # deadlock waiting on itself. Poll the check-runs API excluding our own
      # job name instead. Never fails the run: missing CI context degrades the
      # review, it does not invalidate it.
      #
      # The exclusion is every *agent* job, not just this one, and that became
      # load-bearing when review joined the shared per-PR concurrency group
      # (#102). A `fix` labelled while a review is running now sits queued
      # behind it — and a queued job is a check run in a non-completed state, so
      # waiting on it is waiting on a job that cannot start until we finish. The
      # timeout bounds that at 15 of this job's 20 minutes, which is not a
      # bound worth having. They are not CI either way: "fix: queued" is not
      # evidence about the diff.
      - name: Wait for other checks, collect results
        if: steps.state.outputs.proceed == 'true'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The sibling agent jobs, which the conversion renamed too: a called
          # workflow's job appears as `<caller job id> / <this workflow's job
          # id>`, so `agent-fix.yml` now produces `fix / fix`. The pattern
          # matches a name whose *either* half is an agent job, because the two
          # halves are owned by different people — the second is a job id in
          # one of these reusable files and cannot change under an adopter, the
          # first is whatever they called their caller job. `^(…)$` alone
          # stopped matching every sibling the moment the loop was split, which
          # put a queued `fix` back in the wait: review would burn the full
          # 900 s on a job that cannot start until review ends, then review on
          # the degraded evidence #48 exists to prevent.
          #
          # Still bounded at both ends, which is the point of anchoring at all:
          # `fixtures`, `CI / fix-lint` and `build / fixtures` are repo checks,
          # not agents, and none of them match.
          #
          # `follow-ups` joins the list even though its exclusion is dead at
          # runtime — this wait only runs on an open pull request and that
          # workflow only fires on a closed one (#50). Joining costs one word in
          # one string; carving it out would cost a comment justifying a timing
          # argument that could stop being true.
          #
          # `resolve` is this workflow's second job (#133) and `auto-fix` its
          # third (#102). Both run after this one, so a review never waits on
          # its own. But an adopter who renamed the caller job gets
          # `agent-review / resolve` and `agent-review / auto-fix`, which
          # nothing else here matches, and neither is evidence about the diff
          # either way. `auto-fix` needs naming in its own right: the
          # alternation is anchored on `/ `, so `fix` does not match a name
          # beginning `auto-`.
          #
          # `advance` is the fourth (#176), in `fix` as well as here, and runs
          # after a round ends on a slice PR. A later round on the same head —
          # a human's re-label — would otherwise read `review / advance` as CI.
          AGENT_CHECKS: '(^|/ )(review|resolve|auto-fix|advance|fix|follow-ups|update-branch|implement-prd|implement)( / |$)'
          # This job's own check run, named the same way. Overlapping with the
          # pattern above is deliberate, not redundant: that one is a heuristic
          # over names nobody declares, and this is the exact answer the caller
          # was made to state. Self-exclusion is the case with no error to read
          # when it is wrong, so it does not get to depend on a regex. Compared
          # as a literal via jq's `env`, never folded into that regex — a job
          # id is not a regex, and a `.` in one would quietly match a
          # neighbouring check too.
          SELF_CHECK: ${{ inputs.self-check }}
          # The verdict's own context, excluded from the commit statuses this
          # step reduces to a word — see the arm that reads them. Spelled out
          # here rather than read from the runner: this step runs long before
          # the runner does, and a test holds the literal to `VERDICT_CONTEXT`.
          VERDICT_CONTEXT: agent-review
          WAIT_SECONDS: "900"
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/ci_status.md"
          # Whatever the last `gh`/`jq` attempt wrote to stderr — the count's,
          # and then the listing's, each truncating it before it runs. Kept out
          # of the evidence — the agent cannot act on it — and out of the log
          # too until a failure arm fires, at which point it is the only thing
          # that separates the causes those arms now have.
          err="${RUNNER_TEMP}/ci_status.err"
          : > "$out"

          # Prints exactly one number, or nothing at all when the API call
          # fails, and never fails itself. All three are load-bearing.
          #
          # `--slurp` is what makes it one number. `--paginate --jq` applies
          # the filter *per page*, so a commit with more than one page of
          # check runs (>30, the endpoint default) prints `0\n0` — several
          # counts, no total. Slurped, the pages arrive as one array and the
          # filter runs once over all of them.
          #
          # The filter is a **pipe into standalone jq**, not gh's `--jq`, and
          # it has to be: gh refuses the two together — "the `--slurp` option
          # is not supported with `--jq` or `--template`" — at flag-parse time,
          # before any request. Written as one gh invocation it shipped in
          # v0.1.5 and collected no evidence at all for a day (#28). Nothing
          # caught it because everything checking it matched *text*; what
          # covers it now runs the step (tests/review-ci-wait.test.ts).
          #
          # Printing nothing on failure is what makes the caller's
          # non-numeric arm mean "the API did not answer". This used to fall
          # back to a literal zero, which turned a failure into a plausible
          # count: a clean non-zero exit became "nothing pending" and the
          # review ran blind, and a 403 whose body reached stdout became
          # `{"message":…}0`, which `-eq` rejects every iteration until the
          # deadline. Both had the same trigger — check runs on a private
          # repository need `checks: read`, granted on this job above.
          #
          # Which is why the count is gated on gh's **exit status** and not on
          # what it printed. Under `--slurp` a failed request still writes
          # JSON: `[]` for a connection failure, and `[{"message":"Resource
          # not accessible by integration",…}]` for that same 403 (recorded
          # from gh 2.100.0). The first of those counts, through this filter,
          # as a perfectly plausible zero — the old lie with a new source.
          #
          # `|| return 0` and `|| true` are both there because GitHub runs a
          # `run:` block carrying no `shell:` under `bash -e`: a non-zero gh
          # inside `$( )` ends the step where it stands, ahead of the arm
          # below that exists to report exactly that. The agent then gets an
          # empty file and reviews saying "no checks reported" — the same
          # blindness, minus the diagnosis. That is what v0.1.5 did.
          #
          # Both halves send stderr to `$err` rather than `/dev/null`, because
          # the arm below no longer has one cause. It fires for a non-zero gh,
          # for a jq filter error, and for no `jq` on the runner at all — and
          # the grant its `::error::` names is the one thing it cannot be: a
          # caller short of `checks: read` is refused before any job starts
          # (#146), so a poll that ran holds the read. Discarding the stderr is
          # how the invocation gh refuses stayed invisible for a release; the
          # arm prints whatever landed here underneath it, which is the only
          # thing that tells the three apart.
          pending_count() {
            : > "$err"
            body=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate --slurp 2>"$err") || return 0
            printf '%s' "$body" \
              | jq "[.[].check_runs[] | select(.name != env.SELF_CHECK) | select(.name | test(\"${AGENT_CHECKS}\") | not) | select(.status != \"completed\")] | length" \
              2>>"$err" || true
          }

          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          while :; do
            pending=$(pending_count)

            # Not a number — the API call failed rather than returning a
            # count. Say so once, loudly, and stop: waiting cannot fix a
            # permission error, and spinning to the deadline turns a
            # diagnosable 403 into fifteen quiet minutes. The step stays
            # `continue-on-error`, so the review still runs; what changes is
            # that both the log and the agent's evidence say it is blind.
            case "$pending" in
              "" | *[!0-9]*)
                echo "::error::Could not read check runs for ${HEAD_SHA}. It is not the caller's \`checks: read\` grant: a caller granting less than this job declares fails the run before any job starts, so a token that got this far holds the read (jeffwlawson/agent-workflows docs/ADOPTING.md §4). Reviewing without CI evidence."
                # `if`, not `[ -s … ] && …`: under `bash -e` a test that fails
                # as the last command of this arm ends the step, which is the
                # defect this whole block was rewritten to stop doing.
                if [ -s "$err" ]; then
                  echo "…and this is what \`gh\`/\`jq\` said, which is the part that tells the three apart:"
                  cat "$err"
                fi
                echo "_Could not read this commit's check runs, so the review below has no CI evidence._" >> "$out"
                break
                ;;
            esac

            [ "$pending" -eq 0 ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "_Timed out waiting for ${pending} check(s); results below may be incomplete._" >> "$out"
              break
            fi
            echo "Waiting for ${pending} check(s)…"
            sleep 20
          done

          # Slurped and piped for the same reason as the count, and `jq -r` to
          # match what gh's own `--jq` does with a string result: print it
          # unquoted. Without `-r` every line reaches the agent wrapped in
          # quotes it would have to read past.
          #
          # Stderr goes to `$err` here for the same reason it does in the
          # count, and it is a separate failure: this call can fail on a run
          # where the count succeeded — a transient 5xx, a secondary rate
          # limit, a later change to this filter alone — and the count's arm
          # never fires to explain it. Without this the agent would be handed
          # `- (could not read check runs)` and the log would say nothing at
          # all about why. Discarding the stderr is the habit that hid #28 for
          # a release; it does not get to survive three lines below the fix.
          #
          # `if !`, not `|| { …; [ -s … ] && cat …; }`, on the same grounds as
          # the arm above: under `bash -e` a test as the last command of the
          # arm ends the step, which is the defect this block was rewritten to
          # stop doing.
          echo "Checks on this commit:" >> "$out"
          : > "$err"
          if ! gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate --slurp 2>"$err" \
            | jq -r ".[].check_runs[] | select(.name != env.SELF_CHECK) | select(.name | test(\"${AGENT_CHECKS}\") | not) | \"- \(.name): \(.conclusion // .status)\"" \
            2>>"$err" >> "$out"; then
            echo "- (could not read check runs)" >> "$out"
            echo "::warning::Could not list check runs for ${HEAD_SHA}, so the review's check list is empty. It is not the \`checks: read\` grant, which a run that started holds — see what \`gh\`/\`jq\` said below."
            if [ -s "$err" ]; then
              cat "$err"
            fi
          fi

          # The same check runs again, as **one word** this time: the CI half of
          # the verdict the runner derives (#96).
          #
          # Separate from the evidence above on purpose. That file is prose for
          # the agent — notes, failure logs, whatever the listing managed — and
          # a derivation that parsed it would be a second description of a
          # format written three lines up, drifting from it on the release that
          # edits either. This reads `.conclusion` from the API instead, with
          # the same two exclusions: a queued sibling agent job is not a red
          # check, and this job's own run is not evidence about the diff.
          #
          # Three values, and `unknown` is not folded into `red`: a review that
          # could not see the checks has not seen a failure, it has seen
          # nothing. Both send a finding-free review to a human — the
          # derivation reads anything but `green` that way — and they say
          # different things about why. A step that dies before writing the
          # file leaves no file at all, which the runner reads as `unknown`
          # too.
          #
          # A check that has not *passed* is not green, so a still-pending one
          # (the timeout arm above) counts with the failures rather than being
          # waited for twice. A commit with no other checks at all is `none`,
          # which the arm below the statuses turns into a word: green on an
          # ordinary pull request — there is nothing failing, which is the
          # honest reading for an adopter whose repository runs none — and not
          # on a slice PR (#175).
          #
          # `if !` rather than `|| { … }` on the same grounds as the arms above:
          # under `bash -e` a test as the last command of the arm ends the step.
          : > "$err"
          if ! checks=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate --slurp 2>"$err" \
            | jq -r "[.[].check_runs[] | select(.name != env.SELF_CHECK) | select(.name | test(\"${AGENT_CHECKS}\") | not) | .conclusion // .status] | if length == 0 then \"none\" elif any(. != \"success\" and . != \"neutral\" and . != \"skipped\") then \"red\" else \"green\" end" \
            2>>"$err"); then
            checks=unknown
            echo "::warning::Could not decide whether this commit's check runs are green, so the verdict below will ask for a human rather than claim the pull request is ready. See what \`gh\`/\`jq\` said below."
            if [ -s "$err" ]; then
              cat "$err"
            fi
          fi

          # And the **other** CI surface, which check runs are not (#105). A
          # repository whose CI reports through the commit-status API — most
          # things outside Actions, and every `create-status` integration — has
          # no check run to read at all, so a derivation over check runs alone
          # calls that commit green and can recommend approving a red one.
          #
          # `agent-review` is excluded by context, and that exclusion is the
          # whole reason this can be read at all: it is the context this very
          # job posts the verdict under, so counting it would make a `failure`
          # verdict on the previous round part of the evidence for the next one
          # — and every "changes recommended" would derive "needs a closer look"
          # one round later, by reading its own answer back.
          #
          # `pending` counts with the failures for the same reason a queued
          # check run does: a status that has not passed has not passed, and
          # this step has already spent its wait.
          #
          # The combined endpoint rather than the per-post list, because it
          # returns the latest status per context — the list returns one entry
          # per *post*, and a context that went `pending → success` would be
          # read as both.
          : > "$err"
          if ! commit_statuses=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/status" --paginate --slurp 2>"$err" \
            | jq -r "[.[].statuses[] | select(.context != env.VERDICT_CONTEXT) | .state] | if length == 0 then \"none\" elif any(. == \"failure\" or . == \"error\" or . == \"pending\") then \"red\" else \"green\" end" \
            2>>"$err"); then
            commit_statuses=unknown
            echo "::warning::Could not read this commit's statuses, so the verdict below will ask for a human rather than claim the pull request is ready. See what \`gh\`/\`jq\` said below."
            if [ -s "$err" ]; then
              cat "$err"
            fi
          fi

          # **No CI at all** — `none` from both halves — is green everywhere
          # but a slice PR (#175). A slice PR's base is a PRD branch, not the
          # default branch, so an adopter's CI that filters `pull_request` to
          # the default branch never runs on one. Green there would let a clean
          # review recommend approving code no CI ran on, and on a slice PR that
          # verdict is what moves the chain onto the next slice. `unknown`
          # sends the review to a human instead, and the evidence says why and
          # where the one-line fix is.
          #
          # Both halves, not check runs alone: a slice PR whose CI reports only
          # through commit statuses had CI run on it. A slice branch is named
          # by `implement-prd`'s *Prepare the slice branch* step.
          if [ "${checks}/${commit_statuses}" = "none/none" ]; then
            case "$BRANCH" in
              agent/slice-*)
                checks=unknown
                commit_statuses=unknown
                no_ci="No CI ran on this slice PR: nothing but the loop's own jobs reported on this commit. A slice PR's base is its PRD branch, so a CI workflow that filters \`pull_request\` to the default branch does not run on it — add \`agent/prd-**\` to that filter's \`branches:\` (jeffwlawson/agent-workflows docs/ADOPTING.md §5, *Slice PRs and your CI*). Until then CI is unknown here, not green, so a clean review asks for a human rather than advancing the chain."
                echo "::warning::${no_ci}"
                echo "_${no_ci}_" >> "$out"
                ;;
            esac
          fi
          if [ "$checks" = none ]; then
            checks=green
          fi
          if [ "$commit_statuses" = none ]; then
            commit_statuses=green
          fi

          # One word out of two, and `red` beats `unknown`: a failure that was
          # seen is more than the other half failing to be read, and the two
          # halves fail independently. `green` needs both to have answered it.
          case "${checks}/${commit_statuses}" in
            red/* | */red) ci_result=red ;;
            unknown/* | */unknown) ci_result=unknown ;;
            *) ci_result=green ;;
          esac
          echo "$ci_result" > "${RUNNER_TEMP}/ci_result.txt"
          echo "Checks on this commit are: ${ci_result} (check runs ${checks}, commit statuses ${commit_statuses})."

          # Tail the failing steps so the agent sees *what* failed, not merely
          # that something did. Capped so a noisy failure cannot swamp the prompt.
          #
          # Excluded on the same grounds as AGENT_CHECKS above, and it has to be
          # the same set: a failed `Agent Fix` says nothing about this diff, and
          # its 60 lines crowd out the CI failure that does. Different namespace
          # though — these are workflow *run* names, where the agent workflows
          # are `Agent Review`/`Agent Fix`/`Agent Update Branch`/`Agent
          # Implement` and the repo's own are `CI` and `Corpus`, so the prefix
          # is the whole test.
          #
          # Being called changes nothing here, and SELF_CHECK is not needed: a
          # called workflow contributes no run of its own, so this run is the
          # caller's — named `Agent Review`, matched by the prefix like every
          # other agent run.
          for rid in $(gh api "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=50" \
                        --jq '.workflow_runs[] | select(.conclusion == "failure") | .id' 2>/dev/null); do
            rname=$(gh api "repos/${GH_REPO}/actions/runs/${rid}" --jq .name 2>/dev/null || echo "run ${rid}")
            case "$rname" in "Agent "*) continue ;; esac
            # `|| echo` on the same grounds as the count above, and it is the
            # same bug: `gh run view --log-failed` exits non-zero whenever a
            # failed run's logs cannot be had — expired, still uploading, a
            # token without `actions: read` — and with `pipefail` under
            # `bash -e` that failing *pipeline* ends the step, inside a group
            # already redirected to `$out`. The step is `continue-on-error`, so
            # nothing goes red; the agent simply never gets the runs after this
            # one, nor the `--- collected CI context ---` dump, and the
            # truncation is silent. Same blindness as #28, one loop further on.
            {
              echo
              echo "### Failure output — ${rname}"
              echo '```'
              gh run view "$rid" --log-failed 2>/dev/null | sed 's/^[^Z]*Z //' | tail -60 \
                || echo "(no failure log available for run ${rid})"
              echo '```'
            } >> "$out"
          done

          echo "--- collected CI context ---"
          cat "$out"

      # The runner package is published to **GitHub Packages**, not npmjs, so the
      # `npx` below resolves from `https://npm.pkg.github.com` and needs a token.
      # `actions/setup-node` writes the `.npmrc` rather than this file doing it by
      # hand — a hand-written one is a second place for the scope to be wrong, and
      # the way it is wrong is a 401 that reads like a bad token.
      #
      # Two properties to keep if you edit this. The registry entry is scoped to
      # `@jeffwlawson` **only**, so a caller's own `npm ci` still resolves
      # everything else from npmjs untouched. And `NODE_AUTH_TOKEN` is
      # unconditional: GitHub Packages has no anonymous install *even for a public
      # package*, so the caller's `packages: read` is a grant this step cannot do
      # without, rather than a consequence of the package's visibility.
      #
      # No `node-version-file` here on purpose: this is the registry half of
      # `setup-node`, not the toolchain half, so it still runs on a repo that
      # passed `node-version-file: ''`. It comes *after* the toolchain step for
      # the same reason — both write the same `.npmrc`, and the last one wins.
      #
      # `package-manager-cache: false` states that same thing to the action.
      # From v5 it caches on its own when the repository's `package.json`
      # carries a `packageManager` field, and the input that switches that off
      # has defaulted to `true` since that same release; v6 and v7 only widen
      # the detection to `devEngines.packageManager`. So a step written to do no
      # toolchain work starts doing some. On an adopter whose manifest names npm
      # with no root lockfile, the restore throws `Dependencies lock file is not
      # found` and fails this step before the runner exists to write
      # `failure_reason.txt`, leaving a run that says only `(no reason file
      # written)`. It would also add a cache *save* to a `pull_request_target`
      # job.
      #
      # It was written at the `@v4` pin, which had no such input, and was inert
      # on purpose — the guard the bump lands on rather than a response to it.
      # At the `@v7` pin above the input exists and is honoured. It still
      # changes no behaviour *here*: this repo declares only `engines`, never
      # `packageManager`, so the caching it switches off would never have fired.
      # The step this protects is an adopter's, and this repo cannot reproduce
      # the failure — which is the reason it is asserted rather than observed
      # (`tests/workflows.test.ts`).
      #
      # This is also the one step in the loop that reaches across repositories. A
      # package published from this repo is not automatically readable by another
      # repo's `GITHUB_TOKEN`; that follows from the package's own access settings
      # (docs/ADOPTING.md §4).
      - name: Authenticate to GitHub Packages
        if: steps.state.outputs.proceed == 'true'
        uses: actions/setup-node@v7
        with:
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      - name: Run review agent
        if: steps.state.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Reads the `.npmrc` the step above wrote. `GITHUB_TOKEN`, carrying the
          # `packages: read` the caller granted — there is no anonymous install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_REVIEW: ${{ vars.AGENT_MODEL_REVIEW }}
          OUTPUT_DIR: ${{ runner.temp }}
          CI_STATUS_FILE: ${{ runner.temp }}/ci_status.md
          # The evidence and the fact are two files, not one. The first is what
          # the agent reads; the second is what the verdict is derived from, and
          # keeping them apart is what stops the derivation reading prose.
          CI_RESULT_FILE: ${{ runner.temp }}/ci_result.txt
          # The two facts the automatic fix turns on that the runner cannot
          # read for itself (#102): the adopter's opt-in, and whether this pull
          # request's one automatic fix is already spent. The derivation adds
          # the third — the round — and picks the verdict row whose key the
          # `auto-fix` job below selects on, so the line a maintainer reads and
          # the job that makes it true come from one decision.
          #
          # Both read off the same `labeled` payload that job guards on, rather
          # than from a live `gh` call, so the two cannot answer differently
          # about a label added while the review ran.
          AUTO_FIX: ${{ inputs.auto-fix }}
          AUTO_FIXED: ${{ contains(github.event.pull_request.labels.*.name, 'agent:auto-fixed') }}
        # `npm exec --prefix` rather than a bare `npx`, and the prefix is the
        # whole point. `npx pkg@version` reuses a package already present in the
        # working directory when it satisfies the spec — and in the repository
        # that *publishes* this package, the checkout is such a package. It has
        # no `dist/` (CI installs, it does not build), so the bin resolves to
        # nothing and the step dies `command not found` before any runner code
        # runs (#8). Installing into RUNNER_TEMP sidesteps the name collision.
        #
        # A no-op for every consuming repo, which has no package of this name to
        # collide with — verified against npm 10 and 11, both of which ignore
        # `--ignore-existing` here. `--prefix` moves the *install*, not the
        # process `cwd`: the runner still does its git work in the checkout.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.6.0 -- agent-workflows review

      # GraphQL `addPullRequestReview`, not REST `POST /pulls/{n}/reviews`, for
      # the one thing REST cannot do: open a **file-level** thread in the same
      # call as the review — it answers one with a 422 — which is where a
      # finding goes when it is in a changed file but outside its hunks (#110).
      # REST's `comments` field is deprecated in favour of `threads` besides.
      #
      # The whole request body is `review_payload.json`, written by the runner
      # from a unit-tested function: `--input` sends a file verbatim, so nothing
      # here composes a query or names a field. The endpoint is `graphql` rather
      # than `/graphql` deliberately — that is what makes `gh` fail the step on
      # an `errors` array, which GraphQL returns with HTTP 200 and which a raw
      # path would read as success and post nothing.
      #
      # The `id:` and the captured URL are the verdict's (#96): a commit status
      # carries one link, and the only place the posted review's own URL exists
      # is the response to this call. `--jq` rather than a second lookup — the
      # newest review on the pull request is not reliably this one.
      - name: Post PR review
        id: review
        if: steps.state.outputs.proceed == 'true' && success()
        env:
          PAYLOAD: ${{ runner.temp }}/review_payload.json
        run: |
          url=$(gh api graphql --input "$PAYLOAD" --jq .data.addPullRequestReview.pullRequestReview.url)
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # The verdict: what a maintainer does next, on the commit it is about.
      #
      # A commit status rather than a comment or a label, for the one property
      # neither of those has — it is attached to a **commit**. A new commit
      # carries no verdict until one is posted for it, so a stale "ready to
      # merge" cannot survive a push, and the status history is the only record
      # of what earlier rounds said. One context, so a later review of the same
      # commit replaces its own verdict and nothing else.
      #
      # The context, the state and the line all come out of `verdict.json`,
      # which the runner wrote from a derivation that is unit-tested. Deriving
      # any of them here would be a second copy of that table, in YAML, where
      # nothing can test it — and the line is the whole feature: it is what
      # makes the outcome actionable without reading the review.
      #
      # Never fails the run, on the same grounds as the marker step above: a
      # posted review is worth more than its verdict. Not because the adopter's
      # caller is the likely cause — a caller short of `statuses: write` is
      # refused before any job starts (#146), so a step that ran holds the
      # write, and what lands here is GitHub refusing the status itself. A
      # warning says so where `|| true` would leave a loop posting no verdicts
      # and looking healthy.
      - name: Post the verdict as a commit status
        if: steps.state.outputs.proceed == 'true' && success()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_URL: ${{ steps.review.outputs.url }}
        run: |
          context=$(jq -r .context "${RUNNER_TEMP}/verdict.json")
          state=$(jq -r .state "${RUNNER_TEMP}/verdict.json")
          description=$(jq -r .description "${RUNNER_TEMP}/verdict.json")
          args=(--method POST "repos/{owner}/{repo}/statuses/${HEAD_SHA}"
                -f "context=${context}" -f "state=${state}" -f "description=${description}")
          # `if`, not `[ -n … ] && …`: under `bash -e` an unset URL would end
          # the step here — with the review posted and no verdict on it, which
          # is the state this whole step exists to make impossible.
          if [ -n "$REVIEW_URL" ]; then
            args+=(-f "target_url=${REVIEW_URL}")
          fi
          gh api "${args[@]}" \
            || echo "::warning::Could not post the \`agent-review\` verdict for ${HEAD_SHA}. The review is posted; what is missing is the one line saying what to do about it. GitHub's reply is printed above. It is not the caller's \`statuses:\` grant: a caller granting less than this job declares fails the run before any job starts, so a token that got this far holds the write (jeffwlawson/agent-workflows docs/ADOPTING.md §4); a 422 is the status itself being refused, which is ours to fix."

      # The verdict again, this time as something a later step and a later job
      # can read (#102). `verdict.json` is a file in this job's `RUNNER_TEMP`;
      # the `auto-fix` job below has its own runner and its own temp, so the
      # only way across is an output.
      #
      # The **key**, not the heading: three rows share a heading and the
      # automatic fix fires on exactly one of them, so a selector on anything
      # but the key would fire on all three. And the round beside it, which
      # nothing derives anything from — it is the second half of a guard a
      # human reads in this file, where "never twice round the loop" is
      # otherwise only inferable from which keys a second round can produce.
      #
      # A step of its own rather than a line added to the status post above,
      # for the reason `Hand the verified threads to the resolve job` is one: a
      # step that posts and a step that hands over fail for different reasons,
      # and the status post is the one that is deliberately allowed to fail.
      # A run that wrote no file hands over nothing, and `auto-fix` does not
      # run — which is the same direction every arm here fails in.
      - name: Hand the verdict to what reads it
        id: verdict
        if: steps.state.outputs.proceed == 'true' && success()
        run: |
          file="${RUNNER_TEMP}/verdict.json"
          [ -f "$file" ] || { echo "No verdict file; nothing to hand over."; exit 0; }
          jq -r '"verdict=\(.verdict)", "round=\(.round)"' "$file" >> "$GITHUB_OUTPUT"

      # The threads this review checked and found fixed (#111, and #109 decision
      # 1), handed to the `resolve` job below, which closes them. The
      # **reviewer** closes a finding and the fixer never does: a fix run replies
      # and resolves nothing, so nothing is marked done by the run that claims to
      # have done it.
      #
      # Handed over rather than acted on here, because this job cannot close a
      # thread. `resolveReviewThread` is refused on an installation token without
      # `contents: write` (#133), and this job holds `contents: read` on purpose
      # (docs/parity.md §10). The reply was always accepted and the resolve never
      # was, so every verified thread in every repo on v0.4.0 stayed open under a
      # reply claiming it had closed.
      #
      # A job output rather than an artifact. The list is a few KB against a
      # 1 MB ceiling, and an artifact would add two more action pins to track.
      # `jq -c` puts it on one line, which is what a `name=value` output takes.
      # A run that wrote no file hands over nothing, and `resolve` does not run.
      #
      # After the verdict and gated on `success()`, as the step it replaces was:
      # a review that failed to post closes nothing.
      - name: Hand the verified threads to the resolve job
        id: resolutions
        if: steps.state.outputs.proceed == 'true' && success()
        env:
          RESOLUTIONS: ${{ runner.temp }}/thread_resolutions.json
        run: |
          [ -f "$RESOLUTIONS" ] || { echo "No resolutions file; nothing to resolve."; exit 0; }
          echo "resolutions=$(jq -c . "$RESOLUTIONS")" >> "$GITHUB_OUTPUT"
          echo "Handing $(jq length "$RESOLUTIONS") verified thread(s) to the resolve job."

      # The marker for the filing half (#47): this PR's review recorded
      # out-of-scope findings, and a human still has a say before they become
      # issues. Removing the label is that say.
      #
      # **Added when, and only when, the run recorded at least one.** The runner
      # writes `follow_ups.md` in no other case, so the file's existence is the
      # whole condition — no parsing, and nothing here that can decide
      # differently from what went into the body.
      #
      # **Never removed here**, which is the other half of the rule and is not
      # symmetry. Removal is the human's opt-out gesture; a step that cleared a
      # stale marker would be racing the person it exists to serve. A marker
      # left behind by a later empty run costs nothing either: that run posts an
      # *empty* findings block, which is what the filing half reads as the
      # latest list, so the merge files nothing and clears the marker itself.
      #
      # After the review is posted, on purpose. The label points at a record
      # that lives in the review body, so marking a PR whose review failed to
      # post would point at nothing.
      #
      # Never fails the run. This label is newer than the six `docs/ADOPTING.md`
      # §3 mandates, so an adopter can be up to date on the pin and not have it
      # — and a posted review is worth more than a marker. A warning says so
      # where `|| true` would not, the same call `Mark PR ready for review`
      # makes below.
      - name: Mark the PR as carrying follow-ups
        if: steps.state.outputs.proceed == 'true' && success()
        run: |
          [ -f "${RUNNER_TEMP}/follow_ups.md" ] || exit 0
          gh pr edit "$PR_NUMBER" --add-label "agent:follow-ups" \
            || echo "::warning::Could not add \`agent:follow-ups\` to PR #${PR_NUMBER}. Its out-of-scope findings stay in the review body and nothing will file them. If the label does not exist in this repository, create it."

      # Draft means "the automated pipeline has not finished", not "the agent is
      # still writing code" — so this belongs here rather than at the end of
      # implement. The human's first real decision (act on the review, or merge)
      # only exists once the review is posted; marking ready any earlier fires
      # the signal during a window when there is nothing to decide.
      #
      # `success()` on purpose: a failed review should leave the PR in draft, so
      # the draft state agrees with the `agent:blocked` label rather than
      # presenting an unreviewed PR as finished.
      #
      # Does not cascade: `ready_for_review` is not in the default
      # `pull_request` types (opened/synchronize/reopened), so neither ci.yml nor
      # corpus.yml re-runs.
      #
      # MUST use AGENT_PAT. `GITHUB_TOKEN` cannot convert a draft PR even with
      # `pull-requests: write` — it fails with
      #   GraphQL: Resource not accessible by integration (markPullRequestReadyForReview)
      # because the Actions bot is an App installation and this mutation is not
      # in its permission set at all. A user PAT is not an App, so it can.
      #
      # This is the fourth GITHUB_TOKEN limitation the loop has hit, and the
      # third of that four where the operation *looks* covered by the granted
      # permission. See docs/ADOPTING.md §1.
      #
      # Never `|| true` here. It was, and it turned a hard failure into a green
      # step: every reviewed PR silently stayed a draft while the workflow
      # reported success, and two were marked ready by hand without anyone
      # noticing the feature was broken. A warning keeps the run green — a PR
      # stuck in draft is not worth failing a review over — while making the
      # failure visible, which `|| true` did not.
      #
      # **Not when the automatic fix is about to run** (#102, PRD #101 decision
      # 4). Draft means "the loop is still working", and it is the human's turn
      # on *approval recommended*, on *needs a closer look*, and on changes
      # recommended only where nobody is going to act on them but them. The
      # `auto-fix` job below is about to add `agent:fix`, so the next thing to
      # happen on this pull request is another agent run: marking it ready here
      # would fire "your turn" during exactly the window the draft state exists
      # to describe, and the fix round's own review would have to mark it ready
      # all over again.
      #
      # One condition rather than the job's three, and deliberately the same
      # one: that key is derived only where all three hold, so a step reading
      # it cannot decide differently from the job it is predicting.
      - name: Mark PR ready for review
        if: >-
          steps.state.outputs.proceed == 'true' && success() &&
          steps.verdict.outputs.verdict != 'changes recommended, fix round started'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready "$PR_NUMBER" \
            || echo "::warning::Could not mark PR #${PR_NUMBER} ready for review. If AGENT_PAT is unset this is expected — GITHUB_TOKEN cannot do it. Mark it ready by hand."

      - name: Mark blocked on failure
        if: steps.state.outputs.proceed == 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:review` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:review` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      # And a run that failed says so in the same place, rather than leaving the
      # last verdict standing. Silence is the dangerous answer here: a status is
      # per commit and per context, so a review that died half way reads from
      # the outside exactly like one that recommended approval — right up until
      # someone merges on it.
      #
      # Last of the failure arms, so every step above it is covered — including
      # the one that posts the verdict itself, whose own failure would otherwise
      # be the one that leaves no status at all.
      #
      # The one step that spells the context out. A run that failed wrote no
      # `verdict.json` to read it from, so this literal is held to
      # `VERDICT_CONTEXT` by a test instead.
      - name: Post an error verdict
        if: steps.state.outputs.proceed == 'true' && failure()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/{owner}/{repo}/statuses/${HEAD_SHA}" \
            -f "context=agent-review" -f "state=error" -f "target_url=${RUN_URL}" \
            -f "description=The review run failed, so there's no verdict. Check the run, then re-add agent:review." \
            || echo "::warning::Could not post the failed \`agent-review\` verdict for ${HEAD_SHA}. The failure comment on the pull request is the only record of this run."

      - name: Always remove in-progress
        if: always() && steps.state.outputs.proceed == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true

  # Closes the threads the review verified (#133). It is the only job in this
  # workflow holding `contents: write`, and it is shaped so that it cannot
  # spend it on anything but that.
  #
  # **Why the scope.** `resolveReviewThread` is refused on an installation
  # token without `contents: write`. `addPullRequestReviewThreadReply` beside
  # it is not refused, which is why the step this replaced replied into every
  # thread and then logged `Resource not accessible by integration` for every
  # resolve. Confirmed 2026-09-24 on a scratch pull request (run 36057777753):
  # same token, same thread, and `pull-requests: write` in both jobs. The job
  # with `contents: read` was refused FORBIDDEN, and the job with
  # `contents: write` resolved.
  #
  # **Why not the review job.** That job reads untrusted pull-request content
  # and runs an agent over it, and `contents: read` is what stops it touching
  # the branch (docs/parity.md §10). This job has no checkout, no toolchain and
  # no agent. It runs two fixed GraphQL mutations whose only variables are a
  # thread id and a reply, read out of what the review runner wrote. The runner
  # dropped every id it had not handed over (`verifyCarried`). So the write
  # scope reaches a job that has nothing to write with.
  #
  # Not `AGENT_PAT`: resolving would then depend on an adopter having set it,
  # and every repository without it would keep the bug silently.
  #
  # **The cost is the caller's grant, and it is not a degradation.** A caller's
  # `permissions:` is the ceiling for every job it calls, and GitHub refuses an
  # elevation rather than trimming it: a called job asking for more than its
  # caller granted fails the **whole run** before any job starts, as a
  # `startup_failure` with no job log in it. So a caller left on `contents: read`
  # does not get a review without the resolve; it gets no review. Both reference
  # callers move in the same release as this job, and `doctor` reports a caller
  # that did not as an error.
  #
  # Probed on a real token (#146), unlike the first two releases of this comment,
  # which paraphrased the message and got it wrong. What GitHub calls it is an
  # *invalid workflow file*, annotated on the run page as:
  #
  #   Invalid workflow file: .github/workflows/agent-review.yml#L<the caller's
  #   `uses:` line> — Error calling workflow
  #   '<owner>/<repo>/.github/workflows/review.yml@<sha>'. The nested job
  #   'resolve' is requesting 'contents: write', but is only allowed
  #   'contents: read'.
  #
  # `gh run view` reports it only as "a workflow file issue" and names neither
  # the scope nor the file, so the annotation is the one place it is legible.
  # The line it points at is the caller's `uses:`, not the `permissions:` line
  # that is short, and the job it names is the **called** one — so an adopter
  # reading it is sent to a file whose short line it does not name. A literal
  # number here would be this repo's caller today and wrong by the next comment
  # added above it; docs/ADOPTING.md §4 writes the same annotation and says the
  # same two things about reading it.
  #
  # Not new with this job either: every job in this loop declares its
  # permissions, so any caller granting less than one of them has always failed
  # this way.
  resolve:
    needs: review
    # Both of the review job's guards, restated rather than inherited through
    # `needs`. Today `needs` implies them, because a skipped review skips this
    # job too. But that holds only while this `if:` carries no status function,
    # and a later `always()` added for another reason would drop both guards.
    # Then the list the review wrote decides whether anything runs.
    if: >-
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.review.outputs.resolutions != '' &&
      needs.review.outputs.resolutions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # **No concurrency group**, on purpose. `agent-pr-*` holds one waiting run,
    # and a newer arrival evicts it silently (docs/parity.md §10). If this job
    # joined the group, it would queue behind a fix a human labelled while the
    # review ran, and could evict that fix. Overlap is harmless instead. A fix
    # run shown a thread that already carries its closing reply is told the
    # close is the only thing outstanding on it, and is not asked to answer it
    # at all (`shared/pr-feedback.ts`). A review that races this job carries
    # such a thread again, re-verifies it and resolves it without a second
    # reply.
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Through `env:`, never interpolated into the script. A reply quotes a
      # maintainer's words (`declineReply`), and quoted text spliced into shell
      # source would run as a script.
      RESOLUTIONS: ${{ needs.review.outputs.resolutions }}
    steps:
      # **The reply is posted first and the resolve is gated on it.**
      # `resolutionReason` is recorded by GitHub and exposed nowhere afterwards,
      # because no field on `PullRequestReviewThread` reads it back. So the
      # reply is the only record of why a thread closed. A thread that closes
      # with no reply loses that statement. On the `WONT_FIX` arm the lost part
      # is the maintainer's quoted words, which are what make a misreading
      # visible. Ordering alone does not prevent that; only the `continue`
      # does. A reply that would not post leaves its thread open, which is the
      # direction this loop fails in everywhere else.
      #
      # **Unless the thread already carries that reply** (`alreadyReplied`,
      # #133). A resolve that did not go through leaves the thread open, and the
      # next review verifies it again. Without this guard every round adds
      # another `**Verified fixed.**`, which is how #130 collected nine on one
      # thread. Only the literal `true` skips the reply. Any other value posts
      # it, because a duplicate reply is the cheaper mistake than a thread that
      # closes with no reply at all.
      #
      # What says a thread already carries the reply is a hidden marker on it
      # and never the words it opens with. Those words are shown to the fix
      # agent, whose own replies land in the same thread as this same bot, and a
      # reply matched on prose is one the fixer can make — a thread closing
      # under the fixer's claim with no review's record on it at all
      # (`shared/review-verification.ts`).
      #
      # Two reasons, and which one a thread closes on is decided by
      # `verifyCarried` and read out of the list, never derived here: a finding
      # the review verified fixed closes as `ADDRESSED`, and one a maintainer
      # declined closes as `WONT_FIX` with their words quoted back (#109,
      # decision 10). The enum is spelled out on both arms because it is a
      # literal in the document rather than a variable GitHub would coerce, and
      # the branch is on a fixed list, so a value this step does not recognise
      # closes as addressed instead of putting an unknown string into a
      # mutation.
      #
      # Never fails the job. A thread that would not close is a thread a human
      # closes, and the review and its verdict are already posted. So each
      # failure is a `::warning::` rather than the `echo` that hid this for a
      # release, and the per-mutation `||` keeps one bad id from taking the
      # rest of the list with it.
      - name: Resolve the threads this review verified
        run: |
          set -uo pipefail
          count=$(jq 'length' <<<"$RESOLUTIONS")
          echo "Resolving ${count} verified thread(s)."

          for i in $(seq 0 $((count - 1))); do
            tid=$(jq -r ".[$i].threadId" <<<"$RESOLUTIONS")
            body=$(jq -r ".[$i].reply" <<<"$RESOLUTIONS")
            reason=$(jq -r ".[$i].reason" <<<"$RESOLUTIONS")
            already=$(jq -r ".[$i].alreadyReplied" <<<"$RESOLUTIONS")

            if [ "$already" = "true" ]; then
              echo "  ${tid} already carries this reply; retrying only the resolve."
            else
              gh api graphql -f threadId="$tid" -f body="$body" -f query='
                mutation($threadId:ID!,$body:String!) {
                  addPullRequestReviewThreadReply(
                    input:{pullRequestReviewThreadId:$threadId, body:$body}
                  ) { clientMutationId }
                }' >/dev/null \
                && echo "  replied to ${tid}" \
                || { echo "::warning::Could not reply to review thread ${tid}, so it is left open: a thread that closes with no reply loses the only record of why."; continue; }
            fi

            if [ "$reason" = "WONT_FIX" ]; then
              mutation='
                mutation($threadId:ID!) {
                  resolveReviewThread(
                    input:{threadId:$threadId, resolutionReason:WONT_FIX}
                  ) { clientMutationId }
                }'
            else
              mutation='
                mutation($threadId:ID!) {
                  resolveReviewThread(
                    input:{threadId:$threadId, resolutionReason:ADDRESSED}
                  ) { clientMutationId }
                }'
            fi

            gh api graphql -f threadId="$tid" -f query="$mutation" >/dev/null \
              && echo "  resolved ${tid} (${reason})" \
              || echo "::warning::Could not resolve review thread ${tid} (${reason}). Its reply is posted, and the thread stays open until the next review retries it, which it does without replying again. GitHub's reply is printed above. It is not the caller's \`contents:\` grant: a caller granting less than this job declares fails the run before any job starts, so a token that got this far holds the write (jeffwlawson/agent-workflows docs/ADOPTING.md §4)."
          done

  # The one automatic fix (#102, PRD #101 decisions 1 and 2). Where the verdict
  # is the round-1 *Changes recommended*, this adds `agent:fix` itself, once per
  # pull request — so a pull request whose fixes the review says are clear
  # reaches a maintainer already fixed and re-reviewed rather than waiting on a
  # label nobody was asked to think about.
  #
  # **Why a separate job.** It spends `AGENT_PAT` on a label something fires
  # on — as `advance` below does, for the same reason in the same shape — and
  # it must not be the job that reads untrusted pull-request
  # content and runs a model over it. So: no checkout, no toolchain, no agent,
  # and `pull-requests: write` alone — narrower than the review job beside it,
  # which holds four scopes. Its whole input is two literals and a key the
  # review job derived.
  #
  # **Why it cannot loop.** The review a fix round asks for is a round 2, and a
  # round-2 review can never produce the key below: findings that survive a fix
  # get *changes recommended after a fix round*, whose line asks the maintainer
  # to read the review (`deriveVerdict`, docs/parity.md §10). The
  # `agent:auto-fixed` marker is the second bound and it is the one that
  # matters later: a human's own commits make the next review a fresh round 1,
  # which may say *Changes recommended* again — and by then the automatic fix
  # is spent, so the line asks them for the label.
  #
  # **Why the guards are restated.** Same reason `resolve` restates them: today
  # `needs:` implies the two standing ones, but only while this `if:` carries
  # no status function, and a later `always()` added for some other reason
  # would drop both. `inputs.auto-fix` and the marker are restated for a
  # different reason — the key already encodes all three, since the runner
  # derives it from exactly them, and a guard a human has to reconstruct from a
  # string literal is one they will read as unconditional.
  auto-fix:
    needs: review
    if: >-
      inputs.auto-fix &&
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.review.outputs.verdict == 'changes recommended, fix round started' &&
      needs.review.outputs.round == '1' &&
      !contains(github.event.pull_request.labels.*.name, 'agent:auto-fixed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # **No concurrency group**, for the reason `resolve` is in none: the
    # `agent-pr-*` waiter slot has depth 1 and holds the newest arrival, so
    # joining would let this job evict a fix a human queued while the review
    # ran — and a label add is not a thing another job can tear.
    #
    # It does queue behind nothing and start immediately, which is the point:
    # the `agent:fix` it adds fires a run that *does* join the group, so the
    # serialisation this loop depends on still happens where the work is.
    permissions:
      # Labels on a pull request, which is the whole of what this job does.
      # Not `issues: write`: that scope covers labels on an issue, and the one
      # thing this must never be able to do is file work (docs/parity.md §10).
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # MUST use AGENT_PAT. A label added with `GITHUB_TOKEN` fires no
      # `labeled` event, so `agent:fix` added with it sits on the pull request
      # triggering nothing — the silent no-op `docs/ADOPTING.md` §1 is about,
      # and the reason this job exists in the shape it does.
      #
      # The marker goes on **first**, and that order is the one-shot bound. A
      # failure between the two leaves the fix unspent and unstarted, which
      # costs this pull request its automatic fix and nothing else; the other
      # order would leave a fix round running with the marker missing, and the
      # next round-1 verdict would start another.
      #
      # `bash -e`, no `|| true` on either add, for the reason the `Transition
      # labels` step above carries none: a label this cannot add is a loop
      # that has stopped transitioning, and the review has already told a
      # maintainer a fix round started. A red job beside that sentence is the
      # only thing that says it did not.
      - name: Start the one automatic fix round
        env:
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --add-label "agent:auto-fixed"
          gh pr edit "$PR_NUMBER" --add-label "agent:fix"
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::AGENT_PAT is not set, so agent:fix was added with GITHUB_TOKEN and will NOT start a fix round. The review's verdict on PR #${PR_NUMBER} says one has; remove and re-add agent:fix by hand to make that true."
          fi

  # The PRD chain's advance (#176, PRD #171). A slice PR is one sub-issue of a
  # PRD, opened by `implement-prd` against the PRD branch, and the chain waits
  # for that slice's review round to end before it builds the next one. When
  # the round ends on a verdict the chain moves on from, this re-adds
  # `agent:implement` to the parent; the `implement-prd` run that starts merges
  # the slice PR into the PRD branch and builds the next slice — or, after the
  # last slice, is the finishing run that hands the PRD PR over.
  #
  # **Which verdicts advance.** The three a slice round ends on without a
  # human: *approval recommended*; *changes recommended* where no automatic fix
  # is starting (auto-fix off, or already spent on this pull request); and
  # *changes recommended after a fix round*, the round-2 answer. Not the key
  # the `auto-fix` job selects on — a fix and its re-review are still in
  # flight, and the round ends at their end, here or in `fix.yml`'s copy of
  # this job — and not *needs a closer look*, which is a reviewer asking for a
  # human: the chain parks on that slice PR until one re-adds `agent:implement`
  # to the parent, which is itself the acceptance. A failed review skips this
  # job — `needs.review.result` below — so the chain parks there too.
  #
  # Keys, matched exactly, for the reason `auto-fix` matches one: three rows
  # share a heading, and it is the key that tells them apart.
  #
  # **Why a separate job**, and in `auto-fix`'s shape: it spends `AGENT_PAT`,
  # and it must not be the job that reads untrusted pull-request content and
  # runs a model over it. No checkout, no toolchain, no agent. Its whole input
  # is the head ref, the pull request's number and a key the review job derived.
  #
  # **Only on a slice PR**, recognised by its head: `agent/slice-<parent>-…`,
  # the name `implement-prd` gives it, which is also where the parent comes
  # from. An ordinary pull request has no chain to advance, and a PRD PR's head
  # is `agent/prd-…`, which this does not match — its own review ends the chain
  # rather than advancing it.
  #
  # **Why it cannot cycle.** It adds a label to the parent **issue**, never to
  # a pull request, and the `implement-prd` run it starts either merges this
  # slice PR — closing it, so no later round on it can fire this again — or
  # refuses into `agent:blocked`. What it starts is bounded by the number of
  # sub-issues, and a finished PRD refuses the label.
  #
  # **After `resolve`, not beside it.** The `implement-prd` run this starts
  # reads the slice PR's unresolved threads for its row of the slices table,
  # and rows are never refreshed. Run in parallel, that read can land before
  # `resolve` has closed the threads this round verified fixed — likeliest on
  # *changes recommended after a fix round*, the verdict that follows a fix —
  # and the PRD PR would link fixed findings as open for good. So this waits
  # for `resolve`, runs when `resolve` was skipped (a round with nothing to
  # close), and parks when `resolve` failed: the threads it would have closed
  # are still open, and a row written now would say so. That takes a status
  # function, which is what the restated guards below exist for.
  #
  # `!cancelled()` rather than `always()`: a cancelled run advances nothing.
  # The review's own result is checked by name, since a status function drops
  # the implicit "every need succeeded".
  #
  # The guards are restated for the reason `resolve` restates them.
  advance:
    needs: [review, resolve]
    if: >-
      !cancelled() &&
      needs.review.result == 'success' &&
      (needs.resolve.result == 'success' || needs.resolve.result == 'skipped') &&
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/slice-') &&
      (needs.review.outputs.verdict == 'approval recommended' ||
       needs.review.outputs.verdict == 'changes recommended' ||
       needs.review.outputs.verdict == 'changes recommended after a fix round')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # **No concurrency group**, for the reason `auto-fix` is in none. The
    # `implement-prd` run its label starts serialises on the parent instead.
    permissions:
      # The comment the no-PAT arm leaves on the slice PR, and nothing else.
      # The label on the parent is added with `AGENT_PAT` or not at all — a
      # label added with `GITHUB_TOKEN` fires no event — so the workflow token
      # is never asked to write an issue, and `issues: write` stays out of this
      # job (docs/parity.md §10) and out of every caller's grant.
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # MUST use AGENT_PAT, for `auto-fix`'s reason: `agent:implement` added with
      # `GITHUB_TOKEN` sits on the parent and starts nothing. So without the PAT
      # nothing is added at all, and the one place a maintainer is already
      # looking — this slice PR — says which re-label advances the chain by hand.
      #
      # `bash -e` and no `|| true` on the add, for `auto-fix`'s reason: a chain
      # that did not advance under a round that ended is a stall with no other
      # symptom, and a red job is the only thing that says so.
      - name: Advance the PRD chain
        env:
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_REF" =~ ^agent/slice-([0-9]+)-[0-9]+- ]]; then
            echo "::error::Slice PR #${PR_NUMBER}'s head \`${HEAD_REF}\` is not \`agent/slice-<parent>-<sub-issue>-…\`, so its PRD cannot be told. Re-add \`agent:implement\` to the PRD by hand to advance its chain."
            exit 1
          fi
          parent="${BASH_REMATCH[1]}"
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::AGENT_PAT is not set, so the PRD chain was not advanced: a label added with GITHUB_TOKEN starts nothing. Re-add agent:implement to #${parent} by hand."
            gh pr comment "$PR_NUMBER" --body "This slice's review round has ended, but the PRD chain will not advance on its own: \`AGENT_PAT\` is not set, and a label added with \`GITHUB_TOKEN\` starts nothing. Re-add \`agent:implement\` to #${parent} by hand to merge this slice PR into the PRD branch and move the chain on." \
              || echo "::warning::…and that could not be said on the pull request either."
            exit 0
          fi
          gh issue edit "$parent" --add-label "agent:implement"
          echo "Re-added agent:implement to #${parent}: the PRD chain advances past slice PR #${PR_NUMBER}."
