name: Agent Implement PRD (reusable)

# The PRD job itself. The `implement-prd` job in `agent-issue.yml` is the
# caller (two wires, under that file's trigger), and every guard, permission and
# step stays here, in a file an adopting repo *references* rather than copies
# (jeffwlawson/winget-manifest-lint#98).
#
# The PRD path (jeffwlawson/winget-manifest-lint#92). Labelling a *parent* issue
# `agent:implement` implements its sub-issues one at a time, one per run, as
# commits straight onto a single **PRD branch**, reviewed on a single **PRD PR**
# into the default branch (PRD #222). No slice has a branch or a pull request
# of its own: the PRD PR's CI is the default branch's CI, so every slice gets
# it.
#
# It shares its trigger label with `agent-implement`, so both jobs start on
# every `agent:implement` label event and the pair partitions the work by issue
# *shape*: an issue that has sub-issues is this workflow's, every other shape is
# `agent-implement`'s. Whichever one does not own the shape calls `defer` and
# exits touching nothing — no comment, no label. Both halves matter. Two bot
# comments about one event say opposite things ("the PRD path is not built"
# beside a run that is building it), and a second job racing to remove
# `agent:implement` would eat the re-label that advances the chain.
#
# ## Ordering comes from the sub-issue list, checked once against the links
#
# The chain walks **sub-issues API order**: publish order is execution order
# (docs/agents/ticket-shape.md). Before the first slice is built, and only
# then, the preflight reads every sub-issue's "blocked by" links and refuses a
# list whose order contradicts them, or a sub-issue blocked from outside the
# PRD (#222). There is no check as each later slice is reached: sub-issues
# stay open until the PRD PR merges, so a link between two slices never clears
# while the chain runs, and a per-slice check would refuse every slice after
# the first.
#
# ## Which slice is next is read off the PRD branch
#
# Every commit a build run makes carries an `Agent-Slice: #<sub>` trailer
# (#242), and a sub-issue is **built** when a commit on the PRD branch carries
# its trailer: it has a slice range (`shared/slice-ranges.ts`). The next slice
# is the first sub-issue in the list with none. Never which sub-issues are
# closed: no step here closes one, and closing or reopening one by hand must
# not make the chain skip or repeat work. `Closes` lines in the PRD PR close
# them when it merges.
#
# The one exception is pre-upgrade compatibility, removable under #224: a
# chain an older release started with slice PRs. A closed sub-issue with no
# slice range landed before the upgrade and is not built again, and a slice PR
# still open into the PRD branch refuses the run by name. Each site is marked
# "Pre-upgrade compatibility" so #224 can find it.
#
# ## The next slice waits for an approval
#
# A run builds one slice, pushes it to the PRD branch, adds `agent:review` to
# the PRD PR and stops. That review is the slice's round. The next run builds
# the next slice **only if the PRD PR's head carries an `agent-review` verdict
# of approval**, read live in the preflight. Anything else refuses and names
# the ways on, and that includes a human re-adding `agent:implement` to a
# parked chain: the label is never the gate.
#
# Before it builds, the run merges the default branch into the PRD branch
# wherever it has moved, and never rebases: a conflict parks the chain and
# names `agent:update-branch` (#245, `Merge the default branch into the PRD
# branch` below).
#
# After the last slice, a **finishing run** builds nothing and runs no model.
# With one slice landed, its round was the review of the whole PRD PR, so it
# marks the PRD PR ready. With more than one, it records that the final review
# is requested in the PRD PR's body and adds `agent:review`. A human merges the
# PRD PR. The loop never merges it and never approves.
#
# ## Progress is comments and a table, never labels or closed issues
#
# The chain's state is the **progress table** in the PRD PR's body (#246,
# #298), with the status line at the top of its note, rendered by
# `shared/progress-list.ts` from live state: by the gate as a slice starts
# building (a rewrite of the slice's row held equal to the render, #312), by
# the runner as its round is asked for, by `review`'s advance job at every
# ending of a round, and by a build run that stops, so no slice is left
# building with nothing running. A build run comments on the sub-issue it
# starts, with its link, and puts a chapter marker on the PRD PR; the parent
# hears from the chain's first run only. The run past an approval notes the
# approved slice on its sub-issue. No step adds a label for progress, and no
# step closes a sub-issue.

on:
  workflow_call:
    inputs:
      default-branch:
        description: >-
          The branch the PRD branch is cut from and the PR is
          opened against. Not a fallback, unlike the PR workflows' input of the
          same name — nothing in an `issues` event says which branch the work
          belongs on, so this is the only answer there is.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets its
          slices implemented, running on the Node the runner package requires.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or an issue title
          becomes a shell script.
        type: string
        default: npm ci
      transcript-retention-days:
        description: >-
          Days the agent's Claude Code session transcript is kept, as this
          run's `agent-transcript` artifact, with every secret the job holds
          redacted. 0 turns the upload off. On a public repository the
          artifact is readable by anyone who can see the repository; see
          docs/ADOPTING.md §2d.
        type: number
        default: 3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the implementation agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT. It opens the PRD PR (the Actions bot may not create one) and
          adds `agent:review` to it, and a label added with `GITHUB_TOKEN`
          triggers no workflow, so without it no slice is ever reviewed
          (docs/ADOPTING.md §1). Optional, and every site warns rather than
          failing silently. The loop's App, where it is set up, takes its
          place.
        required: false
      AGENT_APP_ID:
        description: >-
          The loop's GitHub App's ID. With `AGENT_APP_PRIVATE_KEY`, the
          catch-up and publish jobs each mint a token for this repository from
          the App and make the writes `AGENT_PAT` would make with it, as the
          App's bot. Optional; without both, `AGENT_PAT` is used as before.
        required: false
      AGENT_APP_PRIVATE_KEY:
        description: The loop's GitHub App's private key. See `AGENT_APP_ID`.
        required: false

# Per *parent issue*, first-come, so consecutive slices of one PRD never
# overlap: the chaining step re-labels the parent while this run is still
# going, and the next run waits for this one to finish every job,
# including the `always()` label removal, before it starts.
#
# On the workflow rather than on a job, because the run is four jobs that
# hand off to each other (see `implement.yml`'s note on its own group): a
# job-level group is released between them, and a second run for the same
# PRD could start between this run's agent and its push.
#
# NOT the `agent-pr-<n>` group the three PR workflows share, even though
# this pushes to a PR's branch. An `issues` event carries no PR number, so
# the two cannot compute a common key. The residual race that leaves is
# recorded in docs/parity.md §10 rather than papered over: the happy path
# does not overlap, because the next run's gate refuses while the PRD PR's
# round is running.
#
# Every label event on the issue starts this workflow, and a workflow-level
# group is entered before any job's `if:` is evaluated (probed, #309). A group
# admits one pending run, cancelling the one it replaces, so an event for any
# other label takes a group of its own, keyed by its run id: otherwise adding
# `bug` while a run is in progress would cancel an `agent:implement` run
# waiting behind it.
concurrency:
  group: agent-implement-prd-issue-${{ github.event.issue.number }}${{ github.event.label.name != 'agent:implement' && format('-other-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# **Four jobs, and the agent's holds nothing it could use to write**, for the
# reason `implement.yml` gives in full: the agent can read every secret its
# own job names, from the runner process's memory, and leave something behind
# for a later step on its runner.
#
# So `gate` reads the PRD, refuses or claims it, and decides the slice;
# `catch_up` merges the default branch into the PRD branch and pushes it,
# before any agent runs and on a runner none has touched; `implement-prd`
# runs the agent with a read-only token and names no PAT and no App secret
# anywhere, and hands over its commits as a `git bundle`; and `publish` starts
# on a fresh runner, checks the bundle, and pushes, opens or reuses the PRD
# PR, asks for the round and hands the PRD PR over. The two jobs that push
# each resolve the loop's token, the App's or the PAT, at their start
# (`.github/actions/loop-token`).
#
# The PRD PR's progress list shows the slice **building** from the gate,
# which holds `pull-requests: write` and runs no agent, once it has claimed
# the slice (#312): the agent's job reads only, and is given no write scope
# to say so.
#
# The permissions differ per job, and the caller grants the union: what
# `publish` and `gate` spend. The caller is unchanged.
jobs:
  gate:
    # Job-level, for the same reason as agent-implement-reusable.yml — a
    # job-level `if:` skips without provisioning a runner. On this side of the
    # seam, where a caller can skip it but cannot loosen it. The jobs after it
    # follow from its outputs, so this is the one guard.
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    # API calls and nothing else; the agent's own limit is on its job.
    timeout-minutes: 10
    # Granted by the caller, bounded here, per job: a called workflow can only
    # downgrade the token it is handed, and a permission declared only here
    # grants nothing.
    permissions:
      # The PRD branch's commits, read for which slices are built.
      contents: read
      # The refusals, the start comments and the label transitions.
      issues: write
      # The PRD PR's chapter marker, and the open-PR reads in the preflight.
      pull-requests: write
      # The approval gate reads the PRD PR head's `agent-review` verdict from
      # its combined status: its own scope, which a block that leaves it out
      # sets to `none` (#199).
      statuses: read
    outputs:
      refused: ${{ steps.preflight.outputs.refused }}
      prd_branch: ${{ steps.preflight.outputs.prd_branch }}
      prd_branch_exists: ${{ steps.preflight.outputs.prd_branch_exists }}
      prd_pr: ${{ steps.preflight.outputs.prd_pr }}
      landed: ${{ steps.preflight.outputs.landed }}
      sub: ${{ steps.preflight.outputs.sub }}
      sub_k: ${{ steps.preflight.outputs.sub_k }}
      sub_title: ${{ steps.preflight.outputs.sub_title }}
      subs: ${{ steps.preflight.outputs.subs }}
      build: ${{ steps.preflight.outputs.build }}
      finishing: ${{ steps.preflight.outputs.finishing }}
      started: ${{ steps.clock.outputs.started }}

    env:
      # Throughout this file, ISSUE_* is the **parent PRD**. The sub-issue being
      # implemented this run is `steps.preflight.outputs.sub`, and is never the
      # thing whose labels get transitioned.
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_STATE: ${{ github.event.issue.state }}
      # The branch the chain is based on: checked out, branched from on the
      # first slice, opened against, and handed to the runner so the prompt can
      # tell the agent what to diff to see the slices already landed.
      BASE_REF: ${{ inputs.default-branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # This run's page, linked from the start comment and from the failure
      # comment on the parent (#205). One definition per job that posts, so
      # the two cannot link different things.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Everything that decides whether this run happens, before checkout and
      # the dependency install, so a refusal costs one API call and nothing else.
      #
      # Order is load-bearing and differs from `agent-implement`'s: the
      # **partition** is settled first, before anything that speaks. A closed
      # PRD parent would otherwise collect the same "this issue is not open"
      # comment twice, seconds apart, from two runs that cannot see each other.
      - name: Preflight
        id: preflight
        run: |
          set -euo pipefail

          # The trigger label comes off with every refusal, as with every run
          # that ends (#236), which is what makes a retry a deliberate human
          # act rather than a re-run. In the loop's one order: the comment
          # first, then this run's own label off, then `agent:blocked` where
          # the refusal is a durable one, so the label that names the next step
          # goes on last.
          # The comment is tolerated: under `-e` a failed one would end the step
          # before the removal, and leave the label on with nothing behind it.
          # One pattern for every refusal (#253): the label that did not run,
          # then a sentence saying why and what to do, starting with a capital.
          refuse() {
            echo "refused=true" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --body "**\`agent:implement\` didn't run:** $1" || echo "::warning::Could not post the refusal comment on #${ISSUE_NUMBER}."
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
            if [ "${2:-}" = "blocked" ]; then
              gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
            fi
            exit 0
          }

          # A durable refusal, one that will repeat verbatim until somebody
          # restructures the work, also marks the issue blocked, since that is
          # where the maintainer has to act (#253). Deliberately
          # NOT used for the finished-PRD case below: a PRD whose sub-issues
          # are all built is in a success state, and `agent:blocked` there is
          # exactly the stale label nobody ever clears (docs/parity.md §10).
          refuse_shape() {
            refuse "$1" blocked
          }

          # Not a refusal. `agent-implement` owns this shape and is running
          # right now on the same event; this job has nothing to add and, more
          # importantly, nothing it may safely touch. A log line and exit 0.
          defer() {
            echo "refused=true" >> "$GITHUB_OUTPUT"
            echo "$1"
            exit 0
          }

          # One query for the whole shape — parent, labels and the sub-issue
          # list together. Asking separately is two chances to see a different
          # answer, and every branch below reads the same snapshot.
          #
          # Deliberately not `|| true`, the same exception
          # jeffwlawson/winget-manifest-lint#90 made: "no answer" read as "no
          # sub-issues" would hand a PRD to the single-issue path. A failed
          # query fails the step, which leaves the trigger label in place and
          # the run visibly red.
          issue=$(gh api graphql \
            -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -F number="$ISSUE_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  issue(number: $number) {
                    parent { number }
                    labels(first: 100) { nodes { name } }
                    subIssues(first: 100) {
                      totalCount
                      nodes { number title state }
                    }
                  }
                }
              }' \
            --jq '.data.repository.issue')
          # Kept for `Open or reuse the PRD PR`, which writes its `Closes` lines
          # from the same snapshot every branch below rules on.
          printf '%s\n' "$issue" > "${RUNNER_TEMP}/prd-issue.json"

          parent=$(jq -r '.parent.number // ""' <<< "$issue")
          subs=$(jq -r '.subIssues.totalCount' <<< "$issue")
          wayfinder=$(jq -r '[.labels.nodes[].name | select(startswith("wayfinder:"))] | join(", ")' <<< "$issue")

          # The partition, and the first thing this step does with the answer.
          # `totalCount` counts closed sub-issues too, so a finished PRD still
          # lands here rather than being handed back — which is what keeps the
          # "nothing left to do" refusal below reachable.
          if [ "$subs" -eq 0 ]; then
            defer "#${ISSUE_NUMBER} has no sub-issues, so agent-implement owns this label event."
          fi

          if [ "$ISSUE_STATE" != "open" ]; then
            refuse "This issue is closed. Reopen it, then add \`agent:implement\` again."
          fi

          # Checked before the hierarchy, since a wayfinder ticket is refused
          # whichever shape it happens to have. A wayfinder map with sub-issues
          # reaches *this* workflow rather than agent-implement, so the refusal
          # has to exist in both.
          if [ -n "$wayfinder" ]; then
            refuse_shape "This is a planning issue (\`wayfinder:*\`), not buildable work. Add \`agent:implement\` to the issues it produces instead."
          fi

          # A nested PRD has two owners of one ordering, and neither can see the
          # other's chain: #${parent}'s run would drive its own sub-issues while
          # this one drives these, both pushing to different branches.
          if [ -n "$parent" ]; then
            refuse_shape "This PRD is itself a sub-issue of #${parent}. Remove it from #${parent}, or move its sub-issues up to #${parent}, then label the top-level issue."
          fi

          # The query pages at 100, and `totalCount` does not. Past that, `next`
          # can come back empty while open sub-issues sit off the end of the
          # page — and the refusal below would then report a PRD as *finished*
          # when it is not, which is the plausible-wrong-answer class every
          # other guard in this file exists to prevent. Refuse loudly instead.
          if [ "$subs" -gt 100 ]; then
            refuse_shape "This PRD has ${subs} sub-issues, and the loop handles at most 100. Split it into smaller PRDs."
          fi

          # A refusal that is a *stop* rather than a shape: the chain is
          # mid-flight and something on it needs a human. It fails into `Mark
          # blocked on failure`, which is what gives it `agent:blocked` and a
          # comment carrying the reason file.
          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          # One PRD branch for the whole PRD, found on the remote by the
          # **stable half** of its name, `agent/prd-<parent>-`, with the dash
          # that stops #17 matching #171's branch. The slug half comes from
          # the parent's title, and a title is editable: recompute it every
          # run and retitling the PRD mid-chain silently forks the chain,
          # building slice N on the default branch without slices 1..N-1. So
          # the slug only ever *names* a branch that does not exist yet.
          #
          # Not `|| true`, for the shape query's reason: "could not look" read
          # as "no branch" starts the chain over on a fresh one.
          branches=$(gh api "repos/${GH_REPO}/git/matching-refs/heads/agent/prd-${ISSUE_NUMBER}-" \
            --jq '[.[] | {name: (.ref | sub("^refs/heads/"; "")), sha: .object.sha}]') \
            || block "Couldn't look for this PRD's branch, so nothing was built."
          if [ "$(jq 'length' <<< "$branches")" -gt 1 ]; then
            # Two branches for one PRD is the fork the lookup exists to
            # prevent, and picking either one drops whatever is on the other.
            block "More than one branch is named for this PRD: $(jq -r 'map("`\(.name)`") | join(", ")' <<< "$branches"). It can't tell which one holds the slices already built. Delete or rename all but one."
          fi
          prd_branch=$(jq -r '.[0].name // ""' <<< "$branches")
          prd_sha=$(jq -r '.[0].sha // ""' <<< "$branches")
          if [ -z "$prd_branch" ]; then
            slug=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
            prd_branch="agent/prd-${ISSUE_NUMBER}-${slug}"
          fi

          # Pre-upgrade compatibility, removable under #224. A release before
          # #222 built each slice on a slice branch, as a slice PR into the PRD
          # branch, and merged it there. One still open is a slice this release
          # cannot see on the PRD branch and must not build over: building its
          # sub-issue again would put a second copy of the work beside it. So
          # the run refuses and names it, and building nothing is the point; a
          # human decides whether it lands. Durable, until they do, so the
          # parent is marked blocked as for a shape.
          #
          # Not `|| true`, for the shape query's reason: "could not look" read
          # as "none open" is the build over it this exists to prevent.
          if [ -n "$prd_sha" ]; then
            old_slices=$(gh pr list --state open --base "$prd_branch" --limit 100 --json number,headRefName) \
              || block "Couldn't look for slice PRs still open into \`${prd_branch}\`, so nothing was built."
            old_slices=$(jq -r 'map(select(.headRefName | startswith("agent/slice-")) | "#\(.number) (`\(.headRefName)`)") | join(", ")' <<< "$old_slices")
            if [ -n "$old_slices" ]; then
              refuse_shape "Slice PRs from an earlier release are still open into this PRD's branch \`${prd_branch}\`: ${old_slices}. This release builds every slice on the PRD branch itself and doesn't use slice PRs, so it won't build over them. Merge or close each by hand; if you close one without merging it, reopen its sub-issue so it's built again. Then add \`agent:implement\` again."
            fi
          fi

          # The sub-issues already built: the ones a commit on the PRD branch
          # names in its `Agent-Slice` trailer, which is exactly the set with a
          # slice range (`shared/slice-ranges.ts`). Read from the commits the
          # PRD branch has and the default branch does not, so a default-branch
          # history the chain merged in names nothing. Never from which
          # sub-issues are closed.
          #
          # Not `|| true`, for the shape query's reason: "could not look" read
          # as "nothing built" builds the first slice a second time.
          built="[]"
          if [ -n "$prd_sha" ]; then
            built=$(gh api "repos/${GH_REPO}/compare/${BASE_REF}...${prd_sha}?per_page=100" --paginate \
                --jq '[.commits[].commit.message | split("\n")[] | capture("^agent-slice:[ \t]*#(?<n>[0-9]+)[ \t]*$"; "i").n | tonumber]' \
              | jq -s -c 'add // [] | unique') \
              || block "Couldn't read which sub-issues are already built on \`${prd_branch}\`, so nothing was built."
          fi

          # The whole scheduling policy, in one filter: keep the open
          # sub-issues no commit names, in the order the API returned them,
          # take the head. `next` in `shared/slice-ranges.ts`, the same rule.
          next=$(jq -c --argjson built "$built" \
            '[.subIssues.nodes[] | select(.state == "OPEN" and (.number as $n | any($built[]; . == $n) | not))] | .[0] // empty' <<< "$issue")
          landed=$(jq --argjson built "$built" \
            '[.subIssues.nodes[] | select(.number as $n | any($built[]; . == $n))] | length' <<< "$issue")
          # Pre-upgrade compatibility, removable under #224. A closed sub-issue
          # no commit names **landed before the upgrade**: a release before
          # #222 closed each slice's sub-issue as its slice PR opened, and
          # merged that PR without a trailer. It is not built again, gets no
          # `Closes` line, and the progress list shows it as landed before the
          # upgrade (`shared/progress-list.ts`). It counts towards the slices
          # that landed, for the handover; never towards the gate, since no
          # round on the PRD PR reviewed it.
          before_upgrade=$(jq --argjson built "$built" \
            '[.subIssues.nodes[] | select(.state == "CLOSED" and (.number as $n | any($built[]; . == $n) | not))] | length' <<< "$issue")
          slices_landed=$((landed + before_upgrade))

          # The PRD PR, found by its **head**, the PRD branch.
          prd_pr=""
          if [ -n "$prd_sha" ]; then
            prd_prs=$(gh pr list --state open --head "$prd_branch" --limit 100 --json number,headRefOid,isDraft,labels,body) \
              || block "Couldn't look for the PRD PR from \`${prd_branch}\`, so nothing was built."
            if [ "$(jq 'length' <<< "$prd_prs")" -gt 1 ]; then
              block "$(jq -r 'map("#\(.number)") | join(", ")' <<< "$prd_prs") are all open from this PRD's branch \`${prd_branch}\`, so it can't tell which one is the PRD PR. Close all but one."
            fi
            prd_pr=$(jq -r '.[0].number // ""' <<< "$prd_prs")
          fi

          # What the run does, from what is built and what the PRD PR says:
          #
          #   built   | PRD PR              | the run
          #   nothing | -                   | checks the links, builds the first slice
          #   some    | none open           | opens it and asks for its review,
          #           |                     |   since a run died after its push
          #   some    | handed over, none   | refused: the PRD is finished
          #           |   left              |
          #   some    | head not approved   | refused, naming the ways on
          #   some    | approved, some left | builds the next slice
          #   some    | approved, none left | finishing: hands the PRD PR over
          build=true
          finishing=false
          approved_sub=""
          approved_sha=""
          approved_review=""
          if [ "$landed" -eq 0 ] && [ -z "$next" ]; then
            # Pre-upgrade compatibility, removable under #224: every sub-issue
            # closed before this release built any, so there is nothing to
            # build and no round of its own to finish on.
            refuse "Every sub-issue of this PRD was closed before this release built any of them, so there's nothing left to build. To build more, add a sub-issue, or reopen one, first."
          elif [ "$landed" -gt 0 ] && [ -z "$prd_pr" ]; then
            echo "Slices of #${ISSUE_NUMBER} are on \`${prd_branch}\` but no PRD PR is open from it; opening one and asking for its review. Nothing is built."
            build=false
          elif [ "$landed" -gt 0 ]; then
            # **Finished** is read off what the handover leaves, never off the
            # draft state alone: review keeps a PRD PR a draft through every
            # slice round (review.yml's `Mark PR ready for review`), but a
            # human can mark one ready by hand, so a ready PRD PR with more
            # than one slice may still be waiting for its handover.
            # With more than one slice landed, the handover's mark in the body
            # is the test, and the handover takes it back out again if it
            # cannot add the label the mark announces. With one, ready is the
            # whole handover, so ready is finished, whoever marked it.
            if [ -z "$next" ]; then
              final_review="<!-- agent:final-review requested -->"
              if [ "$slices_landed" -gt 1 ] && [[ "$(jq -r '.[0].body // ""' <<< "$prd_prs")" == *"$final_review"* ]]; then
                refuse "Every sub-issue of this PRD is built and the final review of PRD PR #${prd_pr} was requested, so it's yours from here. To build more, add a sub-issue first."
              fi
              if [ "$slices_landed" -eq 1 ] && [ "$(jq -r '.[0].isDraft' <<< "$prd_prs")" != "true" ]; then
                refuse "Every sub-issue of this PRD is built and its PRD PR is ready for you. To build more, add a sub-issue first."
              fi
            fi

            # The ways on from a round that did not end on an approval, said
            # the same way wherever the chain stops for one.
            ways="To move on, add \`agent:fix\` to PRD PR #${prd_pr} for another fix round; or decline a finding by replying to it, then add \`agent:review\` there; or push a commit, then add \`agent:review\` there. The chain moves on once a review of the PRD PR's latest commit recommends approval."

            # A round in flight is never cut short: the review, the fix it
            # started, or the re-review that fix asked for is still to land.
            # Read off the trigger labels, which are on while their run works
            # and while it is queued (#236).
            busy=$(jq -r '[.[0].labels[].name | select(. == "agent:review" or . == "agent:fix" or . == "agent:update-branch")] | join("`, `")' <<< "$prd_prs")
            if [ -n "$busy" ]; then
              refuse "PRD PR #${prd_pr} still has \`${busy}\`, so its review round hasn't ended and nothing was built. Add \`agent:implement\` again once that label is gone."
            fi

            # **The approval gate.** Read live off the PRD PR's head, never off
            # the label that started this run: anyone with triage rights can
            # add that, and a human re-adding it to a parked chain must get
            # this refusal rather than the next slice. The combined status
            # holds the latest post per context, and only an approval is
            # `success` (`VERDICTS` in `shared/review-output.ts`); a review
            # that died posts `error`.
            head=$(jq -r '.[0].headRefOid' <<< "$prd_prs")
            verdict=$(gh api "repos/${GH_REPO}/commits/${head}/status" --paginate --slurp \
              | jq -c '[.[].statuses[]? | select(.context == "agent-review")] | .[0] // empty') \
              || block "Couldn't read the review verdict on PRD PR #${prd_pr}'s latest commit, so nothing was built."
            case "$(jq -r '.state // ""' <<< "${verdict:-null}")" in
              success)
                echo "PRD PR #${prd_pr}'s latest commit ${head} has an approval; the chain moves on."
                # The slice that approval is for, the current one: the last
                # sub-issue in the list with a slice range. Named on its own
                # sub-issue by `Note the approved slice`, with the review
                # whose record says which criteria changed.
                approved_sub=$(jq -r --argjson built "$built" \
                  '[.subIssues.nodes[] | select(.number as $n | any($built[]; . == $n))] | last | .number // ""' <<< "$issue")
                approved_sha="$head"
                approved_review=$(jq -r '.target_url // ""' <<< "$verdict")
                ;;
              "") refuse "PRD PR #${prd_pr}'s latest commit hasn't been reviewed, so the next slice wasn't started. ${ways}" ;;
              error) refuse "The review of PRD PR #${prd_pr}'s latest commit didn't finish, so there's no verdict and the next slice wasn't started. ${ways}" ;;
              *) refuse "The review of PRD PR #${prd_pr}'s latest commit didn't recommend approval ($(jq -r '.description // "" | split(". ")[0]' <<< "$verdict")), so the next slice wasn't started. ${ways}" ;;
            esac

            if [ -z "$next" ]; then
              echo "Every sub-issue of #${ISSUE_NUMBER} is built; finishing it."
              build=false
              finishing=true
            fi
          fi

          if [ "$build" = "true" ]; then
            # **The links, checked once, before the first build.** The order
            # is the sub-issue list's, and the links are what it must agree
            # with: a sub-issue listed before one it is blocked by would be
            # built on work that does not exist yet, and one blocked by an
            # issue outside the PRD is waiting on a deliverable the chain
            # does not build. Both refuse before anything is built, when the
            # fix costs a reorder rather than several slices.
            #
            # Only here, never as later slices are reached: sub-issues stay
            # open until the PRD PR merges, so a link between two slices
            # never clears while the chain runs. This amends the "never reads
            # `blocked_by`" of docs/parity.md §2a.
            #
            # A link to a sub-issue counts whatever its state, since the order
            # is wrong either way; one to an outside issue only while that
            # issue is open, the parent's own rule below. Not `|| true`: "could
            # not read" read as "no links" is the order this exists to check.
            if [ "$slices_landed" -eq 0 ]; then
              order=$(jq -c '[.subIssues.nodes[].number]' <<< "$issue")
              for sub in $(jq -r '.[]' <<< "$order"); do
                links=$(gh api "repos/${GH_REPO}/issues/${sub}/dependencies/blocked_by" --jq '[.[] | {number, state}]') \
                  || block "Couldn't read the \"blocked by\" links of sub-issue #${sub}, so nothing was built."
                late=$(jq -r --argjson order "$order" --argjson sub "$sub" \
                  '[.[] | .number as $n | select(($order | index($n)) != null and ($order | index($n)) > ($order | index($sub))) | $n] | .[0] // ""' <<< "$links")
                if [ -n "$late" ]; then
                  refuse_shape "Sub-issue #${sub} comes before #${late} in this PRD's sub-issue list, but it's blocked by #${late}, so it would be built first. Reorder the sub-issues so #${late} comes before #${sub}, then add \`agent:implement\` again."
                fi
                outside=$(jq -r --argjson order "$order" \
                  '[.[] | select(.state == "open" and (.number as $n | $order | index($n)) == null) | .number] | .[0] // ""' <<< "$links")
                if [ -n "$outside" ]; then
                  refuse_shape "Sub-issue #${sub} is blocked by #${outside}, which isn't part of this PRD, and the chain can't build #${sub} until #${outside} is done. Move that \"blocked by\" link from #${sub} to this issue, then add \`agent:implement\` again."
                fi
              done
            fi

            # The same blocked-by refusal `agent-implement` carries, for the
            # same reason: a blocker is a *separate* deliverable with its own
            # PR and its own reviewer, so labelling the thing downstream must
            # not authorise it, transitively. Being a coordinator exempts this
            # issue from nothing (a PRD parent is a deliverable like any other),
            # and here the cost of running anyway is larger than the flat
            # case's one wasted run: a single label starts a chain that lands
            # every slice on one branch, as one PR, built on work that does not
            # exist yet.
            #
            # **After the finished PRD's refusal.** That shape can never run at
            # all; this one is only *not yet*, and it is the one that must give
            # way when they collide. A finished PRD carrying a still-open edge
            # would otherwise be handed `agent:blocked`, the one label
            # `refuse_shape` above deliberately withholds from a success state,
            # on an issue no later run can ever clear it from. The finishing
            # run never reaches it either: it builds nothing.
            #
            # REST rather than the shape query above, deliberately: this
            # endpoint is purpose-built and its response was verified against a
            # real edge.
            blockers=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/dependencies/blocked_by" \
              --jq '[.[] | select(.state == "open") | "#\(.number)"] | join(", ")' 2>/dev/null || echo "")
            # `refuse_shape` rather than `refuse`, the same deliberate exception
            # `agent-implement` makes: `agent:blocked` is the only way to find
            # work that is waiting, and a plain `refuse` would strip the
            # trigger label and leave the PRD carrying nothing at all.
            if [ -n "$blockers" ]; then
              if [[ "$blockers" == *,* ]]; then
                refuse_shape "It's blocked by ${blockers}, which are still open. Add \`agent:implement\` again once they are closed, or remove the \"blocked by\" links that no longer apply."
              else
                refuse_shape "It's blocked by ${blockers}, which is still open. Add \`agent:implement\` again once ${blockers} is closed, or remove the \"blocked by\" link if it no longer applies."
              fi
            fi
          fi

          # Heredoc form for the title: an issue title cannot contain a newline
          # today, and a step output that trusts that is one GitHub API change
          # away from being an injection into the environment file.
          {
            echo "prd_branch=${prd_branch}"
            echo "prd_branch_exists=$([ -n "$prd_sha" ] && echo true || echo false)"
            echo "prd_pr=${prd_pr}"
            # Every slice that landed, those before the upgrade included: what
            # the handover asks "more than one?" of.
            echo "landed=${slices_landed}"
            echo "approved_sub=${approved_sub}"
            echo "approved_sha=${approved_sha}"
            echo "approved_review=${approved_review}"
            if [ "$build" = "true" ]; then
              echo "sub=$(jq -r '.number' <<< "$next")"
              # Slice k of n, for the comment on the sub-issue it starts.
              echo "sub_k=$(jq --argjson sub "$(jq '.number' <<< "$next")" '[.subIssues.nodes[].number] | index($sub) + 1' <<< "$issue")"
              echo "sub_title<<PRD_SUB_TITLE_EOF"
              jq -r '.title' <<< "$next"
              echo "PRD_SUB_TITLE_EOF"
            else
              echo "sub="
              echo "sub_k="
            fi
            echo "subs=${subs}"
            echo "build=${build}"
            echo "finishing=${finishing}"
            echo "refused=false"
          } >> "$GITHUB_OUTPUT"

          if [ "$build" = "true" ]; then
            echo "Targeting sub-issue #$(jq -r '.number' <<< "$next") of ${subs}, with ${landed} built and ${before_upgrade} landed before the upgrade."
          fi

      # The trigger label stays on while this run works and comes off in the
      # last step, however the run ends (#236), so on the parent it is on only
      # during a run. Nothing in this run puts it back: the next slice waits on
      # this one's round on the PRD PR. So the one label to take off here is a
      # block an earlier run left. The line before it is the permission probe:
      # it adds the label this run already holds, which changes nothing, and is
      # not `|| true`, so a short token fails the run before the checkout.
      #
      # Then the start comments (#298), each run's link once, on the
      # sub-issue it builds, and the other surfaces pointing there by `#N`:
      #
      # - the **parent**, on the chain's first run only and with no link,
      #   acknowledging the label the maintainer just added; later runs post
      #   nothing there, and the parent keeps its label, refusals and park
      #   comments;
      # - the **sub-issue**, with the run's link, so a running build is found
      #   from the work it is for (#246);
      # - the **PRD PR**, a chapter marker with no link, `#<sub>` reaching the
      #   run in one click; for the first slice, `Open or reuse the PRD PR`
      #   posts it once the PR is open.
      #
      # No title beside a reference: GitHub renders one with its title. Each is
      # a warning where it cannot be posted, never a failure: nothing has been
      # done yet that a stopped run would need to report, and a progress note
      # is not worth a build.
      - name: Transition labels
        id: start
        if: steps.preflight.outputs.refused == 'false'
        env:
          SUB: ${{ steps.preflight.outputs.sub }}
          SUB_K: ${{ steps.preflight.outputs.sub_k }}
          SUBS: ${{ steps.preflight.outputs.subs }}
          PRD_BRANCH: ${{ steps.preflight.outputs.prd_branch }}
          PRD_PR: ${{ steps.preflight.outputs.prd_pr }}
          LANDED: ${{ steps.preflight.outputs.landed }}
          BUILD: ${{ steps.preflight.outputs.build }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:implement"
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          [ "$BUILD" = "true" ] || exit 0
          # The chain's first run, once: a retry of a first run that stopped
          # finds the comment it posted, by its mark, and posts no second.
          if [ "$LANDED" = "0" ]; then
            mark="<!-- agent:prd-started -->"
            posted=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/comments" --paginate \
              --jq "[.[] | select(.body // \"\" | contains(\"${mark}\"))] | length" | jq -s 'add // 0') || posted=0
            if [ "${posted:-0}" -eq 0 ]; then
              body=$(printf '**`agent:implement` started:** building #%s first.\n\n%s' "$SUB" "$mark")
              gh issue comment "$ISSUE_NUMBER" --body "$body" || echo "::warning::Could not post the start comment on #${ISSUE_NUMBER}. The run goes on; it is ${RUN_URL}."
            fi
          fi
          if [ -n "$PRD_PR" ]; then
            where="on PRD PR #${PRD_PR}"
          else
            where="on the PRD branch \`${PRD_BRANCH}\`, whose PRD PR opens once this slice is pushed"
          fi
          gh issue comment "$SUB" --body "**\`agent:implement\` started:** Building now ${where} · [Workflow run](${RUN_URL})" || echo "::warning::Could not post the start comment on sub-issue #${SUB}. The run goes on; it is ${RUN_URL}."
          if [ -n "$PRD_PR" ]; then
            gh pr comment "$PRD_PR" --body "**Slice ${SUB_K} of ${SUBS} · #${SUB} started**" || echo "::warning::Could not say on PRD PR #${PRD_PR} that sub-issue #${SUB} started."
          fi

      # The approved slice, on its own sub-issue (#246): the run the advance
      # job started has passed its gate, so the slice the PRD PR's head was
      # approved on is done with, and its sub-issue records what shipped for
      # it, while the sub-issue itself stays open until the PRD PR merges.
      # Built in the approved head, reviewed on the PRD PR, and the criteria
      # the approving round's record (#214) says changed or went unmet, or
      # that none did.
      #
      # The record is the approving review's body, which the verdict links,
      # read for the lines its *Acceptance criteria* group gives a changed or
      # unmet criterion (`renderCriteriaGroup` in `shared/review-output.ts`; a
      # test renders the group and reads it back through this step). Never
      # fails the run: a note that cannot be read or posted says so in a
      # warning, and the chain goes on.
      - name: Note the approved slice
        id: approved_note
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.approved_sub != ''
        env:
          APPROVED_SUB: ${{ steps.preflight.outputs.approved_sub }}
          APPROVED_SHA: ${{ steps.preflight.outputs.approved_sha }}
          APPROVED_REVIEW: ${{ steps.preflight.outputs.approved_review }}
          PRD_PR: ${{ steps.preflight.outputs.prd_pr }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -uo pipefail
          # Once per approved head: a retry past the same approval, after a
          # run that failed, finds the note it posted and posts no second.
          mark="<!-- agent:slice-approved ${APPROVED_SHA} -->"
          posted=$(gh api "repos/${GH_REPO}/issues/${APPROVED_SUB}/comments" --paginate \
            --jq "[.[] | select(.body // \"\" | contains(\"${mark}\"))] | length" | jq -s 'add // 0') || posted=""
          if [ -n "$posted" ] && [ "$posted" -gt 0 ]; then
            echo "Sub-issue #${APPROVED_SUB} already has its approved-slice note for ${APPROVED_SHA}."
            exit 0
          fi
          criteria="**Acceptance criteria changed or unmet:** none."
          body=""
          if [[ "$APPROVED_REVIEW" =~ \#pullrequestreview-([0-9]+)$ ]]; then
            body=$(gh api "repos/${GH_REPO}/pulls/${PRD_PR}/reviews/${BASH_REMATCH[1]}" --jq '.body // ""') || body=""
          fi
          if [ -z "$body" ]; then
            criteria="**Acceptance criteria changed or unmet:** the approving review couldn't be read, so they aren't listed here; its *Acceptance criteria* section has them."
            echo "::warning::Could not read the review that approved sub-issue #${APPROVED_SUB} (${APPROVED_REVIEW:-no link}), so its note does not list the criteria."
          else
            listed=$(awk '
              /<summary><b>Acceptance criteria<\/b>/ { inside = 1; next }
              inside && /^<\/details>/ { inside = 0 }
              inside && /^- \*\*(Changed|Unmet):\*\* / { print }
            ' <<< "$body")
            if [ -n "$listed" ]; then
              criteria=$(printf '**Acceptance criteria changed or unmet:**\n\n%s' "$listed")
            fi
          fi
          review="reviewed on PRD PR #${PRD_PR}"
          [ -n "$APPROVED_REVIEW" ] && review="[reviewed](${APPROVED_REVIEW}) on PRD PR #${PRD_PR}"
          note=$(printf '**Slice approved:** built in [`%s`](%s/%s/commit/%s), %s. This sub-issue stays open until the PRD PR merges.\n\n%s\n\n%s' \
            "${APPROVED_SHA:0:7}" "$SERVER_URL" "$GH_REPO" "$APPROVED_SHA" "$review" "$criteria" "$mark")
          gh issue comment "$APPROVED_SUB" --body "$note" \
            || echo "::warning::Could not post the approved-slice note on sub-issue #${APPROVED_SUB}. The run goes on."

      # The slice **building** in the PRD PR's progress table and status line
      # (#246, #312), written here because this job runs no agent: the agent's
      # job reads only (#308). Only on a run that builds, once this run has
      # claimed its slice and before any agent starts; with no PRD PR yet, the
      # first slice's, there is no table to write.
      #
      # No toolchain runs here, so this does not render: it rewrites the
      # slice's row and the status line in the table the last round's ending
      # left, and the result is what `renderProgressList` and `renderPrdStatus`
      # render with the slice building, held equal by a test. A slice with no
      # range has no counts and no diff, so its row is the same whatever the
      # rest of the table says. A body with half a list, or two, is left alone,
      # as is one whose list has no row for the slice, each with a warning.
      #
      # The table and status line it replaces are kept, as `progress_unbuilt.md`
      # and `status_unbuilt.md`, and handed to `publish`, before the write: a
      # list that shows the slice building always has one to undo it, for a run
      # that stops before the runner renders its own (`Show the stopped slice in
      # the progress list`). Never fails the run: the list is a view of the
      # chain, and a slice is worth more than it.
      - name: Show the slice building in the progress list
        if: steps.preflight.outputs.refused == 'false' && steps.preflight.outputs.build == 'true' && steps.preflight.outputs.prd_pr != ''
        env:
          SUB: ${{ steps.preflight.outputs.sub }}
          SUB_K: ${{ steps.preflight.outputs.sub_k }}
          SUBS: ${{ steps.preflight.outputs.subs }}
          PRD_PR: ${{ steps.preflight.outputs.prd_pr }}
          # `PROGRESS_START`, `PROGRESS_END`, `STATUS_START` and `STATUS_END`
          # in `shared/progress-list.ts`; a test holds them equal.
          PROGRESS_START: "<!-- agent:progress -->"
          PROGRESS_END: "<!-- /agent:progress -->"
          STATUS_START: "<!-- agent:status -->"
          STATUS_END: "<!-- /agent:status -->"
        run: |
          set -uo pipefail
          current="${RUNNER_TEMP}/progress_pr.json"
          composed="${RUNNER_TEMP}/progress_building.json"
          request="${RUNNER_TEMP}/progress_edit.json"
          if ! gh api "repos/{owner}/{repo}/pulls/${PRD_PR}" > "$current"; then
            echo "::warning::Could not read PRD PR #${PRD_PR}, so its progress list does not show sub-issue #${SUB} building."
            exit 0
          fi
          # The row and the line `renderProgressList` and `renderPrdStatus`
          # give a slice that is building.
          prefix="| ${SUB_K} · #${SUB} |"
          row="${prefix} 🔨 Building | – | – | – |"
          line="**🔨 Building slice ${SUB_K} of ${SUBS}** · #${SUB}"
          jq --arg prefix "$prefix" --arg row "$row" --arg line "$line" '
            def block($b; $s; $e):
              ($b | split($s)) as $starts
              | ($b | split($e)) as $ends
              | if ($starts | length) == 1 and ($ends | length) == 1 then {}
                elif ($starts | length) == 2 and ($ends | length) == 2 and ($starts[1] | split($e) | length) == 2 then
                  {before: $starts[0], inside: ($starts[1] | split($e))[0], after: ($starts[1] | split($e))[1]}
                else null end;
            (.body // "") as $b
            | block($b; env.PROGRESS_START; env.PROGRESS_END) as $list
            | if $list == null then {outcome: "half"}
              elif ($list | has("inside") | not) then {outcome: "none"}
              elif ([$list.inside | split("\n")[] | select(startswith($prefix))] | length) != 1 then {outcome: "no row"}
              else
                ($list.before + env.PROGRESS_START
                  + ($list.inside | split("\n") | map(if startswith($prefix) then $row else . end) | join("\n"))
                  + env.PROGRESS_END + $list.after) as $body
                | block($body; env.STATUS_START; env.STATUS_END) as $status
                | {outcome: "write", progress: (env.PROGRESS_START + $list.inside + env.PROGRESS_END)}
                  + if ($status | type) == "object" and ($status | has("inside")) then
                      {status: (env.STATUS_START + $status.inside + env.STATUS_END),
                       body: ($status.before + env.STATUS_START + "\n> " + $line + "\n> " + env.STATUS_END + $status.after)}
                    else {body: $body} end
              end
          ' "$current" > "$composed" || { echo "::warning::Could not compose PRD PR #${PRD_PR}'s progress list, so it does not show sub-issue #${SUB} building."; exit 0; }
          case "$(jq -r '.outcome' "$composed")" in
            half)
              echo "::warning::PRD PR #${PRD_PR}'s body carries half a progress list, or two, so it was not written. Restore the missing marker, or delete the markers and the text between them, and the next ending of a round writes it again."
              exit 0 ;;
            none)
              echo "PRD PR #${PRD_PR}'s body carries no progress list, so none shows sub-issue #${SUB} building."
              exit 0 ;;
            "no row")
              echo "::warning::PRD PR #${PRD_PR}'s progress list has no row for sub-issue #${SUB} as slice ${SUB_K}, so it was not written. The next ending of a round writes it again."
              exit 0 ;;
          esac
          jq -j '.progress' "$composed" > "${RUNNER_TEMP}/progress_unbuilt.md"
          if [ "$(jq -r 'has("status")' "$composed")" = "true" ]; then
            jq -j '.status' "$composed" > "${RUNNER_TEMP}/status_unbuilt.md"
          fi
          jq '{body}' "$composed" > "$request"
          gh api --method PATCH "repos/{owner}/{repo}/pulls/${PRD_PR}" --input "$request" > /dev/null \
            && echo "PRD PR #${PRD_PR}'s progress list shows sub-issue #${SUB} building." \
            || echo "::warning::Could not write PRD PR #${PRD_PR}'s progress list, so it does not show sub-issue #${SUB} building. GitHub's reply is above."

      # The preflight's snapshot of the PRD, which `Open or reuse the PRD PR`
      # writes its `Closes` lines from, and the reason file a `block` in the
      # preflight writes, handed to `publish`, which reports it. `always()`,
      # for the second; not on a refusal or a deferral, which hand nothing on.
      - name: Hand the PRD's snapshot on
        if: always() && steps.preflight.outputs.refused != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agent-implement-prd-gate
          path: |
            ${{ runner.temp }}/prd-issue.json
            ${{ runner.temp }}/failure_reason.txt
            ${{ runner.temp }}/progress_unbuilt.md
            ${{ runner.temp }}/status_unbuilt.md
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # The clock the failure step reads a time limit off (#220). A job that
      # reaches its `timeout-minutes` is cancelled, not failed, and nothing in
      # the `needs` context says which cancellation it was, so that step
      # compares how long the agent's job could have run with its limit. Last
      # in this job, so it starts as near the agent's job as a step here can,
      # and is read from this job's outputs rather than the agent's, which a
      # step there could rewrite.
      - name: Start the agent's clock
        if: steps.preflight.outputs.refused == 'false'
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

  # **Keeping up with the default branch**, before the agent runs, and in a job
  # of its own because it pushes: the gate names no PAT, and the agent's job
  # must not. Its runner is one no agent has touched, and it is discarded
  # before the agent's starts.
  catch_up:
    needs: gate
    # From here to `Push the PRD branch` is **building a slice**, and only a
    # run that builds one does any of it. The finishing run, and the run
    # that only opens a missing PRD PR, check nothing out, install no
    # toolchain and run no model.
    if: needs.gate.outputs.refused == 'false' && needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    # A clone, a merge and a push.
    timeout-minutes: 10
    permissions:
      contents: write
      # The parked chain's comment and its label removal.
      issues: write
    outputs:
      parked: ${{ steps.catch_up.outputs.parked }}
      merged: ${{ steps.catch_up.outputs.merged }}
      head: ${{ steps.tip.outputs.sha }}

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BASE_REF: ${{ inputs.default-branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # The token every write below that the workflow token cannot make is
      # made with: the loop's App's, `AGENT_PAT`, or the workflow token, in
      # that order, and `source` says which. Minted in this job, before its
      # first write, and handed to no other.
      - name: Resolve the loop's token
        id: token
        uses: jeffwlawson/agent-workflows/.github/actions/loop-token@v0.7.12
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          agent-pat: ${{ secrets.AGENT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          # No credential is left in the checkout. Each fetch and push below
          # passes its own token on the command line instead.
          persist-credentials: false

      # Every slice is built **on the PRD branch itself**, at its tip, so slice
      # N is written on top of slices 1..N-1. The branch the preflight found is
      # reused; with none, it is cut from the base branch here and pushed with
      # the first slice.
      - name: Prepare the PRD branch
        id: prepare
        env:
          PRD_BRANCH: ${{ needs.gate.outputs.prd_branch }}
          EXISTS: ${{ needs.gate.outputs.prd_branch_exists }}
          SUB: ${{ needs.gate.outputs.sub }}
        run: |
          set -euo pipefail
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

          if [ "$EXISTS" = "true" ]; then
            # The checkout persists no credential, so the fetch carries the
            # job's read token itself, as each push carries its own.
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::${auth}"
            git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" fetch origin "+refs/heads/${PRD_BRANCH}:refs/remotes/origin/${PRD_BRANCH}"
            git checkout -B "$PRD_BRANCH" "refs/remotes/origin/${PRD_BRANCH}"
            echo "Building sub-issue #${SUB} on $PRD_BRANCH at $(git rev-parse --short HEAD)."
          else
            git checkout -b "$PRD_BRANCH"
            echo "Created $PRD_BRANCH from ${BASE_REF}; building sub-issue #${SUB} on it, and it is pushed with this slice."
          fi

      # **Keeping up with the default branch** (#245). Before a slice is built,
      # the default branch is merged into the PRD branch wherever it has moved
      # since the two last met, so a change made there mid-chain, CI's own
      # workflow included, reaches the next slice's round with no hand steps
      # (#211). GitHub runs no `pull_request` CI on a PR with conflicts, so a
      # conflict found here, a slice at a time, is one found before it can
      # strand every later slice on 🔵.
      #
      # A **merge**, never a rebase, and the push is plain, never forced:
      # verdicts are commit statuses and review threads are pinned to commits,
      # so rewriting the PRD branch orphans both.
      #
      # A clean merge is pushed **here, before the runner starts**. It is then
      # on the remote, so `Mark the slice's commits` gives it no `Agent-Slice`
      # trailer, and it carries `Agent-Catch-Up` instead: it lands before the
      # slice's first trailered commit, outside every slice range
      # (`shared/slice-ranges.ts`), so no slice round reviews it.
      #
      # The checkout persists no credential, so the fetch carries the job's
      # read token and the push the loop's token, each as a masked header on
      # its own command. In a job of its own, before the agent's and
      # on another runner, which is why the push token is in its env at all;
      # nothing it does is written into the checkout.
      #
      # A conflict is aborted, builds nothing and pushes nothing, and parks the
      # chain with a refusal naming `agent:update-branch` on the PRD PR, whose
      # agent resolves it and asks for a re-review: a round of the slice
      # already built, whose approval moves the chain on as any other. Not a
      # failure, so it exits 0, and every job after this one stands down on
      # `parked`.
      - name: Merge the default branch into the PRD branch
        id: catch_up
        env:
          PRD_BRANCH: ${{ needs.gate.outputs.prd_branch }}
          EXISTS: ${{ needs.gate.outputs.prd_branch_exists }}
          PRD_PR: ${{ needs.gate.outputs.prd_pr }}
          SUB: ${{ needs.gate.outputs.sub }}
          PUSH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          # A PRD branch this run just cut from the default branch is the
          # default branch, and is pushed with its first slice: pushing it
          # here, with a merge on it and no slice, would publish a PRD branch
          # nothing was built on.
          if [ "$EXISTS" != "true" ]; then
            echo "\`${PRD_BRANCH}\` was cut from \`${BASE_REF}\` by this run; nothing to merge."
            exit 0
          fi

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            || block "Couldn't fetch \`${BASE_REF}\` to bring the PRD branch up to date with it, so nothing was built."
          if git merge-base --is-ancestor "refs/remotes/origin/${BASE_REF}" HEAD; then
            echo "\`${PRD_BRANCH}\` already has everything on \`${BASE_REF}\`; nothing to merge."
            exit 0
          fi

          # The `Agent-Catch-Up` trailer (`CATCH_UP_TRAILER` in
          # `shared/slice-ranges.ts`, held equal by a test) is what keeps this
          # merge out of every slice range: `update-branch`'s conflict
          # resolution is a merge of the same shape, and belongs to its slice.
          message=$(printf 'Merge %s into %s\n\nAgent-Catch-Up: #%s' "$BASE_REF" "$PRD_BRANCH" "$SUB")
          if ! git merge --no-ff --no-edit -m "$message" "refs/remotes/origin/${BASE_REF}"; then
            conflicts=$(git diff --name-only --diff-filter=U | sed 's/.*/`&`/' | paste -sd ',' - | sed 's/,/, /g')
            git merge --abort || true
            # A merge that stopped on no conflict is git refusing for some
            # other reason, which is a failure, not this refusal.
            if [ -z "$conflicts" ]; then
              block "Couldn't merge \`${BASE_REF}\` into \`${PRD_BRANCH}\`, and not because of a conflict, so nothing was built. Git's reply is in the workflow run's log."
            fi
            if [ -n "$PRD_PR" ]; then
              way="Add \`agent:update-branch\` to PRD PR #${PRD_PR} to merge it there and resolve the conflict. The chain moves on once a review of the resolution recommends approval."
            else
              way="Merge \`${BASE_REF}\` into \`${PRD_BRANCH}\` and resolve the conflict by hand, then add \`agent:implement\` again."
            fi
            # A refusal's order, as in the preflight: the comment first, then
            # this run's own label off. No `agent:blocked`: the way on is a
            # label on the PRD PR, and the chain moves on by itself after it.
            echo "parked=true" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --body "**\`agent:implement\` didn't run:** The default branch \`${BASE_REF}\` has changed since the PRD branch last took it in, and merging it into \`${PRD_BRANCH}\` conflicts in ${conflicts}. The chain parked before sub-issue #${SUB}, and nothing was built or pushed. ${way}" \
              || echo "::warning::Could not post the conflict comment on #${ISSUE_NUMBER}."
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
            exit 0
          fi

          # A merge that brings in a change to a workflow file is a push
          # GitHub rejects from a token without Workflows: write, the
          # `GITHUB_TOKEN` fallback included, and a retry fails the same way.
          # So that cause is named wherever the merge carries one: telling the
          # human only to retry is a loop that cannot end.
          push_auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${push_auth}"
          if ! git -c "http.extraHeader=AUTHORIZATION: basic ${push_auth}" push origin "$PRD_BRANCH"; then
            workflows=$(git diff --name-only HEAD^1 HEAD -- .github/workflows | sed 's/.*/`&`/' | paste -sd ',' - | sed 's/,/, /g')
            if [ -n "$workflows" ]; then
              block "Couldn't push the merge of \`${BASE_REF}\` into \`${PRD_BRANCH}\`, so nothing was built. The merge changes ${workflows}, and GitHub refuses a push that changes a workflow file from a token without Workflows: write, so trying again fails the same way until the loop pushes with a token that has Workflows: write: the loop's App, or \`AGENT_PAT\`. If it does, something else may have moved the PRD branch; trying again merges on top of it."
            fi
            block "Couldn't push the merge of \`${BASE_REF}\` into \`${PRD_BRANCH}\`, so nothing was built. Something else may have moved the PRD branch; trying again merges on top of it."
          fi
          # The remote-tracking ref is what `Mark the slice's commits` reads
          # "already published" off, so it is moved to the merge explicitly
          # rather than trusted to the push's refspec.
          git update-ref "refs/remotes/origin/${PRD_BRANCH}" HEAD
          echo "merged=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Merged \`${BASE_REF}\` into \`${PRD_BRANCH}\` at $(git rev-parse --short HEAD), before building sub-issue #${SUB}."

      # The PRD branch's tip as this job left it, which the agent builds on and
      # `publish` checks the agent's commits against. Read here, in a job no
      # agent ran in, and never from the agent's job.
      - name: Record the PRD branch's tip
        id: tip
        if: steps.catch_up.outputs.parked != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The reason file a `block` above writes, for `publish` to report.
      - name: Hand the reason on
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agent-implement-prd-catch-up
          path: ${{ runner.temp }}/failure_reason.txt
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  implement-prd:
    needs: [gate, catch_up]
    if: needs.gate.outputs.refused == 'false' && needs.gate.outputs.build == 'true' && needs.catch_up.outputs.parked != 'true'
    runs-on: ubuntu-latest
    # The repository variable `AGENT_TIMEOUT_MINUTES` where it is set (#220),
    # shared by the four jobs that run an agent to write code, and 30 where it
    # is not. `vars` is among the contexts this key may read, and in a called
    # workflow it resolves against the caller's repository. `fromJSON` because
    # a variable is a string and this key wants a number; a value that is not
    # one fails the job before any step, which `doctor` reports. The failure
    # step in `publish` names the same figure.
    timeout-minutes: ${{ fromJSON(vars.AGENT_TIMEOUT_MINUTES || '30') }}
    # **Read-only, and no PAT or App secret named anywhere in this job.** Not
    # even in a step that never runs: a secret is delivered to every job whose
    # text names it.
    permissions:
      # The checkout.
      contents: read
      # The runner reads the PRD and the sub-issue, and their comments.
      issues: read
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read
      # The runner reads the PRD PR's rounds for its progress list.
      pull-requests: read

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BASE_REF: ${{ inputs.default-branch }}
      # Where a run of this PRD that stopped before it finished left its
      # commits, and where this one looks for them (#303). Fixed, so the retry
      # finds it by name: the publish job names the same branch.
      RESCUE_BRANCH: agent/rescue/prd-${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          # No credential is left in the checkout for the agent's git, or
          # anything else it runs, to find. Nothing in this job pushes: the
          # publish job pushes, from a checkout of its own.
          persist-credentials: false

      # The PRD branch again, as `catch_up` left it: at its tip, with the
      # default branch merged in where it had moved, or cut from the base
      # branch where there was none.
      #
      # And the rescue branch an earlier run left (#303), where there is one,
      # fetched to `refs/rescue/` for the runner to resume from: outside
      # `refs/remotes/`, so `Mark the slice's commits` marks rescued commits as
      # this run's. The runner decides whether it still builds on this tip;
      # this only fetches it. **An unreadable answer stops the run**, rather
      # than reading as "no rescue": a run that started over without it, and
      # succeeded, would delete it.
      - name: Prepare the PRD branch
        id: prepare
        env:
          PRD_BRANCH: ${{ needs.gate.outputs.prd_branch }}
          EXISTS: ${{ needs.gate.outputs.prd_branch_exists }}
          SUB: ${{ needs.gate.outputs.sub }}
        run: |
          set -euo pipefail
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

          if [ "$EXISTS" = "true" ]; then
            # The checkout persists no credential, so the fetch carries the
            # job's read token itself.
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::${auth}"
            git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" fetch origin "+refs/heads/${PRD_BRANCH}:refs/remotes/origin/${PRD_BRANCH}"
            git checkout -B "$PRD_BRANCH" "refs/remotes/origin/${PRD_BRANCH}"
            echo "Building sub-issue #${SUB} on $PRD_BRANCH at $(git rev-parse --short HEAD)."
          else
            git checkout -b "$PRD_BRANCH"
            echo "Created $PRD_BRANCH from ${BASE_REF}; building sub-issue #${SUB} on it, and it is pushed with this slice."
          fi

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          found=0
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" ls-remote --exit-code origin "refs/heads/${RESCUE_BRANCH}" > /dev/null || found=$?
          case "$found" in
            0)
              git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "+refs/heads/${RESCUE_BRANCH}:refs/rescue/${RESCUE_BRANCH}"
              echo "Fetched ${RESCUE_BRANCH}, which an earlier run left, for the runner to resume from." ;;
            2) echo "No ${RESCUE_BRANCH}, so there is nothing to resume from." ;;
            *)
              reason="Couldn't check whether an earlier run left commits on \`${RESCUE_BRANCH}\`, so this run stopped rather than start over without them."
              printf '%s\n' "$reason" > "${RUNNER_TEMP}/failure_reason.txt"
              echo "::error::${reason}"
              exit 1 ;;
          esac

      # Both setup steps are the adopter's toolchain, so both are skippable.
      # `npm install -g @anthropic-ai/claude-code` below is not: that is the
      # agent's own runtime, and every runner image already has the Node it
      # needs for it.
      - name: Setup Node.js
        if: inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, never an expression reading the
      # issue event.
      - name: Install dependencies
        if: inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The runner package lives on GitHub Packages, which has no anonymous
      # install even for a public package — see the long note on the same step in
      # agent-review-reusable.yml. Short version: the scoped `.npmrc` is written
      # for `@jeffwlawson` only so a caller's own `npm ci` is untouched, and
      # `packages: read` in the caller is what makes the token below work. The
      # cache opt-out belongs to the same note: this half declares no toolchain,
      # so it must not infer one.
      #
      # With `node-version-file: ''` the toolchain step above is skipped, and
      # without a Node named here the runner would run on the image's, below
      # the package's `engines.node` (#335). So it names one in exactly that
      # case and none otherwise, leaving an adopter's own version file to decide
      # the Node their commands run on. `tests/workflows.test.ts` holds it to
      # `engines.node`.
      - name: Authenticate to GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version-file == '' && '24' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      - name: Run implementation agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_IMPLEMENT_PRD: ${{ vars.AGENT_MODEL_IMPLEMENT_PRD }}
          # The PRD branch, which the agent commits on and the prompt names.
          BRANCH: ${{ needs.gate.outputs.prd_branch }}
          SUB_NUMBER: ${{ needs.gate.outputs.sub }}
          SUB_TITLE: ${{ needs.gate.outputs.sub_title }}
          # The PRD PR, whose rounds the runner counts in the progress list it
          # renders (#246); empty on the first slice, which opens it.
          PRD_PR: ${{ needs.gate.outputs.prd_pr }}
          # The merge of the default branch pushed before it, which leaves the
          # PRD PR's head unreviewed: the list a stopped run writes back shows
          # the slice before this one parked, not approved.
          MERGED: ${{ needs.catch_up.outputs.merged }}
          OUTPUT_DIR: ${{ runner.temp }}
        # `npm exec --prefix` rather than a bare `npx`, and the prefix is the
        # whole point. `npx pkg@version` reuses a package already present in the
        # working directory when it satisfies the spec — and in the repository
        # that *publishes* this package, the checkout is such a package. It has
        # no `dist/` (CI installs, it does not build), so the bin resolves to
        # nothing and the step dies `command not found` before any runner code
        # runs (#8). Installing into RUNNER_TEMP sidesteps the name collision.
        #
        # A no-op for every consuming repo, which has no package of this name to
        # collide with — verified against npm 10 and 11, both of which ignore
        # `--ignore-existing` here. `--prefix` moves the *install*, not the
        # process `cwd`: the runner still does its git work in the checkout.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.7.12 -- agent-workflows implement-prd

      # The agent's own record of the session (#269), so a run can be profiled
      # and debugged from what it did and not only from the log, which shows
      # some of its tool calls and none of its file reads, edits or thinking.
      # Claude Code writes it under `~/.claude/projects/`, in a directory named
      # after the checkout's path, and it goes with the runner unless something
      # keeps it: sandcastle's own copy does not run without a sandbox.
      #
      # **Redacted, never refused.** An artifact on a public repository is
      # readable by anyone who can see the repository, and the agent's
      # environment holds `CLAUDE_CODE_OAUTH_TOKEN`, so a transcript where it
      # printed that environment carries the token. Every secret this job holds
      # is replaced with `[REDACTED]` in a copy, the job token also in the
      # basic-auth form a checkout's git config holds it in, and only the copy
      # is uploaded. The script is the one every agent workflow runs, and names no
      # PAT: no job that runs an agent holds one (#307, #316).
      #
      # `always()`, so a failed, cancelled or timed-out run keeps its record
      # too, and `continue-on-error`, so the record never fails the run it
      # records. The upload reads the redaction's outcome rather than its own
      # `always()` alone, so a copy the redaction did not finish is never sent.
      # `transcript-retention-days` at 0 turns both off.
      - name: Redact the session transcript
        id: transcript
        if: always() && inputs.transcript-retention-days > 0
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, shutil

          source = pathlib.Path.home() / ".claude" / "projects"
          copy = pathlib.Path(os.environ["RUNNER_TEMP"]) / "agent-transcript"
          shutil.rmtree(copy, ignore_errors=True)

          secrets = []
          for name in ("CLAUDE_CODE_OAUTH_TOKEN", "GITHUB_TOKEN"):
              value = os.environ.get(name, "").encode()
              if not value:
                  continue
              secrets.append(value)
              if name != "CLAUDE_CODE_OAUTH_TOKEN":
                  secrets.append(base64.b64encode(b"x-access-token:" + value))

          files = sorted(source.rglob("*.jsonl")) if source.is_dir() else []
          if not files:
              print("No session transcript to upload: the agent never started.")
          for file in files:
              text = file.read_bytes()
              for secret in secrets:
                  text = text.replace(secret, b"[REDACTED]")
              out = copy / file.relative_to(source)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(text)
              print(f"Redacted {file.relative_to(source)} for upload.")
          PY

      # `overwrite`, so a re-run replaces this attempt's copy rather than
      # failing on the name. Uploading needs no scope: the artifact service
      # takes the runner's own token.
      - name: Upload the session transcript
        if: always() && steps.transcript.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: agent-transcript
          path: ${{ runner.temp }}/agent-transcript
          if-no-files-found: ignore
          retention-days: ${{ inputs.transcript-retention-days }}
          overwrite: true

      # Every commit this run made gets exactly one `Agent-Slice: #<sub>`
      # trailer naming the sub-issue it built (#242): the mark
      # `shared/slice-ranges.ts` reads a slice's commits off the PRD branch by,
      # and the one the preflight reads which sub-issues are built from,
      # whatever their subject lines say. The agent is not told to write it,
      # so it is written here, and one the agent did write is replaced.
      #
      # Here, after the runner and before the bundle, because the commits are
      # still local: rewriting them rewrites nothing published. "This run's" is
      # every commit reachable from HEAD and from nothing on the remote, so the
      # PRD branch's earlier slices and a default-branch commit the agent
      # merged in keep their identity. Trees, authors and dates are kept, and
      # the branch is moved without touching the working tree, since only
      # messages change.
      #
      # `--no-divider` because the input is a commit message, not a patch
      # email: without it a `---` line anywhere in the body is read as the
      # start of a patch, the trailer lands above it, and git's own trailer
      # parser, which reads the message's last paragraph, never sees it.
      - name: Mark the slice's commits
        id: trailer
        if: success()
        env:
          SUB: ${{ needs.gate.outputs.sub }}
        run: |
          set -euo pipefail

          declare -A rewritten=()
          mapped() { printf '%s' "${rewritten[$1]:-$1}"; }

          old=$(git rev-parse HEAD)
          count=0
          for commit in $(git rev-list --reverse --topo-order HEAD --not --remotes); do
            parents=()
            for parent in $(git rev-list --parents -n 1 "$commit" | cut -d' ' -f2-); do
              parents+=(-p "$(mapped "$parent")")
            done
            message=$(git log -1 --format=%B "$commit" \
              | { grep -iv '^Agent-Slice:' || true; } \
              | git interpret-trailers --no-divider --trailer "Agent-Slice: #${SUB}")
            rewritten[$commit]=$(
              export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE
              GIT_AUTHOR_NAME=$(git log -1 --format=%an "$commit")
              GIT_AUTHOR_EMAIL=$(git log -1 --format=%ae "$commit")
              GIT_AUTHOR_DATE=$(git log -1 --format=%ad --date=raw "$commit")
              GIT_COMMITTER_NAME=$(git log -1 --format=%cn "$commit")
              GIT_COMMITTER_EMAIL=$(git log -1 --format=%ce "$commit")
              GIT_COMMITTER_DATE=$(git log -1 --format=%cd --date=raw "$commit")
              git commit-tree "${commit}^{tree}" "${parents[@]}" <<< "$message"
            )
            count=$((count + 1))
          done

          git update-ref -m "Agent-Slice: #${SUB}" HEAD "$(mapped "$old")" "$old"
          echo "Marked ${count} commit(s) with Agent-Slice: #${SUB}."

      # The agent's commits, as the one thing `publish` pushes. A bundle rather
      # than a push from here: this job holds no token that can write, and the
      # runner that ran the agent is not one to spend a token on. Thin (the
      # PRD branch's tip `catch_up` left is its prerequisite, which `publish`
      # has from its own checkout), and holding exactly the PRD branch.
      #
      # `always()` (#303): a run that failed, was cancelled or timed out hands
      # its commits over too, unmarked, for `publish` to rescue to a side
      # branch rather than push; the run that resumes from them marks them.
      # No commits is no bundle, which `publish` reads as nothing to push or
      # rescue.
      - name: Bundle the branch
        if: always()
        env:
          BRANCH: ${{ needs.gate.outputs.prd_branch }}
          BASE_SHA: ${{ needs.catch_up.outputs.head }}
        run: |
          if [ -z "$(git rev-list -n 1 "${BASE_SHA}..refs/heads/${BRANCH}")" ]; then
            echo "No new commits, so there is nothing to bundle."
            exit 0
          fi
          git bundle create "${RUNNER_TEMP}/branch.bundle" "refs/heads/${BRANCH}" "^${BASE_SHA}"

      # The bundle, the reason file on a failure, and the progress lists and
      # status lines the runner rendered for `publish` to write, as one
      # artifact. `always()`, because a failed run is one of the outcomes
      # `publish` reports, and any of them may be missing. Uploading needs no
      # scope: the artifact service takes the runner's own token, so this job
      # stays read-only. `overwrite`, so a re-run replaces this attempt's copy
      # rather than failing on the name.
      #
      # What this job hands over is the agent's to write, whatever a step here
      # meant it to be. So `publish` takes nothing from it but this artifact,
      # which it checks, and reads nothing from this job's outputs.
      - name: Hand the branch to the publish job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-implement-prd
          path: |
            ${{ runner.temp }}/branch.bundle
            ${{ runner.temp }}/failure_reason.txt
            ${{ runner.temp }}/progress.md
            ${{ runner.temp }}/status.md
            ${{ runner.temp }}/progress_stopped.md
            ${{ runner.temp }}/status_stopped.md
            ${{ runner.temp }}/progress_stopped_pushed.md
            ${{ runner.temp }}/status_stopped_pushed.md
            ${{ runner.temp }}/rescue_ignored.md
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  publish:
    needs: [gate, catch_up, implement-prd]
    # `always()`, so a failed, cancelled or timed-out agent is still reported
    # and its trigger label still taken off, and so a run that builds nothing
    # (the finishing run, or one that only opens a missing PRD PR), where the
    # two jobs before this one are skipped, does its work at all. Not where
    # the gate was skipped (another label's event) or refused or deferred:
    # that run said what it had to, or must say nothing.
    if: always() && needs.gate.result != 'skipped' && needs.gate.outputs.refused != 'true'
    runs-on: ubuntu-latest
    # A clone, a push and some API calls, and a bounded wait for the PR's head.
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BASE_REF: ${{ inputs.default-branch }}
      # The agent's job's, which it looks for to resume from (#303).
      RESCUE_BRANCH: agent/rescue/prd-${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Into `RUNNER_TEMP`, where every step below looks for the files it reads
      # as it did when the run was one job: the agent's first, then the
      # catch-up's and the gate's, which no agent touched. Each tolerated: a
      # job that was skipped, or killed before its upload, leaves nothing to
      # fetch, and the failure step still has to run.
      - name: Fetch what the agent handed over
        if: needs.gate.outputs.build == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: agent-implement-prd
          path: ${{ runner.temp }}

      - name: Fetch what the catch-up handed over
        if: needs.catch_up.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: agent-implement-prd-catch-up
          path: ${{ runner.temp }}

      - name: Fetch what the gate handed over
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: agent-implement-prd-gate
          path: ${{ runner.temp }}

      # The token every write below that the workflow token cannot make is
      # made with: the loop's App's, `AGENT_PAT`, or the workflow token, in
      # that order, and `source` says which. Minted in this job, before its
      # first write, and handed to no other.
      - name: Resolve the loop's token
        id: token
        if: always()
        uses: jeffwlawson/agent-workflows/.github/actions/loop-token@v0.7.12
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          agent-pat: ${{ secrets.AGENT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A rescue branch the runner set aside because the PRD branch moved
      # since it was saved (#303), said on the PRD however the run ends, so
      # work nobody built on is not dropped silently. The runner writes the
      # note; it is absent on every other run.
      - name: Say the rescue was set aside
        if: always()
        run: |
          note="${RUNNER_TEMP}/rescue_ignored.md"
          [ -f "$note" ] || exit 0
          gh issue comment "$ISSUE_NUMBER" --body-file "$note" \
            || echo "::warning::Could not say on #${ISSUE_NUMBER} that ${RESCUE_BRANCH} was set aside."

      - name: Checkout the base branch
        if: needs.implement-prd.result == 'success'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          # Nothing the agent touched is on this runner, and the push below
          # passes its token on its own command, as everywhere else.
          persist-credentials: false

      # **Plain**, never forced. The PRD branch carries every earlier slice,
      # and verdicts and review threads are pinned to its commits, so a force
      # push is a chain that silently eats its own history and orphans its
      # reviews. A rejected non-fast-forward is the correct outcome: it means
      # something else moved the branch while this slice was built, and the
      # slice is then built again on top of that by the retry.
      #
      # The checkout persists no credential, so the token reaches git here, for
      # the push alone, as a masked header. Why, and what that does not cover,
      # is the note on implement.yml's `Push branch`.
      #
      # The steps here that act on a build read the agent's job's result, and
      # the ones a run that builds nothing does too read the gate's, by name:
      # GitHub documents an ancestor job's failure as seen by `failure()`, and
      # says nothing of `success()`, in a job that runs `always()`.
      #
      # **The bundle is checked before anything is pushed from it**, as
      # implement.yml's is: intact, exactly the PRD branch and nothing else,
      # and built on the tip `catch_up` left, read there and never from the
      # agent's job. Its content is the agent's to write and the round's to
      # judge.
      - name: Push the PRD branch
        id: push
        if: needs.implement-prd.result == 'success' && success()
        env:
          PRD_BRANCH: ${{ needs.gate.outputs.prd_branch }}
          BASE_SHA: ${{ needs.catch_up.outputs.head }}
          PUSH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/branch.bundle"

          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          [ -f "$bundle" ] || block "The agent's job finished without handing over its commits, so nothing was pushed."
          git bundle verify --quiet "$bundle" \
            || block "The agent's commits arrived damaged or incomplete, so nothing was pushed."
          git bundle unbundle "$bundle" > /dev/null \
            || block "The agent's commits arrived damaged or incomplete, so nothing was pushed."
          heads=$(git bundle list-heads "$bundle")
          if [ "$(wc -l <<< "$heads")" -ne 1 ] || [ "$(cut -d' ' -f2 <<< "$heads")" != "refs/heads/${PRD_BRANCH}" ]; then
            block "The agent's commits arrived on a branch other than \`${PRD_BRANCH}\`, or beside other branches, so nothing was pushed."
          fi
          git update-ref "refs/heads/${PRD_BRANCH}" "$(cut -d' ' -f1 <<< "$heads")"
          git merge-base --is-ancestor "$BASE_SHA" "refs/heads/${PRD_BRANCH}" \
            || block "The agent's commits don't build on \`${PRD_BRANCH}\` as this run left it, so nothing was pushed."

          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" push origin "$PRD_BRANCH"
          # The commit `Request review` waits for the PRD PR to show.
          echo "head=$(git rev-parse "refs/heads/${PRD_BRANCH}")" >> "$GITHUB_OUTPUT"

      # A run that pushed its slice leaves no rescue branch behind (#303),
      # whether it resumed from it, and its commits are now on the PRD branch
      # with the rest of this run's, or set it aside. Never fails the run: a
      # branch left behind is set aside by the next run, whose tip has moved
      # past it.
      - name: Delete the rescue branch
        if: needs.implement-prd.result == 'success' && success()
        run: |
          if ! gh api "repos/{owner}/{repo}/git/ref/heads/${RESCUE_BRANCH}" --silent 2> /dev/null; then
            echo "No ${RESCUE_BRANCH} to delete."
            exit 0
          fi
          gh api --method DELETE "repos/{owner}/{repo}/git/refs/heads/${RESCUE_BRANCH}" --silent \
            && echo "Deleted ${RESCUE_BRANCH}: this run succeeded." \
            || echo "::warning::Could not delete ${RESCUE_BRANCH}. The next run sets it aside; delete it by hand."

      # The PRD PR: PRD branch into the base branch, the one PR of the chain,
      # and the one a human merges. The run that builds the first slice opens
      # it, since until then the PRD branch has no commits the base branch
      # lacks; every later run finds it by its **head** and reuses it. So does
      # a run that finds slices built and no PRD PR open, which is a run that
      # died between its push and here.
      #
      # A **draft**, which stays one until the PRD is done: review marks it
      # ready only on the final review's approval, and the finishing run on a
      # one-slice PRD. Nothing here reads the draft state as "finished" on a
      # PRD of more than one slice, since a human can still mark it ready by
      # hand. Its body is the **frame** (#218), written once, in the order #298
      # settled: the note, opening with the **status line** between its own
      # markers, then a `---` rule, then `## Summary` and the summary block the
      # final review writes, then a second rule, then the progress table, then
      # the `Closes` line at the bottom, on one line. Each rule sits outside
      # every marker pair, so no splice touches it, with a blank line above it,
      # without which GitHub reads that line as a setext heading (#353). The
      # note's text past the status line opens with a **draft-only** part,
      # between its own markers (`DRAFT_NOTE_START` and `DRAFT_NOTE_END` in
      # `review/pr-summary.ts`, held equal by a test), which the final review's
      # write of the summary removes (#247). The status line, the `Closes`
      # line and the progress table are workflow-owned, each between its own
      # markers, which the review's rewrite of the summary splices around byte
      # for byte. The `Closes` line names the parent and every open sub-issue,
      # so merging the PRD PR closes exactly the work it contains, and nothing
      # closes before that. A maintainer's notes outside the blocks survive
      # every run.
      #
      # The **progress table** (#246) and the status line are the ones the
      # runner rendered for this slice in review, `progress.md` and
      # `status.md`, which this run is about to ask for: written into a PRD PR
      # this run opens, and spliced into one it reuses as the advance job
      # splices them (`spliceProgressList` and `spliceStatus` in
      # `shared/progress-list.ts`, held equal by a test). A run that built
      # nothing has neither, and opens the PRD PR with a table that says when
      # it is written. A table that cannot be written into a reused PRD PR is a
      # warning: the slice is pushed, and its review is what matters now.
      #
      # A PRD PR this run opens gets the slice's **chapter marker** right after
      # it opens (#298), as a later slice's gets it as its run starts: no link,
      # since the sub-issue carries the run's.
      #
      # Pre-upgrade compatibility, removable under #224: a PRD PR an older
      # release opened has no `Closes` block, only `Closes #<parent>`, since
      # that release closed each sub-issue itself. A reused PRD PR with no
      # `Closes` marker at all gets the block at the end of its body, in the
      # same write as the list, so the sub-issues still open close when it
      # merges. Nothing else in that body is touched: an old slices table stays
      # where it is, as history.
      - name: Open or reuse the PRD PR
        if: needs.gate.result == 'success' && needs.gate.outputs.finishing == 'false' && (needs.gate.outputs.build == 'false' || needs.implement-prd.result == 'success') && success()
        id: prd_pr
        env:
          PRD_BRANCH: ${{ needs.gate.outputs.prd_branch }}
          SUB: ${{ needs.gate.outputs.sub }}
          SUB_K: ${{ needs.gate.outputs.sub_k }}
          SUBS: ${{ needs.gate.outputs.subs }}
          # The Actions bot may not create a PR. The loop's App and a user PAT
          # are not the Actions bot, so they bypass that; the resolver falls
          # back to GITHUB_TOKEN so the shape stays identical in a setup with
          # neither.
          TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # `PROGRESS_START`, `PROGRESS_END`, `STATUS_START` and `STATUS_END`
          # in `shared/progress-list.ts`; a test holds them equal.
          PROGRESS_START: "<!-- agent:progress -->"
          PROGRESS_END: "<!-- /agent:progress -->"
          STATUS_START: "<!-- agent:status -->"
          STATUS_END: "<!-- /agent:status -->"
        run: |
          set -euo pipefail

          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          # The runner's render of this slice in review; absent on a run that
          # built nothing.
          progress="${RUNNER_TEMP}/progress.md"
          status="${RUNNER_TEMP}/status.md"

          # From the preflight's snapshot, the one every branch of it ruled on.
          # A closed sub-issue gets no reference: one this release built is
          # open until the PRD PR merges, so a closed one landed before the
          # upgrade. One line, every reference with its own keyword, since
          # GitHub reads a closing keyword anywhere in the body.
          closes=$(jq -r --arg parent "$ISSUE_NUMBER" \
            '["#\($parent)", (.subIssues.nodes[] | select(.state == "OPEN") | "#\(.number)")] | "Closes " + join(", closes ")' \
            "${RUNNER_TEMP}/prd-issue.json")
          closes_block=$(printf '%s\n%s\n%s' "<!-- agent:closes -->" "$closes" "<!-- /agent:closes -->")

          existing=$(gh pr list --state open --head "$PRD_BRANCH" --limit 100 --json number --jq 'map(.number) | join(" ")') \
            || block "Couldn't look for the PRD PR from \`${PRD_BRANCH}\`. The slice is on the PRD branch, and trying again doesn't build it twice."
          count=$(wc -w <<< "$existing")

          if [ "$count" -gt 1 ]; then
            block "${count} open PRs come from this PRD's branch \`${PRD_BRANCH}\` (#${existing// /, #}), so it can't tell which one is the PRD PR. Close all but one."
          elif [ "$count" -eq 1 ]; then
            number="$existing"
            echo "Reusing PRD PR #${number}."
            if [ -f "$progress" ]; then
              [ -f "$status" ] || status=/dev/null
              current="${RUNNER_TEMP}/progress_pr.json"
              request="${RUNNER_TEMP}/progress_edit.json"
              if ! gh api "repos/{owner}/{repo}/pulls/${number}" > "$current"; then
                echo "::warning::Could not read PRD PR #${number}, so its progress list is left as it stands."
              elif ! jq --rawfile block "$progress" --rawfile status "$status" --arg closes "$closes_block" '
                  def splice($b; $s; $e; $block; $append):
                    if $b == "" then (if $append then $block else $b end)
                    else
                      ($b | split($s)) as $starts
                      | ($b | split($e)) as $ends
                      | if ($starts | length) == 1 and ($ends | length) == 1 then
                          (if $append then $b + (if ($b | endswith("\n")) then "\n" else "\n\n" end) + $block else $b end)
                        elif ($starts | length) == 2 and ($ends | length) == 2 and ($starts[1] | split($e) | length) == 2 then
                          $starts[0] + $block + ($starts[1] | split($e))[1]
                        else null end
                    end;
                  (.body // "") as $b
                  | splice($b; env.PROGRESS_START; env.PROGRESS_END; $block; true) as $body
                  | (if $body == null or $status == "" then $body
                     else (splice($body; env.STATUS_START; env.STATUS_END; $status; false) // $body) end) as $body
                  | (if $body == null or ($b | contains("<!-- agent:closes -->") or contains("<!-- /agent:closes -->")) then $body
                     else $body + "\n\n" + $closes end) as $body
                  | if $body == null then {} else {body: $body} end
                ' "$current" > "$request"; then
                echo "::warning::Could not compose PRD PR #${number}'s progress list, so it is left as it stands."
              elif [ "$(jq -r 'has("body")' "$request")" != "true" ]; then
                echo "::warning::PRD PR #${number}'s body carries half a progress list, or two, so it was not written. Restore the missing marker, or delete the markers and the text between them, and the next ending of a round writes it again."
              elif ! gh api --method PATCH "repos/{owner}/{repo}/pulls/${number}" --input "$request" > /dev/null; then
                echo "::warning::Could not write PRD PR #${number}'s progress list. GitHub's reply is above."
              else
                echo "Wrote PRD PR #${number}'s progress list."
              fi
            fi
          else
            body_file="${RUNNER_TEMP}/prd-pr-body.md"
            if [ -f "$progress" ]; then
              list=$(cat "$progress")
            else
              list=$(printf '%s\n%s\n%s' "$PROGRESS_START" "_The progress table is written when this slice's review round ends._" "$PROGRESS_END")
            fi
            if [ -f "$status" ]; then
              line=$(cat "$status")
            else
              line="${STATUS_START}"$'\n> '"**🔍 In review:** the slices built so far."$'\n> '"${STATUS_END}"
            fi
            cat > "$body_file" <<FRAME
          > [!NOTE]
          > ${line}
          >
          > <!-- agent:draft-note -->The agent loop builds PRD #${ISSUE_NUMBER} here, one sub-issue at a time, and reviews each on this PR before starting the next. It stays a draft until every slice is done. Don't merge it before then.<!-- /agent:draft-note --> Built by the agent loop from PRD #${ISSUE_NUMBER}, one sub-issue per slice. Comment here to steer it; your notes outside the loop's blocks are never edited.

          ---

          ## Summary

          <!-- agent:summary -->
          _The final review will summarize the whole PRD here._
          <!-- /agent:summary -->

          ---

          ${list}

          ${closes_block}
          FRAME
            url=$(gh pr create --draft --base "$BASE_REF" --head "$PRD_BRANCH" \
              --title "${ISSUE_TITLE:0:256}" --body-file "$body_file" | tail -n1) \
              || if [ "$TOKEN_SOURCE" != "app" ] && [ "$TOKEN_SOURCE" != "pat" ]; then
                block "Couldn't open the PRD PR, because neither the loop's App nor \`AGENT_PAT\` is set and GitHub doesn't let the default token open PRs. Set up one of them first."
              else
                block "Couldn't open the PRD PR from \`${PRD_BRANCH}\` into \`${BASE_REF}\`. GitHub's reply is in the workflow run's log."
              fi
            number=$(basename "$url")
            echo "Opened PRD PR $url"
            if [ -n "$SUB" ]; then
              gh pr comment "$number" --body "**Slice ${SUB_K} of ${SUBS} · #${SUB} started**" \
                || echo "::warning::Could not say on PRD PR #${number} that sub-issue #${SUB} started."
            fi
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The slice's round: `agent:review` on the PRD PR, the way
      # `agent-implement`'s PR gets its review. Safe for the same reason as
      # there: the hop it starts is bounded at the other end (docs/parity.md
      # §10). This run adds nothing to the parent: the next slice waits for
      # this round's verdict.
      #
      # MUST use the loop's App or AGENT_PAT: a label added with GITHUB_TOKEN
      # triggers no workflow. `-e`, unlike `agent-implement`'s: this is the
      # last step, and without it a failed label add exits green with the
      # slice asking nobody for review. So it fails into `Mark blocked on failure`, whose comment
      # names the PRD PR to label by hand.
      - name: Request review
        if: needs.gate.result == 'success' && needs.gate.outputs.finishing == 'false' && (needs.gate.outputs.build == 'false' || needs.implement-prd.result == 'success') && success()
        env:
          PRD_PR: ${{ steps.prd_pr.outputs.number }}
          TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The commit this run pushed, and how long the PR gets to show it as
          # its head before the label goes on anyway (#229). Empty on the run
          # that only opens a missing PRD PR, which pushed nothing.
          PUSHED_SHA: ${{ steps.push.outputs.head }}
          HEAD_WAIT_SECONDS: "60"
        run: |
          set -euo pipefail
          # Wait for the pull request to show the pushed commit as its head
          # before asking for the review (#229). GitHub moves a PR's head
          # asynchronously after a push, and a label added before it has would
          # carry the commit before the push in its payload. Bounded: past it,
          # the label goes on anyway with a warning, since review reads the
          # branch tip itself and refuses by name where it cannot settle on it.
          if [ -n "$PUSHED_SHA" ]; then
            head=""
            deadline=$((SECONDS + HEAD_WAIT_SECONDS))
            until head=$(gh pr view "$PRD_PR" --json headRefOid --jq .headRefOid 2>/dev/null) && [ "$head" = "$PUSHED_SHA" ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::warning::PR #${PRD_PR} still shows ${head:-an unreadable head} as its head ${HEAD_WAIT_SECONDS}s after ${PUSHED_SHA} was pushed. Asking for the review anyway: it reads the branch tip itself, and refuses by name if it cannot settle on ${PUSHED_SHA}."
                break
              fi
              sleep 5
            done
          fi
          # This run's own label comes off the parent before the next step's
          # goes on the PRD PR (#236): every result is posted by now, so what
          # is left is the hand-off. The last step removes it again, which is
          # nothing where it is already off.
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          # Removed first, as every trigger label the loop adds (#236): an add
          # on a label that is somehow already there fires nothing.
          gh pr edit "$PRD_PR" --remove-label "agent:review" || true
          gh pr edit "$PRD_PR" --add-label "agent:review"
          if [ "$TOKEN_SOURCE" != "app" ] && [ "$TOKEN_SOURCE" != "pat" ]; then
            echo "::warning::Neither the loop's App nor AGENT_PAT is set, so this label was added with GITHUB_TOKEN and will NOT trigger agent-review. Add agent:review by hand on PRD PR #${PRD_PR}."
          fi

      # The finishing run's handover: every sub-issue is built and the last
      # slice's round approved, so the PRD PR leaves the chain. A human merges
      # it; the loop never merges it and never approves.
      #
      # One slice landed means its round was a review of the whole PRD PR
      # already, and of the same lines, so the PRD PR is marked ready here and
      # no second review runs. More than one means a **final review**: this
      # records that it is requested in the PRD PR's progress list, where a review of
      # the PRD PR reads it from, and then adds `agent:review`. The record goes
      # first, so the review the label starts finds it, and a retry writes it
      # once. It is also what the preflight reads the PRD as finished by, so
      # a label add that fails takes it back out before the step stops.
      #
      # `LANDED` counts the slices that landed before the upgrade too
      # (pre-upgrade compatibility, removable under #224): no round on the
      # PRD PR reviewed them, so one slice built here beside them is not a
      # review of the whole PRD PR.
      #
      # Needs the loop's App or AGENT_PAT either way, and refuses without one
      # rather than doing half. `gh pr ready` cannot convert a draft under
      # GITHUB_TOKEN, and a label added with it starts no review.
      - name: "Hand over PRD PR #${{ needs.gate.outputs.prd_pr }}"
        if: needs.gate.result == 'success' && needs.gate.outputs.finishing == 'true' && success()
        id: handover
        env:
          PRD_PR: ${{ needs.gate.outputs.prd_pr }}
          LANDED: ${{ needs.gate.outputs.landed }}
          SUBS: ${{ needs.gate.outputs.subs }}
          SERVER_URL: ${{ github.server_url }}
          TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          if [ "$TOKEN_SOURCE" != "app" ] && [ "$TOKEN_SOURCE" != "pat" ]; then
            block "Couldn't hand PRD PR #${PRD_PR} over, because neither the loop's App nor \`AGENT_PAT\` is set and GitHub doesn't let the default token mark a draft ready or start a review. Every sub-issue is built. Set up one of them; trying again resumes the handover and builds nothing."
          fi

          if [ "$LANDED" -gt 1 ]; then
            mark="<!-- agent:final-review requested -->"
            body=$(gh pr view "$PRD_PR" --json body --jq '.body') \
              || block "Couldn't read PRD PR #${PRD_PR} to ask for its final review. Trying again builds nothing."
            if [[ "$body" != *"$mark"* ]]; then
              # Into the progress table (#246, #298), with the final review's
              # row in review: `finalReviewRequestedLines` in
              # `shared/progress-list.ts`, which a test holds this copy equal
              # to. Written in front of the end marker of the table the last
              # slice's round left, every slice approved, it is the table
              # rendered for the final review requested. A body with no table,
              # one opened before #246, gets the mark at its end.
              lines="| Final review | 🔍 In review | 0 | 0 | [all](${SERVER_URL}/${GH_REPO}/pull/${PRD_PR}/files) |"$'\n'"${mark}"$'\n'
              end="<!-- /agent:progress -->"
              requested="${body}"$'\n\n'"${mark}"
              if [[ "$body" == *"$end"* ]]; then
                requested="${body/"$end"/"${lines}${end}"}"
              fi
              # And the status line, where the body has exactly one: what
              # `renderPrdStatus` says of the final review in review.
              status_start="<!-- agent:status -->"
              status_end="<!-- /agent:status -->"
              rest="${requested#*"$status_start"}"
              if [[ "$requested" == *"$status_start"*"$status_end"* ]] && [[ "$rest" != *"$status_start"* ]] && [[ "${rest#*"$status_end"}" != *"$status_end"* ]]; then
                quoted=$'\n> '
                requested="${requested%%"$status_start"*}${status_start}${quoted}**🔍 Final review of all ${SUBS} slices**${quoted}${status_end}${rest#*"$status_end"}"
              fi
              gh api -X PATCH "repos/${GH_REPO}/pulls/${PRD_PR}" -f body="${requested}" >/dev/null \
                || block "Couldn't note on PRD PR #${PRD_PR} that its final review is due, so it wasn't requested. Trying again builds nothing."
            fi
            # This run's own label off the parent before the next step's goes
            # on the PRD PR, as in `Request review` (#236).
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
            # Removed first, as every trigger label the loop adds (#236).
            gh pr edit "$PRD_PR" --remove-label "agent:review" || true
            # The mark is what the preflight calls this PRD finished by, so a
            # label that did not go on takes it back out: left in, the retry
            # would be refused as finished with no final review ever asked for.
            if ! gh pr edit "$PRD_PR" --add-label "agent:review"; then
              if [[ "$body" != *"$mark"* ]]; then
                gh api -X PATCH "repos/${GH_REPO}/pulls/${PRD_PR}" -f body="${body}" >/dev/null \
                  || block "Couldn't add \`agent:review\` to PRD PR #${PRD_PR}, and couldn't take back out the note that its final review is due. Add \`agent:review\` to PRD PR #${PRD_PR} by hand."
              fi
              block "Couldn't add \`agent:review\` to PRD PR #${PRD_PR}, so its final review was not requested. Trying again resumes the handover and builds nothing."
            fi
            echo "Asked for the final review of PRD PR #${PRD_PR}, over its ${LANDED} slices."
            # Its start comment on the PRD PR (#298), with this run's link,
            # since no sub-issue holds one for it.
            gh pr comment "$PRD_PR" --body "**Final review of all ${SUBS} slices started** · [Workflow run](${RUN_URL})" \
              || echo "::warning::Could not post the final review's start comment on PRD PR #${PRD_PR}."
          else
            gh pr ready "$PRD_PR" \
              || block "Couldn't mark PRD PR #${PRD_PR} ready for review. Trying again resumes the handover and builds nothing."
            echo "Marked PRD PR #${PRD_PR} ready: its one slice's round was the review of the whole PR."
          fi

      # Any of the four jobs: `gate` failing (this job's own `if:` lets a
      # failed gate through, since its `refused` is `!= 'true'` there), the
      # catch-up failing, the agent's job failing, timing out or being
      # cancelled, or a step here. `failure()` in this job sees an ancestor
      # job's failure too, but not a cancelled one, so each result is read by
      # name. A skipped job is not one of them: the catch-up and the agent's
      # job are skipped on a run that builds nothing, and the agent's on a
      # parked chain.
      #
      # `!= 'true'`, not `== 'false'`: a preflight that fails hard exits before
      # writing the output at all, and `''` is not `'false'` — an equality gate
      # would skip this step precisely when the PRD most needed the comment.
      # Refusals and deferrals exit 0 and set `refused`, so neither reaches
      # this job at all; the preflight's `block` is the exception, which exits
      # 1 to land here.
      #
      # In the loop's one order (#236): the comment, then this run's own label
      # off, then `agent:blocked`. The removal only where the preflight decided
      # the issue was this run's, for the last step's reason below.
      #
      # Ahead of it, the rescue (#303): a run that stopped with commits the PRD
      # branch does not have keeps them on a side branch, and the comment
      # names it. The checkout first, where the agent's job stopped and the
      # one above was skipped: the prerequisite of its bundle is the tip
      # `catch_up` left, which every full checkout of the repository has.
      - name: Checkout the base branch for the rescue
        if: always() && needs.gate.outputs.refused == 'false' && needs.gate.outputs.build == 'true' && (needs.implement-prd.result == 'failure' || needs.implement-prd.result == 'cancelled')
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          persist-credentials: false

      # **To a side branch with a fixed name, never to the PRD branch.** A
      # commit pushed there would stand on the PRD PR's head unverified, with
      # no verdict and without the `Agent-Slice` trailer `Mark the slice's
      # commits` gives a finished run's, so rescued work reaches the PRD
      # branch only through the resumed run's own push, after its verify.
      # Nothing else: no PRD PR, no review asked for, no label.
      #
      # Only where the preflight claimed a build, the run stopped (the agent's
      # job failed, timed out or was cancelled, or a step here failed), and
      # nothing was pushed to the PRD branch. The bundle is checked as `Push
      # the PRD branch` checks it, and a bundle that fails a check is not
      # rescued: no bundle at all is a run with no commits ahead of the tip it
      # started from, which pushes nothing.
      #
      # `--force-with-lease`, against the rescue as this step reads it: a run
      # that stops again overwrites the earlier rescue, which it started from
      # and so holds all of, and nothing that moved it in between is lost
      # silently. With the loop's token, as the PRD branch is pushed, since the
      # agent's commits may touch a workflow file.
      - name: Rescue the agent's commits
        id: rescue
        if: always() && needs.gate.outputs.refused == 'false' && needs.gate.outputs.build == 'true' && (cancelled() || failure() || needs.implement-prd.result == 'failure' || needs.implement-prd.result == 'cancelled') && steps.push.outputs.head == ''
        continue-on-error: true
        env:
          PRD_BRANCH: ${{ needs.gate.outputs.prd_branch }}
          BASE_SHA: ${{ needs.catch_up.outputs.head }}
          PUSH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/branch.bundle"

          skip() {
            echo "::warning::$1 Nothing was rescued."
            exit 0
          }

          if [ ! -f "$bundle" ]; then
            echo "No commits ahead of the tip this run started from, so there is nothing to rescue."
            exit 0
          fi
          git bundle verify --quiet "$bundle" || skip "The agent's commits arrived damaged or incomplete."
          git bundle unbundle "$bundle" > /dev/null || skip "The agent's commits arrived damaged or incomplete."
          heads=$(git bundle list-heads "$bundle")
          if [ "$(wc -l <<< "$heads")" -ne 1 ] || [ "$(cut -d' ' -f2 <<< "$heads")" != "refs/heads/${PRD_BRANCH}" ]; then
            skip "The agent's commits arrived on a branch other than \`${PRD_BRANCH}\`, or beside other branches."
          fi
          tip=$(cut -d' ' -f1 <<< "$heads")
          git merge-base --is-ancestor "$BASE_SHA" "$tip" \
            || skip "The agent's commits don't build on \`${PRD_BRANCH}\` as this run left it."

          # The rescue as it stands, read with the job's token, is what the
          # lease holds the push to; none is the lease that it must not exist.
          read=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${read}"
          remote=$(git -c "http.extraHeader=AUTHORIZATION: basic ${read}" ls-remote origin "refs/heads/${RESCUE_BRANCH}")
          current=$(printf '%s\n' "$remote" | awk -v ref="refs/heads/${RESCUE_BRANCH}" '$2 == ref { print $1 }')
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" push --force-with-lease="refs/heads/${RESCUE_BRANCH}:${current}" origin "${tip}:refs/heads/${RESCUE_BRANCH}"
          echo "Rescued $(git rev-list --count "${BASE_SHA}..${tip}") commit(s) to ${RESCUE_BRANCH}."
          echo "branch=${RESCUE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Mark blocked on failure
        if: always() && (failure() || cancelled() || needs.gate.result != 'success' || needs.catch_up.result == 'failure' || needs.catch_up.result == 'cancelled' || needs.implement-prd.result == 'failure' || needs.implement-prd.result == 'cancelled')
        env:
          # How each job ahead of this one ended, and this job's own status for
          # a cancel that lands while it runs. `job.status` rather than
          # `cancelled()`, which GitHub allows only in an `if:`.
          GATE_RESULT: ${{ needs.gate.result }}
          CATCH_UP_RESULT: ${{ needs.catch_up.result }}
          AGENT_RESULT: ${{ needs.implement-prd.result }}
          JOB_STATUS: ${{ job.status }}
          JOB_STARTED: ${{ needs.gate.outputs.started }}
          REFUSED: ${{ needs.gate.outputs.refused }}
          TIMEOUT_MINUTES: ${{ vars.AGENT_TIMEOUT_MINUTES || '30' }}
          SUB: ${{ needs.gate.outputs.sub }}
          PUSHED: ${{ steps.push.outputs.head }}
          MERGED: ${{ needs.catch_up.outputs.merged }}
          PRD_PR: ${{ steps.prd_pr.outputs.number || needs.gate.outputs.prd_pr }}
          FINISHING: ${{ needs.gate.outputs.finishing }}
          RESCUED: ${{ steps.rescue.outputs.branch }}
        run: |
          reason="It stopped without giving a reason. The workflow run's log has the details."
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          # Cancelled is not failed (#220), and a job that reached its limit
          # is cancelled too. What tells the two apart is the clock `gate`
          # started just before the jobs that build: a timed-out job ran its
          # whole limit, and the time since that clock is at least that. A
          # reason file is not read on either; what wrote one was stopped, not
          # failing. The labels and the retry are a failure's, word for word.
          #
          # The clock is read on a failure that left no reason file too: the
          # agent's result here is the `needs` context's, and a runner that
          # wrote no reason did not end on its own terms either way.
          # The limit is compared only where it is a positive integer: `fromJSON`
          # accepts `1.5` and `1e1`, which bash arithmetic refuses, and under
          # `bash -e` that would end this step before its comment. A limit the
          # step cannot compare reads as a cancel, which is still said.
          stopped=false
          if [ "$JOB_STATUS" = "cancelled" ] || [ "$GATE_RESULT" = "cancelled" ] || [ "$CATCH_UP_RESULT" = "cancelled" ] || [ "$AGENT_RESULT" = "cancelled" ]; then
            stopped=true
            reason="It was cancelled before it finished, by hand or by GitHub."
          elif [ "$AGENT_RESULT" = "failure" ] && [ ! -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            stopped=true
          fi
          if [ "$stopped" = "true" ]; then
            if [ -n "${JOB_STARTED:-}" ] && [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] && [ $(( $(date +%s) - JOB_STARTED )) -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
              reason="It timed out after ${TIMEOUT_MINUTES} minutes. The repository variable \`AGENT_TIMEOUT_MINUTES\` raises the limit."
            fi
          fi
          # One pattern for every run that stopped (#253): the reason as a
          # sentence, starting with a capital and ending in a full stop, then
          # the run and what to do.
          reason="${reason^}"
          case "$reason" in *[.!?]) ;; *) reason="${reason}." ;; esac
          # The label comes off in the last step since #236, so adding it is
          # the retry.
          #
          # The finishing run built nothing, so there is no sub-issue to retry.
          # What a retry does instead is resume the handover, since its gate
          # still passes, so it is still the remedy, and says so.
          retry="To try again, add \`agent:implement\`."
          if [ "${FINISHING}" = "true" ]; then
            reason="${reason} It was handing the PRD PR over, with every sub-issue built."
            retry="To try again, add \`agent:implement\`; it resumes the handover and builds nothing."
          elif [ -n "${SUB}" ]; then
            reason="${reason} It was building sub-issue #${SUB}."
          fi
          # Not after a preflight that died before deciding: that run leaves
          # the label on (see the last step), and adding a label that is
          # already present fires no event.
          if [ "$REFUSED" != "false" ]; then
            retry="To try again, remove \`agent:implement\` if it is still on this issue, then add it."
          fi
          # Adding the label is the right retry for most of the ways this run
          # can stop, and the wrong one once the slice is pushed: the PRD
          # branch then holds it, so the retry does not build it again, and
          # its gate refuses while the slice has no review. What is left is
          # the review, so say where to ask for it. With no PRD PR open yet,
          # the retry is still the remedy: it opens one and asks for the
          # review, and builds nothing.
          #
          # Nor once the default branch is merged in and pushed, with the
          # slice not: the PRD PR's head is then that merge, which no review
          # has seen, so the gate refuses the retry too. Its review is the way
          # on, a round of the slice already built, whose approval moves the
          # chain on by itself.
          if [ -z "${PUSHED}" ] && [ -n "${MERGED}" ] && [ -n "${PRD_PR}" ]; then
            retry="The default branch \`${BASE_REF}\` was merged into the PRD branch before it stopped, and that merge has no review yet, so adding \`agent:implement\` would be refused. Add \`agent:review\` to PRD PR #${PRD_PR}; the chain moves on once it recommends approval."
          fi
          if [ -n "${PUSHED}" ]; then
            if [ -n "${PRD_PR}" ]; then
              retry="Sub-issue #${SUB} was built and pushed to the PRD branch before it stopped, so it won't be built again. Add \`agent:review\` to PRD PR #${PRD_PR} if it doesn't have it."
            else
              retry="Sub-issue #${SUB} was built and pushed to the PRD branch before it stopped, so it won't be built again. To open the PRD PR and ask for its review, add \`agent:implement\`."
            fi
          fi
          # A rescue (#303) is named whatever else the retry says, and is the
          # retry where nothing else was: adding the label resumes from it.
          if [ -n "${RESCUED:-}" ]; then
            if [ "$retry" = "To try again, add \`agent:implement\`." ]; then
              retry="Its commits so far are saved on \`${RESCUED}\`. To resume from them, add \`agent:implement\`."
            else
              retry="${retry} Its commits so far are saved on \`${RESCUED}\`, and the next \`agent:implement\` run resumes from them."
            fi
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '**`agent:implement` stopped:** %s\n\n[Workflow run](%s) · %s\n' "$reason" "$RUN_URL" "$retry" > "$body_file"
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file" || echo "::warning::Could not post the failure comment on #${ISSUE_NUMBER}."
          if [ "$REFUSED" = "false" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true

      # A build run that stops leaves no slice building (#246). The gate
      # showed this sub-issue building in the PRD PR's progress list before
      # the catch-up started (#312), and a run that parks, fails or is
      # cancelled after that starts no round, so no advance job writes the
      # list again. This writes back the one the runner rendered for a stopped
      # run: the sub-issue not started where nothing of it was pushed, and
      # parked where it was, with its review the way on, as the comment above
      # says. Where the runner never got that far (the catch-up parked or
      # failed, or the agent's job died before its runner rendered anything),
      # nothing of the slice was pushed, and it writes back the list and the
      # status line the gate replaced instead.
      #
      # Only where one of those exists, and the gate keeps its own before it
      # writes the building list, so a list that never showed the slice
      # building is left alone. Spliced as every writer of the list splices it
      # (`spliceProgressList`, held equal by a test). Never fails the job, and
      # after the comment and the labels: the list is a view of the chain.
      - name: Show the stopped slice in the progress list
        if: always() && needs.gate.outputs.refused == 'false' && needs.gate.outputs.build == 'true' && (failure() || cancelled() || needs.catch_up.result != 'success' || needs.implement-prd.result != 'success')
        env:
          PUSHED: ${{ steps.push.outputs.head }}
          PRD_PR: ${{ steps.prd_pr.outputs.number || needs.gate.outputs.prd_pr }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # `PROGRESS_START`, `PROGRESS_END`, `STATUS_START` and `STATUS_END`
          # in `shared/progress-list.ts`; a test holds them equal.
          PROGRESS_START: "<!-- agent:progress -->"
          PROGRESS_END: "<!-- /agent:progress -->"
          STATUS_START: "<!-- agent:status -->"
          STATUS_END: "<!-- /agent:status -->"
        run: |
          set -uo pipefail
          list="${RUNNER_TEMP}/progress_stopped.md"
          status="${RUNNER_TEMP}/status_stopped.md"
          if [ ! -f "$list" ]; then
            list="${RUNNER_TEMP}/progress_unbuilt.md"
            status="${RUNNER_TEMP}/status_unbuilt.md"
          fi
          if [ -n "$PUSHED" ]; then
            list="${RUNNER_TEMP}/progress_stopped_pushed.md"
            status="${RUNNER_TEMP}/status_stopped_pushed.md"
          fi
          [ -f "$status" ] || status=/dev/null
          if [ -z "$PRD_PR" ] || [ ! -f "$list" ]; then
            echo "No progress list shows this slice building, so none is written."
            exit 0
          fi
          current="${RUNNER_TEMP}/progress_pr.json"
          request="${RUNNER_TEMP}/progress_edit.json"
          if ! gh api "repos/{owner}/{repo}/pulls/${PRD_PR}" > "$current"; then
            echo "::warning::Could not read PRD PR #${PRD_PR}, so its progress list still shows the slice building."
            exit 0
          fi
          jq --rawfile block "$list" --rawfile status "$status" '
            def splice($b; $s; $e; $block; $append):
              if $b == "" then (if $append then $block else $b end)
              else
                ($b | split($s)) as $starts
                | ($b | split($e)) as $ends
                | if ($starts | length) == 1 and ($ends | length) == 1 then
                    (if $append then $b + (if ($b | endswith("\n")) then "\n" else "\n\n" end) + $block else $b end)
                  elif ($starts | length) == 2 and ($ends | length) == 2 and ($starts[1] | split($e) | length) == 2 then
                    $starts[0] + $block + ($starts[1] | split($e))[1]
                  else null end
              end;
            (.body // "") as $b
            | splice($b; env.PROGRESS_START; env.PROGRESS_END; $block; true) as $body
            | (if $body == null or $status == "" then $body
               else (splice($body; env.STATUS_START; env.STATUS_END; $status; false) // $body) end) as $body
            | if $body == null then {} else {body: $body} end
          ' "$current" > "$request" || { echo "::warning::Could not compose PRD PR #${PRD_PR}'s progress list, so it still shows the slice building."; exit 0; }
          if [ "$(jq -r 'has("body")' "$request")" != "true" ]; then
            echo "::warning::PRD PR #${PRD_PR}'s body carries half a progress list, or two, so it was not written. Restore the missing marker, or delete the markers and the text between them, and the next ending of a round writes it again."
            exit 0
          fi
          gh api --method PATCH "repos/{owner}/{repo}/pulls/${PRD_PR}" --input "$request" > /dev/null \
            && echo "Wrote PRD PR #${PRD_PR}'s progress list: the slice stopped$([ -n "$PUSHED" ] && echo ' after its push')." \
            || echo "::warning::Could not write PRD PR #${PRD_PR}'s progress list, so it still shows the slice building. GitHub's reply is above."

      # The trigger label comes off however the run ends (#236): success,
      # failure, timeout or cancel, so it never outlives the run that decided
      # the issue was its own. `== 'false'`, unlike the failure step above: a
      # refusal took it off already, a deferral must not touch it, and nor
      # must a preflight that died before deciding, since that run may be the
      # one that would have deferred, and `agent-implement` owns that label event
      # and holds the label while it works. Such a run leaves it on, as it
      # always has, and the failure comment says to remove it before re-adding.
      - name: Always remove the trigger label
        if: always() && needs.gate.outputs.refused == 'false'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
