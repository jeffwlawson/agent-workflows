name: Agent Implement (reusable)

# The implement job itself. The `implement` job in `agent-issue.yml` is the
# caller (two wires, under that file's trigger), and every guard, permission and
# step stays here, in a file an adopting repo *references* rather than copies
# (jeffwlawson/winget-manifest-lint#98).
#
# Unlike the three PR workflows, this one has no event field to take a base
# branch from: an `issues` event carries no pull request, so the branch to cut
# from and the branch to open the PR against are a *choice*. `default-branch` is
# that choice, made by the adopter once instead of hand-edited in three places
# and in two prompts they cannot reach (docs/ADOPTING.md §5).
on:
  workflow_call:
    inputs:
      default-branch:
        description: >-
          The branch the agent's work is cut from and the PR is opened against.
          Not a fallback, unlike the PR workflows' input of the same name —
          nothing in an `issues` event says which branch the work belongs on, so
          this is the only answer there is.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets its
          issue implemented, running on the Node the runner package requires.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or an issue title
          becomes a shell script.
        type: string
        default: npm ci
      transcript-retention-days:
        description: >-
          Days the agent's Claude Code session transcript is kept, as this
          run's `agent-transcript` artifact, with every secret the job holds
          redacted. 0 turns the upload off. On a public repository the
          artifact is readable by anyone who can see the repository; see
          docs/ADOPTING.md §2d.
        type: number
        default: 3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the implementation agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT. Three things need it and each fails differently without it:
          the push (CI on the resulting PR waits for a maintainer's approval),
          `gh pr create` (the Actions bot is forbidden from creating PRs), and the `agent:review` label add
          (a label added with `GITHUB_TOKEN` triggers no workflow, so the
          cascade dies silently). See docs/ADOPTING.md §1. Optional, and every
          site warns rather than failing. The loop's App, where it is set up,
          takes its place.
        required: false
      AGENT_APP_ID:
        description: >-
          The loop's GitHub App's ID. With `AGENT_APP_PRIVATE_KEY`, the publish
          job mints a token for this repository from the App and makes the
          writes `AGENT_PAT` would make with it, as the App's bot. Optional;
          without both, `AGENT_PAT` is used as before.
        required: false
      AGENT_APP_PRIVATE_KEY:
        description: The loop's GitHub App's private key. See `AGENT_APP_ID`.
        required: false


# One run at a time per issue, held across all three jobs below. On the
# workflow rather than on a job, because the run is three jobs that hand off to
# each other: a job-level group is released between them, and a second run
# for the same issue could start its agent between this run's agent and its
# push. A workflow-level group in a called workflow holds the whole run (probed
# 2026-10-02: a second run's first job started two seconds after the first
# run's last job ended).
#
# Every label event on the issue starts this workflow, and a group admits one
# pending run, cancelling the one it replaces. So an event for any other label
# takes a group of its own, keyed by its run id: otherwise adding `bug` while a
# run is in progress would cancel an `agent:implement` run waiting behind it.
concurrency:
  group: agent-implement-issue-${{ github.event.issue.number }}${{ github.event.label.name != 'agent:implement' && format('-other-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# **Three jobs, and the agent's holds nothing it could use to write.**
#
# The agent runs unsandboxed with the runner's passwordless `sudo`, so it can
# read anything on its runner: the environment of every process, and the
# memory of the runner process itself, which holds every secret its job names
# from the moment the job starts, whether or not a step using it ever runs
# (probed 2026-10-02). Scrubbing a variable, persisting no credential and
# passing the PAT to one command (#306) close the easy reads, not that one.
# And whatever ran there can leave something behind — a hook, a git config
# entry, a replaced binary, a process waiting on `/proc` — for a later step on
# the same runner to hand a token to.
#
# So the steps that write are on other runners. `gate` reads the issue,
# refuses or claims it, and names the branch; `implement` runs the agent with
# a read-only token and names no PAT and no App secret anywhere, and hands
# over its commits as a `git bundle`; `publish` starts on a fresh runner,
# checks the bundle, and pushes, opens the PR and asks for the review with the
# loop's token, the App's or the PAT (`.github/actions/loop-token`). Each
# runner is discarded when its job ends and the job token with it, so nothing
# the agent did reaches the job that holds a credential. The same split as review.yml's
# (#257), where the job that runs the model holds no write scope at all.
#
# The permissions differ per job, and the caller grants the union: what
# `publish` spends. The caller is unchanged.
jobs:
  gate:
    # Job-level, deliberately. A job-level `if:` skips without provisioning a
    # runner and costs nothing; a step-level guard has already booted a runner
    # and bills a full rounded-up minute for every unrelated label event.
    #
    # On this side of the seam, like every other guard in the loop: a caller's
    # own `if:` can skip this job, it cannot loosen this one. The two jobs
    # after it follow from its outputs, so this is the one guard.
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    # API calls and nothing else; the agent's own limit is on its job.
    timeout-minutes: 10
    # Granted by the caller, bounded here, per job. A called workflow can only
    # downgrade the token it is handed, so each job's block is its ceiling and
    # the caller's grant has to cover the widest of them — without it there is
    # no run to make a `gh` call in: GitHub refuses the elevation rather than
    # trimming a job to fit, so a caller granting less than a block declares
    # fails before any job starts (probed, #146).
    permissions:
      # The base branch's tip, read for `publish` to check the agent's commits
      # against.
      contents: read
      # The refusals, the start comment and the label transitions.
      issues: write
      # The open-PR check in the preflight.
      pull-requests: read
    outputs:
      refused: ${{ steps.preflight.outputs.refused }}
      branch: ${{ steps.branch.outputs.name }}
      base: ${{ steps.base.outputs.sha }}
      started: ${{ steps.clock.outputs.started }}

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_STATE: ${{ github.event.issue.state }}
      # The branch this run works from, end to end: checked out, branched from,
      # opened against, and handed to the runner so the agent's prompt names the
      # branch its own was actually cut from. One value, one input, so the three
      # can never disagree.
      BASE_REF: ${{ inputs.default-branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # This run's page, linked from every comment the run posts on the issue:
      # the start comment, the PR it opened, and the failure (#205). One
      # definition, so the three cannot link different things.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Four refusals and one deferral, in order, all of them here rather than
      # in the agent: this step runs before checkout and the dependency install,
      # so neither costs more than one API call.
      #
      # The **partition** has to come first
      # (jeffwlawson/winget-manifest-lint#92). `agent-implement-prd` shares this
      # trigger label and owns every issue that has sub-issues, so both jobs
      # start on every label event and exactly one of them may speak. This step
      # settles which before it says anything at all — including about a closed
      # issue, which would otherwise collect the same "not open" comment twice,
      # seconds apart, from two runs that cannot see each other.
      #
      # Then state. The PR query below lists open PRs only, so an issue whose PR
      # has already merged looks exactly like an issue nobody has started. It
      # then checks out the base branch, finds the work already there, and
      # usually dies at "no commits were made" — or, worse, invents a change and
      # opens a duplicate PR (jeffwlawson/winget-manifest-lint#102).
      #
      # Then the rest of the shape (jeffwlawson/winget-manifest-lint#90), before
      # the PR query rather than after: an issue that must never be implemented
      # should not be handed "close that PR, then re-add the label", a remedy
      # that leads straight back to a refusal.
      #
      # Distinct messages throughout, on purpose. "Someone is already on this",
      # "this is finished" and "this is not implementable as labelled" call for
      # different things from the human reading them, and the comment is all
      # they get without opening the run log.
      - name: Preflight
        id: preflight
        run: |
          set -euo pipefail

          # The trigger label comes off with every refusal, as with every run
          # that ends (#236), which is what makes a retry a deliberate human
          # act rather than a re-run. In the loop's one order: the comment
          # first, then this run's own label off, then `agent:blocked` where
          # the refusal is a shape's, so the label that names the next step
          # goes on last.
          # The comment is tolerated: under `-e` a failed one would end the step
          # before the removal, and leave the label on with nothing behind it.
          # One pattern for every refusal (#253): the label that did not run,
          # then a sentence saying why and what to do, starting with a capital.
          refuse() {
            echo "refused=true" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --body "**\`agent:implement\` didn't run:** $1" || echo "::warning::Could not post the refusal comment on #${ISSUE_NUMBER}."
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
            if [ "${2:-}" = "blocked" ]; then
              gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
            fi
            exit 0
          }

          # A shape refusal also marks the issue blocked: `agent:blocked` goes on
          # only where the maintainer has to act (#253). The other two are
          # transient — reopen the issue, close the PR, and the same run would
          # now proceed — whereas a shape refusal will repeat verbatim until
          # somebody restructures the work. `agent:blocked` is what records
          # that on the issue itself; the transition step below clears it when a
          # run does start.
          refuse_shape() {
            refuse "$1" blocked
          }

          # Not a refusal, and deliberately touching nothing: the PRD workflow
          # owns this shape and is running right now on the same event. A
          # comment here would sit beside its comment saying the opposite, and a
          # label edit would race the re-label its chain depends on.
          defer() {
            echo "refused=true" >> "$GITHUB_OUTPUT"
            echo "$1"
            exit 0
          }

          # One query for the whole shape — parent, sub-issues and labels
          # together. Asking separately is two chances to see a different
          # answer, and every branch below reads the same snapshot.
          #
          # Deliberately not `|| true`. Every other guard in these workflows
          # proceeds when an API call comes back empty, on the grounds that a
          # blip is not evidence; this one is the exception, because "no answer"
          # read as "standalone" is exactly the isolated sub-issue run the guard
          # exists to prevent. A failed query fails the step, which leaves the
          # trigger label in place and the run visibly red.
          issue=$(gh api graphql \
            -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -F number="$ISSUE_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  issue(number: $number) {
                    parent { number }
                    subIssues(first: 1) { totalCount }
                    labels(first: 100) { nodes { name } }
                  }
                }
              }' \
            --jq '.data.repository.issue')

          parent=$(jq -r '.parent.number // ""' <<< "$issue")
          subs=$(jq -r '.subIssues.totalCount' <<< "$issue")
          wayfinder=$(jq -r '[.labels.nodes[].name | select(startswith("wayfinder:"))] | join(", ")' <<< "$issue")

          # Sub-issue count first, so a *nested* PRD — sub-issues and a parent —
          # is `has-sub-issues` and goes to the PRD workflow. That is the one
          # shape both workflows could plausibly claim, and the PRD path is the
          # one that can explain what is wrong with it.
          if [ "$subs" -gt 0 ]; then
            shape=has-sub-issues
          elif [ -n "$parent" ]; then
            shape=has-parent
          else
            shape=standalone
          fi
          echo "shape=$shape" >> "$GITHUB_OUTPUT"

          if [ "$shape" = "has-sub-issues" ]; then
            defer "#${ISSUE_NUMBER} has ${subs} sub-issue(s), so agent-implement-prd owns this label event."
          fi

          if [ "$ISSUE_STATE" != "open" ]; then
            refuse "This issue is closed. Reopen it, then add \`agent:implement\` again."
          fi

          # Checked before the hierarchy, since a wayfinder ticket is refused
          # whichever shape it happens to have. The PRD workflow carries the
          # same refusal, for the wayfinder map that has sub-issues.
          if [ -n "$wayfinder" ]; then
            refuse_shape "This is a planning issue (\`wayfinder:*\`), not buildable work. Add \`agent:implement\` to the issues it produces instead."
          fi

          if [ "$shape" = "has-parent" ]; then
            refuse_shape "This is a sub-issue of #${parent}. Add \`agent:implement\` to #${parent} instead; it builds its sub-issues in order."
          fi

          # Blocked-by is *sequencing*, not containment, and that distinction is
          # the whole reason this is a refusal rather than a chain. A PRD parent
          # contains its sub-issues — the parent's body is the spec and the
          # slices are pieces of it — so authorising the parent authorises them,
          # which is what lets one label drive five runs onto one branch. A
          # blocker is a separate deliverable with its own PR and its own
          # reviewer. Implementing it because somebody labelled the thing
          # downstream would authorise work nobody asked for, transitively, and
          # some blockers are decision tickets that are not implementable at all.
          #
          # REST rather than the shape query above, deliberately: this endpoint
          # is purpose-built and its response was verified against a real edge.
          # A GraphQL equivalent may exist and would save the call, but an
          # unverified field name here fails the entire preflight, and the
          # ~0.3 s is not worth guessing for.
          blockers=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/dependencies/blocked_by" \
            --jq '[.[] | select(.state == "open") | "#\(.number)"] | join(", ")' 2>/dev/null || echo "")
          # `refuse_shape` rather than `refuse`, against the distinction those two
          # verbs draw above — and the exception is deliberate. By that rule this
          # is *transient*: the blocker closes and the same run proceeds, with
          # nothing restructured. But `agent:blocked` is the only way to find
          # work that is waiting, and until #5 promotes these automatically,
          # nothing else will surface them. A plain `refuse` would strip the
          # trigger label and leave the issue carrying nothing at all.
          #
          # There is no queued label to use instead: the one declared for this
          # was retired (#204), because the native edge read above already says
          # the issue waits, and this refusal is what reads it.
          if [ -n "$blockers" ]; then
            if [[ "$blockers" == *,* ]]; then
              refuse_shape "It's blocked by ${blockers}, which are still open. Add \`agent:implement\` again once they are closed, or remove the \"blocked by\" links that no longer apply."
            else
              refuse_shape "It's blocked by ${blockers}, which is still open. Add \`agent:implement\` again once ${blockers} is closed, or remove the \"blocked by\" link if it no longer applies."
            fi
          fi

          existing=$(gh pr list --state open --limit 1000 --json number,url,body \
            --jq "[.[] | select(.body | test(\"(?i)(closes|fixes|resolves)\\\\s+#${ISSUE_NUMBER}\\\\b\"))] | .[0].number // empty")
          if [ -n "$existing" ]; then
            refuse "PR #${existing} already exists for this issue. Keep working on that PR, or close it and add \`agent:implement\` again."
          fi
          echo "refused=false" >> "$GITHUB_OUTPUT"

      # The trigger label stays on while this run works and comes off in the
      # last step, however the run ends (#236): a retry is still a human
      # re-adding it deliberately. So the one label to take off here is a block
      # an earlier run left. The line before it is the permission probe, the label write a short
      # token feels first, ahead of the agent pass it would otherwise spend: it
      # adds the label this run already holds, which changes nothing, and is not
      # `|| true`, so a short token fails the run before the checkout.
      #
      # Then the run links itself on the issue (#205), last and before the
      # checkout, so a run in progress can be found from the issue rather than
      # by matching timestamps in Actions. A warning where it cannot be posted,
      # never a failure: nothing has been done yet that a stopped run would
      # need to report.
      - name: Transition labels
        if: steps.preflight.outputs.refused == 'false'
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:implement"
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "**\`agent:implement\` started:** [Workflow run](${RUN_URL})" || echo "::warning::Could not post the start comment on #${ISSUE_NUMBER}. The run goes on; it is ${RUN_URL}."

      - name: Compute branch name
        if: steps.preflight.outputs.refused == 'false'
        id: branch
        run: |
          slug=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          echo "name=agent/issue-${ISSUE_NUMBER}-${slug}" >> "$GITHUB_OUTPUT"

      # The base the agent's branch has to build on, read here so `publish`
      # checks the bundle against a commit the agent's job did not report.
      # The agent's job checks out the branch by name a moment later, so its
      # base is this commit or a descendant of it.
      - name: Record the base
        if: steps.preflight.outputs.refused == 'false'
        id: base
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GH_REPO}/commits/${BASE_REF}" --jq .sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # The clock the failure step reads a time limit off (#220). A job that
      # reaches its `timeout-minutes` is cancelled, not failed, and nothing in
      # the `needs` context says which cancellation it was, so that step
      # compares how long the agent's job could have run with its limit. Last
      # in this job, so it starts as near the agent's job as a step here can,
      # and is read from this job's outputs rather than the agent's, which a
      # step there could rewrite.
      - name: Start the agent's clock
        if: steps.preflight.outputs.refused == 'false'
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

  implement:
    needs: gate
    if: needs.gate.outputs.refused == 'false'
    runs-on: ubuntu-latest
    # The repository variable `AGENT_TIMEOUT_MINUTES` where it is set (#220),
    # shared by the four jobs that run an agent to write code, and 30 where it
    # is not. `vars` is among the contexts this key may read, and in a called
    # workflow it resolves against the caller's repository. `fromJSON` because
    # a variable is a string and this key wants a number; a value that is not
    # one fails the job before any step, which `doctor` reports. The failure
    # step in `publish` names the same figure.
    timeout-minutes: ${{ fromJSON(vars.AGENT_TIMEOUT_MINUTES || '30') }}
    # **Read-only, and no PAT or App secret named anywhere in this job.** Not
    # even in a step that never runs: a secret is delivered to every job whose
    # text names it.
    # The job token is readable by the agent however it is scrubbed, so this
    # block is what it can do with it.
    permissions:
      # The checkout.
      contents: read
      # The runner reads the issue and its comments, for the agent's prompt.
      issues: read
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BASE_REF: ${{ inputs.default-branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          # No credential is left in the checkout for the agent's git, or
          # anything else it runs, to find. Nothing in this job fetches or
          # pushes after it: the publish job pushes, from a checkout of its own.
          persist-credentials: false

      - name: Create branch
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
        run: |
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      # Both setup steps are the adopter's toolchain, so both are skippable.
      # `npm install -g @anthropic-ai/claude-code` below is not: that is the
      # agent's own runtime, and every runner image already has the Node it
      # needs for it.
      - name: Setup Node.js
        if: inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, never an expression reading the
      # issue event.
      - name: Install dependencies
        if: inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The runner package lives on GitHub Packages, which has no anonymous
      # install even for a public package — see the long note on the same step in
      # agent-review-reusable.yml. Short version: the scoped `.npmrc` is written
      # for `@jeffwlawson` only so a caller's own `npm ci` is untouched, and
      # `packages: read` in the caller is what makes the token below work. The
      # cache opt-out belongs to the same note: this half declares no toolchain,
      # so it must not infer one.
      #
      # With `node-version-file: ''` the toolchain step above is skipped, and
      # without a Node named here the runner would run on the image's, below
      # the package's `engines.node` (#335). So it names one in exactly that
      # case and none otherwise, leaving an adopter's own version file to decide
      # the Node their commands run on. `tests/workflows.test.ts` holds it to
      # `engines.node`.
      - name: Authenticate to GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version-file == '' && '24' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      - name: Run implementation agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_IMPLEMENT: ${{ vars.AGENT_MODEL_IMPLEMENT }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          OUTPUT_DIR: ${{ runner.temp }}
        # `npm exec --prefix` rather than a bare `npx`, and the prefix is the
        # whole point. `npx pkg@version` reuses a package already present in the
        # working directory when it satisfies the spec — and in the repository
        # that *publishes* this package, the checkout is such a package. It has
        # no `dist/` (CI installs, it does not build), so the bin resolves to
        # nothing and the step dies `command not found` before any runner code
        # runs (#8). Installing into RUNNER_TEMP sidesteps the name collision.
        #
        # A no-op for every consuming repo, which has no package of this name to
        # collide with — verified against npm 10 and 11, both of which ignore
        # `--ignore-existing` here. `--prefix` moves the *install*, not the
        # process `cwd`: the runner still does its git work in the checkout.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.7.14 -- agent-workflows implement

      # The agent's own record of the session (#269), so a run can be profiled
      # and debugged from what it did and not only from the log, which shows
      # some of its tool calls and none of its file reads, edits or thinking.
      # Claude Code writes it under `~/.claude/projects/`, in a directory named
      # after the checkout's path, and it goes with the runner unless something
      # keeps it: sandcastle's own copy does not run without a sandbox.
      #
      # **Redacted, never refused.** An artifact on a public repository is
      # readable by anyone who can see the repository, and the agent's
      # environment holds `CLAUDE_CODE_OAUTH_TOKEN`, so a transcript where it
      # printed that environment carries the token. Every secret this job holds
      # is replaced with `[REDACTED]` in a copy, the job token also in the
      # basic-auth form a checkout's git config holds it in, and only the copy
      # is uploaded. The script is the one every agent workflow runs, and names no
      # PAT: no job that runs an agent holds one (#307, #316).
      #
      # `always()`, so a failed, cancelled or timed-out run keeps its record
      # too, and `continue-on-error`, so the record never fails the run it
      # records. The upload reads the redaction's outcome rather than its own
      # `always()` alone, so a copy the redaction did not finish is never sent.
      # `transcript-retention-days` at 0 turns both off.
      - name: Redact the session transcript
        id: transcript
        if: always() && inputs.transcript-retention-days > 0
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, shutil

          source = pathlib.Path.home() / ".claude" / "projects"
          copy = pathlib.Path(os.environ["RUNNER_TEMP"]) / "agent-transcript"
          shutil.rmtree(copy, ignore_errors=True)

          secrets = []
          for name in ("CLAUDE_CODE_OAUTH_TOKEN", "GITHUB_TOKEN"):
              value = os.environ.get(name, "").encode()
              if not value:
                  continue
              secrets.append(value)
              if name != "CLAUDE_CODE_OAUTH_TOKEN":
                  secrets.append(base64.b64encode(b"x-access-token:" + value))

          files = sorted(source.rglob("*.jsonl")) if source.is_dir() else []
          if not files:
              print("No session transcript to upload: the agent never started.")
          for file in files:
              text = file.read_bytes()
              for secret in secrets:
                  text = text.replace(secret, b"[REDACTED]")
              out = copy / file.relative_to(source)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(text)
              print(f"Redacted {file.relative_to(source)} for upload.")
          PY

      # `overwrite`, so a re-run replaces this attempt's copy rather than
      # failing on the name. Uploading needs no scope: the artifact service
      # takes the runner's own token.
      - name: Upload the session transcript
        if: always() && steps.transcript.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: agent-transcript
          path: ${{ runner.temp }}/agent-transcript
          if-no-files-found: ignore
          retention-days: ${{ inputs.transcript-retention-days }}
          overwrite: true

      # The agent's commits, as the one thing `publish` pushes. A bundle rather
      # than a push from here: this job holds no token that can write, and the
      # runner that ran the agent is not one to spend a token on. Thin — the
      # base branch is its prerequisite, which `publish` has from its own
      # checkout — and holding exactly the one branch `gate` named.
      - name: Bundle the branch
        if: success()
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
        run: git bundle create "${RUNNER_TEMP}/branch.bundle" "refs/heads/${BRANCH}" "^refs/heads/${BASE_REF}"

      # The bundle on success, the reason file on a failure, handed to
      # `publish` as one artifact. `always()`, because a failed run is one of
      # the outcomes `publish` reports, and either file may be missing.
      # Uploading needs no scope: the artifact service takes the runner's own
      # token, so this job stays read-only. `overwrite`, so a re-run replaces
      # this attempt's copy rather than failing on the name.
      #
      # What this job hands over is the agent's to write, whatever a step here
      # meant it to be. So `publish` takes nothing from it but this artifact,
      # which it checks, and reads nothing from this job's outputs.
      - name: Hand the branch to the publish job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-implement
          path: |
            ${{ runner.temp }}/branch.bundle
            ${{ runner.temp }}/failure_reason.txt
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  publish:
    needs: [gate, implement]
    # `always()`, so a failed, cancelled or timed-out agent is still reported
    # and its trigger label still taken off — the steps that did that sat at
    # the end of one job before, under the same `always()`. Not where the gate
    # was skipped (another label's event) or refused or deferred: that run
    # said what it had to, or must say nothing.
    if: always() && needs.gate.result != 'skipped' && needs.gate.outputs.refused != 'true'
    runs-on: ubuntu-latest
    # A clone, a push and some API calls, and a bounded wait for the PR's head.
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BASE_REF: ${{ inputs.default-branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Into `RUNNER_TEMP`, where the failure step looks for a reason file as
      # it did when the agent ran in this job. Tolerated: an agent's job that
      # was killed before its upload leaves nothing to fetch, and the failure
      # step still has to run.
      - name: Fetch what the agent handed over
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: agent-implement
          path: ${{ runner.temp }}

      # The token every write below that the workflow token cannot make is
      # made with: the loop's App's, `AGENT_PAT`, or the workflow token, in
      # that order, and `source` says which. Minted here, before the first
      # write and after the agent finished, and in no other job.
      - name: Resolve the loop's token
        id: token
        if: always()
        uses: jeffwlawson/agent-workflows/.github/actions/loop-token@v0.7.14
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          agent-pat: ${{ secrets.AGENT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout the base branch
        if: needs.implement.result == 'success'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          # Nothing the agent touched is on this runner, and the push below
          # passes its token on its own command, as everywhere else.
          persist-credentials: false

      # `head` is the commit `Request review` waits for the new PR to show.
      #
      # **The bundle is checked before anything is pushed from it**, against
      # facts `gate` established and the agent could not reach: it is intact
      # and its prerequisites are here, it holds exactly the branch `gate`
      # named and nothing else, and that branch builds on the base `gate`
      # read. Its *content* is the agent's to write and the review's to judge,
      # as it always was; what this rules out is a bundle that is not the
      # branch this run was for. Unbundled rather than fetched: no remote, no
      # hooks, and no git configuration from anywhere but this fresh checkout.
      #
      # The loop's App and AGENT_PAT are both optional. With neither, this
      # pushes with GITHUB_TOKEN, which works, except that CI on the resulting
      # PR waits for a maintainer to approve it: since 2026-06-11 a push made
      # with it starts `pull_request` runs that require approval (#221). Set
      # either later and this starts using it with no change to the workflow.
      - name: Push branch
        id: push
        if: needs.implement.result == 'success' && success()
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
          BASE_SHA: ${{ needs.gate.outputs.base }}
          PUSH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/branch.bundle"

          block() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "::error::$1"
            exit 1
          }

          [ -f "$bundle" ] || block "The agent's job finished without handing over its commits, so nothing was pushed."
          git bundle verify --quiet "$bundle" \
            || block "The agent's commits arrived damaged or incomplete, so nothing was pushed."
          # `verify` checks the prerequisites and little else: a bundle cut
          # short, in its header or its commits, can pass it. Unbundling reads
          # and indexes the whole of it, which is where that shows, and writes
          # objects only, never a ref.
          git bundle unbundle "$bundle" > /dev/null \
            || block "The agent's commits arrived damaged or incomplete, so nothing was pushed."
          heads=$(git bundle list-heads "$bundle")
          if [ "$(wc -l <<< "$heads")" -ne 1 ] || [ "$(cut -d' ' -f2 <<< "$heads")" != "refs/heads/${BRANCH}" ]; then
            block "The agent's commits arrived on a branch other than \`${BRANCH}\`, or beside other branches, so nothing was pushed."
          fi
          git update-ref "refs/heads/${BRANCH}" "$(cut -d' ' -f1 <<< "$heads")"
          git merge-base --is-ancestor "$BASE_SHA" "refs/heads/${BRANCH}" \
            || block "The agent's commits don't build on \`${BASE_REF}\` as this run found it, so nothing was pushed."

          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" push --force origin "$BRANCH"
          echo "head=$(git rev-parse "refs/heads/${BRANCH}")" >> "$GITHUB_OUTPUT"

      # The body is the **frame** (#218), written here once and never
      # rewritten, in the order #298 settled: a note on what the loop does with
      # the pull request and how to steer it, linking this run and opening with
      # a status line between its own markers, which every review rewrites; a
      # `---` rule, outside every marker pair and with a blank line above it,
      # without which GitHub reads that line as a setext heading (#353);
      # `## Summary` and the summary block the review writes and keeps current;
      # and `Closes #N` at the bottom, where GitHub reads it as well as at the
      # top. The review owns the two blocks and nothing else, so a maintainer's
      # notes outside them survive every round. The title is the issue's until
      # the first review writes one true of the change.
      - name: Open draft PR
        if: needs.implement.result == 'success' && success()
        id: open_pr
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
          # gh reads GH_TOKEN from the env. The job-level GH_TOKEN is the
          # built-in GITHUB_TOKEN, and the Actions bot is forbidden from
          # creating PRs ("GitHub Actions is not permitted to create or approve
          # pull requests"). The loop's App and a user PAT are not the Actions
          # bot, so they bypass that restriction. The resolver falls back to
          # GITHUB_TOKEN so the step still runs in setups with neither: it
          # will fail the same way, but the workflow shape stays identical.
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The status line the note opens with until the first review rewrites
          # it (#298): `OPENING_STATUS` in `shared/progress-list.ts`, held equal
          # by a test.
          OPENING_STATUS: "**🔍 In review:** waiting for its first review."
        run: |
          title="Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          body_file="${RUNNER_TEMP}/pr-body.md"
          cat > "$body_file" <<FRAME
          > [!NOTE]
          > <!-- agent:status -->
          > ${OPENING_STATUS}
          > <!-- /agent:status -->
          >
          > Opened by the agent loop from #${ISSUE_NUMBER} ([Workflow run](${RUN_URL})). Comment here to steer it; your notes outside the loop's blocks are never edited.

          ---

          ## Summary

          <!-- agent:summary -->
          _The review will summarize this change here after its first pass._
          <!-- /agent:summary -->

          Closes #${ISSUE_NUMBER}
          FRAME
          pr_url=$(gh pr create --draft --base "$BASE_REF" --head "$BRANCH" \
            --title "${title:0:256}" --body-file "$body_file" | tail -n1)
          echo "number=$(basename "$pr_url")" >> "$GITHUB_OUTPUT"
          echo "Opened $pr_url"

      # The success outcome, said on the issue with the run link (#205), so
      # every comment a run leaves there links it. Before the review is asked
      # for, and a warning where it cannot be posted: the PR is open either
      # way, and the review must still be requested.
      - name: Link the PR on the issue
        if: needs.implement.result == 'success' && success()
        env:
          NEW_PR: ${{ steps.open_pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "**\`agent:implement\` opened PR #${NEW_PR}:** [Workflow run](${RUN_URL})" || echo "::warning::Could not comment PR #${NEW_PR} on #${ISSUE_NUMBER}."

      # Cascade: every agent PR gets reviewed without a human labelling it.
      #
      # Safe because the hop it starts is bounded at the other end. Since #102
      # agent-review can add `agent:fix` back: only within the pull request's
      # fix-round budget (#201), and never after a fix round that closed none
      # of the findings it was given (#202). The invariant that records the
      # old rule and both amendments is docs/parity.md §10; a return leg
      # without those bounds closes the loop with no human gate.
      #
      # MUST use the loop's App or AGENT_PAT: a label added with GITHUB_TOKEN
      # does not trigger further workflows, so the label would appear and
      # nothing would happen, a silent no-op. Warn loudly rather than pretend
      # it worked.
      - name: Request review
        if: needs.implement.result == 'success' && success()
        env:
          NEW_PR: ${{ steps.open_pr.outputs.number }}
          TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The commit this run pushed, and how long the PR gets to show it as
          # its head before the label goes on anyway (#229).
          PUSHED_SHA: ${{ steps.push.outputs.head }}
          HEAD_WAIT_SECONDS: "60"
        run: |
          set -uo pipefail
          # Wait for the pull request to show the pushed commit as its head
          # before asking for the review (#229). GitHub moves a PR's head
          # asynchronously after a push, and a label added before it has would
          # carry the commit before the push in its payload. Bounded: past it,
          # the label goes on anyway with a warning, since review reads the
          # branch tip itself and refuses by name where it cannot settle on it.
          head=""
          deadline=$((SECONDS + HEAD_WAIT_SECONDS))
          until head=$(gh pr view "$NEW_PR" --json headRefOid --jq .headRefOid 2>/dev/null) && [ "$head" = "$PUSHED_SHA" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::PR #${NEW_PR} still shows ${head:-an unreadable head} as its head ${HEAD_WAIT_SECONDS}s after ${PUSHED_SHA} was pushed. Asking for the review anyway: it reads the branch tip itself, and refuses by name if it cannot settle on ${PUSHED_SHA}."
              break
            fi
            sleep 5
          done
          # This run's own label comes off before the next step's goes on
          # (#236): every result is posted by now, the PR link included, so
          # what is left is the hand-off. The last step removes it again, which
          # is nothing where it is already off.
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          # Removed first, as every trigger label the loop adds (#236): an add
          # on a label that is somehow already there fires nothing.
          gh pr edit "$NEW_PR" --remove-label "agent:review" || true
          gh pr edit "$NEW_PR" --add-label "agent:review"
          if [ "$TOKEN_SOURCE" != "app" ] && [ "$TOKEN_SOURCE" != "pat" ]; then
            echo "::warning::Neither the loop's App nor AGENT_PAT is set, so this label was added with GITHUB_TOKEN and will NOT trigger agent-review. Add agent:review by hand on PR #${NEW_PR}."
          fi

      # Any of the three jobs: `gate` failing (this job's own `if:` lets a
      # failed gate through, since its `refused` is `!= 'true'` there), the
      # agent's job failing, timing out or being cancelled, or a step here.
      # `failure()` in this job sees an ancestor job's failure too, but not a
      # cancelled one, so the agent's result is read by name. Refusals exit 0
      # and a deferral sets `refused`, so neither reaches this job at all.
      #
      # A preflight that fails hard — the shape query erroring on a schema or
      # permissions mismatch — exits before writing `refused` at all, and that
      # is the run that most needs this comment: nothing on the issue,
      # `agent:implement` still attached, and a red run nobody is watching.
      #
      # In the loop's one order (#236): the comment, then this run's own label
      # off, then `agent:blocked`. The removal only where the preflight decided
      # the issue was this run's, for the last step's reason below.
      - name: Mark blocked on failure
        if: always() && (failure() || cancelled() || needs.gate.result != 'success' || needs.implement.result != 'success')
        env:
          # How each job ahead of this one ended, and this job's own status for
          # a cancel that lands while it runs. `job.status` rather than
          # `cancelled()`, which GitHub allows only in an `if:`.
          GATE_RESULT: ${{ needs.gate.result }}
          AGENT_RESULT: ${{ needs.implement.result }}
          JOB_STATUS: ${{ job.status }}
          JOB_STARTED: ${{ needs.gate.outputs.started }}
          REFUSED: ${{ needs.gate.outputs.refused }}
          TIMEOUT_MINUTES: ${{ vars.AGENT_TIMEOUT_MINUTES || '30' }}
        run: |
          reason="It stopped without giving a reason. The workflow run's log has the details."
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          # Cancelled is not failed (#220), and a job that reached its limit
          # is cancelled too. What tells the two apart is the clock `gate`
          # started just before the agent's job: a timed-out job ran its whole
          # limit, and the time since that clock is at least that. A reason
          # file is not read on either; what wrote one was stopped, not
          # failing. The labels and the retry are a failure's, word for word.
          #
          # The clock is read on a failure that left no reason file too: the
          # agent's result here is the `needs` context's, not the job status
          # the clock was first compared against, and a runner that wrote no
          # reason did not end on its own terms either way.
          # The limit is compared only where it is a positive integer: `fromJSON`
          # accepts `1.5` and `1e1`, which bash arithmetic refuses, and under
          # `bash -e` that would end this step before its comment. A limit the
          # step cannot compare reads as a cancel, which is still said.
          stopped=false
          if [ "$JOB_STATUS" = "cancelled" ] || [ "$GATE_RESULT" = "cancelled" ] || [ "$AGENT_RESULT" = "cancelled" ]; then
            stopped=true
            reason="It was cancelled before it finished, by hand or by GitHub."
          elif [ "$AGENT_RESULT" = "failure" ] && [ ! -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            stopped=true
          fi
          if [ "$stopped" = "true" ]; then
            if [ -n "${JOB_STARTED:-}" ] && [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] && [ $(( $(date +%s) - JOB_STARTED )) -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
              reason="It timed out after ${TIMEOUT_MINUTES} minutes. The repository variable \`AGENT_TIMEOUT_MINUTES\` raises the limit."
            fi
          fi
          # One pattern for every run that stopped (#253): the reason as a
          # sentence, starting with a capital and ending in a full stop, then
          # the run and what to do.
          reason="${reason^}"
          case "$reason" in *[.!?]) ;; *) reason="${reason}." ;; esac
          # The label comes off in the last step since #236, so adding it is
          # the retry. Not after a preflight that died before deciding: that
          # run leaves the label on (see the last step), and adding a label
          # that is already present fires no event.
          retry="To try again, add \`agent:implement\`."
          if [ "$REFUSED" != "false" ]; then
            retry="To try again, remove \`agent:implement\` if it is still on this issue, then add it."
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '**`agent:implement` stopped:** %s\n\n[Workflow run](%s) · %s\n' "$reason" "$RUN_URL" "$retry" > "$body_file"
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file" || echo "::warning::Could not post the failure comment on #${ISSUE_NUMBER}."
          if [ "$REFUSED" = "false" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true

      # The trigger label comes off however the run ends (#236): success,
      # failure, timeout or cancel, so it never outlives the run that decided
      # the issue was its own. `== 'false'`, unlike the failure step above: a
      # refusal took it off already, a deferral must not touch it, and nor
      # must a preflight that died before deciding, since that run may be the
      # one that would have deferred, and `agent-implement-prd` owns that label event
      # and holds the label while it works. Such a run leaves it on, as it
      # always has, and the failure comment says to remove it before re-adding.
      - name: Always remove the trigger label
        if: always() && needs.gate.outputs.refused == 'false'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
