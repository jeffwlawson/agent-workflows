name: Agent Review (reusable)

# The review job itself. `agent-review.yml` is the caller — a trigger and two
# wires — and everything that bounds what a wrong review can do stays here, in
# a file an adopting repo *references* rather than copies (#97, slice 3 of #88).
#
# A reusable workflow rather than a composite action, for one reason: an action
# cannot declare `on:`, `permissions:`, `concurrency:` or a job-level `if:` —
# which is every security control in this loop, and **the fork guard is a
# job-level `if:`**. An action could have absorbed checkout → node → install and
# left the controls to be copy-pasted per repo, which is how they drift.
#
# The trigger stays with the caller because `workflow_call` cannot carry one:
# the event that reaches this job is the caller's, so `github.event.…` below
# reads the `pull_request_target` payload exactly as it did before the split,
# and `github.repository` is still the *calling* repository.
#
# Two properties an adopter cannot get wrong, because they are not theirs to
# state: the fork guard and the label guard are on this side of the seam. A
# caller's own `if:` can skip this job; it cannot loosen it.
on:
  workflow_call:
    inputs:
      default-branch:
        description: >-
          Branch to diff against when the pull-request event carries no base
          ref. On a real PR `base.ref` is always set, so this fires only when
          something is already odd — but an unset fallback degrades *silently*
          to the wrong branch, which is the #71 failure arriving by a different
          route.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets a
          review, running on the image's own Node.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or a PR title becomes
          a shell script.
        type: string
        default: npm ci
      self-check:
        description: >-
          The check-run name this job appears under on the PR, which for a
          called workflow is `<caller job id> / <this workflow's job id>`. The
          CI wait below polls every check on the head commit and has to
          recognise its own, or it waits for itself: 15 of this job's 20
          minutes, then a review with the degraded evidence #48 exists to
          prevent. Nothing inside a called workflow can read its caller's job
          id, hence an input — and required rather than defaulted, because a
          default that is wrong fails exactly this quietly.
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the review agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT, used only to mark the PR ready for review — `GITHUB_TOKEN`
          cannot do that whatever permissions it is granted (docs/ADOPTING.md
          §1). Optional: without it the step warns, the run stays green, and a
          human marks the PR ready by hand.
        required: false

jobs:
  review:
    # Two guards, both required:
    #  - the trigger label, and
    #  - same-repo head: a fork PR must never reach the checkout+npm ci steps,
    #    which would run untrusted code with secrets in scope.
    if: >-
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One group per PR, shared with agent-fix.yml and agent-update-branch.yml.
    # Review is `contents: read` and cannot push, but that is not what the group
    # protects against: the hazard is review *reading* a branch while a fix is
    # writing to it, which produces a confident review of a tree state that
    # never existed. Review used to sit in its own `agent-review-pr-*` group and
    # that race was live (docs/parity.md §10, #102).
    concurrency:
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # `contents: read` is the invariant that bounds what a wrong review can do
    # (docs/parity.md §10). No `issues: write`: review files nothing, and the
    # `gh pr edit --add-label` steps below need only `pull-requests: write` —
    # that scope covers labels on a PR, which is why agent-fix.yml and
    # agent-update-branch.yml already label unguarded without it.
    #
    # The caller declares the same two, and that is not the duplication it
    # looks like — the two blocks do opposite jobs. A called workflow can only
    # *downgrade* the token it is handed, so this block is the bound and cannot
    # be widened from the caller's side. The caller's block is the grant: on a
    # repo whose default `GITHUB_TOKEN` is read-only, `pull-requests: write`
    # declared only here grants nothing, and every `gh pr edit` below 403s — a
    # review that runs, costs a full agent pass, and silently transitions no
    # label at all.
    permissions:
      contents: read
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # The PR's real base branch. review-context.ts diffs HEAD against this so
      # the inline-comment allow-list matches GitHub's PR diff exactly; a
      # hardcoded `main` mis-filters any PR stacked on another branch (#71).
      # The event field is the source; `default-branch` is the fallback for an
      # event that somehow carries none, which is the adopter's call to make
      # rather than a literal `main` buried in a shell expansion.
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.default-branch }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # Same guard as agent-fix.yml and agent-update-branch.yml. Review had none
      # until #102, so labelling a merged PR ran a full agent pass over merged
      # work and then died at `gh pr ready` — which cannot convert a merged PR —
      # under a warning that blames a missing AGENT_PAT. That is a real failure
      # mode misreported as a setup problem, which is worse than either.
      #
      # Unlike the other two this also adds `agent:blocked`. A refusal here is a
      # run a human asked for and did not get, and the review pipeline already
      # uses that label for exactly that; the comment alone scrolls away.
      #
      # The second refusal is the one the shared concurrency group makes
      # necessary. Everything this job reads is pinned to the head SHA in the
      # `labeled` payload — the checkout below, and `commit_id` on the posted
      # review, which is `git rev-parse HEAD` of that checkout. The payload is
      # snapshotted at label time, and joining `agent-pr-*` means the run can
      # start long after: label `agent:review` while a fix is running and the
      # review starts once the fix has pushed, still pinned to the pre-fix
      # commit. Serialising did not remove the race, it turned reading-during-a-
      # write into reading-after-one — a clean review of a superseded tree,
      # every inline comment on an ancestor commit and rendered outdated. The
      # mutates catch their version of this at push time
      # (`--force-with-lease` on the same payload SHA); review publishes
      # instead of failing, so it has to check before it starts.
      #
      # Refuse rather than re-target the current tip: a review is a statement
      # about the commit a human pointed at, and re-pointing it at whatever
      # arrived since would also need the CI wait and `commit_id` moved to the
      # new SHA. Re-adding the label after the mutate finishes is one action and
      # reviews the right thing. An unreadable `gh pr view` proceeds rather than
      # refuses — an API blip is not evidence the branch moved.
      - name: Pre-flight — refuse if the PR is closed, merged, or has moved
        id: state
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          refuse() {
            gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
            gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
            gh pr comment "$PR_NUMBER" --body "$1"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          }

          if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" = "true" ]; then
            refuse "Refused to run \`agent:review\`: this PR is not open."
            exit 0
          fi

          current=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid 2>/dev/null || echo "")
          if [ -n "$current" ] && [ "$current" != "$HEAD_SHA" ]; then
            refuse "Refused to run \`agent:review\`: the branch moved while this run was queued — the label was added at \`${HEAD_SHA:0:7}\`, the head is now \`${current:0:7}\`. Reviewing the labelled commit would put every comment on an ancestor and render it outdated. Re-add \`agent:review\` to review the current head."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Transition labels
        if: steps.state.outputs.proceed == 'true'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR head
        if: steps.state.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Make the PR base available for diffing
        if: steps.state.outputs.proceed == 'true'
        # Create a local ref for the PR's base branch (the checkout is of
        # head.sha, so the base is not present). review-context.ts diffs against
        # it; a bare `git fetch origin <ref>` would populate FETCH_HEAD but no
        # named ref, so keep the refspec. Falls back to `main` when base.ref is
        # somehow empty, matching diffCommandAgainstBase's own default.
        #
        # A ref name may legally contain `$()`, backticks, `;`, `|` and `&`, so
        # #75 asked whether this line is shell-safe. It is, and the two reasons
        # are both load-bearing — keep them if you edit this:
        #   1. BASE_REF arrives as an `env:` var, NOT as a `${{ }}` interpolated
        #      into the run script. Interpolation would splice the ref into the
        #      script *source*, where it would be parsed as syntax; an env var
        #      is only ever data.
        #   2. `"${BASE_REF}"` expands in one pass. POSIX shells do not re-scan
        #      an expansion result for command substitution or operators — only
        #      word splitting and globbing, which the double quotes suppress.
        #      Verified 2026-08-02 against sh and bash with the values above:
        #      each reached git verbatim as a single argument.
        # So the quotes are not decorative; dropping them, or switching to
        # `${{ github.event.pull_request.base.ref }}` inline, breaks this.
        #
        # The `:-main` this line used to carry is gone, not lost: the fallback
        # moved up to the `env:` block, where it is the `default-branch` input
        # rather than a literal only this repo could be right about.
        run: git fetch origin "+refs/heads/${BASE_REF}:refs/heads/${BASE_REF}"

      # Both setup steps are the adopter's toolchain, so both are skippable.
      # `npm install -g @anthropic-ai/claude-code` below is not: that is the
      # agent's own runtime, and every runner image already has the Node it
      # needs for it.
      - name: Setup Node.js
        if: steps.state.outputs.proceed == 'true' && inputs.node-version-file != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, which `pull_request_target` reads
      # from the base branch, and never an expression reading the PR event.
      - name: Install dependencies
        if: steps.state.outputs.proceed == 'true' && inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        if: steps.state.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Wait for the PR's other checks, then hand their results to the agent.
      #
      # Why: a review running while CI is still going has no evidence beyond the
      # diff, so it reasons from the issue's spec. That is exactly how a review
      # once certified a rule "corpus-safe" 96 seconds before the corpus failed
      # with 13 false positives from that very rule. Waiting alone would not have
      # helped — the *results* have to reach the prompt.
      #
      # This job is itself a check on the PR, so `gh pr checks --watch` would
      # deadlock waiting on itself. Poll the check-runs API excluding our own
      # job name instead. Never fails the run: missing CI context degrades the
      # review, it does not invalidate it.
      #
      # The exclusion is every *agent* job, not just this one, and that became
      # load-bearing when review joined the shared per-PR concurrency group
      # (#102). A `fix` labelled while a review is running now sits queued
      # behind it — and a queued job is a check run in a non-completed state, so
      # waiting on it is waiting on a job that cannot start until we finish. The
      # timeout bounds that at 15 of this job's 20 minutes, which is not a
      # bound worth having. They are not CI either way: "fix: queued" is not
      # evidence about the diff.
      - name: Wait for other checks, collect results
        if: steps.state.outputs.proceed == 'true'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Anchored: a repo check genuinely named `fixtures` is not an agent.
          AGENT_CHECKS: ^(review|fix|update-branch|implement)$
          # This job's own check run, which the extraction renamed: a called
          # workflow's job appears as `<caller job id> / <this job's id>`, so
          # the anchored pattern above stops matching it and the wait would
          # spend its whole timeout on itself. Compared as a literal via jq's
          # `env`, not folded into that regex — a job id is not a regex, and a
          # `.` in one would quietly match a neighbouring check too.
          SELF_CHECK: ${{ inputs.self-check }}
          WAIT_SECONDS: "900"
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/ci_status.md"
          : > "$out"

          pending_count() {
            gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
              --jq "[.check_runs[] | select(.name != env.SELF_CHECK) | select(.name | test(\"${AGENT_CHECKS}\") | not) | select(.status != \"completed\")] | length" \
              2>/dev/null || echo 0
          }

          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          while :; do
            pending=$(pending_count)
            [ "${pending:-0}" -eq 0 ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "_Timed out waiting for ${pending} check(s); results below may be incomplete._" >> "$out"
              break
            fi
            echo "Waiting for ${pending} check(s)…"
            sleep 20
          done

          echo "Checks on this commit:" >> "$out"
          gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
            --jq ".check_runs[] | select(.name != env.SELF_CHECK) | select(.name | test(\"${AGENT_CHECKS}\") | not) | \"- \(.name): \(.conclusion // .status)\"" \
            >> "$out" 2>/dev/null || echo "- (could not read check runs)" >> "$out"

          # Tail the failing steps so the agent sees *what* failed, not merely
          # that something did. Capped so a noisy failure cannot swamp the prompt.
          #
          # Excluded on the same grounds as AGENT_CHECKS above, and it has to be
          # the same set: a failed `Agent Fix` says nothing about this diff, and
          # its 60 lines crowd out the CI failure that does. Different namespace
          # though — these are workflow *run* names, where the agent workflows
          # are `Agent Review`/`Agent Fix`/`Agent Update Branch`/`Agent
          # Implement` and the repo's own are `CI` and `Corpus`, so the prefix
          # is the whole test.
          #
          # Being called changes nothing here, and SELF_CHECK is not needed: a
          # called workflow contributes no run of its own, so this run is the
          # caller's — named `Agent Review`, matched by the prefix like every
          # other agent run.
          for rid in $(gh api "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=50" \
                        --jq '.workflow_runs[] | select(.conclusion == "failure") | .id' 2>/dev/null); do
            rname=$(gh api "repos/${GH_REPO}/actions/runs/${rid}" --jq .name 2>/dev/null || echo "run ${rid}")
            case "$rname" in "Agent "*) continue ;; esac
            {
              echo
              echo "### Failure output — ${rname}"
              echo '```'
              gh run view "$rid" --log-failed 2>/dev/null | sed 's/^[^Z]*Z //' | tail -60
              echo '```'
            } >> "$out"
          done

          echo "--- collected CI context ---"
          cat "$out"

      - name: Run review agent
        if: steps.state.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_REVIEW: ${{ vars.AGENT_MODEL_REVIEW }}
          OUTPUT_DIR: ${{ runner.temp }}
          CI_STATUS_FILE: ${{ runner.temp }}/ci_status.md
        run: npx --yes @jeffwlawson/agent-workflows@0.1.0 review

      - name: Post PR review
        if: steps.state.outputs.proceed == 'true' && success()
        env:
          PAYLOAD: ${{ runner.temp }}/review_payload.json
        run: gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/reviews" --input "$PAYLOAD"

      # Draft means "the automated pipeline has not finished", not "the agent is
      # still writing code" — so this belongs here rather than at the end of
      # implement. The human's first real decision (act on the review, or merge)
      # only exists once the review is posted; marking ready any earlier fires
      # the signal during a window when there is nothing to decide.
      #
      # `success()` on purpose: a failed review should leave the PR in draft, so
      # the draft state agrees with the `agent:blocked` label rather than
      # presenting an unreviewed PR as finished.
      #
      # Does not cascade: `ready_for_review` is not in the default
      # `pull_request` types (opened/synchronize/reopened), so neither ci.yml nor
      # corpus.yml re-runs.
      #
      # MUST use AGENT_PAT. `GITHUB_TOKEN` cannot convert a draft PR even with
      # `pull-requests: write` — it fails with
      #   GraphQL: Resource not accessible by integration (markPullRequestReadyForReview)
      # because the Actions bot is an App installation and this mutation is not
      # in its permission set at all. A user PAT is not an App, so it can.
      #
      # This is the fourth GITHUB_TOKEN limitation the loop has hit, and the
      # third of that four where the operation *looks* covered by the granted
      # permission. See docs/ADOPTING.md §1.
      #
      # Never `|| true` here. It was, and it turned a hard failure into a green
      # step: every reviewed PR silently stayed a draft while the workflow
      # reported success, and two were marked ready by hand without anyone
      # noticing the feature was broken. A warning keeps the run green — a PR
      # stuck in draft is not worth failing a review over — while making the
      # failure visible, which `|| true` did not.
      - name: Mark PR ready for review
        if: steps.state.outputs.proceed == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready "$PR_NUMBER" \
            || echo "::warning::Could not mark PR #${PR_NUMBER} ready for review. If AGENT_PAT is unset this is expected — GITHUB_TOKEN cannot do it. Mark it ready by hand."

      - name: Mark blocked on failure
        if: steps.state.outputs.proceed == 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:review` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:review` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && steps.state.outputs.proceed == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
