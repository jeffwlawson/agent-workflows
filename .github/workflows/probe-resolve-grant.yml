name: Probe resolve grant (#133, throwaway)
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  contents-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PROBE: contents-read
    steps:
      - uses: actions/checkout@v7
      - run: bash probe.sh
  contents-write:
    needs: contents-read
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PROBE: contents-write
    steps:
      - uses: actions/checkout@v7
      - run: bash probe.sh
