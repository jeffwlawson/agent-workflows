# What every fix case is replayed with. A case's replay.yaml and inputs/
# override any of these.
#
# The inputs below are a fix run with nothing to resume, no conversation
# comment owed an answer and no minor finding, as fix/fix.ts renders them. A
# case that was handed a conversation comment sets CONVERSATION in its own
# inputs/.

execution:
  max_turns: 200
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]

inputs:
  RESUME: ""
  CONVERSATION: "(none)"
  MINOR_FINDINGS: "(none)"

# Appended after the rendered prompt. Nothing pushes here, and the runner's
# second phase, which turns the run into structured output, does not run, so
# the change and the outcomes have to be in the run for a grader to read.
#
# The run cannot commit: `claude plugin eval` denies writes to the run's
# `.git` (evals/README.md, "What a fix replay cannot exercise"). So the change
# is the working tree's, against the head, untracked files included, and it is
# printed in the final message, which is what the graders read (#716).
note: |
  # EVAL REPLAY

  This fix run is a replay, run to measure the brief above. Nothing is pushed and GitHub is not
  reachable; the branch was checked out at `{{HEAD}}`, and `origin/{{BRANCH}}` still points there.
  This checkout's `.git` is read-only, so a commit fails here: leave the change in the working tree,
  which is what the replay grades.

  When you are done, your **final message** gives, in this order:

  1. The change, as the output of `git diff origin/{{BRANCH}}`, followed by
     `git diff --no-index /dev/null <file>` for each file `git ls-files --others --exclude-standard`
     lists, so a new file is in it too. Paste the output whole, not a summary of it.
  2. The commit message you would have written.
  3. Each thread's outcome (addressed or declined) and the reply you would post on it.
  4. Each conversation comment's outcome (addressed or declined), by its id, and the reason you
     would give; none where *CONVERSATION* holds no comment with an id.

  Then `<promise>COMPLETE</promise>`.
