name: Agent Follow-ups (reusable)

# File the out-of-scope findings a review recorded, once the pull request has
# closed (#50), and on every merge post the linked briefs' *After merge, by a
# human* checklist (#544). The `follow-ups` job in `agent-pr.yml` is the caller (a grant,
# with no inputs and no secrets to wire), and every control stays here, in a
# file an adopting repo *references* rather than copies.
#
# This is the sixth workflow and the only one in the loop holding
# `issues: write`, which is why most of what follows is about what it may not
# do. It **runs no model**: installing Claude Code is a step this file simply
# omits, so reading arbitrary issue bodies while holding that permission is not
# a prompt-injection surface. The judgement is a pure function in the command
# instead, unit-tested from plain objects.
#
# **What fires it, and what each case does.** Per trigger and per state, here
# rather than only in the ticket: the job condition below is the only other
# statement of this, and a condition does not read as a table.
#
# | Event | PR state | Marker on the PR | What happens |
# |---|---|---|---|
# | `closed` | merged | present | the post-merge checklist is posted where a linked brief names a check; the latest review's findings are filed, the PR is told what happened to each, the marker is removed |
# | `closed` | merged | absent | the post-merge checklist is posted where a linked brief names a check; nothing is filed, and otherwise the job exits silently: no comment, no refusal, no label |
# | `closed` | not merged | any | the job never starts; abandoned work does not populate the tracker |
# | `labeled` `agent:follow-ups` | closed, merged or not | present, by construction | the same run: the manual entry point, for a missed close event, a reconsidered opt-out or a partial failure; a checklist already posted is not posted again, and none is posted on a pull request that did not merge |
# | `labeled` `agent:follow-ups` | open | any | the job never starts; filing round 3's findings would strand round 9's |
# | `labeled` anything else | any | any | the job never starts |
# | any of the above, from a fork | any | any | the job never starts |
#
# **A PRD chain files once, at its PRD PR's merge** (#247). Its slices are
# built as commits on the PRD branch and reviewed on the PRD PR, and nothing
# merges into the PRD branch through a pull request any more, so the PRD PR's
# merge is the only `closed` event the chain produces and no filter is needed
# here. The PRD PR's newest review carries forward every follow-up an earlier
# round on it recorded, de-duplicated, under a cap of three per landed slice
# that the payload records and the filing re-applies.
#
# `pull_request_target` for two reasons that both belong in the file: it reads
# workflow YAML from the default branch, so a pull request cannot alter what runs,
# and it carries the write token unconditionally — a `pull_request` close from
# a fork would arrive read-only, which is a filing run that silently files
# nothing.
#
# **A job condition cannot make an API call**, and that shapes the run more
# than anything else here. The marker is the opt-out, so it is re-read at
# filing time rather than taken from the event payload — "remove the label,
# then click merge" is precisely the race it exists for — which means it cannot
# be part of the condition. So this job starts on *every* merge in the
# repository, which the post-merge checklist needs anyway (#544): the marker
# gates the filing alone, since removing it is the opt-out of filing, not of
# being reminded. A merge whose linked briefs name no post-merge check and
# whose pull request carries no marker is a **silent exit 0**: most merges have
# neither, and a comment on each of those is how a channel teaches people to
# stop reading it.
#
# **The manual entry point does not override the edited-body refusal.** A
# review body edited after submission refuses to file, says so on the pull
# request, and leaves the marker in place; re-adding the label runs the same
# refusal again. Stated here because it is invisible otherwise — a control with
# a one-label bypass is not a control, and the escape hatch is the right one
# already: a human who has read the finding opens the issue by hand.
on:
  # **Zero inputs, deliberately.** The caller is a trigger and a permissions
  # grant and nothing else.
  #
  # No `setup`: nothing is checked out, and executing an adopter-supplied
  # command is the sharpest edge in this reusable surface — declaring no input
  # keeps it structurally impossible rather than merely absent. No
  # `node-version-file`: its default names a file that does not exist without a
  # checkout, so inheriting the review workflow's shape would fail every run at
  # Node setup. The auth step pins `node-version` instead, held to the
  # package's `engines.node` (#335): the image's own Node drifts below it. No
  # `default-branch`, because nothing is diffed, and no `self-check`, because
  # nothing waits on CI.
  #
  # **And zero secrets.** No model credential, because no model runs — which is
  # what keeps a `pull_request_target` workflow holding `issues: write` free of
  # one — and no `AGENT_PAT`. The issues are created with the always-present
  # workflow token: the PAT is optional loop-wide, so a filing step depending on
  # it would, on a repository without one, silently file nothing, which is the
  # exact failure class this feature exists to fix. Anti-recursion is a welcome
  # second reason rather than the deciding one — issues created with the
  # workflow token start no workflows, and a stub carries no trigger label
  # either way.
  workflow_call:

# Every job's `if:` opens with `vars.AGENT_ORCHESTRATOR != 'service'` (#455):
# a repository that sets that variable is served by the service orchestrator,
# and every job here skips, so one orchestrator answers each label. Unset, or
# any other value, leaves the rest of each condition as it was.
jobs:
  follow-ups:
    # **The shape of this condition is a decision, not formatting.** It is the
    # loop's first job-level condition mixing `&&` and `||`, and `&&` binds
    # tighter: written flat, the fork guard would attach to the first disjunct
    # only and a fork pull request would reach the labeled branch — on the one
    # workflow in the loop holding `issues: write`. The broken form and this one
    # contain identical substrings, which is why `tests/workflows.test.ts`
    # compares the whole normalised string rather than looking for clauses in
    # it. Fork guard hoisted, disjunction parenthesised.
    #
    # `merged == true` literally rather than truthily. The labeled clause never
    # reads `merged` at all: that field is guaranteed on the `closed` action and
    # unspecified on `labeled`, and the manual path accepts a closed-unmerged
    # pull request anyway — so the clause that would have needed an unverified
    # field is the one that does not need it.
    #
    # **This is the deliberate exception to the house rule that every pull
    # request workflow refuses a merged PR.** That guard exists because
    # labelling a merged PR once ran a full agent pass over merged work and then
    # died. Here merged is the *normal* case, and copying the house pattern
    # would make this workflow refuse exactly what it exists to do — silently,
    # and with every check green.
    if: >-
      vars.AGENT_ORCHESTRATOR != 'service' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        ( github.event.action == 'closed'  && github.event.pull_request.merged == true ) ||
        ( github.event.action == 'labeled' && github.event.label.name == 'agent:follow-ups'
          && github.event.pull_request.state == 'closed' )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The loop's existing per-pull-request group, for a specific reason rather
    # than for conformity: two entry points mean a manual label add can race the
    # merge-triggered run, and both would read the tracker *before* either filed
    # — a read-then-write with no lock, whose result is two issues for one
    # finding. The usual objection to this group is that a job waiting on CI
    # deadlocks behind a queued sibling; this job waits on no checks at all.
    concurrency:
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # Granted by the caller, bounded here — a called workflow can only downgrade
    # the token it is handed, and a permission declared only here grants nothing.
    #
    # What is **withheld** is the security statement, and each absence is worth
    # naming because nothing else says it: no `contents: write` (nothing is
    # checked out and nothing is pushed), no `checks: read` (nothing waits on
    # CI), and no `actions: write` (this workflow starts nothing).
    permissions:
      # Strictly unnecessary — nothing here reads the repository — and kept
      # deliberately: a `permissions:` block is a replacement rather than an
      # addition, so omitting this line sets `contents: none`, which is an
      # untested configuration for the runner install.
      contents: read
      # Creating the stubs. This is the grant the whole feature is about, and
      # the reason every other line in this file is about what it may not do.
      issues: write
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read
      # Posting the report and removing the marker. A pull request's labels live
      # under this scope, not under `issues`.
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `gh` resolves the repository from this rather than from a git remote,
      # which is load-bearing here rather than conventional: nothing is checked
      # out, so there is no remote to resolve from.
      GH_REPO: ${{ github.repository }}
      # The limit `timeout-minutes` states, as the measuring step compares it
      # and as the timeout comment names it. Spelled out twice because
      # `timeout-minutes` cannot read `env`; `tests/workflows.test.ts` holds
      # the two equal.
      TIMEOUT_MINUTES: "10"

    steps:
      # The clock *Measure how the job ended* reads a time limit off (#220). A
      # job that reaches its `timeout-minutes` is cancelled, not failed, and
      # nothing in the `job` context says which cancellation it was, so that
      # step compares how long the job ran with its limit. First, so it starts
      # as near the job's own start as a step can.
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # No state step and no shell guard: the merge gate is the job condition
      # alone. A shell guard exists elsewhere to post a comment explaining a
      # refusal; the case refused here is a pull request closed without merging,
      # where nobody is waiting and a comment on a dead PR is noise.
      #
      # The registry half of `setup-node`, deliberately toolchain-free: it
      # declares no `node-version-file` — there is no checkout for one to name —
      # and passes `package-manager-cache: false` so the action does not infer a
      # toolchain from a `packageManager` field and fail before the runner
      # exists to write `failure_reason.txt`. See the long note on the same step
      # in review.yml.
      #
      # It names a `node-version` unconditionally, where the other five name one
      # only when their toolchain step is skipped (#335). There is no toolchain step here, so without it the runner
      # runs on the image's Node: v22 under a package declaring `engines.node`
      # `>=24`, logging `EBADENGINE` and working only until something it imports
      # needs 24, at which point it dies loading, before it can write
      # `failure_reason.txt`. A version, unlike a version file, needs no
      # checkout; `tests/workflows.test.ts` holds it to `engines.node`.
      - name: Authenticate to GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # No `npm install -g @anthropic-ai/claude-code` above this step, and that
      # absence is the point: `follow-ups:file` is a command, and runs no model.
      - name: File the recorded follow-ups
        env:
          # Reads the `.npmrc` the step above wrote. `GITHUB_TOKEN`, carrying the
          # `packages: read` the caller granted — there is no anonymous install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A directory of its own (#510), so its write log and its reason file
          # are this command's by path.
          OUTPUT_DIR: ${{ runner.temp }}/file
        # `npm exec --prefix` rather than a bare `npx`, and the prefix is the
        # whole point — see the long note on the same line in review.yml. Short
        # version: `npx pkg@version` would reuse this repository's own checkout
        # as the package, which has no `dist/`, and the step would die
        # `command not found` before any runner code ran (#8).
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.9.4 -- agent-workflows follow-ups:file

      # How the job ended, measured here because only this job's clock knows
      # (#220): a job that reaches its `timeout-minutes` is cancelled, not
      # failed, and nothing in the `job` context says which cancellation it
      # was. So a cancel is compared with the limit: a timed-out job ran its
      # whole limit, less the moment the runner took to reach the first step,
      # hence a minute's slack. Only a cancel, as review's job measures it: a
      # failure has its reason file to speak for it, which is the order the
      # shell before `follow-ups:conclude` read them in. The limit is compared
      # only where it is a positive integer: `fromJSON` accepts `1.5` and
      # `1e1`, which bash arithmetic refuses, and under `bash -e` that would
      # end this step before the comment. A limit it cannot compare reads as
      # no timeout, and the run is still said to have been cancelled. A fact,
      # handed on; what it means is the command's.
      - name: Measure how the job ended
        id: outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          timed_out=false
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "${JOB_STARTED:-}" ] && [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] && [ $(( $(date +%s) - JOB_STARTED )) -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
            timed_out=true
          fi
          echo "timed-out=${timed_out}" >> "$GITHUB_OUTPUT"

      # `follow-ups:conclude` (#511): nothing on a run that finished, and
      # otherwise the one failure comment, so a failure says what failed where
      # a human will see it rather than looking like the silent no-op that is
      # this job's ordinary outcome. `always()`, so a cancel and a timeout are
      # said too.
      #
      # No `agent:blocked`, unlike the workflows that act on an open pull
      # request: that label is the open pipeline's "a human has to look at
      # this before the loop continues", and there is no pipeline left on a
      # merged PR to block. And `agent:follow-ups` stays on: `follow-ups:file`
      # removes it only on success, so a failed run leaves it in place, and
      # re-adding an already-present label fires no event
      # (docs/ADOPTING.md §1). Hence the gesture the comment names.
      #
      # A failure before the package can install, the auth step's own, posts
      # nothing: this is the package. That is the "never got as far as the
      # runner" case `CLAUDE.md` names.
      - name: Conclude the run
        if: always()
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A directory of its own, so the reason file it reads is
          # `follow-ups:file`'s and never its own.
          OUTPUT_DIR: ${{ runner.temp }}/conclude
          FILE_DIR: ${{ runner.temp }}/file
          JOB_STATUS: ${{ job.status }}
          TIMED_OUT: ${{ steps.outcome.outputs.timed-out }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.9.4 -- agent-workflows follow-ups:conclude

      # Every write each command made, one line each as it landed, and a last
      # line for how it ended (ADR 0005), kept for whoever audits the run: the
      # stubs `follow-ups:file` filed, the report and the marker's removal, and
      # the failure comment `follow-ups:conclude` posted. Both commands' logs,
      # by the paths they declare, and no wildcard. `always()`, since a run
      # that stopped is the one a log is read for, and nothing of a run that
      # wrote nothing.
      - name: Keep the write logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-follow-ups-write-log
          path: |
            ${{ runner.temp }}/file/write_log.jsonl
            ${{ runner.temp }}/conclude/write_log.jsonl
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
