name: Agent Update Branch

# The trigger, the token grant and the secrets. Everything else — the fork
# guard, the permissions ceiling, the concurrency group, the merge and every
# step after it — is in agent-update-branch-reusable.yml, which an adopting repo
# references instead of copying (jeffwlawson/winget-manifest-lint#98).
#
# `pull_request_target` reads workflow YAML from the *default* branch, so a pull
# request cannot alter this file to change what runs. The called workflow is
# equally out of a PR's reach — but now because of what the `uses:` below is
# **pinned to**, not because it is local. Pin a tag or a SHA, never a branch:
# `@main` would hand a job that runs with your secrets to whatever currently
# sits on another repository's default branch (docs/ADOPTING.md §9).
on:
  pull_request_target:
    types: [labeled]

jobs:
  update-branch:
    uses: jeffwlawson/agent-workflows/.github/workflows/update-branch.yml@v0.7.5
    # Granted here, bounded there. A called workflow can only downgrade the
    # token it is handed, so these have to be at least what the job needs.
    permissions:
      contents: write
      # Installing the runner package, which the called job does with `npx` from
      # GitHub Packages. Granted here because a called workflow can only
      # *downgrade* the token it is handed, so the scope has to start in the
      # caller — and unconditional because GitHub Packages has no anonymous
      # install even for a public package. Omit it and there is no run to install
      # in: a caller granting less than a job it calls declares is refused before
      # any job starts (docs/ADOPTING.md §4).
      packages: read
      pull-requests: write
      # Carrying the review's verdict on to the merge commit a clean refresh
      # creates, so a refresh does not quietly cost a review round. A commit
      # status is its own scope rather than part of `pull-requests: write`. The
      # step warns rather than failing if the copy does not land, the branch
      # having moved by then — but omitting the grant costs the whole run
      # instead, before any job starts (docs/ADOPTING.md §4).
      statuses: write
    # No `with:`. The three inputs (`default-branch`, `node-version-file`,
    # `setup`) default to this repo's values — `main`, `.nvmrc`, `npm ci`.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}
