name: Agent Implement (reusable)

# The implement job itself. The `implement` job in `agent-issue.yml` is the
# caller (two wires, under that file's trigger), and every guard, permission and
# step stays here, in a file an adopting repo *references* rather than copies
# (jeffwlawson/winget-manifest-lint#98).
#
# Unlike the three PR workflows, this one has no event field to take a base
# branch from: an `issues` event carries no pull request, so the branch to cut
# from and the branch to open the PR against are a *choice*. `default-branch` is
# that choice, made by the adopter once instead of hand-edited in three places
# and in two prompts they cannot reach (docs/ADOPTING.md §5).
on:
  workflow_call:
    inputs:
      default-branch:
        description: >-
          The branch the agent's work is cut from and the PR is opened against.
          Not a fallback, unlike the PR workflows' input of the same name —
          nothing in an `issues` event says which branch the work belongs on, so
          this is the only answer there is.
        type: string
        default: main
      node-version-file:
        description: >-
          The file `actions/setup-node` reads the version from. Empty skips the
          setup step entirely: a repo whose toolchain is not Node still gets its
          issue implemented, running on the Node the runner package requires.
        type: string
        default: .nvmrc
      setup:
        description: >-
          Commands that install the repository's dependencies in the checkout,
          before the agent starts. Empty skips the step. This is a *command*, so
          it is executed by construction — pass a literal from your workflow
          file, never an expression that reads the event, or an issue title
          becomes a shell script.
        type: string
        default: npm ci
      transcript-retention-days:
        description: >-
          Days the agent's Claude Code session transcript is kept, as this
          run's `agent-transcript` artifact, with every secret the job holds
          redacted. 0 turns the upload off. On a public repository the
          artifact is readable by anyone who can see the repository; see
          docs/ADOPTING.md §2d.
        type: number
        default: 3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token the implementation agent runs under.
        required: true
      AGENT_PAT:
        description: >-
          User PAT. Three things need it and each fails differently without it:
          the push (CI on the resulting PR waits for a maintainer's approval),
          opening the PR (the Actions bot is forbidden from creating PRs), and the `agent:review` label add
          (a label added with `GITHUB_TOKEN` triggers no workflow, so the
          cascade dies silently). See docs/ADOPTING.md §1. Optional, and every
          site warns rather than failing. The loop's App, where it is set up,
          takes its place.
        required: false
      AGENT_APP_ID:
        description: >-
          The loop's GitHub App's ID. With `AGENT_APP_PRIVATE_KEY`, the publish
          job mints a token for this repository from the App and makes the
          writes `AGENT_PAT` would make with it, as the App's bot. Optional;
          without both, `AGENT_PAT` is used as before.
        required: false
      AGENT_APP_PRIVATE_KEY:
        description: The loop's GitHub App's private key. See `AGENT_APP_ID`.
        required: false


# One run at a time per issue, held across all three jobs below. On the
# workflow rather than on a job, because the run is three jobs that hand off to
# each other: a job-level group is released between them, and a second run
# for the same issue could start its agent between this run's agent and its
# push. A workflow-level group in a called workflow holds the whole run (probed
# 2026-10-02: a second run's first job started two seconds after the first
# run's last job ended).
#
# Every label event on the issue starts this workflow, and a group admits one
# pending run, cancelling the one it replaces. So an event for any other label
# takes a group of its own, keyed by its run id: otherwise adding `bug` while a
# run is in progress would cancel an `agent:implement` run waiting behind it.
concurrency:
  group: agent-implement-issue-${{ github.event.issue.number }}${{ github.event.label.name != 'agent:implement' && format('-other-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# **Three jobs, and the agent's holds nothing it could use to write.**
#
# The agent runs unsandboxed with the runner's passwordless `sudo`, so it can
# read anything on its runner: the environment of every process, and the
# memory of the runner process itself, which holds every secret its job names
# from the moment the job starts, whether or not a step using it ever runs
# (probed 2026-10-02). Scrubbing a variable, persisting no credential and
# passing the PAT to one command (#306) close the easy reads, not that one.
# And whatever ran there can leave something behind — a hook, a git config
# entry, a replaced binary, a process waiting on `/proc` — for a later step on
# the same runner to hand a token to.
#
# So the steps that write are on other runners. `gate` reads the issue,
# refuses or claims it, and names the branch; `implement` runs the agent with
# a read-only token and names no PAT and no App secret anywhere, and hands
# over its commits as a `git bundle`; `publish` starts on a fresh runner,
# checks the bundle, and pushes, opens the PR and asks for the review with the
# loop's token, the App's or the PAT (`.github/actions/loop-token`). Each
# runner is discarded when its job ends and the job token with it, so nothing
# the agent did reaches the job that holds a credential. The same split as review.yml's
# (#257), where the job that runs the model holds no write scope at all.
#
# The permissions differ per job, and the caller grants the union: what
# `publish` spends. The caller is unchanged.
#
# Every job's `if:` opens with `vars.AGENT_ORCHESTRATOR != 'service'` (#455):
# a repository that sets that variable is served by the service orchestrator,
# and every job here skips, so one orchestrator answers each label. Unset, or
# any other value, leaves the rest of each condition as it was.
jobs:
  gate:
    # Job-level, deliberately. A job-level `if:` skips without provisioning a
    # runner and costs nothing; a step-level guard has already booted a runner
    # and bills a full rounded-up minute for every unrelated label event.
    #
    # On this side of the seam, like every other guard in the loop: a caller's
    # own `if:` can skip this job, it cannot loosen this one. The two jobs
    # after it follow from its outputs, so this is the one guard.
    if: vars.AGENT_ORCHESTRATOR != 'service' && github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    # API calls and nothing else; the agent's own limit is on its job.
    timeout-minutes: 10
    # Granted by the caller, bounded here, per job. A called workflow can only
    # downgrade the token it is handed, so each job's block is its ceiling and
    # the caller's grant has to cover the widest of them — without it there is
    # no run to make a `gh` call in: GitHub refuses the elevation rather than
    # trimming a job to fit, so a caller granting less than a block declares
    # fails before any job starts (probed, #146).
    permissions:
      # The base branch's tip, read for `publish` to check the agent's commits
      # against, and the agent's branch's, for the push to lease on.
      contents: read
      # The refusals, the start comment and the label transitions.
      issues: write
      # The open-PR check in the pre-flight.
      pull-requests: read
      # Installing the package `implement:gate` runs from, by `npm exec`.
      # GitHub Packages has no anonymous install, so this is needed even
      # though the package is public, and, being a bound, it grants nothing
      # without the caller's own `packages: read`, which both caller sets
      # already grant.
      packages: read
    outputs:
      # `false` where the run goes ahead, `true` where it refused or deferred,
      # and empty where the gate died before deciding: the three values the
      # jobs after it read.
      refused: ${{ steps.state.outputs.proceed == 'true' && 'false' || steps.state.outputs.proceed == 'false' && 'true' || '' }}
      branch: ${{ steps.state.outputs.branch }}
      base: ${{ steps.state.outputs.base }}
      # The agent's branch's tip as the gate found it, empty where the branch
      # does not exist yet.
      tip: ${{ steps.state.outputs.tip }}
      started: ${{ steps.clock.outputs.started }}
      # The sentence `implement:gate` failed with, where it failed after
      # claiming the run (the probe, or a read after it), for the failure
      # comment: its reason file is in this job's `runner.temp`, which no later
      # job can read.
      failure-reason: ${{ steps.state.outputs.failure-reason }}

    steps:
      # `implement:gate` runs before anything is checked out, so there is no
      # Node here yet: Node and the registry the package installs from, set up
      # for the gate alone, as `fix.yml`'s gate job does. A version rather than
      # a version file, since there is no checkout to read one from: the one
      # the package's `engines.node` names, which `tests/workflows.test.ts`
      # holds it to. No adopter step runs in this job, so the `.npmrc` it
      # points npm at needs none of the `userconfig` handling review's gate
      # job has (#429).
      - name: Set up Node for the gate
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # Everything this job settles before the agent's job, as one command
      # (#490), before checkout and the dependency install, so a refusal costs
      # neither: the partition, which leaves an issue with sub-issues to
      # `agent-implement-prd` without a word; the refusals, of a closed issue,
      # a planning issue, a sub-issue, one with open blockers and one an open
      # PR already closes, each said on the issue with `agent:implement` taken
      # off, and the shape's marked `agent:blocked`; then the permission probe,
      # `agent:blocked` off, the start comment linking this run (#205), the
      # branch's name, the commit the base is at, and the branch's current
      # tip. `implement/gate.ts` says why each is as it is, a failed shape
      # query failing the run where a failed blocker read goes ahead included.
      #
      # `ISSUE_STATE` is the issue as the label's event saw it; its shape, its
      # blockers, the open PRs and the two tips the command reads itself, with
      # this step's token, which is also every write it makes. What it decided
      # is its `gate.json`, which the step below copies into this job's
      # outputs.
      - name: Refuse or claim the issue
        id: gate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          # The branch this run works from, end to end: checked out, branched
          # from, opened against, and handed to the runner so the agent's
          # prompt names the branch its own was actually cut from. One value,
          # one input, so the three can never disagree.
          BASE_REF: ${{ inputs.default-branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # This run's page, linked from every comment the run posts on the
          # issue: the start comment, the PR it opened, and the failure (#205).
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # `GITHUB_TOKEN`, carrying the `packages: read` the caller granted:
          # there is no anonymous install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        # `npm exec --prefix` rather than a bare `npx`: see the long note on
        # the runner step below.
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.8 -- agent-workflows implement:gate

      # Glue only Actions can do (ADR 0003): the gate's decision and facts,
      # copied into the step outputs `proceed`, `branch`, `base` and `tip`,
      # which the job's outputs and the clock read. `always()`, so a gate that
      # decided to go ahead and then failed, at the probe, still says so;
      # nothing where it wrote no `gate.json`, or one with no `proceed`, which
      # `refused` reads as a gate that died before deciding. And the reason
      # the gate failed with, where it wrote one, as `failure-reason`, whole,
      # under a delimiter of its own, as `fix.yml`'s gate job hands its on.
      - name: Hand the gate's decision to the job
        id: state
        if: always()
        run: |
          reason="${RUNNER_TEMP}/failure_reason.txt"
          if [ -f "$reason" ]; then
            delimiter="REASON_$(date +%s%N)_${RANDOM}"
            {
              echo "failure-reason<<${delimiter}"
              printf '%s\n' "$(cat "$reason")"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi
          file="${RUNNER_TEMP}/gate.json"
          [ -f "$file" ] || { echo "implement:gate wrote no gate.json; this run decided nothing."; exit 0; }
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$file" >> "$GITHUB_OUTPUT"

      # The clock the agent's job measures its time limit against (#220). A
      # job that reaches its `timeout-minutes` is cancelled, not failed, and
      # nothing in the `needs` context says which cancellation it was, so that
      # job's last step compares how long it could have run with its limit. Last
      # in this job, so it starts as near the agent's job as a step here can,
      # and is read from this job's outputs rather than the agent's, which a
      # step there could rewrite.
      - name: Start the agent's clock
        if: steps.state.outputs.proceed == 'true'
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

  implement:
    needs: gate
    if: vars.AGENT_ORCHESTRATOR != 'service' && needs.gate.outputs.refused == 'false'
    runs-on: ubuntu-latest
    # The repository variable `AGENT_TIMEOUT_MINUTES` where it is set (#220),
    # shared by the four jobs that run an agent to write code, and 30 where it
    # is not. `vars` is among the contexts this key may read, and in a called
    # workflow it resolves against the caller's repository. `fromJSON` because
    # a variable is a string and this key wants a number; a value that is not
    # one fails the job before any step, which `doctor` reports.
    # `implement:conclude` names the same figure.
    timeout-minutes: ${{ fromJSON(vars.AGENT_TIMEOUT_MINUTES || '30') }}
    # Its one output: whether it ran out of time. See *Measure how the agent's
    # job ended*. Everything else it hands over is the artifact.
    outputs:
      timed-out: ${{ steps.outcome.outputs.timed-out }}
    # **Read-only, and no PAT or App secret named anywhere in this job.** Not
    # even in a step that never runs: a secret is delivered to every job whose
    # text names it.
    # The job token is readable by the agent however it is scrubbed, so this
    # block is what it can do with it.
    permissions:
      # The checkout.
      contents: read
      # The runner reads the issue and its comments, for the agent's prompt.
      issues: read
      # Installing the runner package. GitHub Packages has no anonymous install,
      # so this is needed even though the package is public — and, being a
      # bound, it grants nothing without the caller's own `packages: read`.
      packages: read

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BASE_REF: ${{ inputs.default-branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          # No credential is left in the checkout for the agent's git, or
          # anything else it runs, to find. Nothing in this job fetches or
          # pushes after it: the publish job pushes, from a checkout of its own.
          persist-credentials: false

      # The package, installed once and early, as `fix.yml`'s agent job
      # installs it (#491), for everything of it this job runs:
      # `implement:prepare` before the adopter's code, the runner, and
      # `implement:bundle` after the agent. Node and the registry the package
      # installs from, a version its `engines.node` names, and no cache, since
      # this job runs the adopter's code and a cache it saved would be restored
      # on the base branch.
      - name: Set up Node for the package
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # That step points `NPM_CONFIG_USERCONFIG` at the `.npmrc` it wrote, for
      # every later step in the job (#429), the adopter's *Install dependencies*
      # included. So the job's setting goes back to npm's default here, and the
      # path comes out as `userconfig`, handed in `env:` to each step that
      # installs or runs the package from this install. The file `setup-node`
      # wrote, never a second copy.
      - name: Keep the package's registry to the package's steps
        id: npmrc
        run: |
          echo "userconfig=${NPM_CONFIG_USERCONFIG}" >> "$GITHUB_OUTPUT"
          echo "NPM_CONFIG_USERCONFIG=${HOME}/.npmrc" >> "$GITHUB_ENV"

      # Into `RUNNER_TEMP` while nothing of the adopter's has run, so a step
      # after the agent finds it there and never asks the registry. The agent
      # and the adopter's own code (`inputs.setup`) can leave things behind on
      # this runner, so nothing after them is handed the registry token: this
      # is the one step of the job that holds it. From `RUNNER_TEMP` too, so no
      # `.npmrc` of the checkout is read.
      - name: Install the package
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --prefix "$RUNNER_TEMP" --no-save @jeffwlawson/agent-workflows@0.8.8

      # The agent's branch, created at the commit the gate read the base at,
      # not the base branch's tip a moment later, so the agent builds on
      # exactly the base `publish` checks its commits against, and checked out
      # with the loop's committer as the identity. A checkout that does not
      # hold that commit, the base rewritten since the gate read it, stops the
      # run with a sentence. From the install above, with no token: it reads
      # nothing but the checkout. Its reason file goes in a directory of its
      # own, which the hand-over below carries.
      - name: Create branch
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          GH_TOKEN: ""
          OUTPUT_DIR: ${{ runner.temp }}/prepare
          CHECKOUT: ${{ github.workspace }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          BASE_SHA: ${{ needs.gate.outputs.base }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.8 -- agent-workflows implement:prepare

      # Both setup steps are the adopter's toolchain, so both are skippable.
      # `npm install -g @anthropic-ai/claude-code` below is not: that is the
      # agent's own runtime, and every runner image already has the Node it
      # needs for it.
      - name: Setup Node.js
        if: inputs.node-version-file != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      # The one place a caller's text becomes a script. That is what the input
      # *is* — a command — so the boundary to hold is where the value comes
      # from: a literal in a workflow file, never an expression reading the
      # issue event.
      - name: Install dependencies
        if: inputs.setup != ''
        run: |
          ${{ inputs.setup }}

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The runner below runs from the install above and asks the registry for
      # nothing, so here this step's work is the Node it names; the registry
      # entry is the shape every runner's job shares, and unread in this one.
      # The cache opt-out: this half declares no toolchain, so it must not
      # infer one.
      #
      # With `node-version-file: ''` the toolchain step above is skipped, and
      # without a Node named here the runner would run on the image's, below
      # the package's `engines.node` (#335). So it names one in exactly that
      # case and none otherwise, leaving an adopter's own version file to decide
      # the Node their commands run on. `tests/workflows.test.ts` holds it to
      # `engines.node`.
      - name: Authenticate to GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version-file == '' && '24' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      - name: Run implementation agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_IMPLEMENT: ${{ vars.AGENT_MODEL_IMPLEMENT }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          OUTPUT_DIR: ${{ runner.temp }}
        # The binary *Install the package* linked, run by its path, from the
        # checkout, where the runner does its git work, as `fix.yml`'s runner
        # is (#487). Not `npm exec`: with the package already under its
        # `--prefix`, `npm exec` installs nothing and puts no install directory
        # on `PATH`, only `node_modules/.bin` of the directory it runs in and
        # each one above it, so from the checkout it finds no command at all,
        # and a `PATH` entry handed in would come after the checkout's own
        # `node_modules/.bin`, which the adopter's code has just had the chance
        # to write. By path, nothing is looked up, the version is the install's
        # pin, and the registry token stays with the install: this step holds
        # none.
        run: '"$RUNNER_TEMP/node_modules/.bin/agent-workflows" implement'

      # The agent's own record of the session (#269), so a run can be profiled
      # and debugged from what it did and not only from the log, which shows
      # some of its tool calls and none of its file reads, edits or thinking.
      # Claude Code writes it under `~/.claude/projects/`, in a directory named
      # after the checkout's path, and it goes with the runner unless something
      # keeps it: sandcastle's own copy does not run without a sandbox.
      #
      # **Redacted, never refused.** An artifact on a public repository is
      # readable by anyone who can see the repository, and the agent's
      # environment holds `CLAUDE_CODE_OAUTH_TOKEN`, so a transcript where it
      # printed that environment carries the token. Every secret this job holds
      # is replaced with `[REDACTED]` in a copy, the job token also in the
      # basic-auth form a checkout's git config holds it in, and only the copy
      # is uploaded. The script is the one every agent workflow runs, and names no
      # PAT: no job that runs an agent holds one (#307, #316).
      #
      # `always()`, so a failed, cancelled or timed-out run keeps its record
      # too, and `continue-on-error`, so the record never fails the run it
      # records. The upload reads the redaction's outcome rather than its own
      # `always()` alone, so a copy the redaction did not finish is never sent.
      # `transcript-retention-days` at 0 turns both off.
      - name: Redact the session transcript
        id: transcript
        if: always() && inputs.transcript-retention-days > 0
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, shutil

          source = pathlib.Path.home() / ".claude" / "projects"
          copy = pathlib.Path(os.environ["RUNNER_TEMP"]) / "agent-transcript"
          shutil.rmtree(copy, ignore_errors=True)

          secrets = []
          for name in ("CLAUDE_CODE_OAUTH_TOKEN", "GITHUB_TOKEN"):
              value = os.environ.get(name, "").encode()
              if not value:
                  continue
              secrets.append(value)
              if name != "CLAUDE_CODE_OAUTH_TOKEN":
                  secrets.append(base64.b64encode(b"x-access-token:" + value))

          files = sorted(source.rglob("*.jsonl")) if source.is_dir() else []
          if not files:
              print("No session transcript to upload: the agent never started.")
          for file in files:
              text = file.read_bytes()
              for secret in secrets:
                  text = text.replace(secret, b"[REDACTED]")
              out = copy / file.relative_to(source)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(text)
              print(f"Redacted {file.relative_to(source)} for upload.")
          PY

      # `overwrite`, so a re-run replaces this attempt's copy rather than
      # failing on the name. Uploading needs no scope: the artifact service
      # takes the runner's own token.
      - name: Upload the session transcript
        if: always() && steps.transcript.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: agent-transcript
          path: ${{ runner.temp }}/agent-transcript
          if-no-files-found: ignore
          retention-days: ${{ inputs.transcript-retention-days }}
          overwrite: true

      # The agent's commits, as the one thing `publish` pushes:
      # `implement:bundle` bundles the branch `gate` named, thin, the commit
      # the gate read the base at being its prerequisite, which `publish` has
      # from its own checkout. Where the runner succeeded, after the
      # transcript, from the install above, run from `RUNNER_TEMP` and working
      # in the checkout, and **with no token**: the agent and the adopter's
      # code have run, and the job's `GH_TOKEN` is set empty for it. Into a
      # directory of its own, which the hand-over below carries beside the
      # runner's reason file.
      - name: Bundle the branch
        if: success()
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.npmrc.outputs.userconfig }}
          GH_TOKEN: ""
          OUTPUT_DIR: ${{ runner.temp }}/bundle
          CHECKOUT: ${{ github.workspace }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          BASE_SHA: ${{ needs.gate.outputs.base }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.8 -- agent-workflows implement:bundle

      # `implement:prepare`'s reason file on a failure, under `prepare/`;
      # `implement:bundle`'s files, the bundle and its reason file on a
      # failure, under `bundle/`; and the runner's reason file at the top:
      # exactly the files each declares. One artifact, `always()`, because a
      # failed run is one of the outcomes `publish` reports, and any of them
      # may be missing. The paths' common directory is `runner.temp`, so
      # `prepare/` and `bundle/` stay as they are in the artifact and where
      # `publish` downloads it. Uploading needs no scope: the artifact service
      # takes the runner's own token, so this job stays read-only.
      # `overwrite`, so a re-run replaces this attempt's copy rather than
      # failing on the name.
      #
      # What this job hands over is the agent's to write, whatever a step here
      # meant it to be. So `publish` takes nothing from it but this artifact,
      # which it checks, and `timed-out`, which decides nothing (see the step
      # after this one).
      - name: Hand the branch to the publish job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-implement
          path: |
            ${{ runner.temp }}/prepare/failure_reason.txt
            ${{ runner.temp }}/bundle/branch.bundle
            ${{ runner.temp }}/bundle/failure_reason.txt
            ${{ runner.temp }}/failure_reason.txt
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # Whether this job ran out of time, for the publish job's ending (#220):
      # glue only Actions can do (ADR 0003), as `fix.yml`'s agent job's last
      # step is. Cancelled is not failed, and a job that reached its limit is
      # cancelled too, or may read as failed in `needs`. What tells a timeout
      # apart is the clock the gate started just before this job: a timed-out
      # job ran its whole limit, less the moment the runner took to start,
      # hence a minute's slack. The limit is compared only where it is a
      # positive integer: `fromJSON` accepts `1.5` and `1e1`, which bash
      # arithmetic refuses, and a limit this cannot compare reads as no
      # timeout, which is still said as a cancel.
      #
      # Last, and `always()`, so it measures however the job ended. On this
      # job's runner, after the agent, so it is the agent's to rewrite like any
      # output here; it decides nothing but which of two sentences a stopped
      # run's comment gives, and never stands in for a reason the runner wrote.
      # `implement:conclude` reads it as `TIMED_OUT`.
      - name: Measure how the agent's job ended
        id: outcome
        if: always()
        env:
          GH_TOKEN: ""
          JOB_STATUS: ${{ job.status }}
          JOB_STARTED: ${{ needs.gate.outputs.started }}
          TIMEOUT_MINUTES: ${{ vars.AGENT_TIMEOUT_MINUTES || '30' }}
        run: |
          timed_out=false
          if [ "$JOB_STATUS" != "success" ] && [ -n "${JOB_STARTED:-}" ] && [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] && [ $(( $(date +%s) - JOB_STARTED )) -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
            timed_out=true
          fi
          echo "timed-out=${timed_out}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [gate, implement]
    # `always()`, so a failed, cancelled or timed-out agent is still reported
    # and its trigger label still taken off. Not where the gate was skipped
    # (another label's event) or refused or deferred: that run said what it
    # had to, or must say nothing. A gate that died before deciding leaves
    # `refused` empty and comes through, so it is still reported.
    if: vars.AGENT_ORCHESTRATOR != 'service' && always() && needs.gate.result != 'skipped' && needs.gate.outputs.refused != 'true'
    runs-on: ubuntu-latest
    # A clone, a push and some API calls, and a bounded wait for the PR's head.
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # The package `implement:publish` and `implement:conclude` run from,
      # installed by `npm exec`. GitHub Packages has no anonymous install, and
      # the caller already grants it.
      packages: read

    # **No job-level `GH_TOKEN`.** A token is handed to the steps that write
    # with it and to no other, so the checkout, the Node setup, the download
    # and the upload hold none.
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # The token every write below that the workflow token cannot make is
      # made with: the loop's App's, `AGENT_PAT`, or the workflow token, in
      # that order, and `source` says which. Minted here, at the job's start
      # (ADR 0005), before the first write and after the agent finished, and
      # in no other job.
      - name: Resolve the loop's token
        id: token
        if: always()
        uses: jeffwlawson/agent-workflows/.github/actions/loop-token@v0.8.8
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          agent-pat: ${{ secrets.AGENT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # **The one checkout**, of the base branch, wherever the gate claimed
      # the run: what `implement:publish` checks the bundle in and pushes
      # from. Nothing the agent touched is on this runner, and no credential
      # is left in it: the push passes its token itself. `always()` wherever
      # the gate claimed the run, so no ending ever checks an empty workspace
      # (#473's last bug).
      - name: Checkout the base branch
        if: always() && needs.gate.outputs.refused == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          persist-credentials: false

      # The Node both commands run on, and the registry they install from. A
      # version rather than a version file, since nothing of the adopter's
      # runs here: the one the package's `engines.node` names, which
      # `tests/workflows.test.ts` holds it to. `always()`, since conclude runs
      # on every ending.
      - name: Set up Node for the package
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jeffwlawson"
          package-manager-cache: false

      # Into a directory of its own under `RUNNER_TEMP`, where both commands
      # look for `implement:bundle`'s files under `bundle/`, and
      # `implement:conclude` for the runner's reason file at the top and
      # `implement:prepare`'s under `prepare/`, where each wrote them. Its own,
      # so nothing another step writes at `RUNNER_TEMP`, the mint's reason
      # file among them, reads as the runner's. `always()`, so a mint that
      # failed still hands conclude the runner's reason. Tolerated: an agent's
      # job that was killed before its upload leaves nothing to fetch, and
      # `implement:conclude`, told this step's outcome, still has to run.
      - name: Fetch what the agent handed over
        id: fetch
        if: always() && needs.gate.outputs.refused == 'false'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: agent-implement
          path: ${{ runner.temp }}/agent-implement

      # The success path (#492): the bundle checked, the push, the draft PR
      # with its frame, the link on the issue, and the review request, in that
      # order. `implement/publish.ts` says why each is as it is.
      #
      # **The bundle is checked before anything is pushed from it**, against
      # facts `gate` established and the agent could not reach: it is intact,
      # holds exactly the branch `gate` named and nothing else, and builds on
      # the base `gate` read. The push is leased on the branch's tip as `gate`
      # read it, or on there being none, so a retry replaces what an earlier
      # failed run left and a push someone made during the run is refused. A
      # server error opening the PR is read back, by this head and this base,
      # before it is called a failure (#329).
      #
      # Given both tokens: `GH_TOKEN`, the workflow's, which it reads and
      # links the PR on the issue with, and the loop's, which it pushes, opens
      # the PR and labels with: the Actions bot is forbidden from opening one,
      # a push made with the workflow token starts CI that waits for a
      # maintainer's approval (#221), and a label it adds triggers nothing.
      # Where the loop's token is the workflow's, the label still goes on and
      # it warns. From `RUNNER_TEMP`, so no `.npmrc` of the checkout is read,
      # and working in the checkout. Its reason file goes in a directory of
      # its own, which `implement:conclude` reads.
      - name: Publish the PR
        id: publish
        if: needs.implement.result == 'success' && success()
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_TOKEN: ${{ steps.token.outputs.token }}
          LOOP_TOKEN_SOURCE: ${{ steps.token.outputs.source }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BASE_REF: ${{ inputs.default-branch }}
          OUTPUT_DIR: ${{ runner.temp }}/publish
          BUNDLE_DIR: ${{ runner.temp }}/agent-implement/bundle
          CHECKOUT: ${{ github.workspace }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          BASE_SHA: ${{ needs.gate.outputs.base }}
          BRANCH_TIP: ${{ needs.gate.outputs.tip }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.8 -- agent-workflows implement:publish

      # Every ending, success included, and the label however the run ended
      # (#493): the failure comment with the reason and the retry the ending
      # calls for (#220, #253), naming the PR where publish opened one before
      # it stopped, then `agent:implement` off where the gate decided the run
      # was its own (#236), then `agent:blocked`, in the loop's one order.
      # `implement/conclude.ts` says why each is as it is.
      #
      # `always()`: the ending is the point of it. Told the facts, not the
      # conclusions: how the gate and the agent's job ended, the gate's
      # decision and reason, whether the agent's job ran out of time and its
      # limit, and the outcome of each step above, so the package works out
      # which ending this is. It reads `implement:publish`'s `published.json`
      # and reason from publish's directory, and `implement:prepare`'s, the
      # runner's and `implement:bundle`'s from the hand-over, each from its
      # own producer's directory and each on its own.
      #
      # Given the workflow's token, which every write it makes is made with.
      # From `RUNNER_TEMP`, so no `.npmrc` of the checkout is read.
      - name: Conclude the run
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}/conclude
          PUBLISH_DIR: ${{ runner.temp }}/publish
          PREPARE_DIR: ${{ runner.temp }}/agent-implement/prepare
          IMPLEMENT_DIR: ${{ runner.temp }}/agent-implement
          BUNDLE_DIR: ${{ runner.temp }}/agent-implement/bundle
          REFUSED: ${{ needs.gate.outputs.refused }}
          GATE_RESULT: ${{ needs.gate.result }}
          # The sentence `implement:gate` failed with, where it wrote one:
          # written on the gate's runner, so it reaches this one as an output
          # rather than a file.
          GATE_REASON: ${{ needs.gate.outputs.failure-reason }}
          AGENT_RESULT: ${{ needs.implement.result }}
          TIMED_OUT: ${{ needs.implement.outputs.timed-out }}
          TIMEOUT_MINUTES: ${{ vars.AGENT_TIMEOUT_MINUTES || '30' }}
          MINT_OUTCOME: ${{ steps.token.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.fetch.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: npm exec --prefix "$RUNNER_TEMP" --yes --package=@jeffwlawson/agent-workflows@0.8.8 -- agent-workflows implement:conclude

      # Every write the two commands made, one line each as it landed, and a
      # last line for how each ended (ADR 0005), kept for whoever audits the
      # run. One artifact, each command's log by the path it declares, and no
      # wildcard. `always()`, since a run that stopped is the one a log is
      # read for, and nothing of a command that never ran.
      - name: Keep the write logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-implement-write-log
          path: |
            ${{ runner.temp }}/publish/write_log.jsonl
            ${{ runner.temp }}/conclude/write_log.jsonl
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
